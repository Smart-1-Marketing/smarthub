{% extends "base.html" %}
{% block title %}{{ title }} — QA — Smart 1 Hub{% endblock %}
{% block content %}
<div class="page-head qa-head">
  <div>
    <div class="qa-crumb"><a href="/qa">QA Reports</a> / {{ title }}</div>
    <h2>{{ title }}</h2>
    <p id="qaNote">Loading&hellip;</p>
  </div>
  <div class="qa-actions">
    <select id="qaMonth" class="qa-btn qa-sec" style="display:none;padding:8px 10px"></select>
    <button class="qa-btn qa-sec" id="qaCompare" style="display:none">&#8646; Compare invoices</button>
    <button class="qa-btn" id="qaCsv" disabled>&#8681; Export CSV</button>
    <button class="qa-btn qa-sec" id="qaReload">&#8635; Refresh</button>
  </div>
</div>
<div class="card qa-card">
  <div class="qa-tablewrap" id="qaWrap">
    <div class="qa-loading" id="qaLoading">Running report&hellip;</div>
  </div>
</div>
<style>
.qa-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.qa-crumb{font-size:12.5px;color:#64748b;margin-bottom:4px}
.qa-crumb a{color:#2563eb;text-decoration:none}
.qa-actions{display:flex;gap:8px}
.qa-btn{border:0;background:#2563eb;color:#fff;font:600 13px 'Segoe UI',system-ui,sans-serif;
  padding:9px 16px;border-radius:8px;cursor:pointer}
.qa-btn[disabled]{opacity:.5;cursor:default}
.qa-btn.qa-sec{background:#fff;color:#1e293b;border:1px solid #e2e8f0}
.qa-card{padding:0;overflow:hidden}
.qa-tablewrap{overflow-x:auto}
.qa-loading{padding:34px;text-align:center;color:#64748b;font-size:14px}
table.qa-t{width:100%;border-collapse:collapse;font-size:13.5px}
table.qa-t th{position:sticky;top:0;background:#f8fafc;text-align:left;padding:10px 14px;
  font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:#64748b;
  border-bottom:1px solid #e2e8f0;white-space:nowrap}
table.qa-t td{padding:9px 14px;border-bottom:1px solid #eef2f7;color:#1e293b;vertical-align:top}
table.qa-t tr:hover td{background:#f8fafc}
table.qa-t td a{color:#2563eb;text-decoration:none;font-weight:600}
table.qa-t td a:hover{text-decoration:underline}
.qa-neg{color:#dc2626;font-weight:600;white-space:nowrap}
.qa-pos{color:#16a34a;font-weight:600;white-space:nowrap}
.qa-empty{padding:34px;text-align:center;color:#64748b}
.qa-err{padding:22px;background:#fef2f2;color:#b91c1c;border-radius:10px;margin:16px}
.qa-qbcta{padding:30px;text-align:center;color:#475569}
.qa-qbcta a{display:inline-block;margin-top:10px;background:#2563eb;color:#fff;padding:9px 18px;
  border-radius:8px;text-decoration:none;font-weight:600}
tr.qa-row-green td{background:#f0fdf4 !important;border-left:3px solid #22c55e}
tr.qa-row-green td:not(:first-child){border-left:none}
tr.qa-row-yellow td{background:#fefce8 !important;border-left:3px solid #eab308}
tr.qa-row-yellow td:not(:first-child){border-left:none}
tr.qa-row-red td{background:#fef2f2 !important;border-left:3px solid #ef4444}
tr.qa-row-red td:not(:first-child){border-left:none}
.qa-unavailable{display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  padding:16px 18px;border:1px solid #fde68a;background:#fffbeb;border-radius:10px;
  color:#78350f;line-height:1.55;font-size:13.5px}
.qa-unavailable b{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:#92400e}
button.qa-act,a.qa-act{display:inline-block;margin-top:2px;background:#92400e;color:#fff;
  border:0;border-radius:8px;padding:8px 14px;font:600 12.5px system-ui;cursor:pointer;
  text-decoration:none}
button.qa-act[disabled]{opacity:.6;cursor:default}
.qa-empty-note{margin-top:10px;font-size:12.5px;color:#94a3b8;line-height:1.55}
tr.qa-row-sub td{background:#f1f5f9 !important;font-weight:800;color:#1a2e58;border-top:2px solid #cbd5e1}
.qa-assign-btn{border:1px solid #e2e8f0;background:#fff;color:#1e293b;border-radius:8px;
  padding:4px 10px;font:600 12px 'Segoe UI',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.qa-assign-wrap{display:flex;gap:6px;align-items:center}
.qa-assign-wrap input{padding:6px 8px;border:1px solid #e2e8f0;border-radius:8px;
  font:12.5px 'Segoe UI',system-ui,sans-serif;width:190px}
.qa-modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:99999;
  align-items:center;justify-content:center;padding:16px}
.qa-modal.open{display:flex}
.qa-modal-box{background:#fff;border-radius:14px;width:640px;max-width:100%;max-height:88vh;
  display:flex;flex-direction:column}
.qa-modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;
  border-bottom:1px solid #e2e8f0;color:#1a2e58;font-weight:700}
.qa-modal-body{padding:14px 18px;overflow-y:auto;font-size:13.5px;line-height:1.6}
.qa-cmp{border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.qa-cmp b{color:#1a2e58}
.qa-x{border:0;background:none;font-size:22px;cursor:pointer;color:#64748b}
</style>
<div class="qa-modal" id="qaSumModal">
  <div class="qa-modal-box">
    <div class="qa-modal-head"><span id="qaSumTitle">Request</span>
      <button class="qa-x" id="qaSumClose">&times;</button></div>
    <div class="qa-modal-body" id="qaSumBody"></div>
  </div>
</div>
<div class="qa-modal" id="qaCmpModal">
  <div class="qa-modal-box">
    <div class="qa-modal-head"><span>Invoice comparison — each month vs this month</span>
      <button class="qa-x" id="qaCmpClose">&times;</button></div>
    <div class="qa-modal-body" id="qaCmpBody"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function(){
  var KEY = {{ key|tojson }};
  var wrap = document.getElementById('qaWrap');
  var note = document.getElementById('qaNote');
  var csvBtn = document.getElementById('qaCsv');
  var data = null;

  function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}

  function cellHtml(c){
    /* A coloured status bubble, e.g. "GTM Found". */
    if(c && typeof c==='object' && c.pill){
      var bg = c.pill==='ok' ? '#e7f6ef' : c.pill==='warn' ? '#fff4d7' : '#feeceb';
      var fg = c.pill==='ok' ? '#147d52' : c.pill==='warn' ? '#a06a00' : '#b42318';
      return '<span style="background:'+bg+';color:'+fg+';border-radius:20px;'+
        'padding:2px 10px;font-size:11.5px;font-weight:700;white-space:nowrap"'+
        (c.title?' title="'+esc(c.title)+'"':'')+'>'+esc(c.text||'')+'</span>';
    }
    /* A number with its change against the previous period. */
    if(c && typeof c==='object' && c.delta!==undefined){
      var d = Number(c.delta)||0;
      var col = d>0 ? '#147d52' : d<0 ? '#b42318' : '#94a3b8';
      var arrow = d>0 ? '\u25B2' : d<0 ? '\u25BC' : '\u25AC';
      return '<b>'+esc(c.text!=null?c.text:'')+'</b> '+
        '<span style="color:'+col+';font-size:11.5px;white-space:nowrap"'+
        (c.title?' title="'+esc(c.title)+'"':'')+'>'+arrow+
        (d?' '+Math.abs(d):'')+'</span>';
    }
    /* Action buttons in a cell. The report is where someone notices the
       problem, so it should also be where they fix it — sending them to
       another screen is how a list stays unactioned. */
    if(c && typeof c==='object' && c.actions){
      return c.actions.map(function(a){
        return '<button class="qa-act" data-action="'+esc(a.action)+'" '+
          'data-client="'+esc(a.client||'')+'" '+
          (a.confirm?'data-confirm="'+esc(a.confirm)+'" ':'')+
          '>'+esc(a.label)+'</button>';
      }).join(' ');
    }
    /* A group heading row, e.g. "Ending this month (12)". */
    if(c && typeof c==='object' && c.group){
      /* Ending this month and ending next month were the same grey label, one
         after the other, so the boundary between "act now" and "act soon" was
         easy to miss. Each band gets its own colour and a rule above it. */
      var tone = c.tone==='now'  ? {bg:'#fdecec',bd:'#dc2626',fg:'#991b1b'} :
                 c.tone==='soon' ? {bg:'#fef9ec',bd:'#d97706',fg:'#92400e'} :
                                   {bg:'#f1f5f9',bd:'#94a3b8',fg:'#475569'};
      return '<span style="display:inline-block;padding:5px 12px;border-radius:6px;'+
             'background:'+tone.bg+';border-left:4px solid '+tone.bd+';color:'+tone.fg+';'+
             'font:700 12px \'Segoe UI\',system-ui,sans-serif;text-transform:uppercase;'+
             'letter-spacing:.6px">'+esc(c.text||'')+'</span>';
    }
    if(c && typeof c==='object' && c.assign!==undefined)
      return '<div class="qa-assign-host" data-cust="'+esc(c.assign)+'"><button class="qa-assign-btn">+ Add to partner</button></div>';
    if(c && typeof c==='object' && c.status_select!==undefined){
      var sopts = (data&&data.statuses||['open','won','lost','abandoned']).map(function(s){
        return '<option value="'+esc(s)+'"'+(s===c.current?' selected':'')+'>'+esc(s)+'</option>';
      }).join('');
      return '<select class="qa-ghlstatus" data-opp="'+esc(c.status_select)+'" style="padding:6px 8px;border:1px solid #e2e8f0;border-radius:8px;font:12.5px \'Segoe UI\',system-ui,sans-serif">'+sopts+'</select> <span class="qa-stage-msg" style="font-size:11px;color:#64748b"></span>';
    }
    if(c && typeof c==='object' && c.stage_select!==undefined){
      var opts = (data&&data.stages||[]).map(function(s){
        return '<option value="'+esc(s.id)+'"'+(s.id===c.current?' selected':'')+'>'+esc(s.name)+'</option>';
      }).join('');
      return '<select class="qa-stage" data-opp="'+esc(c.stage_select)+'" style="padding:6px 8px;border:1px solid #e2e8f0;border-radius:8px;font:12.5px \'Segoe UI\',system-ui,sans-serif">'+opts+'</select> <span class="qa-stage-msg" style="font-size:11px;color:#64748b"></span>';
    }
    if(c && typeof c==='object' && c.search_attach!==undefined)
      return '<div class="qa-sa-host" data-client="'+esc(c.search_attach)+'" data-kind="'+esc(c.kind)+'" data-q="'+esc(c.q||'')+'">'
        +'<button class="qa-assign-btn">&#128269; Search &amp; attach</button></div>';
    if(c && typeof c==='object' && c.href)
      return '<a href="'+esc(c.href)+'" target="'+(c.href.charAt(0)==='/'?'_self':'_blank')+'">'+esc(c.text)+'</a>';
    /* A cell that says why it is empty rather than showing a zero. "none
       running" and "ended 08-08-26" are not the same thing as 0 and a date,
       and a reader scanning the column needs to be able to tell. */
    if(c && typeof c==='object' && c.muted)
      return '<span style="color:#94a3b8;font-style:italic">'+esc(c.text||'')+'</span>';
    var s = String(c==null?'':c);
    if(s.indexOf('▼')===0) return '<span class="qa-neg">'+esc(s)+'</span>';
    if(s.indexOf('▲')===0) return '<span class="qa-pos">'+esc(s)+'</span>';
    return esc(s);
  }

  function render(d){
    data = d;
    note.textContent = d.note || '';
    // month picker (scorecards)
    var msel = document.getElementById('qaMonth');
    if(d.month_options && d.month_options.length){
      msel.style.display = 'inline-block';
      msel.innerHTML = d.month_options.map(function(m){
        return '<option value="'+esc(m.ym)+'"'+(m.ym===d.month?' selected':'')+'>'+esc(m.label)+'</option>';
      }).join('');
    }
    // compare-invoices button (billing comparison)
    var cmpBtn = document.getElementById('qaCompare');
    if(d.invoice_comparison && d.invoice_comparison.length){
      cmpBtn.style.display = 'inline-block';
      document.getElementById('qaCmpBody').innerHTML = d.invoice_comparison.map(function(c){
        return '<div class="qa-cmp"><b>'+esc(c.month)+' &rarr; '+esc(c.vs)+'</b><br>'+esc(c.text)+'</div>';
      }).join('');
    } else { cmpBtn.style.display='none'; }

    if(d.error){ wrap.innerHTML = '<div class="qa-err">'+esc(d.error)+'</div>'; return; }
    if(d.needs_qb){
      wrap.innerHTML = '<div class="qa-qbcta">'+esc(d.note)+'<br><a href="/status">Open System Status</a></div>';
      return;
    }
    // "We looked and it is fine" and "we could not look" are different
    // answers, and rendering both as a green tick is how a page ends up
    // confidently telling you the opposite of the truth. A report that sets
    // `unavailable` is saying it could not look.
    if(d.unavailable){
      var u = d.unavailable;
      wrap.innerHTML = '<div class="qa-unavailable">'+
        '<b>Not measured</b><span>'+esc(u.message||'')+'</span>'+
        (u.action_post ? '<button class="qa-act" data-post="'+esc(u.action_post)+'">'+
          esc(u.action_label||'Run it now')+'</button>' : '')+
        (u.action_href ? '<a class="qa-act" href="'+esc(u.action_href)+'">'+
          esc(u.action_label||'Open')+'</a>' : '')+
      '</div>';
      var act = wrap.querySelector('button.qa-act');
      if(act){
        act.addEventListener('click', function(){
          act.disabled = true;
          var was = act.textContent;
          act.textContent = 'Working… this can take a minute';
          fetch(act.getAttribute('data-post'), {method:'POST', credentials:'same-origin'})
            .then(function(r){ return r.json(); })
            .then(function(res){
              if(res && res.ok){
                act.textContent = 'Done — reloading';
                window.location.reload();
              } else {
                // Say what came back rather than silently re-enabling.
                act.disabled = false;
                act.textContent = was;
                wrap.insertAdjacentHTML('beforeend',
                  '<div class="qa-err">'+esc((res && res.error) ||
                  'That did not succeed, and nothing said why.')+'</div>');
              }
            })
            .catch(function(e){
              act.disabled = false; act.textContent = was;
              wrap.insertAdjacentHTML('beforeend',
                '<div class="qa-err">'+esc(String(e))+'</div>');
            });
        });
      }
      return;
    }
    if(!d.rows || !d.rows.length){
      wrap.innerHTML = '<div class="qa-empty">Nothing to report — all clear. &#10003;</div>'+
        // The note is the report explaining what it checked. Dropping it on
        // the empty path threw away the only context an all-clear has.
        (d.note ? '<div class="qa-empty-note">'+esc(d.note)+'</div>' : '');
      return;
    }
    var styles = d.row_styles || [];
    var h = '<table class="qa-t"><thead><tr>';
    d.columns.forEach(function(c){ h += '<th>'+esc(c)+'</th>'; });
    h += '</tr></thead><tbody>';
    d.rows.forEach(function(row, i){
      var cls = styles[i] ? ' class="qa-row-'+styles[i]+'"' : '';
      h += '<tr'+cls+'>';
      row.forEach(function(c){ h += '<td>'+cellHtml(c)+'</td>'; });
      h += '</tr>';
    });
    h += '</tbody></table>';
    // searchable partner datalist for assign controls
    if(d.partners && d.partners.length){
      h += '<datalist id="qaPartners">'+d.partners.map(function(p){
        return '<option value="'+esc(p)+'">';}).join('')+'</datalist>';
    }
    wrap.innerHTML = h;
    wrap.querySelectorAll('.qa-ghlstatus').forEach(function(sel){
      sel.onchange = function(){
        var msg = sel.parentElement.querySelector('.qa-stage-msg');
        if(msg) msg.textContent = 'Saving…';
        fetch('/api/qa/accounting/status', {method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({id: sel.dataset.opp, status: sel.value})})
          .then(function(r){return r.json();})
          .then(function(res){ if(msg) msg.textContent = res.error ? res.error : 'Saved ✓'; })
          .catch(function(e){ if(msg) msg.textContent = String(e); });
      };
    });
    wrap.querySelectorAll('.qa-stage').forEach(function(sel){
      sel.onchange = function(){
        var msg = sel.parentElement.querySelector('.qa-stage-msg');
        if(msg) msg.textContent = 'Saving…';
        fetch('/api/qa/accounting/status', {method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({id: sel.dataset.opp, stage_id: sel.value})})
          .then(function(r){return r.json();})
          .then(function(res){ if(msg) msg.textContent = res.error ? res.error : 'Saved ✓'; })
          .catch(function(e){ if(msg) msg.textContent = String(e); });
      };
    });
    wrap.querySelectorAll('.qa-sa-host').forEach(function(host){
      host.querySelector('.qa-assign-btn').onclick = function(){
        host.innerHTML = '<div class="qa-assign-wrap">'
          +'<input placeholder="Name or domain&hellip;" value="'+esc(host.dataset.q)+'">'
          +'<button class="qa-assign-btn qa-go">Search</button></div><div class="qa-sa-res"></div>';
        var inp = host.querySelector('input'), res = host.querySelector('.qa-sa-res');
        var kind = host.dataset.kind;
        var go = function(){
          var q = inp.value.trim(); if(!q) return;
          res.innerHTML = '<span class="qa-loading" style="padding:6px;display:block">Searching&hellip;</span>';
          var plat = kind==='analytics' ? 'analytics' : 'gtm';
          fetch('/google/api/search?q='+encodeURIComponent(q)+'&platform='+plat)
            .then(function(r){return r.json();}).then(function(d){
              var items = (d.results||[]);
              if(kind==='analytics') items = items.filter(function(x){return x.platform==='Google Analytics';});
              if(kind==='gtm') items = items.filter(function(x){return x.platform==='Google Tag Manager';});
              if(!items.length){ res.innerHTML='<span class="qa-neg" style="font-size:12px">No matches — try a domain.</span>'; return; }
              res.innerHTML='';
              items.slice(0,5).forEach(function(x){
                var div=document.createElement('div');
                div.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid #e2e8f0;border-radius:8px;padding:5px 8px;margin-top:5px;font-size:12px;background:#fff';
                div.innerHTML='<span><b>'+esc(x.name||x.resource_id)+'</b><br><span style="color:#64748b;font-size:10.5px">'+esc(x.google_login)+'</span></span>'
                  +'<button class="qa-assign-btn">Attach</button>';
                div.querySelector('button').onclick=function(){
                  fetch('/api/client/links',{method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({client:host.dataset.client,kind:kind,
                      data:{name:x.name,resource_id:x.resource_id,google_login:x.google_login,
                            account_id:x.account_id,container:x.internal_container_id||x.resource_id}})})
                    .then(function(r){return r.json();}).then(function(r2){
                      if(r2.error){res.innerHTML='<span class="qa-neg">'+esc(r2.error)+'</span>';return;}
                      var tr=host.closest('tr'); if(tr) tr.remove();   // attached — off the report
                    });
                };
                res.appendChild(div);
              });
            });
        };
        host.querySelector('.qa-go').onclick=go;
        inp.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
        inp.focus();
      };
    });
    wrap.querySelectorAll('.qa-assign-host').forEach(function(host){
      host.querySelector('.qa-assign-btn').onclick = function(){
        host.innerHTML = '<div class="qa-assign-wrap">'
          +'<input list="qaPartners" placeholder="Type to search partners&hellip;">'
          +'<button class="qa-assign-btn qa-save">Save</button></div>';
        var inp = host.querySelector('input');
        inp.focus();
        host.querySelector('.qa-save').onclick = function(){
          var partner = inp.value.trim();
          if(!partner) return;
          fetch('/api/qa/invoice-off/assign', {method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({customer: host.dataset.cust, partner: partner})})
            .then(function(r){return r.json();})
            .then(function(res){
              if(res.error){ host.innerHTML = '<span class="qa-neg">'+esc(res.error)+'</span>'; return; }
              var tr = host.closest('tr');
              if(tr) tr.remove();      // remembered — never shown again
            });
        };
      };
    });
    csvBtn.disabled = false;
  }

  function load(){
    wrap.innerHTML = '<div class="qa-loading">Running report&hellip;</div>';
    csvBtn.disabled = true;
    var msel = document.getElementById('qaMonth');
    var qs = (msel.style.display!=='none' && msel.value) ? '?month='+encodeURIComponent(msel.value) : '';
    fetch('/api/qa/'+KEY+qs).then(function(r){return r.json();}).then(render)
      .catch(function(e){ wrap.innerHTML='<div class="qa-err">'+esc(e)+'</div>'; });
  }
  document.getElementById('qaMonth').onchange = load;
  document.getElementById('qaCompare').onclick = function(){
    document.getElementById('qaCmpModal').classList.add('open');
  };
  var sumClose = document.getElementById('qaSumClose');
  if(sumClose) sumClose.onclick = function(){
    document.getElementById('qaSumModal').classList.remove('open'); };
  var sumModal = document.getElementById('qaSumModal');
  if(sumModal) sumModal.addEventListener('click', function(ev){
    if(ev.target === sumModal) sumModal.classList.remove('open'); });
  document.getElementById('qaCmpClose').onclick = function(){
    document.getElementById('qaCmpModal').classList.remove('open');
  };
  document.getElementById('qaCmpModal').onclick = function(e){
    if(e.target===this) this.classList.remove('open');
  };

  csvBtn.onclick = function(){
    if(!data || !data.rows) return;
    function cv(c){
      var s = (c && typeof c==='object') ? c.text : c;
      s = String(s==null?'':s).replace(/^[▼▲]\s*/,'');
      return '"'+s.replace(/"/g,'""')+'"';
    }
    var lines = [data.columns.map(cv).join(',')];
    data.rows.forEach(function(r){ lines.push(r.map(cv).join(',')); });
    var blob = new Blob(["﻿"+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = KEY + '-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);}, 5000);
  };
  document.getElementById('qaReload').onclick = load;
  load();
})();
</script>

<!-- Everything below was inside the page title block, which base.html renders
     between <title> and </title>. The browser treated all of it as the tab's
     text: the styles never applied and the scripts never ran. Moved here so
     they do. -->
<script>
/* Report actions. Delegated, because rows redraw. */
document.addEventListener('click', function(ev){
  var b = ev.target.closest('.qa-act');
  if(!b) return;
  var action = b.dataset.action, client = b.dataset.client;
  if(b.dataset.confirm && !confirm(b.dataset.confirm)) return;

  if(action === 'add-dashboard'){
    var url = prompt('Dashboard URL for ' + client + '\n\n' +
                     'This writes to every live product for this client, so the ' +
                     'client stops appearing on the report.');
    if(!url) return;
    b.disabled = true; b.textContent = 'Saving…';
    fetch('/api/qa/dashboard/add', {method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({client: client, url: url})})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d.ok){ alert(d.error || 'Could not save.'); b.disabled=false; b.textContent='Add dashboard'; return; }
        alert(d.note || 'Saved.');
        b.closest('tr').style.opacity = '.4';
        b.textContent = 'Added ✓';
      })
      .catch(function(){ alert('Could not save.'); b.disabled=false; b.textContent='Add dashboard'; });
    return;
  }

  if(action === 'form-summary'){
    /* Was a native alert(). Two problems with that: it is the one piece of UI
       we cannot style, and a browser that has been told "prevent this page
       from creating more dialogs" swallows it silently — which reads as the
       button doing nothing at all. A real panel can't be suppressed and can
       show an empty state rather than an empty box. */
    b.disabled = true; b.textContent = 'Loading…';
    fetch('/api/qa/form-summary/' + encodeURIComponent(client), {credentials:'same-origin'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        b.disabled = false; b.textContent = 'Summary';
        var title = document.getElementById('qaSumTitle');
        var body  = document.getElementById('qaSumBody');
        if(d.error){
          title.textContent = 'Could not load this request';
          body.innerHTML = '<p style="color:#b42318">'+esc(d.error)+'</p>';
          document.getElementById('qaSumModal').classList.add('open');
          return;
        }
        title.textContent = d.name || 'Request';
        var h = '';
        if(d.contact && (d.contact.name || d.contact.email || d.contact.company)){
          h += '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;'
            +  'padding:10px 12px;margin-bottom:12px">'
            +  '<b>'+esc(d.contact.name||'—')+'</b>'
            +  (d.contact.company? ' <span class="muted">· '+esc(d.contact.company)+'</span>':'')
            +  '<div style="font-size:12.5px;color:#64748b;margin-top:2px">'
            +  esc(d.contact.email||'') + (d.contact.phone? ' · '+esc(d.contact.phone):'')
            +  '</div></div>';
        }
        var meta = [];
        if(d.created) meta.push('Submitted ' + esc(d.created));
        if(d.status)  meta.push('Status ' + esc(d.status));
        if(meta.length) h += '<div style="font-size:12px;color:#64748b;margin-bottom:12px">'
                          + meta.join(' &middot; ') + '</div>';
        if((d.fields||[]).length){
          h += '<table style="width:100%;border-collapse:collapse">';
          d.fields.forEach(function(f){
            h += '<tr><td style="vertical-align:top;padding:6px 10px 6px 0;color:#64748b;'
              +  'font-size:12px;white-space:nowrap">'+esc(f.label)+'</td>'
              +  '<td style="padding:6px 0;white-space:pre-wrap">'+esc(f.value)+'</td></tr>';
          });
          h += '</table>';
        } else {
          h += '<p class="muted">'+esc(d.note || 'No form fields were recorded for this request.')+'</p>';
        }
        body.innerHTML = h;
        document.getElementById('qaSumModal').classList.add('open');
      })
      .catch(function(){
        b.disabled=false; b.textContent='Summary';
        document.getElementById('qaSumTitle').textContent = 'Could not load this request';
        document.getElementById('qaSumBody').innerHTML =
          '<p style="color:#b42318">The request could not be fetched. '
        + 'Smart 1 Suite may be unreachable.</p>';
        document.getElementById('qaSumModal').classList.add('open');
      });
    return;
  }

  if(action === 'skip-dashboard' || action === 'unskip-dashboard'){
    var verb = action === 'skip-dashboard' ? 'skip' : 'unskip';
    b.disabled = true;
    fetch('/api/qa/dashboard/' + verb, {method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({client: client})})
      .then(function(r){ return r.json(); })
      .then(function(){ b.closest('tr').style.display = 'none'; if(window.loadSkips) loadSkips(); })
      .catch(function(){ b.disabled = false; });
  }
});

/* The skipped list, collapsed. A skip made months ago should be reviewable —
   otherwise it's indistinguishable from the report being wrong. */
(function(){
  if(!/no-dashboards/.test(location.pathname)) return;
  var wrap = document.createElement('div');
  wrap.style.margin = '26px 0 0';
  wrap.innerHTML = '<button class="qa-act" id="showSkips">Show skipped clients</button>' +
                   '<div id="skipBox" hidden style="margin-top:12px"></div>';
  (document.querySelector('.qa-wrap') || document.body).appendChild(wrap);
  document.getElementById('showSkips').onclick = function(){
    var box = document.getElementById('skipBox');
    box.hidden = !box.hidden;
    this.textContent = box.hidden ? 'Show skipped clients' : 'Hide skipped clients';
    if(!box.hidden) loadSkips();
  };
  window.loadSkips = function(){
    var box = document.getElementById('skipBox');
    if(!box || box.hidden) return;
    fetch('/api/qa/dashboard-skips', {credentials:'same-origin'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d.rows || !d.rows.length){
          box.innerHTML = '<p class="muted">' + esc(d.note || 'Nothing skipped.') + '</p>';
          return;
        }
        box.innerHTML = '<p class="muted" style="font-size:12.5px">' + esc(d.note) + '</p>' +
          '<table class="qa-t"><thead><tr>' +
          d.columns.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          d.rows.map(function(r){
            return '<tr>' + r.map(function(c){ return '<td>' + cellHtml(c) + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table>';
      });
  };
})();
</script>
<style>
/* Matches .qa-btn.qa-sec — the Hub's secondary button — rather than the
   one-off blue this used to be. Two button styles on one page reads as two
   different systems bolted together. */
.qa-act{border:1px solid #e2e8f0;background:#fff;color:#1e293b;border-radius:8px;
  padding:5px 11px;font:600 12px 'Segoe UI',system-ui,sans-serif;cursor:pointer;
  white-space:nowrap}
.qa-act:hover{background:#f8fafc;border-color:#cbd5e1}
.qa-assign-btn:hover{background:#f8fafc}
.qa-act:disabled{opacity:.5;cursor:default}
</style>
{% endblock %}
