<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Image Picker · Smart 1{% endblock %}</title>
<style>
:root{
  --ink:#0A2240;
  --ink-2:#41587A;
  --ink-3:#6B7F9B;
  --line:#DDE5EE;
  --paper:#F3F7FB;
  --white:#fff;
  --accent:#00A8C5;
  --accent-deep:#0A6E85;
  --accent-wash:#E4F7FB;
  --good:#0E8F4F;
  --warn:#B4530A;
  --bad:#B3261E;
  --r:14px;
  --shadow:0 1px 2px rgba(10,34,64,.06), 0 8px 24px rgba(10,34,64,.07);
  --tray-h:0px;
}
*{box-sizing:border-box}
/* The `hidden` attribute is only a user-agent rule, so any author `display:`
   beats it. That is exactly how smart1-marketing-audit shipped an opaque
   overlay nobody could dismiss (QA audit v2, §3.1). One line, once, globally. */
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tray-h) + env(safe-area-inset-bottom));
}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.2}
h1{font-size:1.5rem}
h2{font-size:1.125rem}
p{margin:0}
a{color:var(--accent-deep)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.wrap{max-width:1160px;margin:0 auto;padding:0 16px}

/* ---- header ---- */
.top{
  background:var(--ink);color:#fff;
  padding:18px 0 20px;
  position:sticky;top:0;z-index:40;
}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(140deg,var(--accent),#0A6E85);
  display:grid;place-items:center;font-weight:800;font-size:.8rem;color:#04222b;
}
.top h1{font-size:1.15rem;color:#fff}
.top .sub{font-size:.82rem;color:#A9BFD8;margin-top:1px}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.ghost{
  background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;
  padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:600;
}
.ghost:hover{background:rgba(255,255,255,.1)}

/* ---- intro ---- */
.intro{padding:26px 0 4px}
.intro h2{font-size:1.6rem;letter-spacing:-.025em}
.intro p{color:var(--ink-2);margin-top:6px;max-width:56ch}

/* ---- pickers ---- */
.panel{
  background:var(--white);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-top:18px;box-shadow:var(--shadow);
}
.panel-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-head h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.panel-head .hint{font-size:.82rem;color:var(--ink-3)}

.tabs{display:flex;gap:6px;background:var(--paper);padding:4px;border-radius:999px;width:fit-content}
.tabs button{
  border:0;background:transparent;padding:8px 18px;border-radius:999px;
  font-weight:600;font-size:.9rem;color:var(--ink-2);
}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{
  border:1px solid var(--line);background:var(--white);color:var(--ink);
  padding:9px 16px;border-radius:999px;font-size:.92rem;font-weight:550;
  transition:border-color .12s, background .12s;
}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

.searchrow{display:flex;gap:8px;margin-top:14px}
.searchrow input{
  flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);
  border-radius:10px;font:inherit;background:var(--white);color:var(--ink);
}
.searchrow input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-wash)}
.btn{
  border:0;background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;
  font-weight:650;font-size:.94rem;
}
.btn:hover{background:#0d2c54}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.accent{background:var(--accent-deep)}
.btn.accent:hover{background:#095f73}
.btn.small{padding:8px 14px;font-size:.86rem}
.btn.quiet{background:var(--white);color:var(--ink);border:1px solid var(--line)}
.btn.quiet:hover{background:var(--paper)}

.filters{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.filters .lbl{font-size:.8rem;color:var(--ink-3)}
.mini{
  border:1px solid var(--line);background:var(--white);border-radius:999px;
  padding:5px 12px;font-size:.82rem;color:var(--ink-2);
}
.mini[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-deep);font-weight:600}

/* ---- grid ---- */
.grid{
  display:grid;gap:12px;margin-top:18px;
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
}
.tile{
  position:relative;border:0;padding:0;background:var(--white);
  border-radius:12px;overflow:hidden;aspect-ratio:4/3;
  box-shadow:var(--shadow);display:block;width:100%;
}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}
.tile:hover img{transform:scale(1.04)}
.tile .credit{
  position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;
  background:linear-gradient(transparent,rgba(10,34,64,.72));
  color:#E7F0F8;font-size:.68rem;text-align:left;
  opacity:0;transition:opacity .15s;
}
.tile:hover .credit,.tile:focus-visible .credit{opacity:1}
.tile .pick{
  position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.9);border:1.5px solid rgba(10,34,64,.18);
  display:grid;place-items:center;color:transparent;font-weight:800;font-size:.9rem;
}
.tile[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:-3px}
.tile[aria-pressed="true"] .pick{background:var(--accent);border-color:var(--accent);color:#04222b}
.tile[data-saved="1"]{opacity:.55}
.tile .flag{
  position:absolute;top:8px;left:8px;background:rgba(10,34,64,.86);color:#CFE9F0;
  font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;
}

.skeleton{aspect-ratio:4/3;border-radius:12px;background:linear-gradient(100deg,#E8EEF5 30%,#F4F8FC 50%,#E8EEF5 70%);background-size:220% 100%;animation:sweep 1.3s linear infinite}
@keyframes sweep{to{background-position:-220% 0}}

/* ---- tray (the signature bit) ---- */
.tray{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--ink);color:#fff;
  padding:12px 0 calc(12px + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .22s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 -8px 30px rgba(10,34,64,.22);
}
.tray.up{transform:none}
.tray .wrap{display:flex;align-items:center;gap:14px}
.tray-thumbs{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding-bottom:2px}
.tray-thumbs button{
  flex:none;width:52px;height:52px;border-radius:9px;overflow:hidden;
  border:2px solid rgba(255,255,255,.25);padding:0;background:#12314f;position:relative;
}
.tray-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.tray-thumbs button::after{
  content:"×";position:absolute;inset:0;background:rgba(10,34,64,.72);color:#fff;
  display:grid;place-items:center;font-size:1.3rem;opacity:0;transition:opacity .12s;
}
.tray-thumbs button:hover::after,.tray-thumbs button:focus-visible::after{opacity:1}
.tray .count{font-size:.86rem;color:#A9BFD8;flex:none}
.tray .btn{background:var(--accent);color:#04222b;flex:none}
.tray .btn:hover{background:#00bcda}

/* ---- messages ---- */
.note{
  border-radius:12px;padding:14px 16px;margin-top:18px;font-size:.94rem;
  border:1px solid var(--line);background:var(--white);
}
.note.good{border-color:#A9DCC0;background:#EEF9F3}
.note.bad{border-color:#EFC0BC;background:#FDF1F0}
.note.warn{border-color:#EFD9B4;background:#FDF7EC}
.note h3{font-size:.98rem;margin-bottom:3px}
.note p{color:var(--ink-2);font-size:.88rem}

.empty{
  text-align:center;padding:52px 20px;color:var(--ink-3);
  border:1px dashed var(--line);border-radius:var(--r);margin-top:18px;background:var(--white);
}
.empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}

.foot{padding:34px 0 60px;color:var(--ink-3);font-size:.8rem;text-align:center}

/* ---- tables (admin/gallery) ---- */
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.pill.on{background:#E6F6ED;color:var(--good)}
.pill.off{background:#F0F3F7;color:var(--ink-3)}
.pill.err{background:#FBECEA;color:var(--bad)}
.pill.pend{background:#FDF4E6;color:var(--warn)}
.linkbox{display:flex;gap:6px;align-items:center}
.linkbox input{flex:1;min-width:0;font:inherit;font-size:.8rem;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink-2)}

@media (max-width:560px){
  .intro h2{font-size:1.32rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
  .tray-thumbs button{width:44px;height:44px}
  .top{padding:14px 0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body data-module="image_picker">
{% block body %}{% endblock %}
</body>
</html>
