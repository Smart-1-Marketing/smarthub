    return '<div class="bsrow" style="flex-direction:column;align-items:stretch;gap:4px">' +
      '<label style="flex:none">' + esc(label) + '</label>' +
      '<div class="inkrow"><span class="inklabel">Brand</span>' + chips +
        '<input type="color" style="width:34px;height:24px;padding:1px;flex:none"' +
        ' data-style="' + block + '" data-prop="' + prop + '" value="' + esc(swatch) + '">' +
        '<button type="button" class="bsclear" style="padding:3px 8px;font-size:10.5px"' +
        ' data-style="' + block + '" data-prop="' + prop + '">Layout</button>' +
      '</div></div>';
  }

  function opt(value, label, current) {
    return '<option value="' + value + '"' +
      ((current || '') === value ? ' selected' : '') + '>' + label + '</option>';
  }

  function currentAccent() {
    var c = state.doc.campaign.brand.colors || {};
    return c.accent || '#2563eb';
  }

  function setBlockStyle(block, prop, raw) {
    var c = concept();
    if (!c.styleOverrides) c.styleOverrides = {};
    if (!c.styleOverrides[block]) c.styleOverrides[block] = {};
    var st = c.styleOverrides[block];

    var value = String(raw == null ? '' : raw).trim();
    if (prop === '*') {
      // "Put it back" -- drop every override on this block at once.
      delete c.styleOverrides[block];
      if (!Object.keys(c.styleOverrides).length) delete c.styleOverrides;
      state.dirty = true;
      schedule();
      return;
    }
    if (value === '') {
      // Blank is "use the layout's own setting", not zero.
      delete st[prop];
    } else if (prop === 'scale' || prop === 'opacity') {
      // Fractions, not pixels. Rounding these to integers is how a 55%
      // overlay became 1 and a 0.9 logo scale became a whole-number 1 — the
      // slider moved and the ad did not.
      var f = Number(value);
      if (!isFinite(f)) { delete st[prop]; } else { st[prop] = f; }
    } else if (prop === 'size' || prop === 'w' || prop === 'h' ||
               prop === 'x' || prop === 'y') {
      var n = Number(value);
      // A position of 0 is meaningful (flush to the edge); a size of 0 is not.
      var floor = (prop === 'x' || prop === 'y') ? 0 : 1;
      if (!isFinite(n) || n < floor) { delete st[prop]; } else { st[prop] = n; }
    } else {
      st[prop] = value;
    }

    if (!Object.keys(st).length) delete c.styleOverrides[block];
    if (!Object.keys(c.styleOverrides).length) delete c.styleOverrides;

    state.dirty = true;
    schedule();          // same debounce the copy fields use
  }

  /* ---------------------------------------------- adjusting a background
     
     Two things you could not do at all until now, and both are the first
     thing anybody asks for once a photo is behind an ad.
     
     **Where the photo sits.** A background is drawn to cover the canvas and
     the overflow is cut off. On a 300x250 that throws away most of a
     landscape shot, and which part it throws away is the difference between
     a house and a lawn -- so the crop anchor is a nine-way grid, showing the
     same alignment the renderer uses rather than a slider that means nothing
     until you move it.
     
     **The overlay.** There has always been one, painted so text stays
     readable, and it was a fixed dark scrim nobody could see or set. It is a
     color and a strength now. Leaving the color alone keeps the graded dark
     scrim exactly as it was, so no existing ad changes; choosing one paints a
     flat wash of that color, because a graded version of a chosen color is
     that color nowhere on the canvas. */
  var BG_POS = [
    ['xMinYMin', 'Top left'], ['xMidYMin', 'Top'], ['xMaxYMin', 'Top right'],
    ['xMinYMid', 'Left'], ['xMidYMid', 'Center'], ['xMaxYMid', 'Right'],
    ['xMinYMax', 'Bottom left'], ['xMidYMax', 'Bottom'], ['xMaxYMax', 'Bottom right'],
  ];
  var DEFAULT_OVERLAY = 0.42;

  function backgroundAdjust() {
    var c = concept();
    if (!c.backgroundImage) return '';
    var strength = typeof c.backgroundOverlay === 'number' ? c.backgroundOverlay : DEFAULT_OVERLAY;
    var wash = c.backgroundOverlayColor || '';
    var zoom = typeof c.backgroundZoom === 'number' ? c.backgroundZoom : 1;
    var off = c.backgroundOffset || legacyOffset(c.backgroundPosition);
    return '<details class="blockstyle" data-acc="bg" style="margin-top:10px"' +
        (openPanel('bg') ? ' open' : '') + '>' +
      '<summary>Where the picture sits' +
        dotIf(!!c.backgroundOffset || !!c.backgroundPosition || zoom !== 1) + '</summary>' +
      '<label style="font-size:11px;color:var(--ink-2);display:block;margin-bottom:4px">' +
        'Move the picture' +
        help('The picture always fills the ad; these move it inside the frame, ' +
             'so a different part of it survives the crop. The circle re-centers it.') +
      '</label>' +
      nudgePad('background', 'Move the picture') +
      '<div class="slider">' +
        '<label>Zoom <b id="bgZoomLabel">' + Math.round(zoom * 100) + '%</b></label>' +
        '<input type="range" id="bgZoom" min="100" max="300" step="5" value="' +
          Math.round(zoom * 100) + '">' +
      '</div>' +
      '<details class="advanced"><summary>Advanced \u2014 type the numbers</summary>' +
        '<div class="bsrow">' +
          '<label>Across (-1 left \u2026 1 right)' +
            '<input type="number" min="-1" max="1" step="0.05" id="bgOffX"' +
            ' value="' + (Math.round((off.x || 0) * 100) / 100) + '"></label>' +
          '<label>Down (-1 top \u2026 1 bottom)' +
            '<input type="number" min="-1" max="1" step="0.05" id="bgOffY"' +
            ' value="' + (Math.round((off.y || 0) * 100) / 100) + '"></label>' +
        '</div>' +
        '<div style="font-size:11px;color:var(--ink-2);line-height:1.35">' +
          'A fraction of the picture\u2019s own overflow, not pixels \u2014 so one ' +
          'setting shows the same part of the photograph on every size.' +
        '</div>' +
      '</details>' +
      '<div class="bsname" style="margin-top:12px">Overlay' +
        help('Painted over the picture so the words stay readable. Leave the ' +
             'color on Auto for the built-in dark scrim, which is heavier where ' +
             'the copy sits; pick one and it becomes a flat wash of that color.') +
      '</div>' +
      '<div class="inkrow"><span class="inklabel">Color</span>' +
        BRAND_ROLES.map(function (role) {
          var hex = (state.doc.campaign.brand.colors || {})[role] || '#888888';
          return '<button type="button" class="inkchip" title="Brand ' + role + '"' +
            ' style="background:' + esc(hex) + '" data-overlay="' + esc(hex) + '"' +
            ' aria-pressed="' + (wash.toUpperCase() === hex.toUpperCase() ? 'true' : 'false') +
            '"></button>';
        }).join('') +
        '<input type="color" id="bgWash" style="width:34px;height:24px;padding:1px;flex:none"' +
          ' value="' + esc(wash || '#0B1220') + '">' +
        '<button type="button" class="bsclear" id="bgWashClear"' +
          ' style="padding:3px 8px;font-size:10.5px">Auto</button>' +
      '</div>' +
      '<div class="slider">' +
        '<label>Transparency <b id="bgOpacityLabel">' +
          Math.round((1 - strength) * 100) + '% see-through</b></label>' +
        '<input type="range" id="bgOpacity" min="0" max="100" step="5"' +
          ' value="' + Math.round(strength * 100) + '">' +
      '</div>' +
      '<div style="font-size:11px;color:var(--ink-2);line-height:1.35">' +
        (wash ? 'A flat wash of the color above.'
              : 'No color chosen, so this is the built-in dark scrim.') +
      '</div></details>';
  }

  /* The nine old alignments, as the offsets they always meant, so a concept
     saved before the arrows existed shows the right numbers in Advanced. */
  function legacyOffset(pos) {
    var map = {
      xMinYMin: [-1,-1], xMidYMin: [0,-1], xMaxYMin: [1,-1],
      xMinYMid: [-1,0],  xMidYMid: [0,0],  xMaxYMid: [1,0],
      xMinYMax: [-1,1],  xMidYMax: [0,1],  xMaxYMax: [1,1]
    }[pos || ''];
    return map ? { x: map[0], y: map[1] } : { x: 0, y: 0 };
  }

  /* The card the copy sits on.
     
     "Full background with copy panel" puts the headline on a filled panel over
     the photograph, and that fill is the single thing deciding whether the
     copy can be read. It was a template constant -- brand primary at 88% --
     so a client whose primary is a mid-gray got copy nobody could read and
     there was no control anywhere that could change it. */
  function panelControls() {
    if (!willDraw('panel')) return '';
    var ps = (concept().styleOverrides || {}).panel || {};
    var op = typeof ps.opacity === 'number' ? ps.opacity : null;
    return '<details class="blockstyle" data-acc="panel"' +
        (openPanel('panel') ? ' open' : '') + '>' +
      '<summary>Panel behind the copy' + dotIf(Object.keys(ps).length > 0) + '</summary>' +
      '<div style="font-size:11px;color:var(--ink-2);line-height:1.35;margin-bottom:7px">' +
        'This layout puts the words on a card over the picture. Its color is ' +
        'what decides whether they can be read.' +
      '</div>' +
      colorControl('panel', 'fill', 'Card color', ps.fill) +
      '<div class="slider">' +
        '<label>Solidity <b id="panelOpacityLabel">' +
          (op === null ? 'layout\u2019s own' : Math.round(op * 100) + '%') + '</b></label>' +
        '<input type="range" id="panelOpacity" min="0" max="100" step="5"' +
          ' value="' + Math.round((op === null ? 0.88 : op) * 100) + '">' +
      '</div>' +
      '<div style="font-size:11px;color:var(--ink-2);line-height:1.35;margin-bottom:6px">' +
        'The copy on this card has a color of its own. Changing the card to ' +
        'something near it makes the words vanish \u2014 the checks on the right ' +
        'will say so, and Text color on each block above is where to fix it.' +
      '</div>' +
      '<button type="button" class="bsclear" data-style="panel" data-prop="*">' +
        'Put the card back</button>' +
      '</details>';
  }

  function wireBackgroundAdjust() {
    var slider = $('bgOpacity');
    if (slider) slider.addEventListener('input', function () {
      var pct = Number(this.value);
      concept().backgroundOverlay = pct / 100;
      state.dirty = true;
      var lbl = $('bgOpacityLabel');
      if (lbl) lbl.textContent = (100 - pct) + '% see-through';
      schedule();
    });
    var zoom = $('bgZoom');
    if (zoom) zoom.addEventListener('input', function () {
      var pct = Number(this.value);
      concept().backgroundZoom = pct / 100;
      state.dirty = true;
      var lbl = $('bgZoomLabel');
      if (lbl) lbl.textContent = pct + '%';
      schedule();
    });
    // Advanced: the offset as two numbers. Same value the arrows move.
    ['bgOffX', 'bgOffY'].forEach(function (id) {
      var el = $(id);
      if (!el) return;
      el.addEventListener('change', function () {
        var c = concept();
        var off = c.backgroundOffset || legacyOffset(c.backgroundPosition);
        var v = Math.max(-1, Math.min(1, Number(this.value) || 0));
        c.backgroundOffset = id === 'bgOffX' ? { x: v, y: off.y || 0 }
                                             : { x: off.x || 0, y: v };
        state.dirty = true;
        preview();
      });
    });
    Array.prototype.forEach.call($('controls').querySelectorAll('[data-overlay]'), function (el) {
      el.addEventListener('click', function () { setOverlayColor(el.dataset.overlay); });
    });
    var picker = $('bgWash');
    if (picker) picker.addEventListener('change', function () { setOverlayColor(this.value); });
    var clear = $('bgWashClear');
    if (clear) clear.addEventListener('click', function () { setOverlayColor(''); });

    // The card behind the copy.
    var panelOp = $('panelOpacity');
    if (panelOp) panelOp.addEventListener('input', function () {
      var pct = Number(this.value);
      setBlockStyle('panel', 'opacity', pct / 100);
      var lbl = $('panelOpacityLabel');
      if (lbl) lbl.textContent = pct + '%';
    });

    // The logo, sized by one slider rather than two number fields.
    var logoScale = $('logoScale');
    if (logoScale) logoScale.addEventListener('input', function () {
      var pct = Number(this.value);
      setBlockStyle('logo', 'scale', pct / 100);
      var lbl = $('logoScaleLabel');
      if (lbl) lbl.textContent = pct + '%';
    });

    var legibility = $('logoLegibility');
    if (legibility) legibility.addEventListener('click', askAboutTheLogo);
  }

  /* A logo nobody can see, fixed by moving the palette.
     
     The client's mark is the one asset in a campaign nobody may edit, so when
     it is dark on their dark brand color the palette is what has to move. QA
     has always said the logo is invisible and could do nothing about it.
     
     The proposals are arithmetic, not a model: every one is generated by
     walking a channel until the WCAG ratio clears, and every one comes back
     with the ratio it achieves, so the panel shows its work. Where the client
     has an Insites scan, the colors their real website uses are offered
     first and labeled as observed -- those are their colors rather than a
     tint of one entry in them. */
  function askAboutTheLogo() {
    var box = $('logoFix');
    if (!box) return;
    box.innerHTML = '<div class="bgmsg">Measuring the logo against what is behind it\u2026</div>';
    siteBrand().then(function (site) {
      return post('/api/palette/variants', {
        campaign: state.doc.campaign, conceptId: state.conceptId, size: state.size,
        observed: site && site.colors ? site.colors : undefined,
      });
    }).then(function (d) {
      if (!d || d.ratio === null || d.ratio === undefined) {
        box.innerHTML = '<div class="bgmsg">' +
          esc((d && d.reason) || 'The logo could not be measured.') + '</div>';
        return;
      }
      var verdictText = d.verdict === 'fine'
        ? 'The logo reads at ' + d.ratio.toFixed(1) + ':1 against the ' + esc(d.behind) +
          ' color, which is fine. Nothing needs changing.'
        : (d.verdict === 'invisible' ? 'The logo is close to invisible' : 'The logo is weak') +
          ' at ' + d.ratio.toFixed(1) + ':1 against the ' + esc(d.behind) + ' color.';
      if (!d.variants || !d.variants.length) {
        box.innerHTML = '<div class="bgmsg">' + esc(verdictText) +
          (d.verdict === 'fine' ? '' :
            ' Nothing in their palette, and no lighter or darker version of it, ' +
            'clears the threshold \u2014 this one needs a reverse logo rather than ' +
            'a color change.') + '</div>';
        return;
      }
      box.innerHTML = '<div class="bgmsg">' + esc(verdictText) +
        ' These keep the logo exactly as it is and move the palette instead.</div>' +
        d.variants.map(function (v, i) {
          return '<button type="button" class="variant" data-variant="' + i + '">' +
            '<span class="vsw" style="background:' + esc(v.colors[d.behind] || '#888') + '"></span>' +
            '<span><b>' + esc(v.name) + ' <em>' + v.ratio.toFixed(1) + ':1</em></b>' +
            '<span>' + esc(v.why) + '</span></span></button>';
        }).join('') +
        '<button type="button" class="bsclear" id="logoFixClose">Leave it as it is</button>';

      Array.prototype.forEach.call(box.querySelectorAll('[data-variant]'), function (el) {
        el.addEventListener('click', function () {
          var v = d.variants[Number(el.dataset.variant)];
          // The whole palette, not one role: applying part of it is how a set
          // ends up half in one scheme and half in another.
          state.doc.campaign.brand.colors = v.colors;
          state.dirty = true;
          drawControls();
          preview();
          showNextSteps('Palette changed to "' + v.name + '". The logo is untouched. ' +
                        'Save to keep it.');
        });
      });
      var close = $('logoFixClose');
      if (close) close.addEventListener('click', function () { box.innerHTML = ''; });
    }).catch(function () {
      box.innerHTML = '<div class="bgmsg">That could not be measured just now.</div>';
    });
  }

  /* The client's real website colors, offered beside the palette.
     
     Brandfetch returns a list and frequently does not label which entry is
     the brand color -- that is the note the intake has to print, and the
     reason a build opens on a palette somebody has to check. An Insites scan
     of their live site reports what the pages actually paint: the background
     behind their content, their text color, their accent. That is observed
     rather than declared, and it is the better evidence.
     
     Shown only when a scan exists, which for a prospect it usually does not.
     A row of swatches with nothing behind them would be a promise the tool
     cannot keep. */
  function drawSiteBrand() {
    var host = $('siteBrand');
    if (!host) return;
    siteBrand().then(function (d) {
      host = $('siteBrand');                    // the column may have redrawn
      if (!host || !d) return;
      var entries = Object.keys(d.colors || {});
      // A scan with no readable palette can still carry the screenshot, and
      // that is the half worth looking at. Returning early on an empty color
      // list hid the picture on every one of those.
      if (!entries.length && !d.screenshot) return;
      host.innerHTML =
        '<div style="font-size:11px;color:var(--ink-2);margin-bottom:5px">' +
          'From their website' +
          help('Read off ' + d.domain + ' by their latest site scan \u2014 what the ' +
               'live pages actually paint, rather than a palette somebody ' +
               'labeled. Click a swatch to copy its hex.') +
        '</div>' +
        (entries.length
          ? '<div class="inkrow" style="margin-bottom:9px">' +
              entries.map(function (k) {
                return '<button type="button" class="inkchip" data-sitecolor="' +
                  esc(d.colors[k]) + '" style="background:' + esc(d.colors[k]) + '"' +
                  ' title="' + esc(k + ' \u2014 ' + d.colors[k] + ' (click to copy)') + '"></button>';
              }).join('') +
            '</div>'
          : '<div class="bgmsg" style="margin-bottom:9px">Their scan could not read ' +
            'a palette off the page.</div>') +
        siteShotMarkup(d);
      wireSiteShot(host, d);
      Array.prototype.forEach.call(host.querySelectorAll('[data-sitecolor]'), function (el) {
        el.addEventListener('click', function () {
          var hex = el.dataset.sitecolor;
          // Copied, not applied. Which of the five roles a site color should
          // become is a judgment -- their page background is not always the
          // ad's primary -- and guessing it would move four other things.
          if (navigator.clipboard) navigator.clipboard.writeText(hex).catch(function () {});
          el.title = hex + ' copied \u2014 paste it into a swatch below';
        });
      });
    });
  }

  /* What the scan can say about their type, which is less than people want.

     `gdpr.has_google_font_api` is a boolean: the site loads Google Fonts, or
     it does not. It never says WHICH face, and a note implying otherwise
     would be worse than no note -- somebody would read it as a
     recommendation and type a family the renderer does not have.

     So it is stated as what it is, and the useful direction is the one people
     do not expect: a **false** is the actionable answer. It means their type
     is self-hosted or licensed, so nothing here will match it by accident and
     the face is a decision somebody has to make rather than assume. A true is
     mild encouragement. And an absent value is *not measured* -- the check
     lives in the scan's GDPR section and a plan that did not run it leaves
     the field out entirely, which must not read as "no". */
  function drawSiteType() {
    var host = $('siteType');
    if (!host) return;
    siteBrand().then(function (d) {
      host = $('siteType');                     // the column may have redrawn
      if (!host || !d) return;
      var uses = d.usesGoogleFonts;
      if (uses === null || uses === undefined) return;   // not measured: say nothing
      host.innerHTML = '<div class="bgmsg" style="margin-top:2px">' +
        (uses
          ? esc(d.domain) + ' loads Google Fonts, so a Google family here has a ' +
            'fair chance of matching their site. The scan does not say which one.'
          : esc(d.domain) + ' does not load Google Fonts \u2014 their face is ' +
            'self-hosted or licensed, so nothing here will match it by accident. ' +
            'Worth picking deliberately.') +
        '</div>';
    });
  }

  /* Their site, as it looks.

     The palette above says what the page paints; this says what it looks
     like, which is the thing an ad actually gets compared against. An
     operator judging brand color on a dark canvas has, until now, had to
     open the client's website in another tab to remember what they are
     matching -- and mostly did not, which is how an ad comes back "not really
     them" with nobody able to say why.

     Desktop and mobile, because half a display package runs on a phone and
     the two are often laid out nothing alike. Desktop leads because it is the
     one that carries the full brand furniture; mobile is a toggle rather than
     a second thumbnail, since two small pictures side by side are two
     pictures nobody can read.

     It is reference and never a source: nothing here can be applied to the
     ad. A screenshot of a website is not a background, and the logo in it is
     a logo photographed off a page -- the rule `hub/scan_facts.py` states,
     that a sighting is a candidate and never merged into what we hold. */
  function siteShotMarkup(d) {
    if (!d.screenshot) return '';
    var when = d.scannedAt ? new Date(d.scannedAt) : null;
    var dated = (when && !isNaN(when)) ? when.toLocaleDateString() : '';
    return '<div id="siteShot">' +
      '<div style="font-size:11px;color:var(--ink-2);margin-bottom:4px;display:flex;' +
        'align-items:center;gap:6px;flex-wrap:wrap">' +
        '<span>Their site' + (dated ? ', ' + esc(dated) : '') + '</span>' +
        (d.screenshotMobile
          ? '<button type="button" class="bsclear" data-shot="desktop" ' +
            'aria-pressed="true" style="padding:1px 7px;font-size:10.5px">Desktop</button>' +
            '<button type="button" class="bsclear" data-shot="mobile" ' +
            'aria-pressed="false" style="padding:1px 7px;font-size:10.5px">Mobile</button>'
          : '') +
      '</div>' +
      '<img id="siteShotImg" src="' + esc(d.screenshot) + '" alt="' +
        esc(d.domain + ' as it looks today') + '" ' +
        'style="width:100%;border-radius:6px;border:1px solid var(--line);' +
        'display:block;cursor:zoom-in;background:var(--panel-2)">' +
      '<div class="bgmsg" style="margin-top:4px">Reference only \u2014 click to enlarge.</div>' +
      '</div>';
  }

  function wireSiteShot(host, d) {
    var img = host.querySelector('#siteShotImg');
    if (!img) return;
    img.addEventListener('click', function () {
      // No "use this picture": see lightbox().
      lightbox(img.src, null, d.domain + ' \u2014 Esc closes');
    });
    Array.prototype.forEach.call(host.querySelectorAll('[data-shot]'), function (btn) {
      btn.addEventListener('click', function () {
        var want = btn.dataset.shot;
        img.src = want === 'mobile' ? d.screenshotMobile : d.screenshot;
        Array.prototype.forEach.call(host.querySelectorAll('[data-shot]'), function (b) {
          b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
        });
      });
    });
  }

  /* What the client's own website says its brand is, from their latest
     Insites scan. Cached for the session: it is one scan, it does not change
     while somebody is laying out an ad, and it is a database read on the Hub
     side. Absence is normal -- most prospects have never been scanned -- so
     every caller treats a null as "no extra evidence" rather than an error. */
  var siteBrandCache;
  function siteBrand() {
    if (siteBrandCache !== undefined) return Promise.resolve(siteBrandCache);
    var who = clientName();
    var domain = (state.doc && state.doc.campaign.brand.domain) || '';
    if (!who && !domain) { siteBrandCache = null; return Promise.resolve(null); }
    return fetch('/_hub/site-brand?client=' + encodeURIComponent(who) +
                 '&domain=' + encodeURIComponent(domain))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        siteBrandCache = (d && d.found) ? d : null;
        return siteBrandCache;
      })
      .catch(function () { siteBrandCache = null; return null; });
  }

  function setOverlayColor(hex) {
    var c = concept();
    if (hex) c.backgroundOverlayColor = hex.toUpperCase();
    else delete c.backgroundOverlayColor;
    // A strength has to exist before a color means anything, or the first
    // pick paints the composer's default 0.42 with no slider position behind
    // it and the panel and the ad disagree.
    if (typeof c.backgroundOverlay !== 'number') c.backgroundOverlay = DEFAULT_OVERLAY;
    state.dirty = true;
    drawControls();
    preview();
  }

  /* ------------------------------------------------- background chooser
     Four ways to put a picture behind the ad, in one place, because the
     question "what goes behind this" is one question however it gets
     answered. Nothing is applied until a thumbnail is clicked -- searching
     and generating produce candidates, the same rule the intake form uses.

     A source that fails says so where the pictures would have been. An empty
     result with no explanation reads as "there is nothing", which is a
     different and usually wrong answer. */
  function bgResults() { return $('bgResults'); }

  function bgSay(html) { bgResults().innerHTML = html; }

  /* Six waits hang off this panel and they are not alike: two are a model
     drawing (billed, tens of seconds), two are somebody else's server (the
     client's own landing page, the stock library) and two are our own
     storage. The Hub's one indicator draws a different glyph for each, so
     the kind travels with the message rather than every call site being
     edited again the next time the mark changes.

     Before this the panel said a sentence and nothing else -- which is the
     note CLAUDE.md already makes about the QA reports saying "Running
     report..." in two words with no mark and no sign it was still going,
     on the screen where the wait is longest and the call is billed.

     Guarded on window.S1Think, so a page that failed to load the script
     loses the mark and never the message. The handle is returned for a
     caller that has a real transition to report; the rest end the wait by
     writing over the panel, which the indicator's own isConnected check
     already handles. */
  function bgBusy(what, kind) {
    if (window.S1Think) {
      return window.S1Think.attach(bgResults(),
        { kind: kind || 'wait', label: what });
    }
    bgSay('<span class="bgmsg">' + esc(what) + '</span>');
    return {
      stage: function (text) {
        if (text) bgSay('<span class="bgmsg">' + esc(text) + '</span>');
      },
      done: function () {}
    };
  }

  function chooseBackground(mode, btn) {
    Array.prototype.forEach.call($('controls').querySelectorAll('[data-bgmode]'),
      function (el) { el.classList.toggle('on', el === btn); });

    if (mode === 'none') {
      var c0 = concept();
      delete c0.backgroundImage;
      delete c0.backgroundOverlay;
      delete c0.backgroundOverlayColor;
      delete c0.backgroundPosition;
      state.dirty = true;
      drawControls();
      var n0 = $('bgNote');
      if (n0) n0.textContent = 'This concept uses the flat brand color.';
      preview();
      return;
    }

    if (mode === 'landing') {
      bgBusy('Reading their landing page\u2026', 'scan');
      post('/api/landing/images', { projectId: state.projectId || undefined,
                                    url: state.doc.landingPage || undefined })
        .then(function (d) {
          if (!d.images || !d.images.length) {
            bgSay('<span class="bgmsg">' +
              esc((d.warnings && d.warnings[0]) ||
                  'Nothing on that page is big enough for a background.') + '</span>');
            return;
          }
          bgGrid(d.images.map(function (i) {
            return { url: i.url, label: i.width + '\u00d7' + i.height };
          }), 'landing');
        })
        .catch(function () { bgSay('<span class="bgmsg">Could not read the landing page.</span>'); });
      return;
    }

    if (mode === 'gallery') {
      var who = clientName();
      if (!who) {
        bgSay('<span class="bgmsg">This build has no client on it yet, so ' +
              'there is no gallery to read.</span>');
        return;
      }
      bgBusy('Reading ' + who + '\u2019s gallery\u2026', 'wait');
      /* The Hub owns this one. The renderer does not know who our clients are
         and must not learn -- the basepath shim puts the mount prefix on the
         front, so standalone this correctly 404s rather than half-working. */
      fetch('/_hub/gallery?client=' + encodeURIComponent(who))
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.images || !d.images.length) {
            bgSay('<span class="bgmsg">' + esc(d.note ||
              'Nothing in that gallery can be used as a background.') +
              ' Try uploading one.</span>');
            return;
          }
          bgGrid(d.images.map(function (i) {
            // `thumb` is what the tile draws; `url` is what gets applied and
            // what the magnifier opens. Only the Hub-fed gallery carries one
            // -- stock, AI and a fresh upload pass none and fall back to the
            // asset, exactly as they did before.
            return { url: i.url, thumb: i.thumb || '', label: i.label || '' };
          }), 'gallery');
        })
        .catch(function () {
          bgSay('<span class="bgmsg">That gallery could not be read.</span>');
        });
      return;
    }

    if (mode === 'upload') {
      bgSay('<p class="bgmsg">Pick a picture from this computer. A wide photo ' +
            'works best \u2014 1200px or more across. It is filed into the ' +
            'client\u2019s gallery too, so nobody has to find it again.</p>' +
            '<input type="file" id="bgFile" accept="image/png,image/jpeg,image/webp">');
      var picker = $('bgFile');
      if (picker) picker.addEventListener('change', function () {
        uploadBackground(this.files && this.files[0]);
      });
      return;
    }

    if (mode === 'stock') {
      stockSearch('');
      return;
    }

    if (mode === 'ai') {
      /* Two waits back to back, and only the second one is the model. The
         page is fetched first (their server, the dish) and then the picture
         is drawn (billed, the star), so the mark changes hands at the real
         transition rather than on a timer -- the browser knows exactly when
         the fetch came back, which is the one case where reporting a step
         beats guessing at one.

         The reading step is claimed only when there is a page still to
         fetch: ensureLanding() caches on state.landing, so the second
         generation has no such step and announcing one would be the
         indicator claiming what it does not know. */
      var hasPage = !!state.landingPage;
      var reading = hasPage && !state.landing;
      var think = bgBusy(
        reading ? 'Reading ' + state.landingPage + '\u2026'
                : 'Drawing something \u2014 this takes a few seconds\u2026',
        reading ? 'scan' : 'ai');
      /* The client's own page is part of the brief. Without it the model is
         drawing from a headline and a business name, which is how a roofing
         company gets a stock-looking house it has never worked on -- the
         analysis was sitting on the project record the whole time and this
         call never asked for it. */
      ensureLanding().then(function (landing) {
      think.stage('Drawing something \u2014 this takes a few seconds\u2026',
                  'ai');
      post('/api/images/generate', {
        business: state.doc.campaign.client || '',
        promoting: effective('headline') || '',
        benefit: effective('support') || '',
        offer: effective('offer') || '',
        landingAnalysis: landing || undefined,
        palette: state.doc.campaign.brand.colors || undefined
      })
        .then(function (d) {
          // The server answers { candidate }. This read only { candidates },
          // found nothing, found no reason either, and printed its fallback
          // sentence -- so a generation that had just worked reported "image
          // generation is not configured". Both shapes are read now, and the
          // server sends both.
          var cands = d.candidates ||
            (d.candidate ? [d.candidate] : (d.url ? [{ url: d.url }] : []));
          cands = cands.filter(function (x) { return x && x.url; });
          if (!cands.length) {
            bgSay('<span class="bgmsg">' + esc(d.reason || d.error ||
              'Nothing came back from the image generator.') + '</span>');
            return;
          }
          aiGrid(cands, null);
        })
        .catch(function () { bgSay('<span class="bgmsg">Image generation is unavailable.</span>'); });
      });
    }
  }

  /* A generated picture is a first draft, and the first thing anybody wants
     is one change to it -- "make the sky darker", "move the house left". The
     server has taken a revise instruction and the previous image as a
     reference since the intake screen was built; the build screen simply
     never offered the box. It is the difference between a generator you can
     work with and a slot machine you keep pulling. */
  function aiGrid(cands, note) {
    bgGrid(cands.map(function (x) { return { url: x.url, label: 'AI' }; }), 'ai',
      (note ? '<p class="bgmsg">' + esc(note) + '</p>' : '') +
      '<p class="bgmsg">Click it to put it behind this concept, or ask for a ' +
      'change and it will redraw from this one rather than starting again.</p>');
    var last = cands[cands.length - 1];
    bgResults().insertAdjacentHTML('beforeend',
      '<div class="bsrow" style="margin-top:8px">' +
        '<label style="flex:1">Ask for a change' +
          '<input type="text" id="aiRevise" placeholder="e.g. make the sky darker">' +
        '</label>' +
        '<button type="button" class="bsclear" id="aiReviseGo">Redraw</button>' +
      '</div>');
    /* Keeping the one you liked.

       A generated picture is a file on the render disk that the retention
       sweep will remove, so a picture worth reusing has to be moved somewhere
       permanent before it is filed -- otherwise the client's gallery gains a
       row that opens today and 404s next month. The renderer moves it to
       Cloudinary; the Hub files it. Offered only inside the Hub, because
       standalone there is no client record to file into. */
    if (window.S1_BASE && last && last.url) {
      bgResults().insertAdjacentHTML('beforeend',
        '<div class="bsrow" style="margin-top:6px">' +
          '<button type="button" class="bsclear" id="aiKeep">' +
            'Save this picture to ' + esc(clientLabel()) + '\u2019s gallery</button>' +
          '<span id="aiKeepNote" style="font-size:11.5px;color:var(--ink-2)"></span>' +
        '</div>');
      var keep = $('aiKeep'), keepNote = $('aiKeepNote');
      if (keep) keep.addEventListener('click', function () {
        keep.disabled = true;
        keepNote.textContent = 'Storing it\u2026';
        post('/api/imagery/keep', {
          url: last.url,
          client: clientName() || 'Smart 1 Marketing',
          campaign: state.doc.campaign.campaignName || 'display ads',
          label: (effective('headline') || 'ai background')
        })
          .then(function (kept) {
            if (!kept || !kept.url) {
              throw new Error((kept && kept.error) || 'That picture could not be stored.');
            }
            return fetch(window.S1_BASE + '/_hub/gallery', {
              method: 'POST', headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                client: clientName(), url: kept.url, public_id: kept.public_id,
                filename: kept.filename, width: kept.width, height: kept.height
              })
            }).then(function (r) { return r.json(); });
          })
          .then(function (g) {
            keep.disabled = false;
            if (g && g.ok) {
              keepNote.textContent = g.duplicate
                ? 'Already in their gallery.'
                : 'Saved to their gallery.';
            } else {
              keepNote.textContent = (g && g.error) || 'The Hub did not file it.';
            }
          })
          .catch(function (e) {
            keep.disabled = false;
            keepNote.textContent = (e && e.message) || 'That could not be saved.';
          });
      });
    }

    var go = $('aiReviseGo'), box = $('aiRevise');
    if (!go || !box) return;
    var run = function () {
      var instruction = box.value.trim();
      if (!instruction) return;
      bgBusy('Redrawing \u2014 "' + instruction + '"\u2026', 'ai');
      post('/api/images/generate', {
        business: state.doc.campaign.client || '',
        promoting: effective('headline') || '',
        benefit: effective('support') || '',
        offer: effective('offer') || '',
        palette: state.doc.campaign.brand.colors || undefined,
        // Carried into the redraw as well. Dropping it here would make every
        // change after the first one drift away from the client's own page.
        landingAnalysis: state.landing || undefined,
        // Both, or the model starts from nothing and the "change" is a
        // different picture that happens to share a description.
        reviseInstruction: instruction,
        previousUrl: last && last.url,
      })
        .then(function (d) {
          var next = d.candidates || (d.candidate ? [d.candidate] : []);
          next = next.filter(function (x) { return x && x.url; });
          if (!next.length) {
            bgSay('<span class="bgmsg">' + esc(d.reason || d.error ||
              'That change did not come back with a picture.') + '</span>');
            return;
          }
          aiGrid(next, 'Redrawn: "' + instruction + '".');
        })
        .catch(function () {
          bgSay('<span class="bgmsg">That change could not be made.</span>');
        });
    };
    go.addEventListener('click', run);
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); run(); }
    });
  }

  /* Stock, with the search phrase on screen and editable.
     
     The phrase used to be derived from the copy and never shown, so two
     photos would come back looking nothing like the client and there was no
     way to tell what had been searched, let alone correct it. Now the server
     says which phrase produced these -- including when it had to drop terms
     to find anything -- and the box above the results is the fix. */
  function stockSearch(phrase) {
    /* The stock libraries are somebody else's server, so this is the dish
       rather than the star -- nothing is being written and nothing is
       billed per call here. */
    bgBusy(phrase ? 'Looking for "' + phrase + '"\u2026'
                  : 'Finding photos that fit this campaign\u2026', 'scan');
    post('/api/images/search', {
      business: state.doc.campaign.client || '',
      promoting: effective('headline') || '',
      benefit: effective('support') || '',
      offer: effective('offer') || '',
      search: phrase || undefined,
      count: 12
    })
      .then(function (d) {
        var cands = (d.candidates || []).filter(function (x) { return x && x.url; });
        var box = '<div class="bsrow" style="margin-bottom:8px">' +
          '<label style="flex:1">Search for' +
            '<input type="text" id="bgQuery" value="' + esc(d.query || phrase || '') +
            '" placeholder="what the picture is of"></label>' +
          '<button type="button" class="bsclear" id="bgQueryGo">Search</button></div>';
        if (!cands.length) {
          bgSay(box + '<span class="bgmsg">' +
            esc(d.reason || 'No stock photos came back.') + '</span>');
          wireStockSearch();
          return;
        }
        var note = d.narrowed
          ? 'Nothing matched the whole phrase, so this is "' + (d.query || '') + '".'
          : 'Searched for "' + (d.query || '') + '".';
        bgGrid(cands.map(function (x) { return { url: x.url, label: '' }; }), 'stock',
               box + '<p class="bgmsg">' + esc(note) +
               ' Not right? Change the words above. Click the magnifier to see ' +
               'one full size, or the picture itself to put it behind this ' +
               'concept.</p>');
        wireStockSearch();
      })
      .catch(function () { bgSay('<span class="bgmsg">Photo search is unavailable.</span>'); });
  }

  function wireStockSearch() {
    var box = $('bgQuery'), go = $('bgQueryGo');
    if (!box || !go) return;
    var run = function () { stockSearch(box.value.trim()); };
    go.addEventListener('click', run);
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); run(); }
    });
  }

  /* Who this build is for. The intake writes the business onto the brand and
     the Hub writes it onto the campaign; either one is the client, and asking
     for both means a build started from the standalone form still finds the
     gallery. */
  function clientName() {
    var c = state.doc && state.doc.campaign;
    if (!c) return '';
    return (c.client || (c.brand && c.brand.name) || '').trim();
  }

  /* The same name, for a sentence rather than for a filing key. Never blank,
     because "file them onto \u2019s record" is how a missing value looks when
     it reaches prose -- and never used as an identifier, because "the client"
     is not one. */
  function clientLabel() { return clientName() || 'the client'; }

  /* ------------------------------------------- the copy, from their page */
  /* Writes the five fields from the client's own landing page.

     Three rules, and each is a way this goes quietly wrong.

     **It fills empty fields only.** A draft that overwrites is a draft
     nobody dares press twice, and the one thing an operator has certainly
     done by the time they press it is fix a headline by hand.

     **It writes to every size, not to the one on screen.** A drafted line is
     the set's copy; landing it as a per-size override would leave the other
     seven sizes empty and the panel insisting the field was filled.

     **An empty offer or proof point is kept empty.** The server is
     instructed twice not to invent either, because a made-up discount or a
     made-up review count is the sentence that costs an account -- so an
     empty answer here is an answer, and it is reported rather than hidden. */
  function wireDraftCopy() {
    var btn = $('draftCopy');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var note = $('draftNote');
      btn.disabled = true;
      /* The longest wait on this screen, and it was a sentence with no mark
         on it -- press the button and the only sign anything is happening is
         eleven words that do not change for half a minute. Past six seconds
         the elapsed line is the only thing separating a slow answer from a
         dead one, which is why it exists.

         Two waits, two kinds: their page is fetched first (the dish) and
         then the copy is written (billed, the star). The reading step is
         claimed only when there is a page still to fetch, because
         ensureLanding() caches -- a second draft goes straight to the model
         and saying otherwise is the indicator claiming a step that is not
         happening. */
      /* Three states, not two. A campaign with no landing page on it never
         reads one, so "writing from what their page says" is a claim about
         a page that does not exist -- and it is the sentence a rep would
         then quote back when the copy is wrong. The page is only named
         where there is one. */
      var hasPage = !!state.landingPage;
      var reading = hasPage && !state.landing;
      var writing = hasPage
        ? 'Writing from what their page says\u2026'
        : 'Writing your ad copy\u2026';
      var opening = reading
        ? 'Reading ' + state.landingPage + '\u2026'
        : writing;
      var think = window.S1Think
        ? window.S1Think.attach(note,
            { kind: reading ? 'scan' : 'ai', label: opening })
        : (function () {
            note.textContent = opening;
            return {
              stage: function (text) { if (text) note.textContent = text; },
              done: function () {}
            };
          })();

      ensureLanding()
        .then(function (landing) {
          think.stage(writing, 'ai');
          return post('/api/copy/suggest', {
            business: clientName() || state.doc.campaign.brand.name,
            // The route requires something to promote. The campaign name is
            // what a rep typed for exactly that, and the page summary backs
            // it up when there is one.
            promoting: state.doc.campaign.promoting ||
                       state.doc.campaign.campaignName ||
                       (landing && landing.summary) || 'their services',
            objective: state.doc.campaign.objective,
            cta: effective('cta') || undefined,
            landingAnalysis: landing || undefined,
          }).then(function (r) { return { r: r, landing: landing }; });
        })
        .then(function (out) {
          btn.disabled = false;
          var r = out.r || {};
          if (r.error) { note.textContent = r.error; return; }
          var map = { headline: r.headline, support: r.support, offer: r.offer,
                      cta: r.cta, trust: r.trust };
          var filled = [], kept = [], blank = [];
          Object.keys(map).forEach(function (k) {
            var value = String(map[k] || '').trim();
            if (effective(k)) { kept.push(k); return; }
            if (!value) { blank.push(k); return; }
            // Every drafted line belongs to the whole set.
            state.copyScope[k] = 'all';
            setCopy(k, value);
            filled.push(k);
          });
          drawControls(); preview();
          /* drawControls() replaces the whole left column, so the element
             this function captured before the fetch is now detached: writing
             to it succeeds, changes nothing on screen, and reads as a button
             that did nothing. Re-read it after the redraw. */
          note = $('draftNote');
          if (!note) return;

          var LABEL = { headline: 'headline', support: 'supporting line',
                        offer: 'offer', cta: 'call to action', trust: 'proof point' };
          var bits = [];
          /* "Nothing was filled in" has two causes and they need different
             answers from the reader: every field was already written, or the
             page had nothing to say. Collapsing them into one sentence made
             the note contradict itself two clauses later. */
          if (filled.length) {
            bits.push('Wrote the ' + filled.map(function (k) { return LABEL[k]; }).join(', ') + '.');
          } else if (!blank.length) {
            bits.push('Nothing to fill in \u2014 every field already had something in it.');
          } else {
            bits.push('Nothing was written.');
          }
          if (kept.length) {
            bits.push('Left your ' + kept.map(function (k) { return LABEL[k]; }).join(', ') +
                      ' alone. Empty a field and draft again to have it rewritten.');
          }
          if (blank.length) {
            bits.push('Their page says nothing about the ' +
                      blank.map(function (k) { return LABEL[k]; }).join(' or the ') +
                      ', so ' + (blank.length === 1 ? 'that was' : 'those were') +
                      ' left blank rather than invented.');
          }
          if (out.landing && out.landing.url) bits.push('Read from ' + out.landing.url + '.');
          if (r.source === 'fallback') {
            bits.push('Assembled from the campaign\u2019s own answers \u2014 ' +
                      'the writing model is not configured, so this is not a draft ' +
                      'from the page.');
          }
          note.textContent = bits.join(' ');
        })
        .catch(function (e) {
          btn.disabled = false;
          note.textContent = (e && e.message) || 'That draft could not be written.';
        });
    });
  }

  /* The page analysis, fetched once and kept.

     A campaign started before the Hub sent a landing page has none stored, and
     one whose page was unreachable at intake has none either -- so this asks
     for it rather than treating "no analysis" as "no page". A page that still
     cannot be read comes back null, and every caller is written to work
     without it rather than to fail: an ad drafted from the campaign's own
     answers is worse than one drafted from the page and much better than a
     button that does nothing. */
  function ensureLanding() {
    if (state.landing) return Promise.resolve(state.landing);
    var url = state.landingPage;
    if (!url) return Promise.resolve(null);
    return post('/api/landing/analyze', { url: url })
      .then(function (a) {
        if (a && !a.error) { state.landing = a; return a; }
        return null;
      })
      .catch(function () { return null; });
  }

  /* A file the browser holds is not something the renderer can fetch, so it
     goes to Cloudinary first -- signed by the server, uploaded straight from
     here, and only then applied as a URL like every other source. The signature
     covers folder, tags and timestamp exactly; sending any other field would
     make Cloudinary reject it as tampered. */
  var MAX_UPLOAD = 12 * 1024 * 1024;

  function uploadBackground(file) {
    if (!file) return;
    if (file.size > MAX_UPLOAD) {
      bgSay('<span class="bgmsg">That file is ' +
        Math.round(file.size / 1048576) + 'MB. Pick one under 12MB.</span>');
      return;
    }
    bgBusy('Uploading ' + file.name + '\u2026', 'wait');
    post('/api/assets/upload-signature', {
      client: clientName() || 'Smart 1 Marketing',
      campaign: (state.doc.campaign.campaignName || 'display ads'),
      kind: 'background',
      filename: file.name
    })
      .then(function (sig) {
        if (!sig || !sig.uploadUrl) {
          throw new Error(sig && sig.error ||
            'Uploads are not configured on the server.');
        }
        var fd = new FormData();
        fd.append('file', file);
        fd.append('api_key', sig.apiKey);
        fd.append('timestamp', sig.timestamp);
        fd.append('signature', sig.signature);
        fd.append('folder', sig.folder);
        fd.append('tags', sig.tags);
        return fetch(sig.uploadUrl, { method: 'POST', body: fd })
          .then(function (r) { return r.json(); });
      })
      .then(function (up) {
        if (!up || !up.secure_url) {
          throw new Error((up && up.error && up.error.message) ||
            'Cloudinary refused that file.');
        }
        fileUploadToGallery(up, file.name);
        bgGrid([{ url: up.secure_url,
                  label: (up.width && up.height)
                    ? up.width + '\u00d7' + up.height : '' }], 'upload');
        applyBackground(up.secure_url, 'upload',
                        bgResults().querySelector('.bgthumb'));
      })
      .catch(function (e) {
        bgSay('<span class="bgmsg">' + esc(e.message ||
          'That upload did not work.') + '</span>');
      });
  }

  /* Replacing the client's mark.
     
     Three steps rather than one, and each is somewhere different on purpose:
     Cloudinary stores the file, the renderer prepares it (transparency, then
     the weight budget with the alpha kept), and the Hub remembers it. Skipping
     the last one is how the same wrong logo gets corrected on every build
     forever, one build at a time. */
  function replaceLogo(file) {
    if (!file) return;
    if (file.size > MAX_UPLOAD) {
      logoSay('That file is ' + Math.round(file.size / 1048576) +
              'MB. Pick one under 12MB.');
      return;
    }
    logoSay('Uploading ' + file.name + '\u2026');
    post('/api/assets/upload-signature', {
      client: clientName() || 'Smart 1 Marketing',
      campaign: (state.doc.campaign.campaignName || 'display ads'),
      kind: 'logo',
      filename: file.name
    })
      .then(function (sig) {
        if (!sig || !sig.uploadUrl) {
          throw new Error(sig && sig.error ||
            'Uploads are not configured on the server.');
        }
        var fd = new FormData();
        fd.append('file', file);
        fd.append('api_key', sig.apiKey);
        fd.append('timestamp', sig.timestamp);
        fd.append('signature', sig.signature);
        fd.append('folder', sig.folder);
        fd.append('tags', sig.tags);
        return fetch(sig.uploadUrl, { method: 'POST', body: fd })
          .then(function (r) { return r.json(); })
          .then(function (up) {
            if (!up || !up.secure_url) {
              throw new Error((up && up.error && up.error.message) ||
                'Cloudinary refused that file.');
            }
            logoSay('Preparing it \u2014 clearing the background and fitting '
                    + 'the weight\u2026');
            return post('/api/logo/apply', {
              requestId: state.requestId, url: up.secure_url
            }).then(function (d) { return { d: d, up: up }; });
          });
      })
      .then(function (r) {
        if (!r.d || !r.d.ok || !r.d.path) {
          throw new Error(r.d && r.d.error || 'That logo could not be used.');
        }
        var brand = state.doc.campaign.brand;
        brand.logos = brand.logos || {};
        brand.logos.primary = r.d.path;
        if (r.d.reverse) brand.logos.reverse = r.d.reverse;
        state.dirty = true;
        rememberLogo(r.up);
        logoSay('New logo applied to every size. Save to keep it.');
        preview();
      })
      .catch(function (e) {
        logoSay(e.message || 'That logo could not be used.');
      });
  }

  function logoSay(msg) {
    var el = $('logoNote');
    if (el) el.textContent = msg;
  }

  /* The Hub owns "which logo does this client use", the same way it owns the
     gallery. Best effort: the logo is already on the ad by now, and a note
     that cannot be written should not undo the change in front of someone. */
  function rememberLogo(up) {
    var who = clientName();
    if (!who) return;
    post('/_hub/logo', {
      client: who, url: up.secure_url, public_id: up.public_id || ''
    })
      .then(function (d) {
        if (d && d.ok) {
          logoSay('New logo applied to every size, and remembered for ' +
                  who + '\u2019s future builds. Save to keep it on this one.');
        }
      })
      .catch(function () {});
  }

  /* Best effort, and deliberately not awaited: the background is already
     applied by the time this runs, and a gallery that is briefly unwritable
     should cost the filing, not the picture. */
  function fileUploadToGallery(up, filename) {
    var who = clientName();
    if (!who) return;
    post('/_hub/gallery', {
      client: who, url: up.secure_url, public_id: up.public_id || '',
      filename: filename || '', width: up.width || 0, height: up.height || 0
    }).catch(function () {});
  }

  function bgGrid(items, mode, header) {
    bgSay((header || '<p class="bgmsg">Click one to put it behind this concept, ' +
           'or the magnifier to see it full size first.</p>') +
      '<div class="bggrid">' + items.map(function (it, i) {
        return '<div class="bgtile">' +
          '<button type="button" class="bgthumb" data-pick="' + i + '"' +
          ' title="Use this picture">' +
          '<img src="' + esc(it.thumb || it.url) + '" alt="" loading="lazy">' +
          (it.label ? '<span>' + esc(it.label) + '</span>' : '') + '</button>' +
          // Judging a photograph at 126px wide is guessing. This opens it at
          // the size it will actually be looked at, without applying it.
          '<button type="button" class="bgzoom" data-zoom="' + i + '"' +
          ' title="See it full size" aria-label="See it full size">\u2315</button>' +
          '</div>';
      }).join('') + '</div>');
    Array.prototype.forEach.call(bgResults().querySelectorAll('[data-pick]'), function (el) {
      el.addEventListener('click', function () {
        applyBackground(items[Number(el.dataset.pick)].url, mode, el);
      });
    });
    Array.prototype.forEach.call(bgResults().querySelectorAll('[data-zoom]'), function (el) {
      el.addEventListener('click', function () {
        var i = Number(el.dataset.zoom);
        lightbox(items[i].url, function () {
          applyBackground(items[i].url, mode,
            bgResults().querySelector('[data-pick="' + i + '"]'));
        });
      });
    });
  }

  /* One picture, big, with the same action available from in there -- looking
     at it and then having to find it again in the grid is how you end up
     picking the one next to it. */
  /* `onUse` is optional, and its absence is the whole difference between the
     two things this opens. A stock or generated photo is a candidate, so it
     gets "Use this picture". A screenshot of the client's own website is
     reference -- you look at it and go back to work -- and offering to put it
     behind the ad would be offering something nobody wants and a few people
     would press. */
  function lightbox(url, onUse, caption) {
    var wrap = document.createElement('div');
    wrap.className = 'lightbox';
    wrap.innerHTML = '<img src="' + esc(url) + '" alt="">' +
      '<div class="lbbar">' +
        (onUse ? '<button type="button" class="btn primary" data-lb="use">Use this picture</button>' : '') +
        '<button type="button" class="btn" data-lb="close">Close</button>' +
        '<span class="lbnote">' + esc(caption || 'Esc closes') + '</span>' +
      '</div>';
    function close() {
      document.removeEventListener('keydown', onKey);
      wrap.remove();
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    wrap.addEventListener('click', function (e) { if (e.target === wrap) close(); });
    wrap.querySelector('[data-lb="close"]').addEventListener('click', close);
    if (onUse) wrap.querySelector('[data-lb="use"]').addEventListener('click', function () {
      close();
      onUse();
    });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(wrap);
  }

  /* The chooser has a URL; the renderer needs a local file. The server does
     that step so the fetch stays behind the same guard as every other asset. */
  function applyBackground(url, mode, el) {
    Array.prototype.forEach.call(bgResults().querySelectorAll('.bgthumb'),
      function (t) { t.classList.remove('on'); });
    if (el) el.classList.add('on');
    $('bgNote').textContent = 'Preparing that picture\u2026';
    post('/api/background/apply', { requestId: state.requestId, url: url })
      .then(function (d) {
        if (!d.ok || !d.path) {
          $('bgNote').textContent = d.error || 'That picture could not be used.';
          return;
        }
        concept().backgroundImage = d.path;
        state.dirty = true;
        // Redraw: the crop grid and the overlay controls only exist while
        // there is a picture, and they are what somebody reaches for next.
        drawControls();
        var note = $('bgNote');
        if (note) note.textContent = 'Photo background applied to this concept (' + mode + ').';
        preview();
      })
      .catch(function () { $('bgNote').textContent = 'That picture could not be used.'; });
  }

  function post(url, body) {
    return fetch(url, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  /* A family is chosen by looking at it. Each card draws the family's real
     block geometry for one representative size -- the same numbers the
     renderer lays out from -- so the picture cannot drift from the output the
     way a hand-drawn thumbnail would. Families whose geometry the server did
     not send still list, as a titled card, rather than disappearing. */
  var WIRE_FILL = {
    panel: 'rgba(255,255,255,.92)', hero: 'rgba(37,99,235,.30)',
    logo: 'rgba(15,23,42,.42)', headline: 'rgba(15,23,42,.62)',
    support: 'rgba(15,23,42,.34)', offer: 'rgba(224,167,43,.62)',
    cta: 'rgba(22,163,74,.62)', trust: 'rgba(15,23,42,.22)'
  };
  // The renderer resolves these against the client's brand; the card only has
  // to say "flat color field" versus "white card", which is the difference
  // someone is actually choosing between.
  var WIRE_BG = {
    primary: '#dbeafe', secondary: '#e0e7ff', accent: '#fef3c7',
    dark: '#cbd5e1', light: '#ffffff'
  };
  // Panels and heroes sit under the type. Object key order usually gives that,
  // but not in every family, so it is enforced rather than assumed.
  var WIRE_ORDER = ['panel', 'hero'];

  function wireSvg(wire) {
    if (!wire || !wire.w || !wire.h) return '';
    var W = 96, H = Math.max(28, Math.round(W * (wire.h / wire.w)));
    var sx = W / wire.w, sy = H / wire.h;
    var blocks = (wire.blocks || []).slice().sort(function (a, b) {
      var ai = WIRE_ORDER.indexOf(a.k), bi = WIRE_ORDER.indexOf(b.k);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
    var parts = blocks.map(function (b) {
      var fill = WIRE_FILL[b.k] || 'rgba(15,23,42,.28)';
      return '<rect x="' + (b.x * sx).toFixed(1) + '" y="' + (b.y * sy).toFixed(1) +
        '" width="' + Math.max(1, b.w * sx).toFixed(1) +
        '" height="' + Math.max(1, b.h * sy).toFixed(1) +
        '" rx="1.5" fill="' + fill + '"></rect>';
    }).join('');
    var field = WIRE_BG[wire.background] || '#ffffff';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
      '" role="img" aria-hidden="true" style="display:block;background:' + field + ';' +
      'border:1px solid var(--line);border-radius:4px">' + parts + '</svg>';
  }

  function familyCards() {
    var current = concept().layoutFamily;
    return state.templates.map(function (t) {
      var on = t.id === current;
      var missing = t.sizes.indexOf(state.size) < 0;
      return '<button type="button" class="famcard' + (on ? ' on' : '') + '"' +
        ' data-family="' + esc(t.id) + '"' +
        ' aria-pressed="' + (on ? 'true' : 'false') + '"' +
        ' title="' + esc(t.description || '') + '">' +
        (wireSvg(t.wire) || '<div class="famnone">' + esc(t.id) + '</div>') +
        '<span class="famname">' + esc(t.name) + '</span>' +
        (missing ? '<span class="fammiss">no ' + esc(state.size) + '</span>' : '') +
        '</button>';
    }).join('');
  }

  function setFamily(id) {
    if (!id || id === concept().layoutFamily) return;
    concept().layoutFamily = id;
    state.dirty = true;
    // Not every family draws every size. Staying on one the new family does
    // not have leaves the preview pane showing a 422 nobody asked for.
    var rail = railSizes();
    if (rail.length && rail.indexOf(state.size) < 0) state.size = rail[0];
    drawControls();          // repaint so the selected card is the lit one
    drawRail();              // the family decides which sizes exist
    preview();
  }

  function describeFamily() {
    var t = state.templates.filter(function (x) { return x.id === concept().layoutFamily; })[0];
    if (!t) return;
    var has = t.sizes.indexOf(state.size) >= 0;
    $('famNote').innerHTML = esc(t.description) +
      (has ? '' : '<br><b style="color:var(--warn)">No ' + esc(state.size) + ' layout in this family.</b>');
  }

  /* -------------------------------------------------------------- preview */
  var timer = null;
  function schedule() { clearTimeout(timer); timer = setTimeout(preview, 320); }

  var inflight = 0;
  function preview() {
    var c = concept(); if (!c) return;
    var mine = ++inflight;
    $('canvas').classList.add('busy');
    fetch('/api/preview', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        campaign: state.doc.campaign, conceptId: c.conceptId,
        size: state.size, platform: state.platform
      })
    })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
      .then(function (res) {
        if (mine !== inflight) return;               // a newer edit already won
        $('canvas').classList.remove('busy');
        if (!res.ok) { drawQa([{ check: 'preview', status: 'fail', detail: res.b.error }]); return; }
        $('preview').src = res.b.image;
        $('dims').textContent = res.b.width + ' x ' + res.b.height;
        state.sizeStatus[state.size] = { status: res.b.status };
        drawQa(res.b.qa);
        markRail();
      })
      .catch(function () { $('canvas').classList.remove('busy'); });
  }

  /* ----------------------------------------------------------- size rail */
  function drawRail() {
    var sizes = railSizes();
    var left = unapprovedSizes().length;
    $('rail').innerHTML =
      '<div style="padding:14px 16px 4px">' +
        '<h3 style="margin:0 0 4px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)">' +
        'Sizes' +
        (sizes.length
          ? '<span style="float:right;letter-spacing:0;text-transform:none;color:' +
            (left ? 'var(--ink-2)' : 'var(--pass)') + '">' +
            (sizes.length - left) + '/' + sizes.length + ' approved</span>'
          : '') +
        '</h3></div>' +
      sizes.map(function (sz) {
        var ok = isApproved(sz);
        return '<div class="size' + (sz === state.size ? ' on' : '') +
          (ok ? ' approved' : '') + '">' +
          '<button class="nm" data-size="' + esc(sz) + '" style="background:none;border:0;' +
            'color:inherit;font:inherit;cursor:pointer;padding:0;flex:1;text-align:left">' +
            esc(sz) + '</button>' +
          '<span class="st" data-st="' + esc(sz) + '"></span>' +
          '<button type="button" class="ok' + (ok ? ' on' : '') + '" data-approve="' + esc(sz) + '"' +
            ' title="' + (ok ? 'Approved — click to unapprove and edit again'
                             : 'Approve this size and lock it') + '"' +
            ' aria-pressed="' + (ok ? 'true' : 'false') + '">' +
            (ok ? '\u2713' : '\u25CB') + '</button>' +
          '</div>';
      }).join('') +
      '<div class="qa" id="qa"></div>' +
      (state.doc.notes && state.doc.notes.length
        ? '<details class="notes"><summary>From intake' +
          '<span class="notecount">' + state.doc.notes.length + '</span></summary>' +
          '<ul style="margin:8px 0 0;padding-left:16px">' +
          state.doc.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') +
          '</ul></details>'
        : '');

    Array.prototype.forEach.call($('rail').querySelectorAll('[data-size]'), function (el) {
      el.addEventListener('click', function () { goToSize(el.dataset.size); });
    });
    Array.prototype.forEach.call($('rail').querySelectorAll('[data-approve]'), function (el) {
      el.addEventListener('click', function () {
        var sz = el.dataset.approve;
        setApproved(sz, !isApproved(sz));
      });
    });
    markRail();
  }

  /* Moving to another size with unsaved edits behind you.
     
     Nothing asked, and the edits stayed in the browser -- they were not lost,
     but nothing on screen said they were still unsaved either, so the
     ordinary way to lose an hour here was to work through four sizes and
     close the tab. */
  function goToSize(size) {
    if (size === state.size) return;
    if (!state.dirty) return showSize(size);
    ask(
      'Save your changes first?',
      'You have edits to ' + state.size + ' that are not saved yet. Moving to ' +
      size + ' keeps them on screen, but nothing is written down until you save.',
      [['Save, then go', 'save'], ['Go without saving', 'go'], ['Stay here', null]],
    ).then(function (choice) {
      if (!choice) return;
      if (choice === 'go') return showSize(size);
      saveCampaign()
        .then(function () {
          flashSaved();
          showSize(size);
        })
        .catch(function () {
          showNextSteps('That did not save, so nothing has moved. Your edits ' +
                        'are still on screen.', true);
        });
    });
  }

  function showSize(size) {
    state.size = size;
    drawControls(); drawRail(); preview();
    refreshOverrideNote();
  }

  function markRail() {
    Object.keys(state.sizeStatus).forEach(function (sz) {
      var dot = $('rail').querySelector('[data-st="' + sz + '"]');
      if (dot) dot.className = 'st ' + state.sizeStatus[sz].status;
    });
  }

  function drawQa(list) {
    var el = $('qa'); if (!el) return;
    if (!list || !list.length) { el.innerHTML = '<h3>Checks</h3><div class="clean">All checks pass.</div>'; return; }
    el.innerHTML = '<h3>Checks</h3><ul>' + list.map(function (f, i) {
      var fixBtn = f.fix && f.fix.action === 'shorten'
        ? '<button class="fix" data-fix="' + i + '">Shorten ' + esc(f.fix.role) +
          (f.fix.maxWords ? ' to ' + f.fix.maxWords + ' words' : '') + '</button>'
        : '';
      return '<li class="' + esc(f.status) + '"><b>' + esc(f.check) + '</b>' + esc(f.detail) + fixBtn + '</li>';
    }).join('') + '</ul>';

    Array.prototype.forEach.call(el.querySelectorAll('[data-fix]'), function (btn) {
      btn.addEventListener('click', function () {
        // Apply the machine-readable fix QA already emits, rather than making
        // the operator work out what "does not fit" means in words.
        var f = list[Number(btn.dataset.fix)];
        var current = effective(f.fix.role).trim().split(/\s+/);
        var max = f.fix.maxWords || Math.max(2, current.length - 1);
        setCopy(f.fix.role, current.slice(0, max).join(' '));
        drawControls(); preview();
      });
    });
  }

  /* ---------------------------------------------------------- stage view */
  $('squint').addEventListener('click', function () {
    var on = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', on ? 'true' : 'false');
    $('preview').style.filter = on ? 'blur(4px)' : '';
  });
  function surround(dark) {
    $('onDark').setAttribute('aria-pressed', dark ? 'true' : 'false');
    $('onLight').setAttribute('aria-pressed', dark ? 'false' : 'true');
    document.querySelector('.stage').style.background = dark ? '#15171B' : '#8A8F98';
  }
  $('onDark').addEventListener('click', function () { surround(true); });
  $('onLight').addEventListener('click', function () { surround(false); });

  /* ------------------------------------------------------------- loading */
  function loadCampaign(id) {
    fetch('/api/campaign/' + encodeURIComponent(id))
      .then(function (r) { return r.json(); })
      .then(function (doc) {
        state.requestId = id;
        state.doc = doc;
        state.conceptId = doc.campaign.concepts[0].conceptId;
        state.sizeStatus = {};
        state.approvals = [];
        // Scope is a per-campaign answer, not a per-session one: "every size"
        // meant this set's sizes.
        state.copyScope = {};
        /* Which platform this set is built for is the campaign's own answer,
           set at intake from what was sold, rather than a dropdown in the
           toolbar that quietly changed which files got written. Where the two
           platforms differ -- Amazon supplies at 2x and caps some placements
           at 40 KB -- the renderer applies it per size either way. */
        state.platforms = (doc.platforms && doc.platforms.length)
          ? doc.platforms : ['google'];
        state.platform = state.platforms[0];
        $('who').textContent = '— ' + doc.campaign.brand.name + ' · ' + doc.campaign.campaignName;
        var listEntry = (window.__campaignList || []).filter(function (c) { return c.requestId === id; })[0];
        var pill = $('statusPill');
        if (listEntry && listEntry.status === 'proof-sent') {
          pill.textContent = 'Needs revision'; pill.className = 'pill revision'; pill.style.display = '';
        } else if (listEntry && listEntry.status === 'approved') {
          pill.textContent = 'Approved'; pill.className = 'pill approved'; pill.style.display = '';
        } else {
          pill.style.display = 'none';
        }
        /* A batch on the project record is the only durable evidence that
           anything has ever been built for this request. Opening a campaign
           is not saving it, so `saved` starts false however finished the
           build is. */
        state.rendered = !!doc.reportUrl;
        state.saved = false;
        /* The page this campaign points at, and the analysis of it if one has
           been taken. Both live on the project record and neither used to
           reach this screen, so every "write this for me" and "draw me a
           picture" on it was working from a business name alone. */
        state.landingPage = doc.landingPage || '';
        state.landing = doc.landing || null;
        var proofBtn = $('proofLink');
        /* The live proof route, never the static proof_<id>.html the batch
           records. That file is a snapshot rendered with no action endpoint
           behind it, so its Approve button rewrites the page to say
           "Approved" and posts nowhere -- a client could sign a set off on it
           and no screen here would ever know. It also sits under /files/,
           which is staff-only. This route is the page with the buttons wired
           up, and it is the one a client can open. */
        if (state.rendered) { proofBtn.href = proofUrl(); proofBtn.style.display = ''; }
        else proofBtn.style.display = 'none';
        $('conceptPick').innerHTML = doc.campaign.concepts.map(function (c) {
          return '<option value="' + esc(c.conceptId) + '">Concept ' + esc(c.conceptId) + ' — ' + esc(c.name) + '</option>';
        }).join('');
        // Land on a size this campaign actually builds. Opening on one it
        // does not is a 422 in the preview pane before anybody has touched
        // anything.
        var rail = railSizes();
        if (rail.length && rail.indexOf(state.size) < 0) state.size = rail[0];
        drawControls(); drawRail(); preview();
        refreshDeliver(); refreshOverrideNote(); refreshStage();
        loadApprovals();
      });
  }

  /* Leaving unsaved work behind is asked about wherever it can happen, not
     only when moving between sizes: the campaign and concept pickers throw
     away exactly the same edits. */
  function leaveIfSafe(what, then) {
    if (!state.dirty) return then();
    ask(
      'Save your changes first?',
      'You have edits that are not saved yet. Opening ' + what + ' will lose them.',
      [['Save, then open', 'save'], ['Open without saving', 'go'], ['Stay here', null]],
    ).then(function (choice) {
      if (!choice) return;
      if (choice === 'go') { state.dirty = false; return then(); }
      saveCampaign().then(function () { flashSaved(); then(); })
        .catch(function () {
          showNextSteps('That did not save, so nothing has moved.', true);
        });
    });
  }

  $('campaignPick').addEventListener('change', function () {
    var pick = this.value;
    leaveIfSafe('another campaign', function () { loadCampaign(pick); });
  });
  $('conceptPick').addEventListener('change', function () {
    var pick = this.value;
    leaveIfSafe('another concept', function () {
      state.conceptId = pick;
      state.sizeStatus = {};
      state.copyScope = {};
      drawControls(); drawRail(); preview();
    });
  });

  /* Saving used to flash the word "Saved" for 1.6 seconds and stop, which
     answers "did that work" and not "what now". The edits are done, the ad
     is not delivered, and nothing on screen says what the remaining steps
     are -- so this names them, in the order they actually happen, and offers
     duplicating the set as one of them. */
  function flashSaved() {
    $('saved').classList.add('on');
    setTimeout(function () { $('saved').classList.remove('on'); }, 1600);
  }

  $('save').addEventListener('click', function () {
    var btn = this; btn.disabled = true;
    saveCampaign()
      .then(function () {
        btn.disabled = false;
        flashSaved();
        // Which sizes are still unapproved, by name. "Saved" on a set where
        // three of eight have been looked at reads as "done", and the sizes
        // nobody has opened are exactly the ones that ship wrong.
        var left = unapprovedSizes();
        showNextSteps(
          left.length
            ? 'Saved. ' + left.length + ' of ' + railSizes().length +
              ' sizes are not approved yet \u2014 ' + left.join(', ') +
              '. Nothing is delivered to the client yet; here is what is left.'
            : 'Saved, and every size is approved. Nothing is delivered to the ' +
              'client yet \u2014 here is what is left.');
      })
      .catch(function () {
        btn.disabled = false;
        showNextSteps('That did not save. Your edits are still on screen; try again.', true);
      });
  });

  function saveCampaign() {
    return fetch('/api/campaign/' + encodeURIComponent(state.requestId), {
      method: 'PUT', headers: { 'content-type': 'application/json' },
      body: JSON.stringify(state.doc)
    }).then(function (r) {
      if (!r.ok) throw new Error('save failed');
      state.dirty = false;
      /* Here rather than in the Save button's handler, because every other
         path that saves -- switching size with unsaved edits, duplicating a
         set, starting a render -- leaves the server holding exactly what is
         on screen too, and a gate that only one of five doors opens is a gate
         people learn to resent. */
      state.saved = true;
      refreshStage();
      return r;
    });
  }

  function projectIdForCurrent() {
    var row = (window.__campaignList || []).filter(function (c) {
      return c.requestId === state.requestId;
    })[0];
    return row && row.projectId;
  }

  function showNextSteps(message, isError) {
    var bar = $('nextStep');
    $('nsMsg').textContent = message;
    $('nsMsg').className = 'nsmsg' + (isError ? ' bad' : '');

    var acts = [];
    if (!isError) {
      acts.push(['Render\u2026', 'render',
                 'Build the finished files, file them onto the client, or ' +
                 'package what is already built.']);
      if (projectIdForCurrent()) {
        acts.push(['Duplicate as the next concept', 'clone',
                   'A fresh copy on its own number, named Concept B \u2014 then ' +
                   'C, then D. Change the background, the words or the layout ' +
