                   'on the copy and leave this one alone.']);
      }
      var proof = $('proofLink');
      if (proof && proof.style.display !== 'none' && proof.href && proof.href !== '#') {
        acts.push(['Open the client proof', 'proof', 'What the client sees.']);
      }
    }
    $('nsActs').innerHTML = acts.map(function (a) {
      return '<button type="button" class="nsbtn" data-next="' + a[1] + '">' +
        '<b>' + esc(a[0]) + '</b><span>' + esc(a[2]) + '</span></button>';
    }).join('');

    Array.prototype.forEach.call($('nsActs').querySelectorAll('[data-next]'), function (el) {
      el.addEventListener('click', function () { runNextStep(el.dataset.next, el); });
    });
    bar.hidden = false;
  }

  function runNextStep(what, el) {
    if (what === 'render') { $('renderAll').click(); $('nextStep').hidden = true; return; }
    if (what === 'proof') { window.open($('proofLink').href, '_blank', 'noopener'); return; }
    if (what !== 'clone') return;

    var pid = projectIdForCurrent();
    if (!pid) { $('nsMsg').textContent = 'This build has no project record to copy.'; return; }
    el.disabled = true;
    $('nsMsg').textContent = 'Copying the set\u2026';
    // Save first: a duplicate of unsaved edits is a duplicate of the wrong ad.
    saveCampaign()
      .then(function () {
        return fetch('/api/project/' + encodeURIComponent(pid) + '/clone', { method: 'POST' })
          .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); });
      })
      .then(function (res) {
        el.disabled = false;
        if (!res.ok || !res.b.requestId) {
          $('nsMsg').textContent = res.b.error || 'That could not be copied.';
          return;
        }
        // Land on the copy, so the next change edits the duplicate rather than
        // the original -- which is the whole reason for duplicating.
        $('nsMsg').textContent = res.b.conceptLetter
          ? 'Copied as Concept ' + res.b.conceptLetter + '. Opening it\u2026'
          : 'Copied. Opening it\u2026';
        window.location.search = '?request=' + encodeURIComponent(res.b.requestId);
      })
      .catch(function () {
        el.disabled = false;
        $('nsMsg').textContent = 'That could not be copied.';
      });
  }

  $('nsClose').addEventListener('click', function () { $('nextStep').hidden = true; });

  /* "Render all sizes" said what it did and never what it produced: it went
     to "Queued a1b2c3" for two seconds and back, and whether anything had
     come out of it was somebody else's problem. It says what it is doing,
     follows the job, and reports the count -- and it names the sizes that
     were not approved, since this is the step that writes the files a proof
     and a delivery ZIP are built from. */
  /* What the render button is actually for.

     It used to do one thing -- build every file -- and everything a person
     wanted to do WITH those files was somewhere else: filing them onto the
     client was a link in the toolbar that had been sitting there since before
     anything was rendered, and the delivery ZIP only appeared once a status
     had changed. So the ordinary job, "build these and put them on the
     client's record", was two controls in two places with a page in between.

     Four answers, because there are four real jobs and they are not the same
     job. Rendering writes files. Filing copies finished files onto a client
     record. The ZIP puts them on your own disk. Each is offered on its own,
     and the first is the two people do together.  */
  function askRenderAction() {
    var count = railSizes().length;
    var opts = [
      ['render-file', 'Render and save to the client', true,
       'Build the files, then file them onto ' + clientLabel() + '\u2019s record. ' +
       'The usual answer.'],
      ['render', 'Render only', true,
       'Build the files and leave them here. Nothing reaches the client record.'],
      ['file', 'Save to the client', state.rendered,
       state.rendered
         ? 'File the files already rendered onto ' + clientLabel() + '\u2019s record. No rebuild.'
         : 'Nothing has been rendered yet, so there is nothing to file.'],
      ['zip', 'Download the full ZIP', state.rendered,
       state.rendered
         ? 'Every finished file in one zip, in platform folders and named for ' +
           'upload. Packaging ' + count + ' files can take a minute.'
         : 'Nothing has been rendered yet, so the zip would be empty.'],
    ];
    return new Promise(function (resolve) {
      var wrap = document.createElement('div');
      wrap.className = 'ask';
      wrap.innerHTML = '<div class="askbox" role="dialog" aria-modal="true">' +
        '<h4>What would you like to do?</h4>' +
        '<p>The preview on screen is a live sketch. These act on real files.</p>' +
        '<div class="nsacts" style="flex-direction:column">' +
          opts.map(function (o) {
            return '<button type="button" class="nsbtn" style="max-width:none" data-act="' +
              o[0] + '"' + (o[2] ? '' : ' disabled') + '><b>' + esc(o[1]) +
              '</b><span>' + esc(o[3]) + '</span></button>';
          }).join('') +
        '</div><div class="askacts"><button type="button" class="btn" data-cancel>Cancel</button></div></div>';
      function done(v) { document.removeEventListener('keydown', onKey); wrap.remove(); resolve(v); }
      function onKey(e) { if (e.key === 'Escape') done(null); }
      wrap.addEventListener('click', function (e) { if (e.target === wrap) done(null); });
      wrap.querySelector('[data-cancel]').addEventListener('click', function () { done(null); });
      Array.prototype.forEach.call(wrap.querySelectorAll('[data-act]'), function (b) {
        b.addEventListener('click', function () { done(b.dataset.act); });
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(wrap);
      var first = wrap.querySelector('[data-act]:not([disabled])');
      if (first) first.focus();
    });
  }

  /* -------------------------------------------------- save this as a preset
     The second ad for a client is this ad with a different offer on it. What
     took the time -- the brand, the layout family, where the picture sits --
     is settled here, and a preset keeps it so the next one is a form fill.

     The dialog asks which copy blocks are the SLOTS rather than assuming all
     of them: a standing tagline or a disclaimer is copy that should travel
     unchanged, and a preset that made everything editable would put it on the
     form to be retyped every time. It offers only the blocks this layout
     family actually draws for the size on screen -- offering one it does not
     is a field that renders nowhere, and the server refuses it anyway, so
     asking would be a question with a wrong answer in it. */
  function askPreset() {
    var c = concept();
    // Which blocks this family draws on ANY of its sizes, not just the one on
    // screen: a slot is a property of the family, and the offer flash the
    // 300x250 carries does not exist on the leaderboard. Reading the size on
    // screen would drop a real slot depending on which size happened to be
    // selected when somebody pressed the button.
    var t = state.templates.filter(function (x) {
      return c && x.id === c.layoutFamily;
    })[0];
    var all = {};
    Object.keys((t && t.blocks) || {}).forEach(function (sz) {
      ((t.blocks[sz]) || []).forEach(function (b) { all[b] = true; });
    });
    var roles = ['headline', 'support', 'offer', 'trust', 'cta']
      .filter(function (r) { return all[r]; });
    // An older server sends no block map. Offering the full set is better than
    // offering one line: the server refuses a slot this family cannot draw and
    // says which, so the worst case is a named refusal rather than a preset
    // missing the slot somebody wanted.
    if (!roles.length) roles = ['headline', 'support', 'offer', 'trust', 'cta'];

    var LABEL = {
      headline: 'Headline', support: 'Supporting line', offer: 'Offer',
      trust: 'Proof point', cta: 'Call to action'
    };
    return new Promise(function (resolve) {
      var wrap = document.createElement('div');
      wrap.className = 'ask';
      wrap.innerHTML = '<div class="askbox" role="dialog" aria-modal="true">' +
        '<h4>Save this as a preset</h4>' +
        '<p>The brand, the layout and the design are kept as they are. Tick the ' +
        'lines the next ad fills in — anything left unticked travels unchanged, ' +
        'which is what you want for a standing tagline or a disclaimer.</p>' +
        '<label style="display:block;margin-bottom:12px;font-size:13px">Name this preset' +
        '<input id="pName" type="text" style="width:100%;margin-top:4px;padding:7px 9px;' +
        'border:1px solid var(--line);border-radius:6px;font:inherit" ' +
        'value="' + esc((state.doc && state.doc.campaign && state.doc.campaign.campaignName) || 'Preset') + '"></label>' +
        '<div style="margin-bottom:14px">' + roles.map(function (r) {
          return '<label style="display:block;font-size:13px;margin-bottom:4px">' +
            '<input type="checkbox" data-role="' + r + '" checked> ' + esc(LABEL[r] || r) +
            '</label>';
        }).join('') + '</div>' +
        '<div class="askacts">' +
        '<button type="button" class="btn primary" data-pick="ok">Save preset</button>' +
        '<button type="button" class="btn" data-pick="cancel">Cancel</button>' +
        '</div></div>';
      function done(v) {
        document.removeEventListener('keydown', onKey);
        wrap.remove();
        resolve(v);
      }
      function onKey(e) { if (e.key === 'Escape') done(null); }
      wrap.addEventListener('click', function (e) { if (e.target === wrap) done(null); });
      wrap.querySelector('[data-pick="cancel"]').addEventListener('click', function () { done(null); });
      wrap.querySelector('[data-pick="ok"]').addEventListener('click', function () {
        var name = (wrap.querySelector('#pName').value || '').trim();
        // A preset with no name is one nobody can pick out of a list later.
        if (!name) { wrap.querySelector('#pName').focus(); return; }
        var fields = [];
        Array.prototype.forEach.call(wrap.querySelectorAll('[data-role]'), function (b) {
          if (b.checked) fields.push({ role: b.getAttribute('data-role') });
        });
        done({ name: name, fields: fields });
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(wrap);
      wrap.querySelector('#pName').select();
    });
  }

  $('savePreset').addEventListener('click', function () {
    askPreset().then(function (answer) {
      if (!answer) return;
      return post('/api/presets', {
        name: answer.name,
        requestId: state.requestId,
        conceptId: state.conceptId,
        fields: answer.fields
      }).then(function (d) {
        if (!d || !d.preset) {
          showNextSteps((d && d.error) || 'That preset did not save.', true);
          return;
        }
        // What the server refused is said out loud. A slot dropped in silence
        // is a form field that renders nowhere, which is the whole reason the
        // server returns the list rather than swallowing it.
        var msg = 'Preset "' + d.preset.name + '" saved for ' + d.preset.client + '. ' +
          d.preset.fields.length + ' line(s) will be asked for on the next ad.';
        if (d.refused && d.refused.length) {
          msg += ' Left out: ' + d.refused.map(function (r) {
            return r.role + ' (' + r.reason + ')';
          }).join('; ') + '.';
        }
        showNextSteps(msg, false);
      }).catch(function () {
        showNextSteps('That preset did not save. Nothing has changed.', true);
      });
    });
  });

  $('renderAll').addEventListener('click', function () {
    askRenderAction().then(function (act) {
      if (!act) return;
      if (act === 'zip') return packageZip();
      if (act === 'file') return fileOnlyStep();
      chooseSizes().then(function (sizes) {
        if (sizes === false) return;
        startRender(sizes, act === 'render-file');
      });
    });
  });

  /* Which sizes, when there is more than one.

     A package of eight takes a couple of minutes, and an operator who fixed
     one headline on the 300x600 was waiting on seven renders they did not ask
     for. Resolves null for "all of them", an array for a selection, and false
     for a cancel -- which is not the same as null and must not start a render
     of everything. */
  function chooseSizes() {
    var sizes = railSizes();
    if (sizes.length < 2) return Promise.resolve(null);
    return ask(
      'Render which sizes?',
      'Building all ' + sizes.length + ' takes a couple of minutes. If you have ' +
      'only changed one, you do not have to wait for the rest.',
      [['All ' + sizes.length + ' sizes', 'all'],
       ['Just ' + state.size, 'one'],
       ['Choose\u2026', 'pick']],
    ).then(function (choice) {
      if (!choice) return false;
      if (choice === 'all') return null;
      if (choice === 'one') return [state.size];
      return pickSizes(sizes);
    });
  }

  /* The chooser, when "just this one" is not the answer either. */
  function pickSizes(sizes) {
    return new Promise(function (resolve) {
      var wrap = document.createElement('div');
      wrap.className = 'ask';
      wrap.innerHTML = '<div class="askbox" role="dialog" aria-modal="true">' +
        '<h4>Which sizes?</h4>' +
        '<div style="display:grid;gap:6px;margin-bottom:14px">' +
          sizes.map(function (sz) {
            return '<label style="display:flex;gap:8px;align-items:center;font-size:13px">' +
              '<input type="checkbox" value="' + esc(sz) + '"' +
              (sz === state.size ? ' checked' : '') + '>' + esc(sz) +
              (isApproved(sz) ? ' <span style="color:var(--pass);font-size:11px">approved</span>' : '') +
              '</label>';
          }).join('') +
        '</div><div class="askacts">' +
          '<button type="button" class="btn primary" data-go>Render these</button>' +
          '<button type="button" class="btn" data-cancel>Cancel</button>' +
        '</div></div>';
      function close(v) { document.removeEventListener('keydown', onKey); wrap.remove(); resolve(v); }
      function onKey(e) { if (e.key === 'Escape') close(false); }
      wrap.addEventListener('click', function (e) { if (e.target === wrap) close(false); });
      wrap.querySelector('[data-cancel]').addEventListener('click', function () { close(false); });
      wrap.querySelector('[data-go]').addEventListener('click', function () {
        var picked = Array.prototype.map.call(
          wrap.querySelectorAll('input:checked'), function (i) { return i.value; });
        close(picked.length ? picked : false);
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(wrap);
    });
  }

  /* Filing on its own, with no render in front of it. */
  function fileOnlyStep() {
    showNextSteps('Filing the finished files onto ' + clientLabel() + '\u2019s record\u2026');
    fileToClient().then(function (res) { reportFiling(res); });
  }

  /* What came of a filing, in the words the Hub answered with.

     "Filed" and "already there" are different outcomes and both are
     successes; a filing that reached the gallery for six of eight ads is not
     a tick. */
  function reportFiling(res) {
    if (!res || !res.ok) {
      $('nsMsg').className = 'nsmsg bad';
      $('nsMsg').textContent = (res && res.error) ||
        'Those files could not be filed onto the client record.';
      return;
    }
    var bits = [];
    if (res.filed) bits.push(res.filed + ' filed onto ' + esc(res.client || clientLabel()) + '\u2019s record');
    if (res.duplicates) bits.push(res.duplicates + ' already there');
    $('nsMsg').className = 'nsmsg';
    $('nsMsg').textContent = bits.length ? bits.join(', ') + '.'
                                         : 'Nothing new to file \u2014 the record already has these.';
    if (res.gallery_url) {
      $('nsActs').insertAdjacentHTML('afterbegin',
        '<a class="nsbtn" href="' + esc(res.gallery_url) + '" target="_blank" rel="noopener">' +
        '<b>Open the client gallery</b><span>Where these ads now sit on the ' +
        'client record.</span></a>');
    }
  }

  /* The zip, on demand.

     Same package delivery produces -- one description of what a package is --
     but deliberately not recorded as a delivery: this is somebody wanting the
     files, and marking the project handed over because a file was downloaded
     is a status nobody set. A QA-failing size is left out, as it is in a real
     delivery, and named here rather than silently missing from the folder. */
  function packageZip() {
    var pid = projectIdOf();
    if (!pid) {
      showNextSteps('This build has no project record, so there is nothing to package.', true);
      return;
    }
    showNextSteps('Packaging every finished file. This can take a minute \u2014 ' +
                  'the zip is built from the rendered files, not from the preview.');
    fetch('/api/project/' + encodeURIComponent(pid) + '/deliver', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ concept: state.conceptId, record: false })
    })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
      .then(function (res) {
        if (!res.ok) {
          $('nsMsg').className = 'nsmsg bad';
          $('nsMsg').textContent = res.b.error || 'That could not be packaged.';
          return;
        }
        var skipped = res.b.skipped || [];
        $('nsMsg').className = 'nsmsg';
        $('nsMsg').textContent = res.b.fileCount + ' file' +
          (res.b.fileCount === 1 ? '' : 's') + ' packaged.' +
          (skipped.length
            ? ' Left out: ' + skipped.map(function (sk) {
                return sk.size + ' (' + sk.reason + ')'; }).join(', ') +
              ' \u2014 a size that fails QA is never packaged.'
            : '');
        $('nsActs').insertAdjacentHTML('afterbegin',
          '<a class="nsbtn" href="' + esc(res.b.zipUrl) + '" download><b>Download the ZIP</b>' +
          '<span>' + res.b.fileCount + ' files, in platform folders, named for upload.' +
          '</span></a>');
      })
      .catch(function () {
        $('nsMsg').className = 'nsmsg bad';
        $('nsMsg').textContent = 'That could not be packaged.';
      });
  }

  function startRender(sizes, alsoFile) {
    var btn = $('renderAll');
    btn.disabled = true; btn.textContent = 'Rendering…';
    var count = sizes ? sizes.length : railSizes().length;
    saveCampaign()
      .then(function () {
        return post('/api/render', {
          campaign: state.doc.campaign,
          platforms: state.platforms || ['google'],
          sizes: sizes || undefined,
        });
      })
      .then(function (b) {
        if (b && b.error) throw new Error(b.error);
        btn.disabled = false; btn.textContent = 'Render…';
        var left = unapprovedSizes();
        showNextSteps(
          'Building ' + count + ' finished file' + (count === 1 ? '' : 's') +
          (sizes ? ' (' + sizes.join(', ') + ')' : '') +
          ((state.platforms || []).length > 1
            ? ' for ' + state.platforms.join(' and ') : '') +
          '. These are what the client proof and the delivery ZIP read \u2014 ' +
          'the preview on screen is a live sketch and is not filed anywhere.' +
          (alsoFile ? ' They will be filed onto ' + clientLabel() +
                      '\u2019s record as soon as they are built.' : '') +
          (left.length ? ' Still unapproved: ' + left.join(', ') + '.'
                       : ' Every size is approved.'));
        if (b && b.jobId) followRender(b.jobId, count, alsoFile);
      })
      .catch(function (e) {
        btn.disabled = false; btn.textContent = 'Render…';
        showNextSteps((e && e.message) || 'That render could not be started.', true);
      });
  }

  /* A queued job that nobody watches is a job nobody knows failed — and a
     finished one used to say "open the proof to see them" with nothing to
     click, because the proof URL lives on the job and nothing read it. */
  function followRender(jobId, sizes, alsoFile) {
    var tries = 0;
    (function poll() {
      if (++tries > 60) return;                 // ~3 minutes, then stop asking
      fetch('/api/render/' + encodeURIComponent(jobId))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j || !j.status) return;
          var prog = j.progress || {};
          if (j.status === 'complete') {
            state.rendered = true;
            refreshStage();
            $('nsMsg').textContent = 'Built ' + (prog.done != null ? prog.done : sizes) +
              ' of ' + (prog.total != null ? prog.total : sizes) + ' files.';
            showHandover();
            /* Filing waits for the files to exist. Started with the render it
               would copy the PREVIOUS build onto the client record and report
               a clean success for doing it -- the failure this whole sequence
               is arranged to stop. */
            if (alsoFile) {
              fileToClient().then(function (res) {
                var was = $('nsMsg').textContent;
                reportFiling(res);
                if (res && res.ok) $('nsMsg').textContent = was + ' ' + $('nsMsg').textContent;
              });
            }
            refreshDeliver();
            return;
          }
          if (j.status === 'failed') {
            $('nsMsg').className = 'nsmsg bad';
            $('nsMsg').textContent = 'That render failed: ' +
              (j.error || 'no reason given') + '. Nothing was written.';
            return;
          }
          setTimeout(poll, 3000);
        })
        .catch(function () { /* stop quietly; the proof link still works */ });
    })();
  }

  /* What to do with a set that has just been built.

     Two things, and they are different questions. The link is what you send
     the client, so it is a field you can select rather than a button that
     opens it here. The decision underneath is the same decision recorded
     against the same project -- an account manager who has looked at eight
     sizes should not have to open the client\u2019s own page and press the
     client\u2019s button to write down what they decided. What it records
     says which of the two happened. */
  function showHandover() {
    var url = proofUrlAbsolute();
    $('nsActs').insertAdjacentHTML('afterbegin',
      '<div style="flex:1 0 100%">' +
        '<div style="font-size:12px;color:var(--ink-2);margin-bottom:2px">' +
          'Send this to ' + esc(clientLabel()) + ' to approve or send back. ' +
          'It opens without a Smart 1 login and shows every size that just rendered.' +
        '</div>' +
        '<div class="proofurl">' +
          '<input type="text" id="proofUrlBox" readonly value="' + esc(url) + '">' +
          '<button type="button" class="btn" id="proofCopy">Copy link</button>' +
          '<a class="btn" href="' + esc(proofUrl()) + '" target="_blank" rel="noopener">Open it</a>' +
        '</div>' +
        '<div style="font-size:12px;color:var(--ink-2);margin:8px 0 2px">' +
          'Or record the decision yourself:' +
        '</div>' +
        '<div class="proofurl">' +
          '<button type="button" class="btn" id="decApprove" ' +
            'style="border-color:var(--pass);color:var(--pass)">Approve</button>' +
          '<button type="button" class="btn" id="decRevise">Send back for changes</button>' +
        '</div>' +
      '</div>');

    /* navigator.clipboard is not available on http and is allowed to refuse
       on https. A button that reports a copy it never made is worse than one
       that asks, so the last resort selects the text and says so. */
    $('proofCopy').addEventListener('click', function () {
      var box = $('proofUrlBox'), btn = this;
      function ok() { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy link'; }, 1600); }
      function manual() { box.focus(); box.select(); btn.textContent = 'Press Ctrl-C'; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(box.value).then(ok, function () {
          box.select();
          try { document.execCommand('copy') ? ok() : manual(); } catch (e) { manual(); }
        });
        return;
      }
      box.select();
      try { document.execCommand('copy') ? ok() : manual(); } catch (e) { manual(); }
    });

    $('decApprove').addEventListener('click', function () { recordDecision('approve'); });
    $('decRevise').addEventListener('click', function () { recordDecision('revision'); });
  }

  /* Approving here is the same event as approving on the client\u2019s page,
     including its consequence: approval is what packages the files. Said out
     loud before the press, because a button that quietly hands a campaign
     over is one nobody presses twice. */
  function recordDecision(kind) {
    var pid = projectIdOf();
    if (!pid) { showNextSteps('This build has no project record to sign off.', true); return; }

    var go = kind === 'approve'
      ? ask('Approve this set?',
            'Recorded against ' + clientLabel() + '\u2019s project as approved by you rather ' +
            'than by them, and approval is what packages the finished files.',
            [['Approve', true], ['Not yet', null]])
      : askNotes();

    go.then(function (answer) {
      if (!answer) return;
      $('nsMsg').className = 'nsmsg';
      $('nsMsg').textContent = kind === 'approve' ? 'Recording the approval\u2026'
                                                  : 'Sending it back\u2026';
      return fetch('/api/project/' + encodeURIComponent(pid) + '/decision', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          kind: kind, concept: state.conceptId,
          notes: (kind === 'revision' ? answer : undefined)
        })
      })
        .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
        .then(function (res) {
          if (!res.ok) {
            $('nsMsg').className = 'nsmsg bad';
            $('nsMsg').textContent = res.b.error || 'That decision was not recorded.';
            return;
          }
          $('nsMsg').textContent = kind === 'approve'
            ? 'Approved' + (res.b.fileCount ? ' \u2014 ' + res.b.fileCount +
                ' file(s) packaged and ready to hand over.' : '.') +
              (res.b.deliveryError ? ' Packaging did not finish: ' + res.b.deliveryError +
                ' Use Deliver final files once that is sorted.' : '')
            : 'Recorded as needing changes. Your note is on the project.';
          /* The status pill and the Deliver button both read the campaign
             list, which is fetched once at boot -- so without this the screen
             goes on saying "draft" about a set it has just approved. */
          reloadCampaignList();
        });
    });
  }

  /* A change request with no detail is not actionable, and one recorded
     without it reads on the queue exactly like one that was explained. The
     server refuses an empty note; this is why. */
  function askNotes() {
    return new Promise(function (resolve) {
      var wrap = document.createElement('div');
      wrap.className = 'ask';
      wrap.innerHTML = '<div class="askbox" role="dialog" aria-modal="true">' +
        '<h4>What needs to change?</h4>' +
        '<p>This goes on the project and into the team notification. ' +
        '\u201CThe client wants it different\u201D is not something anybody can act on.</p>' +
        '<textarea id="revNotes" rows="4" style="width:100%;background:var(--bg);color:var(--ink);' +
          'border:1px solid var(--line);border-radius:7px;padding:9px;font:inherit;font-size:13px"></textarea>' +
        '<div class="askacts" style="margin-top:12px">' +
          '<button type="button" class="btn primary" data-go>Send it back</button>' +
          '<button type="button" class="btn" data-cancel>Cancel</button>' +
        '</div></div>';
      function close(v) { document.removeEventListener('keydown', onKey); wrap.remove(); resolve(v); }
      function onKey(e) { if (e.key === 'Escape') close(null); }
      wrap.addEventListener('click', function (e) { if (e.target === wrap) close(null); });
      wrap.querySelector('[data-cancel]').addEventListener('click', function () { close(null); });
      wrap.querySelector('[data-go]').addEventListener('click', function () {
        var v = wrap.querySelector('#revNotes').value.trim();
        if (!v) { wrap.querySelector('#revNotes').focus(); return; }
        close(v);
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(wrap);
      wrap.querySelector('#revNotes').focus();
    });
  }

  /* ------------------------------------------------------- delivery */
  function projectIdOf() {
    var le = (window.__campaignList || []).filter(function (c) { return c.requestId === state.requestId; })[0];
    return le && le.projectId;
  }
  function refreshDeliver() {
    var le = (window.__campaignList || []).filter(function (c) { return c.requestId === state.requestId; })[0];
    var btn = $('deliver');
    btn.style.display = le && (le.status === 'approved' || le.status === 'complete') ? '' : 'none';
    btn.textContent = le && le.status === 'complete' ? 'Deliver again' : 'Deliver final files';
    // Every delivered package stays one click away, right here.
    var box = $('deliveries');
    if (le && le.delivered && le.delivered.length) {
      box.style.display = '';
      box.innerHTML = '<strong>Delivered packages</strong><br>' + le.delivered.map(function (d) {
        var when = new Date(d.at);
        return '<a href="' + d.zipUrl + '" download style="color:var(--accent,#1F5FC0);font-weight:600;text-decoration:none">\u2B07 ' +
          (d.fileCount || '?') + ' files</a> <span style="color:#8a97a4">\u2014 ' +
          when.toLocaleDateString() + ' ' + when.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + '</span>';
      }).reverse().join('<br>');
    } else {
      box.style.display = 'none';
    }
  }
  /* ------------------------------------------------- what exists yet
     One function decides which controls are on the toolbar, because the rule
     is one sentence -- save, then render, then file -- and three handlers
     each deciding a piece of it is how a button comes back after the step
     that should have retired it. */
  function refreshStage() {
    var pid = projectIdOf();

    $('renderAll').style.display = state.saved ? '' : 'none';
    // Same gate as Render: it reads the saved build, not what is on screen.
    var presetBtn = $('savePreset');
    if (presetBtn) presetBtn.style.display = state.saved ? '' : 'none';
    // Motion is built from the saved static design, so it appears at the same
    // moment Render does and for the same reason.
    var animBtn = $('animate');
    if (animBtn) animBtn.style.display = state.saved ? '' : 'none';
    $('save').classList.toggle('primary', !state.saved);
    $('renderAll').classList.toggle('primary', state.saved);
    $('saveHint').style.display = state.saved ? 'none' : '';

    // window.S1_BASE is set by the server only when the page is served under
    // a mount prefix, which is exactly the case where the Hub is in front of
    // us. Standalone there is no client registry to file anything into.
    var link = $('attachClient');
    if (link) {
      if (!window.S1_BASE || !pid || !state.rendered) link.style.display = 'none';
      else {
        link.href = window.S1_BASE + '/_hub/attach?project=' + encodeURIComponent(pid);
        link.style.display = '';
      }
    }

    var proofBtn = $('proofLink');
    if (proofBtn && state.rendered) { proofBtn.href = proofUrl(); proofBtn.style.display = ''; }
  }

  /* The page a client is shown. Same address every time for a given request,
     so a link sent last week still opens the current set rather than the one
     that happened to be built the day it was sent. */
  function proofUrl() { return '/proof/' + encodeURIComponent(state.requestId); }

  /* The same thing, spelled out, for pasting into an email. S1_BASE is the
     Hub's mount prefix; the origin is whichever hostname this browser used,
     which is the honest answer -- this app cannot enumerate the hostnames it
     answers on, and the one in the address bar is the one that works. */
  function proofUrlAbsolute() {
    return location.origin + (window.S1_BASE || '') + proofUrl();
  }

  /* ------------------------------------------- file the ads onto a client */
  /* The one-press version of the Attach page, for the ordinary case where
     the answer to "which client, which sizes" is "this one, all of them". */
  function fileToClient() {
    var pid = projectIdOf();
    if (!window.S1_BASE) {
      return Promise.resolve({ ok: false,
        error: 'Filing to a client needs the Smart 1 Hub in front of this tool. ' +
               'There is no client record to file into standalone.' });
    }
    if (!pid) {
      return Promise.resolve({ ok: false,
        error: 'This build has no project record, so there is nothing to file.' });
    }
    return fetch(window.S1_BASE + '/_hub/attach', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ project: pid })
    })
      .then(function (r) { return r.json().then(function (b) { return b; }); })
      .catch(function () {
        return { ok: false, error: 'The Hub did not answer, so nothing was filed.' };
      });
  }

  $('deliver').addEventListener('click', function () {
    var pid = projectIdOf();
    if (!pid) { alert('No project record found for this campaign.'); return; }
    var btn = this; btn.disabled = true; btn.textContent = 'Packaging…';
    fetch('/api/project/' + encodeURIComponent(pid) + '/deliver', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ concept: state.conceptId })
    })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
      .then(function (res) {
        btn.disabled = false;
        if (!res.ok) { btn.textContent = 'Deliver final files'; alert(res.b.error || 'Delivery failed'); return; }
        btn.textContent = 'Delivered ✓';
        var a = document.createElement('a');
        a.href = res.b.zipUrl; a.download = '';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { btn.textContent = 'Deliver again'; }, 2400);
      })
      .catch(function () { btn.disabled = false; btn.textContent = 'Deliver final files'; });
  });

  /* The project record owns the approvals, so they survive a reload and are
     the same list for whoever else has this campaign open. */
  function loadApprovals() {
    var pid = projectIdOf();
    if (!pid) { state.approvals = []; return; }
    fetch('/api/project/' + encodeURIComponent(pid))
      .then(function (r) { return r.json(); })
      .then(function (proj) {
        state.approvals = proj.approvals || [];
        drawControls(); drawRail();
      })
      .catch(function () { /* an unreadable record is no approvals, not a lock */ });
  }

  /* ------------------------------------------------- manual override */
  function refreshOverrideNote() {
    var pid = projectIdOf();
    var note = $('overrideNote');
    if (!pid) { note.style.display = 'none'; return; }
    fetch('/api/project/' + encodeURIComponent(pid))
      .then(function (r) { return r.json(); })
      .then(function (p) {
        var o = (p.overrides || []).filter(function (o) {
          return o.conceptId === state.conceptId && o.size === state.size && o.platform === state.platform;
        })[0];
        if (o) {
          note.style.display = '';
          note.innerHTML = 'This size ships a manually edited file: <b>' + o.originalName +
            '</b> &nbsp;<a href="#" id="dropOverride" style="color:inherit">remove</a>';
          note.querySelector('#dropOverride').addEventListener('click', function (e) {
            e.preventDefault();
            fetch('/api/project/' + encodeURIComponent(pid) + '/override', {
              method: 'POST', headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ conceptId: state.conceptId, platform: state.platform, size: state.size, remove: true })
            }).then(function () { refreshOverrideNote(); });
          });
        } else {
          note.style.display = 'none';
        }
      })
      .catch(function () { note.style.display = 'none'; });
  }

  $('overrideBtn').addEventListener('click', function () { $('overrideInput').click(); });
  $('overrideInput').addEventListener('change', function () {
    var file = this.files[0]; this.value = '';
    if (!file) return;
    var pid = projectIdOf();
    if (!pid) { alert('No project record found for this campaign.'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var b64 = String(reader.result).split(',')[1];
      fetch('/api/project/' + encodeURIComponent(pid) + '/override', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          conceptId: state.conceptId, platform: state.platform, size: state.size,
          filename: file.name, dataBase64: b64
        })
      })
        .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
        .then(function (res) {
          if (!res.ok) { alert(res.b.error || 'That file was rejected.'); return; }
          refreshOverrideNote();
        });
    };
    reader.readAsDataURL(file);
  });

  window.addEventListener('beforeunload', function (e) {
    if (state.dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  /* Refetch the campaign list and re-apply everything read off it. */
  function reloadCampaignList() {
    return fetch('/api/campaigns')
      .then(function (r) { return r.json(); })
      .then(function (b) {
        window.__campaignList = b.campaigns || window.__campaignList || [];
        var le = (window.__campaignList).filter(function (c) {
          return c.requestId === state.requestId; })[0];
        var pill = $('statusPill');
        if (le && le.status === 'proof-sent') {
          pill.textContent = 'Needs revision'; pill.className = 'pill revision'; pill.style.display = '';
        } else if (le && le.status === 'approved') {
          pill.textContent = 'Approved'; pill.className = 'pill approved'; pill.style.display = '';
        } else if (le && le.status === 'complete') {
          pill.textContent = 'Delivered'; pill.className = 'pill approved'; pill.style.display = '';
        } else {
          pill.style.display = 'none';
        }
        refreshDeliver(); refreshStage();
      })
      .catch(function () { /* the decision is recorded either way */ });
  }

  /* --------------------------------------------------------------- start */
  Promise.all([
    fetch('/api/build/options').then(function (r) { return r.json(); }),
    fetch('/api/campaigns').then(function (r) { return r.json(); })
  ]).then(function (out) {
    state.templates = out[0].templates || [];
    state.platformSizes = out[0].platformSizes || null;
    // The families the renderer actually has. A select of these rather than a
    // text box, because an unknown name falls back to Montserrat predictably --
    // so a free-text control can show one family while the ad renders another.
    state.fonts = out[0].fonts || [];
    var list = out[1].campaigns || [];
    window.__campaignList = list;
    if (!list.length) {
      document.getElementById('bench').innerHTML =
        '<div class="empty" style="grid-column:1/-1"><h2>No campaigns yet</h2>' +
        '<p>A campaign appears here as soon as someone submits the request form.</p></div>';
      return;
    }
    $('campaignPick').innerHTML = list.map(function (c) {
      var flag = c.status === 'proof-sent' ? '⚠ NEEDS REVISION — ' : c.status === 'approved' ? '✓ ' : '';
      return '<option value="' + esc(c.requestId) + '">' + flag + esc(c.client) + ' — ' + esc(c.campaignName) + '</option>';
    }).join('');
    var pre = new URLSearchParams(location.search).get('request');
    loadCampaign(pre && list.some(function (c) { return c.requestId === pre; }) ? pre : list[0].requestId);
  });
})();

  /* ======================================================== the animator ====

     Motion, added after the static design exists.

     Three things about the shape of this panel are deliberate.

     IT ASKS THE MOTION FIRST. "Animate the button" and "animate the text" are
     two different jobs -- one adds a message and the other adds attention --
     and every control after that point depends on which. Offering both sets of
     controls at once and letting the operator work out which apply is how the
     slide fields get filled in on a button pulse that will never draw them.

     THE TIMING IS PRINTED, NOT IMPLIED. Google refuses an animated ad that
     runs faster than 5 frames a second or animates for more than 30 seconds,
     and both are invisible on screen -- a GIF looping for ever plays perfectly
     in every browser. So the arithmetic is on the panel, in words, next to the
     preview, and it comes from the SERVER's plan rather than being recomputed
     here: a second copy of that rule is a second answer to "is this legal",
     and the two disagree the day either is edited.

     THE PREVIEW IS THE REAL FILE. Not a mock-up of the frames -- the encoded
     GIF, at the weight it will ship at, so the number under it is the number
     that decides whether Google takes it. */

  var anim = {
    /** The spec being edited, per concept. Not written to the campaign until
     *  Build is pressed, so closing the panel changes nothing. */
    spec: null,
    conceptId: null,
    options: null,
    sizes: [],
    busy: false,
    seq: 0,
  };

  function animDefaults(kind) {
    var d = (anim.options && anim.options.defaults) || {};
    return kind === 'button'
      ? { kind: 'button', frameMs: d.buttonFrameMs || 320, frames: d.buttonFrames || 4 }
      : { kind: 'text', frameMs: d.textFrameMs || 1800, slides: [{}, {}] };
  }

  /** Which copy blocks this family draws on the size being previewed. A slide
   *  field for a block the layout does not draw is the proof-point mistake:
   *  typed in, saved, word-counted and rendered nowhere. */
  function animFields() {
    var c = concept();
    var t = (state.templates || []).filter(function (x) { return c && x.id === c.layoutFamily; })[0];
    var drawn = (t && t.blocks && t.blocks[state.size]) || null;
    var all = ['headline', 'support', 'offer', 'trust', 'cta'];
    return drawn && drawn.length ? all.filter(function (r) { return drawn.indexOf(r) >= 0; }) : all;
  }

  var ANIM_LABEL = {
    headline: 'Headline', support: 'Supporting line', offer: 'Offer',
    trust: 'Proof point', cta: 'Call to action'
  };

  /* Slide copy is stored twice over, exactly as the static copy is: a default
     that every size uses and an override for one canvas. Without the override
     a headline written for the 300x600 is two lines on the 320x50 and the
     whole set fails QA on copy nobody can shorten -- which is not a theory,
     it is what the first run of this against a real campaign did. */
  function animSlide(i) {
    var per = anim.spec.sizeSlides && anim.spec.sizeSlides[state.size];
    var base = (anim.spec.slides || [])[i] || {};
    var over = (per || [])[i] || {};
    var out = {};
    Object.keys(base).forEach(function (k) { out[k] = base[k]; });
    Object.keys(over).forEach(function (k) { out[k] = over[k]; });
    return out;
  }

  function animSetSlide(i, field, value, thisSizeOnly) {
    if (thisSizeOnly) {
      anim.spec.sizeSlides = anim.spec.sizeSlides || {};
      var list = anim.spec.sizeSlides[state.size] = anim.spec.sizeSlides[state.size] || [];
      while (list.length <= i) list.push({});
      list[i][field] = value;
      return;
    }
    anim.spec.slides = anim.spec.slides || [];
    while (anim.spec.slides.length <= i) anim.spec.slides.push({});
    anim.spec.slides[i][field] = value;
    /* The same rule the copy scope toggle follows: writing the default while
       an override for this size still holds the old value looks exactly like
       the edit not having worked. */
    var per2 = anim.spec.sizeSlides && anim.spec.sizeSlides[state.size];
    if (per2 && per2[i]) delete per2[i][field];
  }

  function openAnimator() {
    var c = concept();
    if (!c) return;
    anim.conceptId = c.conceptId;
    anim.spec = null;
    anim.busy = false;

    var wrap = document.createElement('div');
    wrap.className = 'ask';
    wrap.innerHTML = '<div class="animbox" role="dialog" aria-modal="true">' +
      '<div id="animBody">Reading the saved build…</div></div>';
    function close() { document.removeEventListener('keydown', onKey); wrap.remove(); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    wrap.addEventListener('click', function (e) { if (e.target === wrap) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(wrap);
    anim.close = close;

    fetch('/api/animate/' + encodeURIComponent(state.requestId) + '/options')
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) {
          $('animBody').innerHTML =
            '<h4>Nothing to animate yet</h4><p>' + esc(res.j.error || 'That could not be read.') +
            '</p><div class="askacts"><button type="button" class="btn" data-close>Close</button></div>';
          wrap.querySelector('[data-close]').addEventListener('click', close);
          return;
        }
        anim.options = res.j;
        var row = (res.j.concepts || []).filter(function (x) { return x.conceptId === c.conceptId; })[0];
        /* An animation already on the saved build is reopened rather than
           replaced. Somebody coming back to shorten slide 2 must not find
           slide 3 gone. */
        anim.spec = (row && row.animation) || null;
        drawAnimator();
      })
      .catch(function () {
        $('animBody').innerHTML = '<h4>Nothing to animate yet</h4>' +
          '<p>The renderer did not answer.</p>' +
          '<div class="askacts"><button type="button" class="btn" data-close>Close</button></div>';
        var b = wrap.querySelector('[data-close]'); if (b) b.addEventListener('click', close);
      });
  }

  function animConceptRow() {
    return ((anim.options && anim.options.concepts) || []).filter(function (x) {
      return x.conceptId === anim.conceptId;
    })[0];
  }

  function drawAnimator() {
    var body = $('animBody');
    if (!body) return;

    /* The first question, and only the first question. Nothing else is on
       screen until it is answered, because every control below depends on the
       answer to it. */
    if (!anim.spec) {
      var motions = (anim.options && anim.options.motions) || [];
      body.innerHTML =
        '<h4>Animate this set</h4>' +
        '<p>The static design is built and saved. This adds motion to it and ' +
        'delivers the moving version <b>beside</b> the still one — the still ' +
        'files still run everywhere an animated file is not accepted, which on ' +
        'this buy is most placements.</p>' +
        '<div class="nsacts" style="flex-direction:column">' +
        motions.map(function (m) {
          return '<button type="button" class="nsbtn" style="max-width:none" data-kind="' +
            esc(m.kind) + '"><b>' + esc(m.label) + '</b><span>' + esc(m.detail) + '</span></button>';
        }).join('') +
        '</div><div class="askacts" style="margin-top:14px">' +
        '<button type="button" class="btn" data-close>Cancel</button></div>';
      Array.prototype.forEach.call(body.querySelectorAll('[data-kind]'), function (b) {
        b.addEventListener('click', function () {
          anim.spec = animDefaults(b.dataset.kind);
          anim.sizes = [];
          drawAnimator();
          animPreview();
        });
      });
      body.querySelector('[data-close]').addEventListener('click', anim.close);
      return;
    }

    var row = animConceptRow() || { sizes: [] };
    var supported = (row.sizes || []).filter(function (r) { return r.supported; });
    if (!anim.sizes.length) anim.sizes = supported.map(function (r) { return r.size; });
    var refused = (row.sizes || []).filter(function (r) { return !r.supported && r.reasons && r.reasons.length; });
    var built = ((anim.options && anim.options.animations) || []).filter(function (a) {
      return a.conceptId === anim.conceptId;
    });

    var isText = anim.spec.kind === 'text';
    var fields = animFields();

    var left = '';
    if (isText) {
      left += '<h5>What each slide says</h5>' +
        '<div class="anim-slide base"><span class="slide-t">Slide 1 — the ad as built</span>' +
        fields.map(function (f) {
          var v = effective(f);
          return v ? '<p class="asis"><b>' + esc(ANIM_LABEL[f]) + ':</b> ' + esc(v) + '</p>' : '';
        }).join('') +
        '<p style="margin:6px 0 0;font-size:11.5px;color:var(--ink-2)">Edit these on the ' +
        'build screen behind this panel — slide 1 <em>is</em> the static ad, so the two ' +
        'can never disagree.</p></div>';

      for (var i = 0; i < 2; i++) {
        var cur = animSlide(i);
        left += '<div class="anim-slide"><span class="slide-t">Slide ' + (i + 2) +
          (i === 1 ? ' <span style="text-transform:none;font-weight:400">(optional)</span>' : '') +
          '</span>' +
          fields.map(function (f) {
            return '<label>' + esc(ANIM_LABEL[f]) +
              '<input type="text" data-slide="' + i + '" data-field="' + f + '" value="' +
              esc(cur[f] == null ? '' : cur[f]) + '" placeholder="' +
              esc(f === 'headline' ? 'What this slide says' : 'unchanged from slide 1') +
              '"></label>';
          }).join('') +
          '</div>';
      }
      left += '<div class="anim-row" style="margin:2px 0 0">' +
        '<label><input type="checkbox" id="animThisSize"' +
        (anim.thisSizeOnly ? ' checked' : '') + '> Write this slide copy for ' +
        esc(state.size) + ' only</label>' +
        '<span>Leave it off and the words apply to every size. Tick it to shorten a ' +
        'slide that will not fit this canvas.</span></div>';
    } else {
      left += '<h5>The pulse</h5>' +
        '<div class="anim-slide">' +
        '<div class="anim-row"><label>Frames ' +
        '<input type="range" id="animFrames" min="3" max="5" step="1" value="' +
        esc(anim.spec.frames || 4) + '"> <b id="animFramesN">' + esc(anim.spec.frames || 4) +
        '</b></label></div>' +
        '<p style="margin:8px 0 0;font-size:12px;color:var(--ink-2)">The button\'s own ' +
        'color brightens and comes back, so the loop joins to itself without a jump. ' +
        'The color is computed from the fill on the ad — correct the client\'s accent ' +
        'next month and the pulse follows it.</p></div>';
    }

    left += '<h5>Timing</h5><div class="anim-row">' +
      '<label>Each frame holds <input type="range" id="animMs" min="200" max="' +
      esc((anim.options.rules && anim.options.rules.maxFrameMs) || 4000) +
      '" step="100" value="' + esc(anim.spec.frameMs) + '"> ' +
      '<b id="animMsN">' + esc(anim.spec.frameMs) + 'ms</b></label>' +
      '<span>200ms is the floor: Google requires 5 frames a second or slower.</span></div>';

    left += '<h5>Sizes to build</h5><div class="anim-sizes">' +
      supported.map(function (r) {
        return '<label><input type="checkbox" data-size="' + esc(r.size) + '"' +
          (anim.sizes.indexOf(r.size) >= 0 ? ' checked' : '') + '> ' + esc(r.size) + '</label>';
      }).join('') + '</div>';
    /* Sizes that will not take a GIF are NAMED and not simply absent. A panel
       offering eight of eleven with nothing saying where the other three went
       reads as a tool that lost them. */
    if (refused.length) {
      left += '<p style="margin:8px 0 0;font-size:11.5px;color:var(--ink-2)">' +
        'Not offered, and shipping as the static ad: <b>' +
        esc(refused.map(function (r) { return r.size; }).join(', ')) + '</b>. ' +
        esc(refused[0].reasons[0]) + '</p>';
    }
    if (built.length) {
      left += '<p style="margin:8px 0 0;font-size:11.5px;color:var(--ink-2)">Already built: <b>' +
        esc(built.map(function (a) { return a.size; }).join(', ')) +
        '</b>. Building again replaces those and leaves the rest alone.</p>';
    }

    body.innerHTML =
      '<h4>' + esc(isText ? 'Animate the text' : 'Animate the button') + '</h4>' +
      '<p>Previewing <b>' + esc(state.size) + '</b>. Change the size on the build screen ' +
      'behind this panel to preview another one; what you build is the list below.</p>' +
      '<div class="anim-cols"><div>' + left + '</div>' +
      '<div><h5>Preview</h5><div class="anim-stage" id="animStage">' +
      '<span style="font-size:12px;color:var(--ink-2)">Building…</span></div>' +
      '<div class="anim-facts" id="animFacts"></div>' +
      '<ul class="anim-issues" id="animIssues"></ul></div></div>' +
      '<div class="askacts" style="margin-top:18px">' +
      '<button type="button" class="btn primary" id="animBuild">Build the animation</button>' +
      '<button type="button" class="btn" data-back>Choose a different motion</button>' +
      '<button type="button" class="btn" data-close>Cancel</button></div>';

    Array.prototype.forEach.call(body.querySelectorAll('input[data-slide]'), function (el) {
      /* `change`, not `input`: this posts a render per edit, and a keystroke
         per render is an encode per keystroke. */
      el.addEventListener('change', function () {
        animSetSlide(Number(el.dataset.slide), el.dataset.field, el.value, !!anim.thisSizeOnly);
        animPreview();
      });
    });
    var ts = $('animThisSize');
    if (ts) ts.addEventListener('change', function () { anim.thisSizeOnly = ts.checked; });
    var fr = $('animFrames');
    if (fr) fr.addEventListener('input', function () {
      anim.spec.frames = Number(fr.value);
      $('animFramesN').textContent = fr.value;
      animPreview();
    });
    var msEl = $('animMs');
    msEl.addEventListener('input', function () {
      anim.spec.frameMs = Number(msEl.value);
      $('animMsN').textContent = msEl.value + 'ms';
    });
    msEl.addEventListener('change', animPreview);
    Array.prototype.forEach.call(body.querySelectorAll('input[data-size]'), function (el) {
      el.addEventListener('change', function () {
        var v = el.dataset.size;
        var at = anim.sizes.indexOf(v);
        if (el.checked && at < 0) anim.sizes.push(v);
        if (!el.checked && at >= 0) anim.sizes.splice(at, 1);
      });
    });
    body.querySelector('[data-back]').addEventListener('click', function () {
      anim.spec = null; drawAnimator();
    });
    body.querySelector('[data-close]').addEventListener('click', anim.close);
    $('animBuild').addEventListener('click', animBuild);
  }

  /* The preview is the encoded file, at the weight it ships at.

     Every answer it can give is a real answer and only one of them is an
     error: a size that does not take a GIF comes back `supported: false` and
     is SAID, not drawn red -- "this one ships as the static ad" is a correct
     decision, and a red box over one of those is what teaches people to stop
     reading the panel. */
  function animPreview() {
    var stage = $('animStage'); if (!stage || !anim.spec) return;
    var seq = ++anim.seq;
    stage.innerHTML = '<span style="font-size:12px;color:var(--ink-2)">Building…</span>';
    $('animFacts').innerHTML = '';
    $('animIssues').innerHTML = '';
    post('/api/animate/preview', {
      campaign: state.doc.campaign,
      conceptId: anim.conceptId,
      size: state.size,
      platform: state.platform,
      animation: anim.spec
    }).then(function (r) {
      if (seq !== anim.seq) return;                  // a later edit already won
      if (!stage.isConnected) return;
      if (r && r.error) {
        stage.innerHTML = '<span style="font-size:12px;color:var(--ink-2)">' + esc(r.error) + '</span>';
        return;
      }
      if (r && r.supported === false) {
        stage.innerHTML = '<span style="font-size:12px;color:var(--ink-2)">' +
          esc(r.reason || 'This size ships as the static ad.') + '</span>';
        return;
      }
      stage.innerHTML = '<img alt="Animated preview" src="' + esc(r.image) + '">';

      var kb = (r.bytes / 1024).toFixed(0);
      var cap = (r.maxFileBytes / 1024).toFixed(0);
      $('animFacts').innerHTML =
        '<b>' + r.frames + ' frames</b> at ' + r.fps + ' a second · plays <b>' + r.loop +
        (r.loop === 1 ? ' time' : ' times') + '</b> then stops · <b>' +
        (r.totalMs / 1000).toFixed(1) + 's</b> in total<br>' +
        '<span class="' + (r.overweight ? 'bad' : '') + '"><b>' + kb + ' KB</b> of the ' +
        cap + ' KB this placement allows</span>' +
        (r.settings ? ' <span style="opacity:.75">(' + esc(r.settings) + ')</span>' : '') +
        (r.adjustments && r.adjustments.length
          ? '<br><span class="bad">' + r.adjustments.map(esc).join('<br>') + '</span>'
          : '');

      $('animIssues').innerHTML = (r.qa || []).map(function (f) {
        return '<li class="' + esc(f.status) + '">' + esc(f.detail) + '</li>';
      }).join('');
    }).catch(function () {
      if (seq !== anim.seq || !stage.isConnected) return;
      stage.innerHTML = '<span style="font-size:12px;color:var(--ink-2)">That preview failed.</span>';
    });
  }

  function animBuild() {
    if (anim.busy) return;
    if (!anim.sizes.length) {
      $('animFacts').innerHTML = '<span class="bad">Tick at least one size to build.</span>';
      return;
    }
    anim.busy = true;
    var btn = $('animBuild');
    btn.disabled = true; btn.textContent = 'Building…';
    post('/api/animate/' + encodeURIComponent(state.requestId), {
      conceptId: anim.conceptId,
      sizes: anim.sizes,
      animation: anim.spec
    }).then(function (r) {
      if (r && r.error) throw new Error(r.error);
      anim.close();
      showNextSteps('Building ' + r.total + ' animated file(s). They are written ' +
        'beside the static ones and go into the delivery ZIP under animated/.');
      followAnimate(r.jobId);
    }).catch(function (e) {
      anim.busy = false;
      btn.disabled = false; btn.textContent = 'Build the animation';
      $('animFacts').innerHTML = '<span class="bad">' +
        esc((e && e.message) || 'That could not be started.') + '</span>';
    });
  }

  /* Same watcher shape as followRender, and separate from it on purpose: what
     an animated job reports is not a render's count of files, and the sizes it
     did NOT produce are the half worth saying out loud. */
  function followAnimate(jobId) {
    var tries = 0;
    (function poll() {
      if (++tries > 60) return;
      fetch('/api/render/' + encodeURIComponent(jobId))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j || !j.status) return;
          var prog = j.progress || {};
          if (j.status === 'complete') {
            var made = (j.animations || []).length;
            var bad = (j.animations || []).filter(function (a) { return a.status === 'fail'; });
            var msg = 'Animated ' + made + ' size' + (made === 1 ? '' : 's') + '.';
            if (bad.length) {
              /* Named, because a failing animation is WITHHELD from the
                 delivery and the static file goes in its place -- a count that
                 said 8 and a ZIP that held 6 is the gap this sentence closes. */
              msg += ' ' + bad.length + ' did not pass its checks and will not be ' +
                'delivered (' + bad.map(function (a) { return a.size; }).join(', ') +
                ') — the still versions of those still ship.';
            }
            var skipped = j.animationSkipped || [];
            if (skipped.length) {
              msg += ' ' + skipped.length + ' size' + (skipped.length === 1 ? '' : 's') +
                ' could not take one: ' + skipped[0].reason;
            }
            showNextSteps(msg, bad.length > 0);
            refreshDeliver();
            return;
          }
          if (j.status === 'failed') {
            showNextSteps('That animation failed: ' + (j.error || 'no reason given') +
              '. The static files are untouched.', true);
            return;
          }
          if (prog.total) {
            $('nsMsg').textContent = 'Animating ' + (prog.done || 0) + ' of ' + prog.total + '…';
          }
          setTimeout(poll, 2000);
        })
        .catch(function () { setTimeout(poll, 3000); });
    })();
  }

  $('animate').addEventListener('click', function () {
    /* It reads the SAVED build, so unsaved edits would animate the previous
       version and report a clean success for doing it -- the same trap Render
       and Attach were arranged around. */
    leaveIfSafe('the animation panel', openAnimator);
  });

  /* ---- health dot: quiet poll of diagnostics, click through when off ---- */
  (function () {
    var el = document.getElementById('health');
    if (!el) return;
    function check() {
      fetch('/api/diagnostics', { headers: { accept: 'application/json' } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          el.className = 'health ' + d.verdict;
          el.title = d.summary.fail + ' failing, ' + d.summary.warn + ' warning';
          el.querySelector('.lbl').textContent =
            d.verdict === 'healthy' ? 'Healthy' : d.verdict === 'degraded' ? 'Degraded' : 'Broken';
        })
        .catch(function () { /* leave the last state */ });
    }
    check();
    setInterval(check, 5 * 60 * 1000);
  })();
</script>
</body>
</html>
