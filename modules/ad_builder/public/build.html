<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ad Builder — Smart 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /*
   * The build screen is the operator's workbench, not the client's proof.
   * Different job, so a deliberately different room: the proof screen is a
   * light neutral gallery, this is a dark studio. Dark because the operator
   * spends an hour here judging brand color against a backdrop, and a bright
   * white surround skews that judgement all day.
   *
   * Layout is a fixed three-column bench: controls left, live canvas center,
   * every size and its QA state right. Nothing moves as you type — the preview
   * is the only thing that changes, which is what makes small edits legible.
   */
  :root {
    --bg: #16181D;
    --panel: #1E2128;
    --panel-2: #262A33;
    --line: #333844;
    --ink: #EEF0F4;
    --ink-2: #98A1B0;
    --signal: #5B8DEF;
    --pass: #35C089;
    --warn: #E0A72B;
    --fail: #EF6B62;
    /* The canvas surround is a neutral mid-grey, not the panel color: brand
       colors must be judged against something that does not tint them. */
    --stage: #8A8F98;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  h1, h2, h3, .lockup { font-family: Poppins, "Avenir Next", "Segoe UI", system-ui, sans-serif; }
  .mono, .spec, .dim { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }

  /* ---------- top bar ---------- */
  .bar {
    display: flex; align-items: center; gap: 12px; flex: none;
    padding: 0 16px; height: 56px; background: var(--panel);
    border-bottom: 1px solid var(--line); white-space: nowrap; overflow-x: auto;
  }
  .bar .btn, .bar select { flex: none; }
  .lockup { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
  .lockup span { color: var(--ink-2); font-weight: 500; }
  .bar select, .bar button { font: inherit; }
  select, input[type=text], textarea {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; font: inherit; width: 100%;
  }
  select:focus, input:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--signal); outline-offset: 1px;
  }
  .bar .grow { flex: 1; }
  .btn {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 14px; cursor: pointer; font: inherit;
  }
  .btn:hover { border-color: var(--ink-2); }
  .btn.primary { background: var(--signal); border-color: var(--signal); color: #0B1220; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .saved { color: var(--pass); font-size: 12.5px; opacity: 0; transition: opacity .2s; }

  /* ---- shared app nav ---- */
  .appnav { display: flex; align-items: center; gap: 2px; margin-right: 8px; }
  .appnav a {
    color: var(--ink-2); text-decoration: none; font-size: 13px; font-weight: 600;
    padding: 6px 11px; border-radius: 6px;
  }
  .appnav a:hover { color: var(--ink); background: var(--panel-2); }
  .appnav a.here { color: var(--ink); background: var(--panel-2); }
  .health { display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font-size: 12px; color: var(--ink-2); padding: 5px 10px; border-radius: 6px; }
  .health:hover { background: var(--panel-2); }
  .health .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .health.healthy .dot { background: var(--pass); }
  .health.degraded .dot { background: var(--warn); }
  /* Not animated. A pulsing red dot in the corner of a screen somebody works
     in for an hour is an alarm, and this is a status: whatever it is reporting
     will still be true in five minutes, and it is almost never something the
     person laying out an ad can act on. It is red, it says "Broken", and it
     links to the page that explains why -- that is enough. */
  .health.broken .dot { background: var(--fail); }
  .pill { font-size: 11.5px; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
  .pill.revision { background: rgba(224,167,43,.16); color: var(--warn); }
  .pill.approved { background: rgba(53,192,137,.16); color: var(--pass); }
  .saved.on { opacity: 1; }

  /* ---------- bench ---------- */
  .bench { flex: 1; display: grid; grid-template-columns: 320px 1fr 300px; min-height: 0; }
  .col { overflow-y: auto; min-height: 0; }
  .col.left { border-right: 1px solid var(--line); background: var(--panel); }
  .col.right { border-left: 1px solid var(--line); background: var(--panel); }

  .group { border-bottom: 1px solid var(--line); padding: 16px 18px; }
  .group h3 {
    margin: 0 0 12px; font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-2); font-weight: 600;
  }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 5px; }
  textarea { min-height: 58px; resize: vertical; }

  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { text-align: center; }
  .swatch input[type=color] {
    width: 44px; height: 32px; padding: 0; border: 1px solid var(--line);
    border-radius: 5px; background: none; cursor: pointer;
  }
  .swatch span { display: block; font-size: 10px; color: var(--ink-2); margin-top: 3px; }

  /* ---------- stage ---------- */
  .stage {
    background: var(--stage); display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 26px; gap: 16px;
    position: relative; overflow: auto;
  }
  /* A faint checker so a transparent or white-on-white creative is visible
     as an object rather than blending into the surround. */
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .16;
    background-image: linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%),
                      linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%);
    background-size: 22px 22px; background-position: 0 0, 11px 11px;
  }
  .canvas {
    position: relative; background: #fff; box-shadow: 0 10px 34px rgba(0,0,0,.34);
    max-width: 100%; line-height: 0;
  }
  .canvas img { display: block; max-width: 100%; height: auto; }
  .canvas.busy { opacity: .55; }
  .stagebar {
    position: relative; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    justify-content: center;
  }
  .chip {
    background: rgba(0,0,0,.34); color: #fff; border: 1px solid rgba(255,255,255,.22);
    border-radius: 5px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: #101318; border-color: #101318; }
  .dim { position: relative; color: #22262C; font-size: 12px; }

  /* ---------- size rail ---------- */
  .size {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 11px 16px; color: var(--ink); cursor: pointer; font: inherit;
  }
  .size:hover { background: var(--panel-2); }
  .size.on { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--signal); }
  .size .nm { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
  .size .st { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .size .st.pass { background: var(--pass); }
  .size .st.warn { background: var(--warn); }
  .size .st.fail { background: var(--fail); }

  /* Approval, per size.
     
     A set is worked one size at a time and there was nothing recording which
     ones were finished, so "have I done the 300x600" was answered by looking
     at it and remembering. The tick is small on purpose -- it sits in the rail
     next to the QA dot rather than becoming a column of its own -- and it is
     a toggle, because a lock nobody can undo is a lock people work around. */
  .size .ok { flex: none; width: 20px; height: 20px; border-radius: 5px; padding: 0;
    font: inherit; font-size: 12px; line-height: 1; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); }
  .size .ok:hover { border-color: var(--pass); color: var(--pass); }
  .size .ok.on { background: rgba(53,192,137,.18); border-color: var(--pass); color: var(--pass); }
  .size.approved .nm { color: var(--pass); }

  /* What an approved size looks like from the controls: everything is
     readable, nothing is editable, and the reason is at the top rather than
     left for someone to work out from a greyed-out box. */
  .locked { padding: 11px 12px; margin-bottom: 12px; border-radius: 7px;
    background: rgba(53,192,137,.12); border: 1px solid rgba(53,192,137,.4);
    font-size: 12.5px; line-height: 1.45; }
  .locked b { color: var(--pass); }
  .locked button { margin-top: 8px; }
  .col.left.lock input, .col.left.lock textarea, .col.left.lock select,
  .col.left.lock .bgmode, .col.left.lock .famcard, .col.left.lock .bsclear,
  .col.left.lock .inkchip, .col.left.lock .bgpos button {
    pointer-events: none; opacity: .5;
  }
  .col.left.lock .locked, .col.left.lock .locked button { pointer-events: auto; opacity: 1; }

  /* One question, two buttons, in the middle of the screen. Used where the
     answer changes what the click does and guessing costs work: which sizes
     an edit applies to, and whether unsaved edits survive moving on. */
  .ask { position: fixed; inset: 0; z-index: 70; background: rgba(9,11,15,.72);
    display: flex; align-items: center; justify-content: center; padding: 24px; }
  .askbox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; max-width: 26rem; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .askbox h4 { margin: 0 0 8px; font-size: 15px; font-family: Poppins, sans-serif; }
  .askbox p { margin: 0 0 15px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  .askacts { display: flex; gap: 8px; flex-wrap: wrap; }

  /* The scope of a copy edit, kept beside the field it governs so the answer
     stays visible and changeable rather than being asked once and forgotten. */
  .scope { display: flex; gap: 4px; align-items: center; margin: 5px 0 0; }
  .scope span { font-size: 10.5px; color: var(--ink-2); margin-right: 2px; }
  .scope button { font: inherit; font-size: 10.5px; padding: 3px 8px; border-radius: 20px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); cursor: pointer; }
  .scope button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink);
    border-color: var(--ink-2); font-weight: 600; }

  /* A copy field this size's layout will not draw. */
  .nodraw { font-size: 11.5px; color: var(--warn); margin: -2px 0 6px; line-height: 1.4; }

  /* One block open at a time.
     
     Five text blocks, each with eight controls, is forty controls in a column
     you scroll — so the block you are working on is off screen by the time
     you reach its color row. They are an accordion now: opening one closes
     the rest, which is the behaviour people expect from a stack of headers
     and the only one that keeps the thing you are editing in view. */
  .blockstyle > summary {
    cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink); font-weight: 700;
  }
  .blockstyle > summary::-webkit-details-marker { display: none; }
  .blockstyle > summary::before {
    content: '\25B8'; font-size: 10px; color: var(--ink-2);
    transition: transform .15s ease; flex: none;
  }
  .blockstyle[open] > summary::before { transform: rotate(90deg); }
  .blockstyle > summary:hover { color: var(--signal); }
  .blockstyle[open] > summary { margin-bottom: 9px; }
  /* A dot on a header whose block has been changed, so a collapsed panel
     still says it is carrying an override. */
  .bsdot { width: 6px; height: 6px; border-radius: 50%; background: var(--signal);
    flex: none; margin-left: auto; }

  /* Nudge pads. Four arrows and a center, which is what "move it a bit left"
     needs and what a nine-way grid of absolute positions cannot express. */
  .pad { display: grid; grid-template-columns: repeat(3, 30px); gap: 4px;
    justify-content: start; margin-bottom: 7px; }
  .pad button {
    aspect-ratio: 1; border: 1px solid var(--line); border-radius: 5px;
    background: var(--bg); color: var(--ink); cursor: pointer; padding: 0;
    font-size: 13px; line-height: 1; display: flex; align-items: center;
    justify-content: center;
  }
  .pad button:hover { border-color: var(--signal); color: var(--signal); }
  .pad button.mid { font-size: 10px; color: var(--ink-2); }
  .pad span { display: block; }

  /* Sliders. One control for "bigger", rather than two number fields that
     have to be kept in step. */
  .slider { margin-bottom: 8px; }
  .slider label { display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; color: var(--ink-2); margin-bottom: 3px; }
  .slider label b { color: var(--ink); font-weight: 600; font-family: "IBM Plex Mono", monospace; }
  .slider input[type=range] { width: 100%; accent-color: var(--signal); }

  /* The numbers, for the once-in-twenty case that needs them. */
  .advanced > summary {
    cursor: pointer; list-style: none; font-size: 11px; color: var(--ink-2);
    padding: 4px 0; text-decoration: underline; text-underline-offset: 2px;
  }
  .advanced > summary::-webkit-details-marker { display: none; }
  .advanced > summary:hover { color: var(--ink); }

  /* Help bubbles. The left column was carrying five paragraphs of explanation
     between the controls they explain — read once, then in the way for ever.
     The text is the same text; it is behind a dot now. */
  .hb {
    display: inline-flex; align-items: center; justify-content: center;
    width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink-2); font-size: 10px;
    font-weight: 700; cursor: help; vertical-align: middle; margin-left: 5px;
    font-family: -apple-system, sans-serif; flex: none; position: relative;
  }
  .hb:hover, .hb:focus { border-color: var(--signal); color: var(--signal); outline: none; }
  .hb .hbtext {
    display: none; position: absolute; left: 50%; bottom: calc(100% + 7px);
    transform: translateX(-50%); width: 232px; padding: 9px 11px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5); color: var(--ink);
    font-size: 11.5px; font-weight: 400; line-height: 1.45; text-transform: none;
    letter-spacing: 0; text-align: left; z-index: 30; cursor: auto;
  }
  .hb:hover .hbtext, .hb:focus .hbtext { display: block; }
  /* Near the left edge of a 320px column a centered bubble is cut off. */
  .hb.left .hbtext { left: 0; transform: none; }

  /* A palette the tool is proposing, with the contrast it achieves. */
  .variant { display: flex; gap: 9px; align-items: center; width: 100%;
    text-align: left; font: inherit; padding: 8px 9px; margin-bottom: 6px;
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 7px; cursor: pointer; }
  .variant:hover { border-color: var(--signal); }
  .variant .vsw { width: 30px; height: 30px; border-radius: 5px; flex: none;
    border: 1px solid rgba(255,255,255,.2); }
  .variant b { display: block; font-size: 12px; }
  .variant span { display: block; font-size: 11px; color: var(--ink-2); line-height: 1.35; }
  .variant em { font-style: normal; color: var(--pass); font-family: "IBM Plex Mono", monospace; }

  .qa { padding: 14px 16px; }
  .qa h3 { margin: 0 0 10px; font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-2); }
  .qa ul { list-style: none; margin: 0; padding: 0; }
  .qa li {
    font-size: 12.5px; line-height: 1.45; padding: 9px 11px; border-radius: 6px;
    margin-bottom: 7px; background: var(--panel-2); border-left: 3px solid var(--line);
  }
  .qa li.warn { border-left-color: var(--warn); }
  .qa li.fail { border-left-color: var(--fail); }
  .qa li b { display: block; font-family: "IBM Plex Mono", monospace; font-size: 11px;
             color: var(--ink-2); margin-bottom: 2px; font-weight: 500; }
  .qa .clean { color: var(--pass); font-size: 12.5px; }
  .fix {
    margin-top: 7px; background: none; border: 1px solid var(--line); color: var(--ink);
    border-radius: 5px; padding: 4px 9px; font: inherit; font-size: 11.5px; cursor: pointer;
  }
  .fix:hover { border-color: var(--signal); color: var(--signal); }

  .notes { padding: 14px 16px; border-top: 1px solid var(--line); }
  .notes li { font-size: 12px; color: var(--ink-2); margin-bottom: 7px; line-height: 1.45; }
  .notes > summary { cursor: pointer; list-style: none; display: flex; align-items: center;
    gap: 7px; font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-2); font-weight: 700; }
  .notes > summary::-webkit-details-marker { display: none; }
  .notes > summary::before { content: '\25B8'; font-size: 10px; transition: transform .15s ease; }
  .notes[open] > summary::before { transform: rotate(90deg); }
  .notecount { font-size: 10.5px; letter-spacing: 0; background: var(--line);
    color: var(--ink-2); border-radius: 9px; padding: 1px 7px; font-weight: 700; }

  /* What happens after Save. Sits between the toolbar and the bench so it is
     read on the way back to the work, not hunted for. */
  .nextstep { position: relative; margin: 0; padding: 12px 40px 12px 14px;
    border-bottom: 1px solid var(--line); border-left: 3px solid var(--signal);
    background: var(--panel-2); color: var(--ink); }
  .nsmsg { font-size: 13px; margin-bottom: 9px; }
  .nsmsg.bad { color: var(--fail); }
  .nsacts { display: flex; gap: 8px; flex-wrap: wrap; }
  .nsbtn { text-align: left; font: inherit; padding: 8px 11px; background: var(--bg);
    color: var(--ink); border: 1px solid var(--line); border-radius: 7px; cursor: pointer;
    display: flex; flex-direction: column; gap: 2px; max-width: 15rem; }
  .nsbtn:hover { border-color: var(--ink-2); }
  .nsbtn b { font-size: 12.5px; }
  .nsbtn span { font-size: 11px; color: var(--ink-2); line-height: 1.3; }
  .nsbtn:disabled { opacity: .55; cursor: default; }
  .nsclose { position: absolute; top: 7px; right: 9px; border: 0; background: none;
    font-size: 19px; line-height: 1; color: var(--ink-2); cursor: pointer; padding: 2px 5px; }

  /* Per-block text styling.
     
     These panels were authored white -- #fff cards with #98A1B0 labels and
     #fff inputs -- inside a room whose body color is near-white. So a label
     sat at about 2:1 against its own card and a typed value was white on
     white: the control was legible only while it was empty and showing its
     placeholder. Everything in the left column is the studio's own palette
     now, which is also the reason the studio has one. */
  .blockstyle { border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px;
    margin-bottom: 8px; background: var(--panel-2); }
  .bsname { font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink); font-weight: 700; margin-bottom: 7px; }
  .bsrow { display: flex; gap: 7px; margin-bottom: 6px; align-items: flex-end; }
  .bsrow > label { flex: 1; font-size: 11px; color: var(--ink-2);
    display: flex; flex-direction: column; gap: 4px; text-transform: none;
    letter-spacing: 0; font-weight: 500; min-width: 0; }
  .bsrow input, .bsrow select { width: 100%; padding: 6px 8px; font-size: 12.5px;
    border: 1px solid var(--line); border-radius: 5px;
    background: var(--bg); color: var(--ink); }
  .bsrow input::placeholder { color: var(--ink-2); opacity: .8; }
  .bsrow input[type=color] { padding: 2px; height: 30px; background: var(--bg); }
  .bsrow input[type=file] { padding: 5px; font-size: 11.5px; }
  .bsclear { align-self: flex-end; font: inherit; font-size: 11px; padding: 7px 9px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 5px; cursor: pointer;
    color: var(--ink-2); white-space: nowrap; }
  .bsclear:hover { border-color: var(--ink-2); color: var(--ink); }

  /* A row of the client's own five colors under every color control.
     Choosing "the brand's accent" and choosing "#F2B705" are different acts:
     the first follows the palette when somebody corrects a swatch, and it is
     what a person means nine times out of ten. The picker stays beside it for
     the tenth. */
  .inkrow { display: flex; gap: 5px; align-items: center; flex-wrap: wrap;
    margin: 2px 0 4px; }
  .inkchip { width: 24px; height: 24px; border-radius: 5px; cursor: pointer;
    border: 1px solid var(--line); padding: 0; position: relative; }
  .inkchip:hover { border-color: var(--ink); }
  .inkchip[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--signal); border-color: var(--signal); }
  .inklabel { font-size: 10.5px; color: var(--ink-2); margin-right: 2px; }

  /* Background chooser: four sources, one panel. */
  .bgmodes { display: grid; gap: 5px; margin-bottom: 8px; }
  .bgmode { text-align: left; font: inherit; font-size: 12.5px; padding: 8px 10px;
    background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .bgmode:hover { border-color: var(--ink-2); }
  .bgmode.on { border-color: var(--signal);
    box-shadow: 0 0 0 1px var(--signal) inset; font-weight: 600; }
  .bgresults:not(:empty) { margin-bottom: 8px; }
  .bgmsg { font-size: 11.5px; color: var(--ink-2); display: block; margin-bottom: 6px; }
  /* Two columns, not four. A 76px-wide thumbnail of a photograph is a smear
     of color: you cannot tell a house from a hedge in one, which is most of
     why the suggestions "did not look close at all". Bigger tiles, and a
     click on the magnifier opens the picture full size before anything is
     applied to the ad. */
  .bggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); gap: 8px; }
  .bgtile { position: relative; }
  .bgthumb { padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
    background: var(--bg); cursor: pointer; display: block; font: inherit; width: 100%; }
  .bgthumb img { width: 100%; height: 94px; object-fit: cover; display: block; }
  .bgthumb span { display: block; font-size: 10.5px; color: var(--ink-2); padding: 3px 5px; }
  .bgthumb:hover { border-color: var(--ink-2); }
  .bgthumb.on { border-color: var(--signal); box-shadow: 0 0 0 1px var(--signal) inset; }
  .bgzoom { position: absolute; top: 5px; right: 5px; width: 26px; height: 26px;
    border-radius: 5px; border: 1px solid rgba(255,255,255,.35); cursor: pointer;
    background: rgba(11,18,32,.72); color: #fff; font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center; padding: 0; }
  .bgzoom:hover { background: rgba(11,18,32,.92); }

  /* The lightbox. A picture is judged at the size it will be seen, and a
     photo behind a 970x250 is not judged at 126 pixels wide. */
  .lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(9,11,15,.88);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 12px; padding: 26px; }
  .lightbox img { max-width: 92vw; max-height: 76vh; border-radius: 8px;
    box-shadow: 0 18px 60px rgba(0,0,0,.6); }
  .lightbox .lbbar { display: flex; gap: 8px; align-items: center; }
  .lightbox .lbnote { color: var(--ink-2); font-size: 12px; }

  /* The nine-way crop grid. A background is drawn to cover the canvas and the
     overflow is cut off; on a 300x250 that is most of a landscape photo. */
  .bgpos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    width: 108px; margin-bottom: 6px; }
  .bgpos button { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 4px;
    background: var(--bg); cursor: pointer; padding: 0; }
  .bgpos button:hover { border-color: var(--ink-2); }
  .bgpos button[aria-pressed="true"] { background: var(--signal); border-color: var(--signal); }

  /* Layout families, chosen by looking rather than by reading a dropdown. */
  .famgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 8px; margin-bottom: 8px; }
  .famcard { display: flex; flex-direction: column; gap: 5px; align-items: stretch;
    padding: 7px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
    cursor: pointer; text-align: left; font: inherit; }
  .famcard:hover { border-color: var(--ink-2); }
  .famcard.on { border-color: var(--signal); box-shadow: 0 0 0 1px var(--signal) inset; }
  .famcard svg { width: 100%; height: auto; }
  .famname { font-size: 11px; line-height: 1.25; color: var(--ink-2); }
  .famcard.on .famname { color: var(--ink); font-weight: 600; }
  .fammiss { font-size: 10px; color: var(--warn); }
  .famnone { font-size: 11px; color: var(--ink-2); padding: 12px 0; text-align: center;
    background: var(--bg); border: 1px dashed var(--line); border-radius: 4px; }

  .empty { padding: 40px 22px; color: var(--ink-2); text-align: center; }
  .empty h2 { font-size: 15px; margin: 0 0 6px; color: var(--ink); }

  @media (max-width: 1100px) {
    .bench { grid-template-columns: 280px 1fr; }
    .col.right { display: none; }
  }
</style>
</head>
<body>

<div class="bar">
  <div class="lockup" style="flex:none">Ad Builder</div><span id="who" style="display:none"></span>
  <nav class="appnav">
    <a href="/build" class="here">Build</a>
    <a href="/projects">Projects</a>
    <a href="/diagnostics">Diagnostics</a>
  </nav>
  <a class="health" id="health" href="/diagnostics" title="Checking…"><span class="dot"></span><span class="lbl">…</span></a>
  <select id="campaignPick" style="width:auto;min-width:230px"></select>
  <select id="conceptPick" style="width:auto"></select>
  <!--
    There is no platform picker.

    It offered Google Display and Amazon DSP, and the choice changed nothing a
    person here is deciding: the two agree on every size in this package, and
    where they differ (Amazon supplies the artwork at 2x and caps some
    placements at 40 KB) the renderer already knows and applies it per size.
    So it was a control that reordered nobody's work and quietly changed which
    files "Render all sizes" produced. The campaign's own platform list decides
    that now -- set at intake, from what was actually sold -- and it is stated
    on the render button rather than chosen here.
  -->
  <span class="pill" id="statusPill" style="display:none"></span>
  <span class="grow"></span>
  <span class="saved" id="saved">Saved</span>
  <button class="btn" id="save">Save</button>
  <a class="btn" id="proofLink" href="#" target="_blank" style="display:none">Open proof</a>
  <button class="btn" id="deliver" style="display:none;border-color:var(--pass);color:var(--pass)">Deliver final files</button>
  <!-- Only when this is running inside the Smart 1 Hub. Standalone there is no
       client registry to attach anything to, so the button would lead nowhere. -->
  <a class="btn" id="attachClient" href="#" style="display:none">Attach to client</a>
  <div id="deliveries" style="display:none;margin-top:10px;font-size:13px"></div>
  <!-- "Render all sizes" said what it did and not what it was for, so nobody
       knew whether they needed it. The title says the rest: the preview is one
       size and lives in the browser, and this is what writes the actual files
       every other step reads. -->
  <button class="btn primary" id="renderAll"
    title="Build the finished file for every size in this layout, not just the one on screen. The preview is a live sketch; this is what the proof, the delivery ZIP and the client gallery all read.">Render all sizes</button>
</div>

<div class="nextstep" id="nextStep" hidden>
  <div class="nsmsg" id="nsMsg"></div>
  <div class="nsacts" id="nsActs"></div>
  <button type="button" class="nsclose" id="nsClose" aria-label="Dismiss">&times;</button>
</div>

<div class="bench" id="bench">
  <div class="col left" id="controls"></div>
  <div class="stage">
    <div class="canvas" id="canvas"><img id="preview" alt="Preview"></div>
    <div class="dim mono" id="dims">—</div>
    <div class="stagebar">
      <button class="chip" id="squint" aria-pressed="false">Squint</button>
      <button class="chip" id="onDark" aria-pressed="false">Dark page</button>
      <button class="chip" id="onLight" aria-pressed="true">Light page</button>
      <button class="chip" id="overrideBtn" title="Ship a hand-edited file for this size instead of the rendered one">Replace with edited file…</button>
      <input type="file" id="overrideInput" accept="image/png,image/jpeg" style="display:none">
    </div>
    <div class="dim mono" id="overrideNote" style="display:none;color:#7A4E00;background:rgba(224,167,43,.14);padding:4px 10px;border-radius:5px"></div>
  </div>
  <div class="col right" id="rail"></div>
</div>

<script>
(function () {
  'use strict';

  var state = {
    requestId: null,
    doc: null,        // { campaign, notes, assetSources }
    conceptId: null,
    size: '300x250',
    platform: 'google',
    platforms: ['google'],
    templates: [],
    fonts: [],        // families the renderer has, from /api/build/options
    /** platform id -> the sizes it buys, from /api/build/options. */
    platformSizes: null,
    dirty: false,
    sizeStatus: {},   // size -> { status }
    /** field -> 'size' | 'all'. Asked once per field per campaign; see
     *  setCopy for why an unasked edit is not just defaulted. */
    copyScope: {},
    /** Approvals for the loaded project, as [{conceptId, platform, size}]. */
    approvals: [],
  };

  var $ = function (id) { return document.getElementById(id); };
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function concept() {
    if (!state.doc) return null;
    var cs = state.doc.campaign.concepts;
    return cs.filter(function (c) { return c.conceptId === state.conceptId; })[0] || cs[0];
  }
  /* Copy is stored as a default plus per-size overrides. The editor always
     shows the effective value for the size on screen, and writes to the
     override for that size — editing the 320x50 must not rewrite the 300x600. */
  function effective(field) {
    var c = concept(); if (!c) return '';
    var d = c.copy['default'] || {};
    var o = c.copy[state.size] || {};
    return o[field] !== undefined ? o[field] : (d[field] || '');
  }
  /* Where a copy edit lands.
     
     Copy is a default plus per-size overrides, and every edit used to go to
     the override for the size on screen. That is right for tightening a
     headline that will not fit a 320x50, and wrong -- silently -- for fixing
     a typo, which then stayed wrong on the other seven sizes with nothing
     saying so.
     
     So the scope is asked, once per field, the first time that field is
     edited, and then stays on screen as a two-way toggle. `all` writes the
     default AND clears that field's per-size overrides, because an override
     left behind would keep winning over the value just typed everywhere it
     existed -- which looks exactly like the edit not having worked. */
  function scopeOf(field) {
    return state.copyScope[field] || null;
  }

  function setCopy(field, value) {
    var c = concept(); if (!c) return;
    if (scopeOf(field) === 'all') {
      if (!c.copy['default']) c.copy['default'] = {};
      c.copy['default'][field] = value;
      Object.keys(c.copy).forEach(function (k) {
        if (k === 'default') return;
        if (c.copy[k] && c.copy[k][field] !== undefined) delete c.copy[k][field];
      });
    } else {
      if (!c.copy[state.size]) c.copy[state.size] = {};
      c.copy[state.size][field] = value;
    }
    state.dirty = true;
  }

  /* Which copy blocks this size's layout will actually draw.
     
     Every size gets the same five fields. No layout carries all five: a proof
     point is a badge beside the button and there is no room for one on a
     728x90, and the offer flash belongs to one family. A field typed into,
     saved, and then drawn nowhere is worse than a missing field -- the proof
     point was exactly that on every layout in the tool until this release --
     so the field says so instead. */
  function drawnBlocks() {
    var t = state.templates.filter(function (x) { return x.id === concept().layoutFamily; })[0];
    var b = t && t.blocks && t.blocks[state.size];
    // An older server does not send `blocks`. Say nothing rather than
    // labelling every field as missing.
    return b || null;
  }

  function willDraw(field) {
    var b = drawnBlocks();
    return !b || b.indexOf(field) >= 0;
  }

  /* Sizes in this family whose layout does draw a block, so "not here" can
     name where it is instead of only where it is not. */
  function sizesDrawing(field) {
    var t = state.templates.filter(function (x) { return x.id === concept().layoutFamily; })[0];
    if (!t || !t.blocks) return [];
    return (t.sizes || []).filter(function (sz) {
      return (t.blocks[sz] || []).indexOf(field) >= 0;
    });
  }

  /* ------------------------------------------------------------ controls */
  /* There is no word budget here any more.
     
     The header counted every word on the canvas against a per-size band and
     turned amber either side of it, which made a perfectly legible ad look
     wrong for being four words short of a guideline nobody publishes. The
     question it stood in for -- does the copy fit -- is answered per block by
     the overflow check in the rail, from real glyph measurements. */

  function drawControls() {
    var c = concept();
    if (!c) { $('controls').innerHTML = ''; return; }
    var b = state.doc.campaign.brand;
    var fields = [
      ['headline', 'Headline', 'textarea'],
      ['support', 'Supporting line', 'textarea'],
      ['offer', 'Offer', 'text'],
      ['cta', 'Call to action', 'text'],
      ['trust', 'Proof point', 'text',
       'One line of evidence that this business is safe to call \u2014 years in ' +
       'business, review score, license, guarantee. e.g. "Serving Riverside ' +
       'since 1998" or "4.9 stars, 300+ reviews".']
    ].map(function (f) {
      var key = f[0];
      var v = effective(key);
      var input = f[2] === 'textarea'
        ? '<textarea data-copy="' + key + '">' + esc(v) + '</textarea>'
        : '<input type="text" data-copy="' + key + '" value="' + esc(v) + '">';
      // A field label nobody can act on is a field nobody fills in well —
      // but four lines of example copy between every field is the column you
      // then have to scroll past for ever. Same words, behind a dot.
      var hint = f[3] ? help(f[3], 'left') : '';
      // Say it before the box, not after the ad comes back without it.
      var absent = '';
      if (!willDraw(key)) {
        var elsewhere = sizesDrawing(key);
        absent = '<div class="nodraw">The ' + esc(f[1].toLowerCase()) +
          ' is not in this layout at ' + esc(state.size) + ', so it will not ' +
          'appear on this ad. ' +
          (elsewhere.length
            ? 'It does draw at ' + esc(elsewhere.join(', ')) + '.'
            : 'No size in this layout family draws it \u2014 try another layout.') +
          '</div>';
      }
      return '<div class="field"><label>' + f[1] + hint + '</label>' + absent + input +
        scopeControl(key) + '</div>';
    }).join('');

    $('controls').innerHTML =
      lockedBanner() +
      '<div class="group"><h3>Copy for ' + esc(state.size) +
        help('Each field asks, the first time you change it, whether the edit ' +
             'is for this size or for every size in the set. The answer stays ' +
             'under the field as a toggle, so it can be changed after.') +
        '</h3>' + fields + '</div>' +
      '<div class="group"><h3>Background</h3>' +
        '<div class="bgmodes">' +
          '<button type="button" class="bgmode' + (concept().backgroundImage ? '' : ' on') + '" data-bgmode="none">Solid brand color</button>' +
          '<button type="button" class="bgmode" data-bgmode="landing">From their landing page</button>' +
          '<button type="button" class="bgmode" data-bgmode="gallery">From their image gallery</button>' +
          '<button type="button" class="bgmode" data-bgmode="upload">Upload a picture</button>' +
          '<button type="button" class="bgmode" data-bgmode="stock">Suggested photos</button>' +
          '<button type="button" class="bgmode" data-bgmode="ai">Have AI make one</button>' +
        '</div>' +
        '<div id="bgResults" class="bgresults"></div>' +
        '<div class="field" style="font-size:11.5px;color:var(--ink-2)" id="bgNote">' +
          (concept().backgroundImage
            ? 'A photo background is applied to this concept.'
            : 'This concept uses the flat brand color.') +
        '</div>' +
        backgroundAdjust() +
        '</div>' +
      '<div class="group"><h3>Layout</h3>' +
        '<div class="famgrid" id="famGrid">' + familyCards() + '</div>' +
        '<div class="field" style="font-size:11.5px;color:var(--ink-2)" id="famNote"></div></div>' +
      '<div class="group"><h3>Brand colors' +
        help('The five roles every layout resolves against. Changing one here ' +
             'changes it on every size in the set.') + '</h3>' +
        '<div id="siteBrand"></div><div class="swatches">' +
        ['primary','secondary','accent','light','dark'].map(function (k) {
          return '<div class="swatch"><input type="color" data-color="' + k + '" value="' + esc(b.colors[k]) + '"><span>' + k + '</span></div>';
        }).join('') +
      '</div></div>' +
      '<div class="group"><h3>Type' +
        help('Only families the renderer has installed will render. An unknown ' +
             'name falls back to the default face and is flagged in the checks ' +
             'on the right, rather than failing.') + '</h3>' +
        '<div class="field"><label>Headline face</label><input type="text" data-font="headline" value="' + esc(b.fonts.headline) + '"></div>' +
        '<div class="field"><label>Body face</label><input type="text" data-font="body" value="' + esc(b.fonts.body) + '"></div>' +
      '</div>' +
      // This heading used to read "Text boxes for 300x250" and it was not
      // true: these overrides live on the concept and every size renders
      // from them. Saying which size they belonged to made a person set a
      // type size to suit the leaderboard and shrink the skyscraper with it,
      // with the panel insisting it had only touched one.
      '<div class="group"><h3>Text boxes \u2014 every size' +
        help('Unlike the copy above, these apply to the whole set. "Layout" ' +
             'means use the layout\u2019s own setting. Sizes are a ceiling \u2014 long ' +
             'copy still shrinks to fit. Width is where the line wraps, and is ' +
             'capped at the edge of the ad.') + '</h3>' +
        blockStyleControls() + panelControls() + logoStyleControls() +
        '</div>';

    describeFamily();
    applyLock();

    var LABELS = {
      headline: 'Headline', support: 'Supporting line', offer: 'Offer',
      cta: 'Call to action', trust: 'Proof point',
    };

    Array.prototype.forEach.call($('controls').querySelectorAll('[data-copy]'), function (el) {
      el.addEventListener('input', function () {
        var field = el.dataset.copy;
        // The question is asked once, and asked BEFORE the value is written,
        // so the very first keystroke lands where it was meant to. While the
        // dialog is open the field keeps whatever was typed -- it is only the
        // campaign that waits.
        ensureScope(field, LABELS[field] || field).then(function () {
          setCopy(field, el.value);
          markScope(field);
          schedule();
        });
      });
    });
    Array.prototype.forEach.call($('controls').querySelectorAll('[data-scope]'), function (el) {
      el.addEventListener('click', function () {
        var field = el.parentNode.dataset.scopefor;
        var was = scopeOf(field);
        state.copyScope[field] = el.dataset.scope;
        markScope(field);
        // Changing the scope after the fact has to move the value too, or the
        // toggle says "every size" over an edit that is still on one of them.
        if (was !== state.copyScope[field]) {
          var box = $('controls').querySelector('[data-copy="' + field + '"]');
          if (box) { setCopy(field, box.value); schedule(); }
        }
      });
    });
    Array.prototype.forEach.call($('controls').querySelectorAll('.bsclear'), function (el) {
      el.addEventListener('click', function () {
        setBlockStyle(el.dataset.style, el.dataset.prop, '');
        drawControls();
      });
    });
    Array.prototype.forEach.call($('controls').querySelectorAll('[data-style]:not(.bsclear)'), function (el) {
      var ev = el.tagName === 'SELECT' || el.type === 'color' ? 'change' : 'input';
      el.addEventListener(ev, function () {
        setBlockStyle(el.dataset.style, el.dataset.prop, el.value);
        if (el.type === 'color') markInk(el.dataset.style, el.dataset.prop);
      });
    });
    Array.prototype.forEach.call($('controls').querySelectorAll('[data-ink]'), function (el) {
      el.addEventListener('click', function () {
        setBlockStyle(el.dataset.ink, el.dataset.inkprop, el.dataset.inkvalue);
        markInk(el.dataset.ink, el.dataset.inkprop);
      });
    });
    var logoPicker = $('logoFile');
    if (logoPicker) logoPicker.addEventListener('change', function () {
      replaceLogo(this.files && this.files[0]);
    });
    wireBackgroundAdjust();
    wireAccordion();
    wireNudgePads();
    drawSiteBrand();
    Array.prototype.forEach.call($('controls').querySelectorAll('[data-bgmode]'), function (el) {
      el.addEventListener('click', function () { chooseBackground(el.dataset.bgmode, el); });
    });
    Array.prototype.forEach.call($('controls').querySelectorAll('[data-family]'), function (el) {
      el.addEventListener('click', function () {
        setFamily(el.dataset.family);
      });
    });
    var legacyFamily = $('family');
    if (legacyFamily) legacyFamily.addEventListener('change', function () {
      concept().layoutFamily = this.value;
      state.dirty = true;
      describeFamily();
      drawRail();
      preview();
    });
    Array.prototype.forEach.call($('controls').querySelectorAll('[data-color]'), function (el) {
      el.addEventListener('input', function () {
        state.doc.campaign.brand.colors[el.dataset.color] = el.value.toUpperCase();
        state.dirty = true;
        schedule();
      });
    });
    Array.prototype.forEach.call($('controls').querySelectorAll('[data-font]'), function (el) {
      el.addEventListener('change', function () {
        state.doc.campaign.brand.fonts[el.dataset.font] = el.value;
        state.dirty = true;
        preview();
      });
    });
  }

  /* Repaint one color row in place rather than redrawing the whole column:
     a full redraw on every swatch click loses the scroll position, and the
     type panel is at the bottom of a long column. */
  function markInk(block, prop) {
    var current = (styleOf(block) || {})[prop];
    Array.prototype.forEach.call(
      $('controls').querySelectorAll('[data-ink="' + block + '"][data-inkprop="' + prop + '"]'),
      function (chip) {
        chip.setAttribute('aria-pressed', chip.dataset.inkvalue === current ? 'true' : 'false');
      });
  }

  function markScope(field) {
    var row = $('controls').querySelector('[data-scopefor="' + field + '"]');
    if (!row) return;
    Array.prototype.forEach.call(row.querySelectorAll('[data-scope]'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.scope === scopeOf(field) ? 'true' : 'false');
    });
  }

  /* --------------------------------------------------------- approvals */
  /* The sizes this campaign will actually build: what the layout family draws,
     narrowed to what its platforms buy.
     
     A family carries thirteen canvases including the four Meta social sizes;
     a Google display buy defines eight of them. The rail listed all thirteen,
     so five rows were sizes whose preview 422s and which "Render all sizes"
     never writes. That was survivable as navigation and stopped being
     survivable the moment the rail started counting approvals -- "2 of 13
     approved" is a wrong number, and the warning on save was naming sizes
     that do not exist for this buy.
     
     The union across platforms, not the intersection: a set sold on Google and
     Amazon genuinely delivers 336x280 for one and 414x125 for the other, and
     each is built by the platform that has it. */
  function railSizes() {
    var t = state.templates.filter(function (x) { return x.id === concept().layoutFamily; })[0];
    if (!t) return [];
    var byPlatform = state.platformSizes;
    // An older server sends no platform list. Showing the family's own sizes
    // is what this always did, and is better than showing none.
    if (!byPlatform) return t.sizes;
    var sold = {};
    (state.platforms || ['google']).forEach(function (p) {
      (byPlatform[p] || []).forEach(function (sz) { sold[sz] = true; });
    });
    var out = t.sizes.filter(function (sz) { return sold[sz]; });
    return out.length ? out : t.sizes;
  }

  function isApproved(size) {
    return (state.approvals || []).some(function (a) {
      return a.conceptId === state.conceptId && a.platform === state.platform &&
             a.size === (size || state.size);
    });
  }

  function unapprovedSizes() {
    return railSizes().filter(function (sz) { return !isApproved(sz); });
  }

  /* An approved size is read-only. The banner is the whole explanation --
     a panel of greyed-out boxes with no reason attached is a bug report
     waiting to be filed. */
  function lockedBanner() {
    if (!isApproved()) return '';
    var a = (state.approvals || []).filter(function (x) {
      return x.conceptId === state.conceptId && x.platform === state.platform &&
             x.size === state.size;
    })[0];
    var who = a && a.by ? ' by ' + esc(a.by) : '';
    var when = a && a.at ? ' on ' + new Date(a.at).toLocaleDateString() : '';
    return '<div class="group"><div class="locked">' +
      '<b>' + esc(state.size) + ' is approved</b>' + who + when + '. ' +
      'Nothing on it can be changed while it stays that way, so work on the ' +
      'other sizes cannot quietly move it.' +
      '<br><button type="button" class="btn" id="unlockSize">Unapprove it to edit</button>' +
      '</div></div>';
  }

  function applyLock() {
    var col = $('controls');
    col.classList.toggle('lock', isApproved());
    var btn = $('unlockSize');
    if (btn) btn.addEventListener('click', function () { setApproved(state.size, false); });
  }

  function setApproved(size, approved) {
    var pid = projectIdOf();
    if (!pid) {
      showNextSteps('This build has no project record yet, so sizes cannot be ' +
                    'approved. Render the set once and it will have one.', true);
      return;
    }
    post('/api/project/' + encodeURIComponent(pid) + '/approve-size', {
      conceptId: state.conceptId, platform: state.platform,
      size: size, approved: approved,
    })
      .then(function (d) {
        if (!d || !d.approvals) {
          // A refused write must not be read as "no approvals": that would
          // silently unlock every size somebody had signed off.
          showNextSteps((d && d.error) ||
            'That approval did not save. Nothing has changed.', true);
          return;
        }
        // The server's list, not a local guess: two people can be in here.
        state.approvals = d.approvals;
        drawControls(); drawRail();
      })
      .catch(function () {
        showNextSteps('That approval did not save. Nothing has changed.', true);
      });
  }

  /* ------------------------------------------------------- one question
     A dialog rather than window.confirm, because confirm gives two words and
     these questions each need a sentence: which sizes an edit is for, and
     whether unsaved work survives moving on. Returns a promise of the chosen
     value; Escape and the backdrop both resolve to null, which every caller
     reads as "do nothing". */
  function ask(title, body, choices) {
    return new Promise(function (resolve) {
      var wrap = document.createElement('div');
      wrap.className = 'ask';
      wrap.innerHTML = '<div class="askbox" role="dialog" aria-modal="true">' +
        '<h4>' + esc(title) + '</h4><p>' + esc(body) + '</p><div class="askacts">' +
        choices.map(function (c, i) {
          return '<button type="button" class="btn' + (i === 0 ? ' primary' : '') +
            '" data-pick="' + i + '">' + esc(c[0]) + '</button>';
        }).join('') + '</div></div>';
      function done(value) {
        document.removeEventListener('keydown', onKey);
        wrap.remove();
        resolve(value);
      }
      function onKey(e) { if (e.key === 'Escape') done(null); }
      wrap.addEventListener('click', function (e) { if (e.target === wrap) done(null); });
      Array.prototype.forEach.call(wrap.querySelectorAll('[data-pick]'), function (b) {
        b.addEventListener('click', function () { done(choices[Number(b.dataset.pick)][1]); });
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(wrap);
      var first = wrap.querySelector('[data-pick]');
      if (first) first.focus();
    });
  }

  /* The scope toggle under a copy field. Present from the start so the answer
     is visible and changeable, rather than asked once in a dialog and then
     invisible for the rest of the session. */
  function scopeControl(field) {
    var chosen = scopeOf(field);
    return '<div class="scope" data-scopefor="' + field + '">' +
      '<span>Applies to</span>' +
      '<button type="button" data-scope="size" aria-pressed="' +
        (chosen === 'size' ? 'true' : 'false') + '">' + esc(state.size) + ' only</button>' +
      '<button type="button" data-scope="all" aria-pressed="' +
        (chosen === 'all' ? 'true' : 'false') + '">Every size</button>' +
      '</div>';
  }

  /* The first edit to a field asks. After that the toggle above answers it,
     and the edit that triggered the question is applied to whichever was
     chosen -- so nobody has to retype what they just typed. */
  function ensureScope(field, label) {
    if (scopeOf(field)) return Promise.resolve(scopeOf(field));
    return ask(
      'Apply this to every size?',
      'You are editing the ' + label.toLowerCase() + '. The set has ' +
      (railSizes().length || 'several') + ' sizes in it. Change this one ' +
      'design, or change all of them?',
      [['Every size', 'all'], ['Just ' + state.size, 'size']],
    ).then(function (choice) {
      // Escape means "not now". Defaulting to either answer here would put
      // the edit somewhere nobody chose.
      state.copyScope[field] = choice || 'size';
      return state.copyScope[field];
    });
  }

  /* --------------------------------------------------- text box styling
     Size, weight, alignment, wrap width and the button fill, per block, for
     the size being looked at. The renderer clamps everything server-side
     (block-style.ts) -- a width past the canvas edge is the change that looks
     right in a panel and ships a clipped ad -- so this panel is free to be a
     plain set of inputs.

     Blank means "leave the template alone" rather than "zero", which is why
     clearing a field deletes the override instead of writing 0. */
  var STYLE_BLOCKS = [
    ['headline', 'Headline'], ['support', 'Supporting line'],
    ['offer', 'Offer'], ['cta', 'Button'], ['trust', 'Proof point']
  ];

  /* ------------------------------------------------- moving and sizing
     
     Two controls replace six number fields, because "nudge it left" and "make
     it bigger" are what people actually ask for and neither was expressible.
     A pad of arrows moves a thing by a step; a slider resizes it
     proportionally. The numbers are still there, behind Advanced, for the
     case that genuinely needs a coordinate.
     
     Everything is clamped server-side in block-style.ts — a pad invites being
     held down, and the one thing it must not do is walk the logo off the
     canvas. */
  var NUDGE = 4;               // px per press: fine enough to aim, coarse
                               // enough that ten presses is a real move.

  /* Which style panel is open. One at a time, remembered across the redraws
     that every edit triggers -- a panel that closed itself on each keystroke
     would be unusable. Not persisted beyond the session: which block you were
     working on last Tuesday is not a preference. */
  var openBlock = null;
  function openPanel(key) { return openBlock === key; }

  function wireAccordion() {
    Array.prototype.forEach.call($('controls').querySelectorAll('[data-acc]'), function (el) {
      el.addEventListener('toggle', function () {
        if (!el.open) {
          if (openBlock === el.dataset.acc) openBlock = null;
          return;
        }
        openBlock = el.dataset.acc;
        // Close the others. `open` is set directly rather than by clicking,
        // so this does not recurse into another toggle that reopens this one.
        Array.prototype.forEach.call($('controls').querySelectorAll('[data-acc]'),
          function (other) { if (other !== el) other.open = false; });
      });
    });
  }

  /* The arrow pads. A pad edits whichever thing it is bound to, and each of
     the three keeps its position somewhere different: the background in a
     fraction of its own overflow, the logo and the button in canvas pixels.
     One handler, three readers, so a fourth pad is a table entry. */
  var PADS = {
    logo: {
      get: function () { var lg = styleOf('logo'); return { x: lg.x, y: lg.y }; },
      step: function (dx, dy) {
        var lg = styleOf('logo');
        var base = layoutLogoBox() || { x: 0, y: 0 };
        setBlockStyle('logo', 'x', (lg.x === undefined ? base.x : lg.x) + dx * NUDGE);
        setBlockStyle('logo', 'y', (lg.y === undefined ? base.y : lg.y) + dy * NUDGE);
      },
      reset: function () {
        setBlockStyle('logo', 'x', '');
        setBlockStyle('logo', 'y', '');
      },
    },
    cta: {
      get: function () { var st = styleOf('cta'); return { x: st.x, y: st.y }; },
      step: function (dx, dy) {
        var st = styleOf('cta');
        var base = layoutBox('cta') || { x: 0, y: 0 };
        setBlockStyle('cta', 'x', (st.x === undefined ? base.x : st.x) + dx * NUDGE);
        setBlockStyle('cta', 'y', (st.y === undefined ? base.y : st.y) + dy * NUDGE);
      },
      reset: function () {
        setBlockStyle('cta', 'x', '');
        setBlockStyle('cta', 'y', '');
      },
    },
    background: {
      get: function () { return concept().backgroundOffset || { x: 0, y: 0 }; },
      // The offset names the part of the PICTURE that shows, so an arrow that
      // moves the picture up is asking to see more of its bottom -- the sign
      // is inverted here on purpose, and the arrows are labelled by what they
      // do to the picture rather than by the number underneath.
      step: function (dx, dy) {
        var c = concept();
        var off = c.backgroundOffset || { x: 0, y: 0 };
        c.backgroundOffset = {
          x: Math.max(-1, Math.min(1, (off.x || 0) + dx * 0.12)),
          y: Math.max(-1, Math.min(1, (off.y || 0) + dy * 0.12)),
        };
        state.dirty = true;
        schedule();
      },
      reset: function () {
        var c = concept();
        delete c.backgroundOffset;
        delete c.backgroundPosition;
        state.dirty = true;
        schedule();
      },
    },
  };

  function wireNudgePads() {
    Array.prototype.forEach.call($('controls').querySelectorAll('[data-pad]'), function (pad) {
      var spec = PADS[pad.dataset.pad];
      if (!spec) return;
      Array.prototype.forEach.call(pad.querySelectorAll('[data-nudge]'), function (btn) {
        btn.addEventListener('click', function () {
          var d = btn.dataset.nudge;
          if (d === 'reset') return spec.reset();
          // An up arrow moves the thing up, which is a smaller y.
          spec.step(d === 'left' ? -1 : d === 'right' ? 1 : 0,
                    d === 'up' ? -1 : d === 'down' ? 1 : 0);
        });
      });
    });
  }

  /* The template's own box for a block at this size, so a nudge starts from
     where the layout put it rather than from zero. */
  function layoutBox(role) {
    var t = state.templates.filter(function (x) { return x.id === concept().layoutFamily; })[0];
    var boxes = t && t.boxes && t.boxes[state.size];
    return (boxes && boxes[role]) || null;
  }

  function nudgePad(id, title) {
    return '<div class="pad" data-pad="' + id + '" title="' + esc(title) + '">' +
      '<span></span>' +
      '<button type="button" data-nudge="up" aria-label="Move up">\u2191</button>' +
      '<span></span>' +
      '<button type="button" data-nudge="left" aria-label="Move left">\u2190</button>' +
      '<button type="button" class="mid" data-nudge="reset" aria-label="Put it back">\u25CB</button>' +
      '<button type="button" data-nudge="right" aria-label="Move right">\u2192</button>' +
      '<span></span>' +
      '<button type="button" data-nudge="down" aria-label="Move down">\u2193</button>' +
      '<span></span></div>';
  }

  /* A dot on a collapsed header, so a panel that is carrying an override says
     so without being opened. */
  function dotIf(on) { return on ? '<span class="bsdot" title="Changed"></span>' : ''; }

  function help(text, side) {
    return '<span class="hb' + (side === 'left' ? ' left' : '') + '" tabindex="0"' +
      ' role="note" aria-label="' + esc(text) + '">?' +
      '<span class="hbtext">' + esc(text) + '</span></span>';
  }

  /* The logo is one of the two things a person may move. "Nudge the logo" is
     the most common note on a proof, and where it belongs depends on the
     picture behind it, which is why this sits next to the background chooser
     rather than in a layout menu. */
  function logoStyleControls() {
    var lg = (concept().styleOverrides || {}).logo || {};
    var touched = Object.keys(lg).length > 0;
    var scale = typeof lg.scale === 'number' ? lg.scale : 1;
    var box = layoutLogoBox();
    return '<details class="blockstyle" data-acc="logo"' + (openPanel('logo') ? ' open' : '') + '>' +
      '<summary>Logo' + dotIf(touched) + '</summary>' +
      '<label style="font-size:11px;color:var(--ink-2);display:block;margin-bottom:4px">' +
        'Move it' + help('Each press shifts the logo ' + NUDGE + ' pixels. The circle ' +
          'puts it back where the layout had it. It cannot be pushed off the ad.') +
      '</label>' +
      nudgePad('logo', 'Move the logo') +
      '<div class="slider">' +
        '<label>Size <b id="logoScaleLabel">' + Math.round(scale * 100) + '%</b></label>' +
        '<input type="range" id="logoScale" min="30" max="300" step="5" value="' +
          Math.round(scale * 100) + '">' +
      '</div>' +
      '<div class="bsrow">' +
        '<label>Anchor across<select data-style="logo" data-prop="align">' +
          opt('', 'Layout', lg.align) + opt('left', 'Left', lg.align) +
          opt('center', 'Center', lg.align) + opt('right', 'Right', lg.align) +
        '</select></label>' +
        '<label>Anchor down<select data-style="logo" data-prop="valign">' +
          opt('', 'Layout', lg.valign) + opt('top', 'Top', lg.valign) +
          opt('middle', 'Middle', lg.valign) + opt('bottom', 'Bottom', lg.valign) +
        '</select></label>' +
      '</div>' +
      '<details class="advanced"><summary>Advanced \u2014 type the numbers</summary>' +
        '<div class="bsrow">' +
          '<label>Left<input type="number" step="1" placeholder="' + (box ? box.x : 'auto') +
            '" data-style="logo" data-prop="x" value="' + (lg.x === undefined ? '' : lg.x) + '"></label>' +
          '<label>Top<input type="number" step="1" placeholder="' + (box ? box.y : 'auto') +
            '" data-style="logo" data-prop="y" value="' + (lg.y === undefined ? '' : lg.y) + '"></label>' +
        '</div>' +
        '<div class="bsrow">' +
          '<label>Box width<input type="number" min="8" step="1" placeholder="' + (box ? box.w : 'auto') +
            '" data-style="logo" data-prop="w" value="' + (lg.w === undefined ? '' : lg.w) + '"></label>' +
          '<label>Box height<input type="number" min="8" step="1" placeholder="' + (box ? box.h : 'auto') +
            '" data-style="logo" data-prop="h" value="' + (lg.h === undefined ? '' : lg.h) + '"></label>' +
        '</div>' +
        '<div style="font-size:11px;color:var(--ink-2);line-height:1.35">' +
          'A box, not the drawn size: the mark is fitted inside it keeping its ' +
          'proportions, so a wide logo gets bigger from a wider box and a tall ' +
          'one does not. A number typed here wins over the slider.' +
        '</div>' +
      '</details>' +
      '<div class="bsrow" style="grid-template-columns:1fr">' +
        '<label>Replace the logo' +
          help('A new logo applies to every size, and is remembered for this ' +
               'client\u2019s future builds.') +
          '<input type="file" id="logoFile"' +
          ' accept="image/png,image/svg+xml,image/jpeg,image/webp"></label>' +
      '</div>' +
      '<div id="logoNote" style="font-size:11.5px;color:var(--ink-2);margin:2px 0 6px"></div>' +
      '<div id="logoFix"></div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
        '<button type="button" class="bsclear" id="logoLegibility">' +
          'Logo hard to see?' +
        '</button>' +
        '<button type="button" class="bsclear" data-style="logo" data-prop="*">' +
          'Put the logo back' +
        '</button>' +
      '</div></details>';
  }

  /* The template's own logo box for this size, so Advanced shows what it is
     overriding rather than an empty field labelled "auto". */
  function layoutLogoBox() { return layoutBox('logo'); }

  function styleOf(block) {
    var all = concept().styleOverrides || {};
    return all[block] || {};
  }

  function blockStyleControls() {
    return STYLE_BLOCKS.map(function (b) {
      var key = b[0], label = b[1], st = styleOf(key);
      var isButton = key === 'cta';
      var touched = Object.keys(st).length > 0;
      // A block this size's layout does not draw gets a header saying so
      // rather than eight controls that change nothing.
      if (!willDraw(key)) {
        return '<details class="blockstyle" data-acc="' + key + '">' +
          '<summary style="color:var(--ink-2)">' + esc(label) + '</summary>' +
          '<div style="font-size:11.5px;color:var(--warn);line-height:1.4">' +
          'Not drawn at ' + esc(state.size) + ' in this layout, so nothing here ' +
          'would change the ad.</div></details>';
      }
      return '<details class="blockstyle" data-acc="' + key + '"' +
          (openPanel(key) ? ' open' : '') + '>' +
        '<summary>' + esc(label) + dotIf(touched) + '</summary>' +
        (isButton
          ? '<label style="font-size:11px;color:var(--ink-2);display:block;margin-bottom:4px">' +
              'Move it' + help('Each press shifts the button ' + NUDGE + ' pixels. The ' +
                'circle puts it back where the layout had it.') +
            '</label>' + nudgePad('cta', 'Move the button')
          : '') +
        '<div class="bsrow">' +
          '<label>Size' +
            '<input type="number" min="8" max="96" step="1" placeholder="auto"' +
            ' data-style="' + key + '" data-prop="size"' +
            ' value="' + (st.size || '') + '"></label>' +
          '<label>Width' +
            '<input type="number" min="20" max="2000" step="1" placeholder="auto"' +
            ' data-style="' + key + '" data-prop="w"' +
            ' value="' + (st.w || '') + '"></label>' +
        '</div>' +
        '<div class="bsrow" style="grid-template-columns:1fr">' +
          '<label>Typeface<select data-style="' + key + '" data-prop="font">' +
            opt('', 'Brand face for this block', st.font) +
            (state.fonts || []).map(function (f) {
              return opt(f, f, st.font);
            }).join('') +
          '</select></label>' +
        '</div>' +
        '<div class="bsrow">' +
          '<label>Weight<select data-style="' + key + '" data-prop="weight">' +
            opt('', 'Layout', st.weight) + opt('regular', 'Regular', st.weight) +
            opt('medium', 'Medium', st.weight) + opt('bold', 'Bold', st.weight) +
          '</select></label>' +
          // Align means two things and used to mean the wrong one on the
          // button: it set the label's alignment inside a button the template
          // already centers, so every setting looked identical. On the button
          // it now moves the button.
          '<label>' + (isButton ? 'Place' : 'Align') +
            (isButton ? help('Where the button sits on the ad, within the safe ' +
                             'margin. The words inside it stay centered.') : '') +
            '<select data-style="' + key + '" data-prop="align">' +
            opt('', 'Layout', st.align) + opt('left', 'Left', st.align) +
            opt('center', 'Center', st.align) + opt('right', 'Right', st.align) +
          '</select></label>' +
        '</div>' +
        (isButton ? '' : colorControl(key, 'color', 'Text color', st.color)) +
        (isButton
          ? colorControl('cta', 'bg', 'Button color', st.bg) +
            colorControl('cta', 'color', 'Button text color', st.color) +
            '<details class="advanced"><summary>Advanced \u2014 type the numbers</summary>' +
              '<div class="bsrow">' +
                '<label>Left<input type="number" step="1" placeholder="auto"' +
                  ' data-style="cta" data-prop="x" value="' + (st.x === undefined ? '' : st.x) + '"></label>' +
                '<label>Top<input type="number" step="1" placeholder="auto"' +
                  ' data-style="cta" data-prop="y" value="' + (st.y === undefined ? '' : st.y) + '"></label>' +
              '</div></details>'
          : '') +
        (concept().backgroundImage && !isButton && key !== 'offer'
          ? '<div style="font-size:11px;color:var(--ink-2);line-height:1.35">' +
            'Over a photo background the renderer picks the ink that survives ' +
            'the overlay, so a color set here is ignored on this concept.' +
            '</div>'
          : '') +
        '<button type="button" class="bsclear" style="margin-top:6px"' +
          ' data-style="' + key + '" data-prop="*">Put this block back</button>' +
        '</details>';
    }).join('');
  }

  /* A color control is a row of the client's five, then a picker.
     
     The brand names are first and are what a person almost always means:
     "the accent" follows the palette when a swatch is corrected upstream,
     where #F2B705 is a snapshot of it that silently goes stale. The picker
     stays for the color that is genuinely one-off, and "Layout" is how you
     put it back. */
  var BRAND_ROLES = ['primary', 'secondary', 'accent', 'light', 'dark'];

  function colorControl(block, prop, label, current) {
    var colors = (state.doc.campaign.brand.colors) || {};
    var chips = BRAND_ROLES.map(function (role) {
      return '<button type="button" class="inkchip" title="Brand ' + role +
        ' \u2014 ' + esc(colors[role] || '') + '"' +
        ' style="background:' + esc(colors[role] || '#888') + '"' +
        ' data-ink="' + block + '" data-inkprop="' + prop + '" data-inkvalue="' + role + '"' +
        ' aria-pressed="' + (current === role ? 'true' : 'false') + '"></button>';
    }).join('');
    // A hex the picker produced, or the resolved brand color so the well is
    // never showing a color the block is not using.
    var swatch = (current && current.charAt(0) === '#')
      ? current
      : (colors[current] || colors[block === 'cta' && prop === 'bg' ? 'accent' : 'dark'] || '#111111');
    return '<div class="bsrow" style="flex-direction:column;align-items:stretch;gap:4px">' +
      '<label style="flex:none">' + esc(label) + '</label>' +
      '<div class="inkrow"><span class="inklabel">Brand</span>' + chips +
        '<input type="color" style="width:34px;height:24px;padding:1px;flex:none"' +
        ' data-style="' + block + '" data-prop="' + prop + '" value="' + esc(swatch) + '">' +
        '<button type="button" class="bsclear" style="padding:3px 8px;font-size:10.5px"' +
        ' data-style="' + block + '" data-prop="' + prop + '">Layout</button>' +
      '</div></div>';
  }

  function opt(value, label, current) {
    return '<option value="' + value + '"' +
      ((current || '') === value ? ' selected' : '') + '>' + label + '</option>';
  }

  function currentAccent() {
    var c = state.doc.campaign.brand.colors || {};
    return c.accent || '#2563eb';
  }

  function setBlockStyle(block, prop, raw) {
    var c = concept();
    if (!c.styleOverrides) c.styleOverrides = {};
    if (!c.styleOverrides[block]) c.styleOverrides[block] = {};
    var st = c.styleOverrides[block];

    var value = String(raw == null ? '' : raw).trim();
    if (prop === '*') {
      // "Put it back" -- drop every override on this block at once.
      delete c.styleOverrides[block];
      if (!Object.keys(c.styleOverrides).length) delete c.styleOverrides;
      state.dirty = true;
      schedule();
      return;
    }
    if (value === '') {
      // Blank is "use the layout's own setting", not zero.
      delete st[prop];
    } else if (prop === 'scale' || prop === 'opacity') {
      // Fractions, not pixels. Rounding these to integers is how a 55%
      // overlay became 1 and a 0.9 logo scale became a whole-number 1 — the
      // slider moved and the ad did not.
      var f = Number(value);
      if (!isFinite(f)) { delete st[prop]; } else { st[prop] = f; }
    } else if (prop === 'size' || prop === 'w' || prop === 'h' ||
               prop === 'x' || prop === 'y') {
      var n = Number(value);
      // A position of 0 is meaningful (flush to the edge); a size of 0 is not.
      var floor = (prop === 'x' || prop === 'y') ? 0 : 1;
      if (!isFinite(n) || n < floor) { delete st[prop]; } else { st[prop] = n; }
    } else {
      st[prop] = value;
    }

    if (!Object.keys(st).length) delete c.styleOverrides[block];
    if (!Object.keys(c.styleOverrides).length) delete c.styleOverrides;

    state.dirty = true;
    schedule();          // same debounce the copy fields use
  }

  /* ---------------------------------------------- adjusting a background
     
     Two things you could not do at all until now, and both are the first
     thing anybody asks for once a photo is behind an ad.
     
     **Where the photo sits.** A background is drawn to cover the canvas and
     the overflow is cut off. On a 300x250 that throws away most of a
     landscape shot, and which part it throws away is the difference between
     a house and a lawn -- so the crop anchor is a nine-way grid, showing the
     same alignment the renderer uses rather than a slider that means nothing
     until you move it.
     
     **The overlay.** There has always been one, painted so text stays
     readable, and it was a fixed dark scrim nobody could see or set. It is a
     color and a strength now. Leaving the color alone keeps the graded dark
     scrim exactly as it was, so no existing ad changes; choosing one paints a
     flat wash of that color, because a graded version of a chosen color is
     that color nowhere on the canvas. */
  var BG_POS = [
    ['xMinYMin', 'Top left'], ['xMidYMin', 'Top'], ['xMaxYMin', 'Top right'],
    ['xMinYMid', 'Left'], ['xMidYMid', 'Center'], ['xMaxYMid', 'Right'],
    ['xMinYMax', 'Bottom left'], ['xMidYMax', 'Bottom'], ['xMaxYMax', 'Bottom right'],
  ];
  var DEFAULT_OVERLAY = 0.42;

  function backgroundAdjust() {
    var c = concept();
    if (!c.backgroundImage) return '';
    var strength = typeof c.backgroundOverlay === 'number' ? c.backgroundOverlay : DEFAULT_OVERLAY;
    var wash = c.backgroundOverlayColor || '';
    var zoom = typeof c.backgroundZoom === 'number' ? c.backgroundZoom : 1;
    var off = c.backgroundOffset || legacyOffset(c.backgroundPosition);
    return '<details class="blockstyle" data-acc="bg" style="margin-top:10px"' +
        (openPanel('bg') ? ' open' : '') + '>' +
      '<summary>Where the picture sits' +
        dotIf(!!c.backgroundOffset || !!c.backgroundPosition || zoom !== 1) + '</summary>' +
      '<label style="font-size:11px;color:var(--ink-2);display:block;margin-bottom:4px">' +
        'Move the picture' +
        help('The picture always fills the ad; these move it inside the frame, ' +
             'so a different part of it survives the crop. The circle re-centers it.') +
      '</label>' +
      nudgePad('background', 'Move the picture') +
      '<div class="slider">' +
        '<label>Zoom <b id="bgZoomLabel">' + Math.round(zoom * 100) + '%</b></label>' +
        '<input type="range" id="bgZoom" min="100" max="300" step="5" value="' +
          Math.round(zoom * 100) + '">' +
      '</div>' +
      '<details class="advanced"><summary>Advanced \u2014 type the numbers</summary>' +
        '<div class="bsrow">' +
          '<label>Across (-1 left \u2026 1 right)' +
            '<input type="number" min="-1" max="1" step="0.05" id="bgOffX"' +
            ' value="' + (Math.round((off.x || 0) * 100) / 100) + '"></label>' +
          '<label>Down (-1 top \u2026 1 bottom)' +
            '<input type="number" min="-1" max="1" step="0.05" id="bgOffY"' +
            ' value="' + (Math.round((off.y || 0) * 100) / 100) + '"></label>' +
        '</div>' +
        '<div style="font-size:11px;color:var(--ink-2);line-height:1.35">' +
          'A fraction of the picture\u2019s own overflow, not pixels \u2014 so one ' +
          'setting shows the same part of the photograph on every size.' +
        '</div>' +
      '</details>' +
      '<div class="bsname" style="margin-top:12px">Overlay' +
        help('Painted over the picture so the words stay readable. Leave the ' +
             'color on Auto for the built-in dark scrim, which is heavier where ' +
             'the copy sits; pick one and it becomes a flat wash of that color.') +
      '</div>' +
      '<div class="inkrow"><span class="inklabel">Color</span>' +
        BRAND_ROLES.map(function (role) {
          var hex = (state.doc.campaign.brand.colors || {})[role] || '#888888';
          return '<button type="button" class="inkchip" title="Brand ' + role + '"' +
            ' style="background:' + esc(hex) + '" data-overlay="' + esc(hex) + '"' +
            ' aria-pressed="' + (wash.toUpperCase() === hex.toUpperCase() ? 'true' : 'false') +
            '"></button>';
        }).join('') +
        '<input type="color" id="bgWash" style="width:34px;height:24px;padding:1px;flex:none"' +
          ' value="' + esc(wash || '#0B1220') + '">' +
        '<button type="button" class="bsclear" id="bgWashClear"' +
          ' style="padding:3px 8px;font-size:10.5px">Auto</button>' +
      '</div>' +
      '<div class="slider">' +
        '<label>Transparency <b id="bgOpacityLabel">' +
          Math.round((1 - strength) * 100) + '% see-through</b></label>' +
        '<input type="range" id="bgOpacity" min="0" max="100" step="5"' +
          ' value="' + Math.round(strength * 100) + '">' +
      '</div>' +
      '<div style="font-size:11px;color:var(--ink-2);line-height:1.35">' +
        (wash ? 'A flat wash of the color above.'
              : 'No color chosen, so this is the built-in dark scrim.') +
      '</div></details>';
  }

  /* The nine old alignments, as the offsets they always meant, so a concept
     saved before the arrows existed shows the right numbers in Advanced. */
  function legacyOffset(pos) {
    var map = {
      xMinYMin: [-1,-1], xMidYMin: [0,-1], xMaxYMin: [1,-1],
      xMinYMid: [-1,0],  xMidYMid: [0,0],  xMaxYMid: [1,0],
      xMinYMax: [-1,1],  xMidYMax: [0,1],  xMaxYMax: [1,1]
    }[pos || ''];
    return map ? { x: map[0], y: map[1] } : { x: 0, y: 0 };
  }

  /* The card the copy sits on.
     
     "Full background with copy panel" puts the headline on a filled panel over
     the photograph, and that fill is the single thing deciding whether the
     copy can be read. It was a template constant -- brand primary at 88% --
     so a client whose primary is a mid-grey got copy nobody could read and
     there was no control anywhere that could change it. */
  function panelControls() {
    if (!willDraw('panel')) return '';
    var ps = (concept().styleOverrides || {}).panel || {};
    var op = typeof ps.opacity === 'number' ? ps.opacity : null;
    return '<details class="blockstyle" data-acc="panel"' +
        (openPanel('panel') ? ' open' : '') + '>' +
      '<summary>Panel behind the copy' + dotIf(Object.keys(ps).length > 0) + '</summary>' +
      '<div style="font-size:11px;color:var(--ink-2);line-height:1.35;margin-bottom:7px">' +
        'This layout puts the words on a card over the picture. Its color is ' +
        'what decides whether they can be read.' +
      '</div>' +
      colorControl('panel', 'fill', 'Card color', ps.fill) +
      '<div class="slider">' +
        '<label>Solidity <b id="panelOpacityLabel">' +
          (op === null ? 'layout\u2019s own' : Math.round(op * 100) + '%') + '</b></label>' +
        '<input type="range" id="panelOpacity" min="0" max="100" step="5"' +
          ' value="' + Math.round((op === null ? 0.88 : op) * 100) + '">' +
      '</div>' +
      '<div style="font-size:11px;color:var(--ink-2);line-height:1.35;margin-bottom:6px">' +
        'The copy on this card has a color of its own. Changing the card to ' +
        'something near it makes the words vanish \u2014 the checks on the right ' +
        'will say so, and Text color on each block above is where to fix it.' +
      '</div>' +
      '<button type="button" class="bsclear" data-style="panel" data-prop="*">' +
        'Put the card back</button>' +
      '</details>';
  }

  function wireBackgroundAdjust() {
    var slider = $('bgOpacity');
    if (slider) slider.addEventListener('input', function () {
      var pct = Number(this.value);
      concept().backgroundOverlay = pct / 100;
      state.dirty = true;
      var lbl = $('bgOpacityLabel');
      if (lbl) lbl.textContent = (100 - pct) + '% see-through';
      schedule();
    });
    var zoom = $('bgZoom');
    if (zoom) zoom.addEventListener('input', function () {
      var pct = Number(this.value);
      concept().backgroundZoom = pct / 100;
      state.dirty = true;
      var lbl = $('bgZoomLabel');
      if (lbl) lbl.textContent = pct + '%';
