<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Smart 1 Sites Admin{% endblock %}</title>
  <link rel="stylesheet" href="{{url_for('static',filename='styles.css')}}">
</head>
<body>
<header>
  <div>
    <a class="brand" href="{{url_for('dashboard')}}">Smart 1 Sites Admin</a>
    <span class="mode">{{'DEMO' if settings.mock_mode else 'LIVE'}}</span>
  </div>
  {% if session.authenticated %}
  <nav>
    <form class="navsearch" method="get" action="{{url_for('dashboard')}}">
      <input name="q" value="{{request.args.get('q','')}}" placeholder="Search a site…" aria-label="Search sites">
    </form>
    <a href="{{url_for('dashboard')}}">Accounts</a>
    <a href="{{url_for('inventory')}}">Inventory</a>
    <a href="{{url_for('packages')}}">Packages</a>
    <a href="{{url_for('add_site')}}">Add Site</a>
    <form method="post" action="{{url_for('logout')}}">
      <input type="hidden" name="csrf_token" value="{{session.csrf}}">
      <button class="linkbtn">Log out</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
  {% with msgs=get_flashed_messages(with_categories=true) %}
    {% for cat,msg in msgs %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
