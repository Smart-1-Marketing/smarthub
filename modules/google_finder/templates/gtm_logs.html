<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GTM Audit Logs - Command Center</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="topline">
        <div>
          <h1>📜 GTM Change & Deployment Audit Logs</h1>
          <p>Full date-stamped audit history of all tags, triggers, and deployments executed through the platform.</p>
        </div>
        <div class="auth">
          <a class="btn" href="/" style="background:#1a2e58!important;">← Back to Main Dashboard</a>
        </div>
      </div>

      <div class="saved-reports-section" style="margin-top: 20px; padding: 20px; background: #f8fafc; border: 1px solid #dfe6f0; border-radius: 12px;">
        <div style="display:flex; gap:10px;">
          <input id="search-gtm-logs-q" placeholder="Search logs by tag name, container ID, email, or action type..." style="flex:1; padding:10px 12px; border:1px solid #ccd6e5; border-radius:8px; font-size:14px;">
          <button id="btn-search-gtm-logs" class="btn" style="padding:10px 18px; font-size:14px; background:#24519c!important;">Search Audit Logs</button>
        </div>
        <div id="gtm-logs-list" style="margin-top:16px;"></div>
      </div>
    </section>
  </main>

  <script>
    function esc(v='') {
      return String(v).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }

    async function fetchGtmLogs(query='') {
      const listEl = document.getElementById('gtm-logs-list');
      listEl.innerHTML = '<span style="font-size:13px; color:#1a2e58;">Loading audit logs...</span>';

      const resp = await fetch(`/api/gtm/logs/search?q=${encodeURIComponent(query)}`);
      const data = await resp.json();
      
      if (!data.logs || !data.logs.length) {
        listEl.innerHTML = '<div style="padding:16px; background:#fff; border:1px solid #d8e0eb; border-radius:8px; font-size:13px; color:#69758a;">No recorded GTM change logs found.</div>';
        return;
      }

      listEl.innerHTML = data.logs.map(log => {
        const dateStr = new Date(log.created_at * 1000).toLocaleString();
        return `
          <div style="padding:12px 14px; background:#fff; border:1px solid #d8e0eb; border-radius:8px; margin-bottom:10px; font-size:13px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <span style="background:#eaf2ff; color:#24519c; font-weight:bold; padding:3px 8px; border-radius:4px; font-size:12px;">${esc(log.action_type)}</span>
                <strong style="margin-left:8px; color:#1a2e58; font-size:14px;">${esc(log.tag_name)}</strong>
              </div>
              <span style="color:#8a95a7; font-size:12px;">${esc(dateStr)}</span>
            </div>
            <div style="margin-top:6px; color:#58677e;">
              <b>Container ID:</b> <code>${esc(log.container_id)}</code> | 
              <b>Account ID:</b> <code>${esc(log.account_id)}</code> | 
              <b>Executed By:</b> ${esc(log.google_login)}
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('btn-search-gtm-logs').addEventListener('click', () => {
      fetchGtmLogs(document.getElementById('search-gtm-logs-q').value);
    });

    fetchGtmLogs();
  </script>
</body>
</html>
