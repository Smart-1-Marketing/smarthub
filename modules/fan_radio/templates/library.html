<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fan Radio library — Smart 1 Hub</title>
<style>
/* Cards, tables, buttons, form controls, headings and pills come from
   hub/static/hub-detail.css via `s1d-page` on the wrapper below, which
   wsgi.py's HubBar injects into this module. Rules for those are not
   restated here; what is left is what is genuinely this screen. */
  :root{--navy:#1a2e58;--blue:#2563eb;--line:#e2e8f0;--soft:#f8fafc;--muted:#64748b;
        --ok:#16a34a;--warn:#b45309}
  *{box-sizing:border-box}
  body{margin:0;background:#f4f6fa;color:#1e293b;font:14px 'Segoe UI',system-ui,sans-serif}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 22px 70px}
  .back{color:var(--blue);text-decoration:none;font-size:13px}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  input[type=search],select{padding:9px 11px;border:1px solid var(--line);
    border-radius:8px;font:13.5px inherit;background:#fff}
  a.lnk{color:var(--blue);text-decoration:none} a.lnk:hover{text-decoration:underline}
  .tag{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;
       font-weight:700;margin-right:4px;background:var(--soft);color:var(--muted)}
  .tag.ok{background:#eaf7ee;color:var(--ok)}
  .tag.warn{background:#fdf4e3;color:var(--warn)}
  .empty{text-align:center;color:var(--muted);padding:30px}
  footer{color:var(--muted);font-size:11.5px;text-align:center;padding:22px}
</style>
</head>
<body>
<div class="wrap s1d-page">
  <a class="back" href="/tools/fan-radio/">← Fan Radio</a>
  <h1>Fan Radio library</h1>
  <p class="sub">Every set of spots, who approved what, and what they asked to change.</p>
  <div class="card">
    <div class="row">
      <input id="q" type="search" placeholder="Search company or client…">
      <select id="scope">
        <option value="">Everything</option>
        <option value="client">Client work</option>
        <option value="spec">Spec spots</option>
      </select>
    </div>
    <div id="out"><p class="empty">Loading…</p></div>
  </div>
  <footer>{{ version }}</footer>
</div>
<script>
(function(){
  var BASE = "/tools/fan-radio";
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function load(){
    var q = document.getElementById("q").value.trim();
    var scope = document.getElementById("scope").value;
    fetch(BASE + "/api/projects?q=" + encodeURIComponent(q) + "&scope=" + scope)
      .then(function(r){ return r.json(); })
      .then(function(j){
        var rows = j.projects || [];
        if(!rows.length){
          document.getElementById("out").innerHTML =
            '<p class="empty">Nothing here yet.</p>'; return; }
        document.getElementById("out").innerHTML =
          '<table><thead><tr><th>Business</th><th>Client</th><th>Spots</th>'
          + '<th>Client says</th><th>Link</th><th>Updated</th><th>By</th></tr></thead><tbody>'
          + rows.map(function(r){
            return '<tr><td><a class="lnk" href="' + BASE + '/#' + esc(r.id) + '">'
              + esc(r.company || "(no name)") + '</a></td>'
              + '<td>' + (r.scope === "spec" ? '<span class="tag">spec</span>'
                                             : esc(r.client)) + '</td>'
              + '<td>' + esc(r.spots) + '</td>'
              + '<td>' + (r.approved ? '<span class="tag ok">' + esc(r.approved)
                                        + ' approved</span>' : '')
                       + (r.changes ? '<span class="tag warn">' + esc(r.changes)
                                        + ' changes</span>' : '')
                       + (!r.approved && !r.changes ? '—' : '') + '</td>'
              + '<td>' + (r.shared ? '<span class="tag ok">live</span>' : '—') + '</td>'
              + '<td>' + esc((r.updated||"").slice(0,16).replace("T"," ")) + '</td>'
              + '<td>' + esc(r.created_by) + '</td></tr>'; }).join("")
          + '</tbody></table>';
      });
  }
  document.getElementById("q").addEventListener("input", function(){
    clearTimeout(window._t); window._t = setTimeout(load, 300); });
  document.getElementById("scope").onchange = load;
  load();
})();
</script>
</body>
</html>
