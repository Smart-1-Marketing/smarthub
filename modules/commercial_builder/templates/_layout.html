<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Commercial Builder{% endblock %} · Smart 1 Creative Hub</title>
<link rel="stylesheet" href="{{ url_for('commercial_builder.static', filename='css/commercial-builder.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body data-module="commercial_builder">
<header class="cb-topbar">
  <div class="cb-topbar-inner">
    <a class="cb-brand" href="{{ url_for('commercial_builder.cb_pages.dashboard') }}">
      <span class="cb-brand-mark">S1</span>
      <span class="cb-brand-text">Creative Hub <span class="cb-brand-sub">Commercial Builder</span></span>
    </a>
    <nav class="cb-topnav">
      <a href="{{ url_for('commercial_builder.cb_pages.dashboard') }}">Dashboard</a>
      <a href="{{ url_for('commercial_builder.cb_pages.new_commercial') }}" class="cb-btn cb-btn-primary cb-btn-sm">+ New Commercial</a>
    </nav>
  </div>
</header>
<main class="cb-main">
  {% block content %}{% endblock %}
</main>
<footer class="cb-footer">Smart 1 Creative Hub — Commercial Builder V1</footer>
<script src="{{ url_for('commercial_builder.static', filename='js/common.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
