   ${hasTable&&tableOn?`<button class="ic" title="${isTableEdited(sec)?'Edit this table — currently hand-edited':'Edit this table by hand'}" onclick="editSecTable('${sec.id}')">${isTableEdited(sec)?'✍':'⊞'}</button>`:''}
   <button class="ic" title="${req?'Required — every Smart 1 proposal includes this':(sec.enabled?'Hide from the proposal':'Show in the proposal')}" ${req?'disabled style="opacity:.3;cursor:not-allowed"':''} onclick="${req?'':`toggleSec('${sec.id}')`}">${sec.enabled?'👁':'🚫'}</button>
  </div>`;
 if(!sec.enabled)
  return `<div class="docsec off"><div class="dhead"><h3>${esc(sec.title)}</h3>${tools}</div>
   <div class="note">Hidden — this section will not appear in the PDF.</div></div>`;
 const body=editing
  ? `<textarea class="dedit" oninput="S.sections[${i}].body=this.value;saveSoon()" onchange="S.sections[${i}].body=cleanCopy(this.value);saveNow();drawPreview()" placeholder="${sec.kind==='text'?'Section copy…':'Short intro above the table…'}">${esc(sec.body||'')}</textarea>`
  : (sec.body?`<div class="dbody">${richText(sec.body)}</div>`
             :`<div class="note dempty">No copy yet — ✨ writes it, or ✎ to type it.</div>`);
 const table=hasTable&&!tableOn
  ? `<div class="dnote">This table is left out of the proposal. The copy above still prints.</div>`
  : previewTable(sec,e);
 /* The map leads the areas section, and the table naming what it shows sits
    under it. A DMA or a statewide buy cannot be drawn, so the picture is
    never the whole campaign -- which is exactly why it is never on its own. */
 const map=sec.kind==='areas'?mapBlock(sec):'';
 return `<div class="docsec"><div class="dhead"><h3>${esc(sec.title)}</h3>${tools}</div>
  ${body}${map}${isTableEdited(sec)&&tableOn?`<div class="dnote" style="color:#8c5a00">✍ This table was edited by hand and no longer recomputes from the plan. <a onclick="resetSecTable('${sec.id}')" style="cursor:pointer;color:var(--blue);font-weight:700">Put the generated one back</a></div>`:''}${table}</div>`;}
/* Which sections carry a generated table at all. `text` and `cover` are prose
   and have nothing to exclude, and offering them the control would make the
   two buttons mean nothing. */
const TABLE_KINDS=["areas","reach","friction","channels","creative","timeline",
                   "kpis","mediaplan","packages","roi","growth","zips"];
function sectionHasTable(sec){return TABLE_KINDS.includes((sec||{}).kind);}
function isTableEdited(sec){
 const t=(sec||{}).tableEdit;
 return !!(t&&Array.isArray(t.rows)&&t.rows.length);}
function toggleSecTable(id){
 const sec=S.sections.find(x=>x.id===id);if(!sec)return;
 sec.showTable=sec.showTable===false;saveSoon();drawPreview();}
function resetSecTable(id){
 const sec=S.sections.find(x=>x.id===id);if(!sec)return;
 delete sec.tableEdit;saveSoon();drawPreview();}
/* Editing a generated table.

   The standing rule in this builder is that a table is computed and the copy
   above it introduces it, because a proposal whose prose and figures
   disagree is the failure the whole specification is built around. That rule
   still holds for what the tables say by default -- nothing here changes how
   one is generated, and the media plan is still edited by changing the plan.

   What this adds is the case the rule never covered: a table that is right
   and still wrong for this client. A row that names a location under NDA, a
   phase of the timeline this client does not want printed, a KPI they asked
   us to drop. The alternative a rep actually has is exporting to Word and
   editing it there, which takes the document out of the system entirely.

   Two things keep it honest. An edited table is **marked** in the builder,
   in amber, with the generated version one click away -- so nobody
   discovers weeks later that a figure was typed rather than computed. And
   the edit is stored as its own rows rather than replacing the generator, so
   changing the plan does not silently re-write somebody's edit; the badge
   says the table no longer recomputes, which is exactly true. */
function editSecTable(id){
 const sec=S.sections.find(x=>x.id===id);if(!sec)return;
 S._tableEdit=(S._tableEdit===id)?null:id;
 if(S._tableEdit===id&&!isTableEdited(sec)){
  const grid=tableGridOf(sec);
  if(!grid){toast("This section has nothing generated to edit yet.");S._tableEdit=null;return;}
  sec.tableEdit={head:grid.head,rows:grid.rows};
 }
 saveNow();drawPreview();}
/* The generated table read back as data. Parsed out of the HTML the preview
   already builds rather than by re-implementing twelve generators: the point
   of an edit is to change what is on screen, so what is on screen is what is
   offered. Cells come back as text -- an edited table is prose in a grid,
   not a spreadsheet. */
function tableGridOf(sec){
 const html=generatedTable(sec,S.estimates||estimates());
 if(!html)return null;
 const box=document.createElement('div');box.innerHTML=html;
 const table=box.querySelector('table');if(!table)return null;
 const head=[...table.querySelectorAll('thead th')].map(th=>th.textContent.trim());
 const rows=[...table.querySelectorAll('tbody tr')].map(tr=>
  [...tr.querySelectorAll('td,th')].map(td=>td.textContent.trim()));
 if(!rows.length)return null;
 return{head:head.length?head:rows[0].map(()=>""),rows};}
function setTableCell(id,r,c,value){
 const sec=S.sections.find(x=>x.id===id);if(!sec||!isTableEdited(sec))return;
 if(!sec.tableEdit.rows[r])return;
 sec.tableEdit.rows[r][c]=String(value||"").slice(0,400);
 saveSoon();}
function setTableHead(id,c,value){
 const sec=S.sections.find(x=>x.id===id);if(!sec||!isTableEdited(sec))return;
 sec.tableEdit.head[c]=String(value||"").slice(0,120);
 saveSoon();}
function rmTableRow(id,r){
 const sec=S.sections.find(x=>x.id===id);if(!sec||!isTableEdited(sec))return;
 sec.tableEdit.rows.splice(r,1);
 if(!sec.tableEdit.rows.length)delete sec.tableEdit;
 saveNow();drawPreview();}
function addTableRow(id){
 const sec=S.sections.find(x=>x.id===id);if(!sec||!isTableEdited(sec))return;
 sec.tableEdit.rows.push(sec.tableEdit.head.map(()=>""));
 saveNow();drawPreview();}
function editedTableHtml(sec){
 const t=sec.tableEdit,editing=S._tableEdit===sec.id;
 if(!editing)
  return `<table class="dtbl"><thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>`
   +t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')+`</tbody></table>`;
 return `<table class="dtbl editable"><thead><tr>${t.head.map((h,c)=>
   `<th><input value="${esc(h)}" onchange="setTableHead('${sec.id}',${c},this.value)" style="width:100%;font:inherit;border:0;background:transparent;color:inherit"></th>`).join('')}<th></th></tr></thead><tbody>`
  +t.rows.map((r,ri)=>`<tr>${r.map((c,ci)=>
    `<td><input value="${esc(c)}" onchange="setTableCell('${sec.id}',${ri},${ci},this.value)" style="width:100%;font:inherit;border:0;background:transparent"></td>`).join('')}
    <td><button class="ic" title="Remove this row" onclick="rmTableRow('${sec.id}',${ri})">✕</button></td></tr>`).join('')
  +`</tbody></table><div class="addrow" style="margin-top:8px">
    <button class="btn btn-ghost" onclick="addTableRow('${sec.id}')">+ Add a row</button>
    <button class="btn btn-line" onclick="resetSecTable('${sec.id}')">↺ Back to the generated table</button>
    <button class="btn btn-primary" onclick="S._tableEdit=null;saveNow();drawPreview()">✓ Done</button></div>`;}

/* The generated tables, rendered as the PDF renders them. These are never
   editable text: they are computed from the campaign, and a proposal whose
   prose and tables disagree is the failure the whole spec is built around. */
function previewTable(sec,e){
 if(isTableEdited(sec))return editedTableHtml(sec);
 return generatedTable(sec,e);}
function generatedTable(sec,e){
 const k=sec.kind;
 if(k==="areas"){const rows=(S.targetAreas||[]).filter(areaComplete);
  const named=targetsReady();
  /* Who we are taking customers from, named. The audience section used to
     say "competitor conquesting" and stop, which is a tactic rather than a
     campaign -- and the client, the only person who actually knows who they
     lose business to, was never shown a list to correct. A row with no
     address still belongs here: conquesting by brand and behavior needs no
     location, and the column says which of the two this one can do. */
  const comp=named.length?dtable(["Who we are going after","What we want from them","How we reach them"],
   named.map(r=>[esc(r.name),esc(r.note||(r.kind==="competitor"?"Their customers":"The people who go there")),
    (r.address||"").trim()?"Geo-fenced at "+esc(r.address):"Brand and behavior — no address on file to fence"])):'';
  if(!rows.length)return comp;
  return dtable(["Target area","Coverage","Est. population"],rows.map(a=>{
   const pop=areaPopulation(a),z=areaZips(a);
   return [esc(areaLabel(a)),esc(a.notes||(z.length?z.length+" ZIP Codes":a.type)),pop?fmt(pop):"<b>Not measured</b>"];}))+comp;}
 if(k==="reach")return dgrid([["Est. population",e.measured?fmt(e.pop):"—"],["Addressable audience",e.measured?fmt(e.aud):"—"],["Households",e.measured?fmt(e.hh):"—"],["Devices",e.measured?fmt(e.dev):"—"]]);
 if(k==="friction"){const picks=suggestions();if(!picks.length)return '';
  return dtable(["We suggest they should","Why"],picks.map(pk=>[esc(pk.title),esc(pk.detail)]));}
 if(k==="channels"){const chan=channelLines();if(!chan.length)return '';
  return dtable(["Channel","Role in the funnel","Primary KPI"],chan.map(it=>{const r=channelRole(it);return [esc(itemLabel(it)),esc(r[0]),esc(r[1])];}));}
 if(k==="creative"){const rows=creativeRows();if(!rows.length)return '';
  return dtable(["Medium","Campaign spend","Creative","What we need"],rows.map(r=>[
   esc(r.label),money(r.spend),esc(creativePhrase(r)),
   r.sizes&&r.sizes.line?esc(r.sizes.line):"<b>Not measured</b>"]));}
 if(k==="timeline")return dtable(["Phase","What happens"],TIMELINE_PHASES.map(t=>[esc(t[0])+"<br>"+esc(t[1]),esc(t[2])]));
 /* A list of things the campaign is judged on is a list. Six KPIs joined by
    commas is a sentence a client skims, and the fourth is the one they would
    have argued with. */
 if(k==="kpis")return S.kpis.length
   ?`<div class="dbody"><ul class="dlist">${S.kpis.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></div>`:'';
 if(k==="mediaplan")return mediaPlanEditor();
 if(k==="packages")return investmentTable();
 if(k==="roi")return roiTable();
 if(k==="growth")return growthTable();
 if(k==="zips"){
  /* Every ZIP, at the back of the document. Trafficking cannot launch
     without this list and nobody reads it in the middle of the strategy.
     The running list, not the found one -- an area restricted to one state
     must not print the ZIPs it was restricted away from. */
  const areas=(S.targetAreas||[]).filter(areaComplete);
  const rows=areas.map(a=>[a,areaZips(a)]).filter(r=>r[1].length);
  const rules=areas.filter(a=>String(a.zipException||"").trim()).map(a=>{
   const rule=a.zipRule||{},dropped=areaZipsDropped(a).length;
   return rule.applied
    ? `<div class="dnote">${esc(areaLabel(a))} — exception: “${esc(a.zipException)}”. ${dropped} ZIP Code${dropped===1?'':'s'} excluded, ${areaZips(a).length} running.</div>`
    : `<div class="dnote" style="color:#8c2f24">${esc(areaLabel(a))} — the exception “${esc(a.zipException)}” could not be read and has <b>not</b> been applied. Every ZIP above is running.</div>`;}).join('');
  if(!rows.length)return '<div class="dnote">No ZIP Codes captured yet. Find them on the target-area step — the insertion order needs them before trafficking.</div>'+rules;
  return dtable(["Target area","ZIP Codes"],rows.map(([a,z])=>
   [esc(areaLabel(a))+'<br><span style="color:var(--muted)">'+z.length+' ZIP Code'+(z.length===1?'':'s')+'</span>',
    '<span style="font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.7">'+z.map(esc).join(", ")+'</span>']))+rules;}
 return '';}
/* Recommended budgets: what "more" looks like, editable here.

   Neither column invents a number. Raising a line quotes the Accelerated
   package already printed two sections above; adding one quotes the rate
   card's own monthly minimum for that product -- the smallest honest figure
   rather than a guess at what they might spend. A product with no card entry
   is offered to be quoted rather than given a price nobody can stand behind.

   The server computes all of it (growth_options in app.py). This renders what
   it returned and writes any edit back onto the quote, so the proposal, the
   PDF and the Word copy all show the same figures. */
function growthRows(){return (S.growth&&S.growth.any)?S.growth:null;}
function growthTable(){
 const g=growthRows();
 if(!g||!g.any)return '<div class="dnote">Nothing to recommend beyond the plan above — every product the discovery answers pointed at is already on it.</div>';
 const months=g.months||1;
 let html='';
 if(g.increases.length){
  html+='<div class="dnote" style="margin-top:10px"><b>Raise a budget already on the plan</b></div>'
   +`<table class="dtbl"><thead><tr><th>Product</th><th style="text-align:right">Quoted</th><th style="text-align:right">Recommended</th><th style="text-align:right">More per month</th><th style="text-align:right">Over ${months} mo</th><th></th></tr></thead><tbody>`
   +g.increases.map(r=>`<tr>
     <td><b>${esc(r.product)}</b>${r.custom?' <span style="color:var(--muted);font-size:10.5px">edited</span>':''}</td>
     <td style="text-align:right">${money(r.current)}</td>
     <td style="text-align:right"><input class="dmoney" type="number" min="0" step="50" value="${r.suggested}" onchange="setGrowth('inc:${esc(r.product)}',+this.value)"></td>
     <td style="text-align:right">${money(r.uplift)}</td>
     <td style="text-align:right">${money(r.campaign)}</td>
     <td><button class="x" title="Do not offer this" onclick="dropGrowth('inc:${esc(r.product)}')">✕</button></td></tr>`).join('')
   +`<tr class="dtot"><td colspan="3">Additional monthly</td><td style="text-align:right">${money(g.increase_monthly)}</td><td style="text-align:right">${money(g.increase_monthly*months)}</td><td></td></tr></tbody></table>`;
 }
 if(g.additions.length){
  html+='<div class="dnote" style="margin-top:14px"><b>Add what the discovery answers pointed at</b></div>'
   +`<table class="dtbl"><thead><tr><th>Product</th><th>Why</th><th style="text-align:right">From</th><th style="text-align:right">Over ${months} mo</th><th></th></tr></thead><tbody>`
   +g.additions.map(r=>`<tr>
     <td><b>${esc(r.product)}</b>${r.category?'<br><span style="color:var(--muted);font-size:11px">'+esc(r.category)+'</span>':''}</td>
     <td>${esc(r.why||'')}</td>
     <td style="text-align:right"><input class="dmoney" type="number" min="0" step="50" value="${r.suggested||''}" placeholder="quote" onchange="setGrowth('add:${esc(r.product)}',+this.value)"></td>
     <td style="text-align:right">${r.quoted?money(r.campaign):'<span style="color:var(--muted)">to be quoted</span>'}</td>
     <td><button class="x" title="Do not offer this" onclick="dropGrowth('add:${esc(r.product)}')">✕</button></td></tr>`).join('')
   +`</tbody></table>`;
 }
 const dropped=(S.growthDropped||[]).length;
 if(dropped)html+=`<div class="dnote" style="margin-top:8px">${dropped} option${dropped===1?'':'s'} removed. <a onclick="S.growthDropped=[];saveNow();refreshGrowth()" style="cursor:pointer;color:var(--blue);font-weight:700">Restore</a></div>`;
 html+='<div class="dnote" style="margin-top:8px">Figures a client can act on without a new proposal. Raising a line uses the Accelerated option above; adding one starts at our listed minimum for that product.</div>';
 return html;}
function setGrowth(key,value){
 S.growthEdits=Object.assign({},S.growthEdits,{[key]:value});
 saveNow();refreshGrowth();}
function dropGrowth(key){
 S.growthDropped=(S.growthDropped||[]).concat([key]);
 saveNow();refreshGrowth();}
/* The server owns the arithmetic, so an edit round-trips rather than being
   recomputed here -- otherwise the preview and the PDF would each carry their
   own version of the same sum. */
async function refreshGrowth(){
 try{
  const d=await api('/sales/builder/api/quotes/'+QUOTE_ID,{method:'PUT',body:JSON.stringify({data:S})});
  if(d.quote&&d.quote.growth)S.growth=d.quote.growth;
 }catch(e){}
 drawPreview();}

function dtable(head,rows){
 return `<table class="dtbl"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`
  +rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')+`</tbody></table>`;}
function dgrid(pairs){
 return `<div class="dgrid">${pairs.map(p=>`<div><b>${p[1]}</b><span>${esc(p[0])}</span></div>`).join('')}</div>`;}
const TIMELINE_PHASES=[
 ["Weeks 1–2","Setup & Onboarding","Admin access collected, tracking pixels placed, conversion actions defined, audience and geography built, Smart 1 Suite provisioned."],
 ["Weeks 3–4","Production & Integration","Creative produced or supplied and approved, landing pages reviewed, workflow automations mapped in the Smart 1 Suite, tracking verified end to end before a cent is spent."],
 ["Month 2+","Execution & Scaling","Campaigns live, weekly pacing and bid optimization, creative performance checks, budget shifted toward what proves out, first full performance review delivered."]];
/* The lines that are actually channels. A production line and a management
   fee are not, and listing them put "Video Production — top of funnel, builds
   awareness and trust on the screens the household already watches" in a
   table headed Recommended Channel Strategy on a document a client reads.
   Mirrors channel_lines() server-side. */
function channelLines(){
 return (S.items||[]).filter(i=>(i.basis||"monthly")!=="one_time"
   && !(sellRateOf(i)==null && mediumOf(i)==="other"));}
function channelRole(it){
 const c=String(it.category||"").toUpperCase(),m=mediumOf(it);
 if(/SEARCH ENGINE MARKETING|PAY PER CLICK/.test(c))return ["Bottom of funnel — captures demand that is already searching","Cost per lead and conversion rate"];
 if(/SEARCH ENGINE OPTIMIZATION/.test(c))return ["Compounding — organic and AI-answer visibility","Ranked terms, map-pack visibility and organic leads"];
 if(/RETARGETING/.test(c))return ["Bottom of funnel — brings back the people who already came","Return visits and cost per conversion"];
 if(m==="video")return ["Top of funnel — builds awareness and trust on the screens the household already watches","Completed views and completion rate"];
 if(m==="audio")return ["Mid funnel — reaches the 79% of digital audio time spent with no screen at all","Reach, frequency and listen-through"];
 if(m==="social")return ["Mid funnel — consideration and re-engagement in feed","Engaged sessions and cost per lead"];
 if(m==="display")return ["Full funnel — precision targeting and retargeting against the people already in market","Click-through rate and cost per action"];
 return ["Supports the campaign","Cost per action"];}
function creativePhrase(r){
 if(r.answer==="has")return "Supplied by the client";
 if(r.answer==="client")return "Produced by Smart 1 — "+money(r.fee)+" one-time";
 if(r.answer==="comp")return "Produced by Smart 1 at no charge";
 return "To be confirmed before launch";}

/* The media plan is editable here: budgets, deletions and additions, without
   walking back three steps to change one number. */
function planRowFor(ix){
 /* The server's row for this line, and only if it was priced against the
    budget that is on screen now. Changing a budget redraws immediately and
    the save lands 900ms later, so without that check the delivery column
    would sit there stating a confident figure for the previous number. */
 const plan=S._mediaPlan;
 if(!plan||!plan.rows||!plan.rows[ix])return null;
 const row=plan.rows[ix],it=S.items[ix]||{};
 if(Math.round(+row.monthly||0)!==Math.round(+it.dollars||0)
    &&(row.basis||'monthly')!=='one_time')return null;
 return row;}
/* The rate column draws the server's rate, which is the QUOTED one. S carries
   the card's listed rate, so drawing that put "CPM 4.25" beside a delivery
   figure computed at $8.50 -- the preview contradicting the PDF on one
   screen, which is exactly the drift this table was consolidated to end. */
function mediaPlanEditor(){
 const months=Math.max(1,+S.months||1);
 const note=(S._mediaPlan||{}).note||"";
 return `<table class="dtbl editable"><thead><tr><th>Product</th><th>Category</th><th>Rate</th><th style="text-align:right">Monthly</th><th style="text-align:right">Total (${months} mo)</th><th>Delivery / mo</th><th></th></tr></thead><tbody>`
  +S.items.map((it,ix)=>{const pr=planRowFor(ix);return `<tr>
    <td><b>${esc(it.product)}</b></td><td>${esc(it.category)}</td>
    <td>${pr?esc(pr.rate):esc(it.rate?(it.rate+' '+(it.rateValue||'')):'Managed')}</td>
    <td style="text-align:right"><input class="dmoney" type="number" min="0" step="50" value="${it.dollars||0}" onchange="previewSetDollars(${ix},+this.value)">${(it.basis||"monthly")==="one_time"?'<small class="tiny" style="display:block">one-time</small>':''}</td>
    <td style="text-align:right">${pr?money(pr.campaign):'<span style="opacity:.6">…</span>'}</td>
    <td class="tiny">${pr?esc(pr.delivery):'<span style="opacity:.6">recalculating…</span>'}</td>
    <td><button class="x" title="Remove this product" onclick="previewRemoveItem(${ix})">✕</button></td></tr>`}).join('')
  /* The server's totals, not a local sum of every line multiplied by the
     flight: that counted a one-time production as monthly and ignored a line
     bought for part of the campaign. */
  +`<tr class="dtot"><td colspan="3">Campaign total</td>
     <td style="text-align:right">${S._mediaPlan?money(S._mediaPlan.monthly_total):'…'}</td>
     <td style="text-align:right">${S._mediaPlan?money(S._mediaPlan.campaign_total):'…'}</td><td colspan="2"></td></tr>`
  +`</tbody></table>`
  +(note?`<div class="note" style="margin-top:6px">${esc(note)}</div>`:'')
  +`
   <div class="addrow" style="margin-top:8px"><select id="pvAddCat">${productCategories.map(c=>`<option value="${esc(c)}">${em(c)} ${esc(c)}</option>`).join('')}</select>
    <button class="btn btn-ghost" onclick="previewAddItem()">+ Add product</button>
    <span class="note" style="margin:0">Changing the plan here re-costs the packages, the ROI table and the creative gate.</span></div>
   ${previewGuards()}`;}
function previewSetDollars(ix,v){
 S.items[ix].dollars=Math.max(0,Math.round(v/50)*50);
 const tot=S.items.reduce((s,i)=>s+(i.dollars||0),0)||1;
 S.items.forEach(i=>{i.pctSeed=Math.round(100*(i.dollars||0)/tot)||1;});
 syncBudgetToPlan();
 buildPackages();S.aiEst=S.aiEst;saveSoon();drawPreview();}
function previewRemoveItem(ix){
 const it=S.items[ix];
 if(!confirm('Remove "'+(it.product||'this product')+'" from the media plan?'))return;
 S.items.splice(ix,1);applySeeds();syncBudgetToPlan();buildPackages();saveSoon();drawPreview();}
function previewAddItem(){
 const cat=document.getElementById('pvAddCat').value,p=findProduct(cat)||{};
 if(S.items.some(i=>i.category===cat)){toast("That category is already in the mix.");return;}
 S.items.push({label:p.label,category:cat,product:p.product||cat,rate:p.rateType,rateValue:p.rateValue,pctSeed:15,dollars:0});
 applySeeds();syncBudgetToPlan();buildPackages();saveSoon();drawPreview();
 toast("Added — set its monthly budget.");}
function previewGuards(){
 const g=guardrailsJs(),need=creativeUnresolved();
 let h='';
 if(g.length)h+=`<div class="warnbox" style="margin-top:10px"><b>🛡 Guardrails</b>${g.map(x=>"⚠ "+esc(x)).join("<br>")}</div>`;
 if(need.length)h+=`<div class="gap" style="margin-top:10px"><b>🎬 Creative still to confirm</b><br>`
  +need.map(m=>esc(MEDIUM_LABEL[m].split(" (")[0])+" is in the plan and nobody has been named to supply the "+(m==="display"||m==="retargeting"?"banners":"spot")+".").join("<br>")+`</div>`;
 return h;}
function investmentTable(){
 /* The server's own summary, not a fourth copy of the arithmetic. The copy
    that lived here summed every line as if it recurred, so a $1,500 one-time
    production added $1,500 to the monthly figure and $9,000 to a six-month
    campaign — a number on the document the client signs. */
 const months=Math.max(1,+S.months||1),inv=S._invest;
 if(!inv||!inv.lines){
  return `<div class="note">Recalculating the investment summary — it is computed
   from the plan on the server, and this quote has not saved since it changed.</div>`;}
 const rows=inv.lines.map(l=>[l.label,money(l.amount),l.recurs]);
 rows.push(["Total first month",money(inv.first_month),""]);
 rows.push(["Total campaign ("+months+" mo, including licensing)",
            money(inv.campaign_total),""]);
 let html=dtable(["","Amount","Recurs"],rows.map(r=>[esc(r[0]),r[1],esc(r[2])]));
 /* All three tiers, on the document. The PDF has printed them for as long as
    it has existed and the preview showed only the selected one, so a rep read
    a one-package proposal and the client received a three-package one. The
    preview is how you find out whether the document is any good; it has to be
    the document. */
 const pk=S.packages||[];
 if(pk.length){
  html+=`<div class="dnote" style="margin-top:10px">The three options below all appear on the proposal. ★ is the one we recommend.</div>`;
  html+=dtable(["",...pk.map(p=>esc(p.name)+(p.rec||p===S.selectedPackage?" ★":""))],
   [["Monthly",...pk.map(p=>money(p.monthly))],
    ["Total ("+months+" mo)",...pk.map(p=>money(p.total))],
    ["Est. impressions / mo",...pk.map(p=>fmt(p.impr))]]);}
 return html;}
/* Expected Results & ROI is the KPI framework, not a table of impressions.

   The section's own title asks what counts as this campaign working, and an
   impression count answers a different question — what the money bought.
   The insertion order has carried a KPI framework all along, so the two
   documents described one campaign two ways: the client agreed to
   impressions and the campaign was run against KPIs.

   The benchmark table is the server's (hub/kpi_framework.py), handed to the
   page with the quote, because a third copy of it would be a third answer.
   test_proposal_targeting.py asserts this page, the Python and the IO
   builder's own JavaScript still say the same thing. */
function kpiPlan(){return (S._kpiPlan||null);}
function roiTable(){
 const plan=kpiPlan();
 if(!plan)return '<div class="dnote">The measurement framework loads with the quote.</div>';
 let h='';
 if(plan.measured){
  h+=`<div class="dbody"><p><b>Primary KPI</b></p><ul class="dlist"><li>${esc(plan.primary)}</li></ul></div>`;
  if((plan.secondary||[]).length)
   h+=`<div class="dbody"><p><b>Secondary KPIs</b></p><ul class="dlist">${
     plan.secondary.map(k=>'<li>'+esc(k)+'</li>').join('')}</ul></div>`;
 }else h+=`<div class="dnote">${esc(plan.note||'')}</div>`;
 if((plan.additional_metrics||[]).length)
  h+=`<div class="dbody"><p><b>Also tracked and reported monthly</b></p><ul class="dlist">${
    plan.additional_metrics.map(m=>'<li>'+esc(m)+'</li>').join('')}</ul></div>`;
 if((plan.rows||[]).length){
  h+=dtable(["Product","Key KPI","Expected benchmark"],
    plan.rows.map(r=>[esc(r.product),esc(r.kpi),esc(r.expected)]));
  h+='<div class="dnote">Benchmark ranges are what this inventory normally delivers for campaigns of this shape. They are expectations to measure against, not guarantees.</div>';
 }
 const t=(S.traditional||{});
 if(t.running==="Yes"&&t.posture)h+=`<div class="dnote">${t.posture==="shift"
   ?"Every result above is attributable to the channel that produced it. That is the difference worth weighing against the traditional spend."
   :"These measures cover the digital portion of the plan; they sit alongside the traditional buy rather than replacing it."}</div>`;
 return h;}

function toggleSec(id){

async function rewriteSecById(id){
 const i=S.sections.findIndex(x=>x.id===id);if(i<0)return;
 if(!CFG.ai_enabled){toast("AI rewriting needs OPENAI_API_KEY on the server.");return;}

   body:JSON.stringify({data:S,section:id})});
  if(d.sections&&d.sections[id]){S.sections[i].body=d.sections[id];saveNow();drawPreview();
   toast("✨ "+S.sections[i].title+" rewritten.");return;}
  toast((d.breaches&&Object.keys(d.breaches).length)?"The rewrite broke a proposal rule and was discarded.":"The AI returned nothing for that section.");
 }catch(e){toast("Rewrite failed: "+e.message);}}

function renderStep(){
 if(!S)return;
 const d=STEPS[step]();window._entering=(_lastStep!==step);_lastStep=step;
 window._stepDesc=d;
 const st=document.getElementById('stage');
 /* One bubble per step, drawn beside the heading. help_dot() is a Jinja
    global and these steps are built in JavaScript, so the same markup is
    emitted here -- hub-help.js mounts on a debounced MutationObserver, so a
    dot written by renderStep() is upgraded like any other. A step with no
    key gets nothing rather than a dead "?".

    Deliberately no data-screen: a tour is anchored by selector and this is
    one page whose markup is replaced on every step, so a tour written for
    it could not drive past the step it started on -- which is the silence
    hub-demo.js was just fixed to stop. */
 const _dot=k=>k?`<span data-help="${k}"></span>`:'';
 st.innerHTML=`<div class="eyebrow">${d.eyebrow}</div><h1 class="q">${d.title} ${_dot(d.help)}</h1><div class="sub">${d.sub}</div>${d.html}`;
 document.getElementById('stepLabel').textContent='Step '+(step+1)+' of '+STEPS.length;
 document.getElementById('bar').style.width=((step+1)/STEPS.length*100)+'%';
 // Back stays available inside a sub-flow even on step 0 of the wizard,
 // because there it means "back out of this area", not "leave the wizard".
 document.getElementById('backBtn').style.visibility=(step===0&&!d.onBack)?'hidden':'visible';
 document.getElementById('nextBtn').textContent=d.nextLabel||(d.isLast?'Finish & back to dashboard':'Continue →');
 if(d.after)d.after();window._valid=d.valid;syncNext();
 /* Only when the wizard actually moved. renderStep() is also how a step
    redraws after an answer -- picking a goal, answering a discovery
    question, toggling a card -- and scrolling to the top on every one of
    those threw the rep back to the heading mid-question. */
 if(window._entering)window.scrollTo(0,0);
}
function syncNext(){const b=document.getElementById('nextBtn');if(b)b.disabled=window._valid?!window._valid():false;}
function nextStep(){
 const d=STEPS[step]();
 if(d.valid&&!d.valid())return;
 // A step can handle Continue itself -- the target-area editor saves the area
 // and returns to the list rather than advancing the wizard.
 if(d.onNext&&d.onNext()===true)return;
 saveNow();
 clearResumeNote();
 if(step<STEPS.length-1){step++;renderStep();}
 else{toast("Saved. "+(QUOTE_NUMBER||"")+" is on the dashboard.");nav('dashboard');}}
function prevStep(){
 const d=window._stepDesc||STEPS[step]();
 if(d.onBack&&d.onBack()===true)return;   // the step walked its own sub-flow
 clearResumeNote();
 if(step>0){step--;renderStep();}}

/* ============================================================
   NEW OR EXISTING CLIENT
   A proposal typed against a name we already hold under a slightly different
   spelling is a proposal that files nowhere -- Client 360 shows nothing, the
   Suite opportunity attaches to a second contact, and the billing audit
   reports a client with one proposal and no history.

   So the step asks which it is, and searching attaches the real record.
   `clientKey` is hub/client_key.py's derived key (d:<domain> where there is a
   URL, n:<name-slug> where there is not) -- carried on the quote so the
   filing path knows which record this belongs to, never used as a substitute
   for the name itself.
   ============================================================ */
function setClientMode(mode){
 S.clientMode=mode;
 if(mode==="new")S.clientKey="";
 saveSoon();renderStep();}
function detachClient(){S.clientKey="";saveSoon();renderStep();}
let _clientTimer=null;
function searchClientsSoon(q){
 S._clientQ=q;
 clearTimeout(_clientTimer);
 _clientTimer=setTimeout(()=>searchClients(q),260);}
async function searchClients(q){
 S._clientQ=q;
 const host=document.getElementById('clientHits');
 if(!host)return;
 if(!String(q||"").trim()){host.innerHTML='';return;}
 host.innerHTML='<div class="note" style="margin-top:8px"><span class="spin"></span>Searching…</div>';
 try{
  const d=await api('/api/clients/search?limit=8&q='+encodeURIComponent(q));
  S._clientHits=d.clients||[];
 }catch(e){
  /* Say it failed. A search that silently returns nothing reads as "this
     client does not exist", which is how a duplicate record gets created. */
  host.innerHTML='<div class="warnbox" style="margin-top:8px">Could not search the client list: '+esc(e.message)+'. You can still type the name below.</div>';

function attachClient(raw){
 let c;try{c=JSON.parse(raw);}catch(e){return;}
 S.client=c.name||S.client;

/* ============================================================
   THE WEBSITE AUDIT, INSIDE THE PROPOSAL

   A proposal is written against evidence, and the evidence for most of it was
   already sitting in a site audit somebody ran weeks ago -- the Google
   listing, the reviews, the pixels, and what the business is already spending
   with somebody else. A rep was reading that off another screen and typing it
   back in, or more often not reading it at all.

   Three rules, each one this codebase has had to learn somewhere else:

   * **Offered, never applied.** Everything the audit answers arrives as a
     proposal with its evidence beside it, and one press takes it. "Are they
     doing SEO" is a judgment from a measurement, and a judgment written
     into a client document on our say-so is the paragraph a client checks
     hardest -- the rule modules/ads_builder applies to its researched
     competitor list.
   * **Sixty days.** A reading older than that describes a website that may
     have been rebuilt since, and the reading carries no sign of its own age
     once it is quoted from. The panel says so and offers the rescan; it never
     refuses to prefill, because leaving a rep with nothing while they wait is
     worse than an old answer they can see the date on.
   * **Reading is free and scanning is billed.** Nothing here spends a credit
     without a press and a confirmation, and the scan is started by posting to
     the module that owns scans rather than by this one learning how.
   ============================================================ */
let AUDIT=null, AUDIT_STATE="idle", AUDIT_ERR="";

function auditDomain(){
 return String(S.url||"").trim();}

function auditPanel(){
 const dom=auditDomain();
 let body;
 if(!dom){
  body='<div class="note" style="margin-top:6px">Add the website above and Smart 1 '
   +'can read what the last audit found — what they are already spending, their '
   +'Google listing, and which of the discovery questions are already answered.</div>';
 }else if(AUDIT_STATE==="loading"){
  body='<div class="note" style="margin-top:6px"><span class="spin"></span>Reading the audit for '+esc(dom)+'…</div>';
 }else if(AUDIT_STATE==="scanning"){
  body='<div class="note" style="margin-top:6px"><span class="spin"></span>Running a new audit of '
   +esc(dom)+'. It takes a minute or two — this panel will fill in by itself.</div>';
 }else if(AUDIT_ERR){
  body='<div class="warnbox" style="margin-top:8px">This could not be read, so it is '
   +'<b>not measured</b> rather than empty: '+esc(AUDIT_ERR)+'</div>';
 }else if(AUDIT&&AUDIT.found){
  body=auditFound();
 }else{
  body='<div class="note" style="margin-top:6px">'
   +esc((AUDIT&&AUDIT.note)||"Nothing has been read from this website yet.")
   +' Running one spends a credit and takes a few minutes.</div>';
 }
 return `<div class="bpanel"><div class="ttl">🔎 What the website audit already knows</div>
  ${body}
  <div class="addrow" style="margin-top:10px">
   <button class="btn btn-ghost" onclick="loadAudit()"${dom?'':' disabled'}>Read the audit</button>
   <button class="btn btn-ghost" onclick="runAudit()"${dom?'':' disabled'}>Run a new audit</button>
   ${AUDIT&&AUDIT.found?`<button class="btn btn-ghost" onclick="applyAudit()">Use these answers</button>`:''}
   ${AUDIT&&AUDIT.scan_url?`<a class="btn btn-ghost" href="${esc(AUDIT.scan_url)}" target="_blank" rel="noopener">Open the full audit ↗</a>`:''}
  </div></div>`;}

function auditFound(){
 const age=AUDIT.age||{}, sp=AUDIT.spend||{};
 let h='';
 /* The age first, and loudest when it matters. A figure with no date on it is
    read as today's, which is the whole way a stale reading reaches a client. */
 if(age.stale){
  h+=`<div class="warnbox" style="margin-top:8px"><b>⚠ This reading is ${esc(age.age_days)} days old</b>
   — over the ${esc(age.limit_days)}-day mark. A proposal written from it describes a site
   that may have been rebuilt since. <a onclick="runAudit()" style="cursor:pointer;color:var(--blue);font-weight:700">Run a new audit</a> before quoting from it.</div>`;
 }else if(age.measured){
  h+=`<div class="note" style="margin-top:6px">Read on ${esc(age.read_on)} — ${esc(age.note)}</div>`;
 }else{
  h+=`<div class="note" style="margin-top:6px">${esc(age.note||"How current this is: not measured.")}</div>`;
 }

 /* What they are already spending, first, because it is what decides what the
    proposal is arguing for. */
 h+='<div style="margin-top:10px"><b>What they are already spending</b>';
 if(sp.total_display){
  h+=`<div style="font-size:22px;font-weight:700;color:var(--navy);line-height:1.2;margin-top:2px">${esc(sp.total_display)}
   <span class="note" style="font-weight:400">a month, that we can put a number on</span></div>`;
  if(sp.total_note)h+=`<div class="note" style="margin-top:3px">${esc(sp.total_note)}</div>`;
 }
 if((sp.observed||[]).length){
  h+='<div class="note" style="margin-top:6px">'+sp.observed.map(f=>
    esc(f.label)+': <b>'+esc(f.value)+'</b>').join(' · ')+'</div>';
 }else{
  h+='<div class="note" style="margin-top:4px">'+esc(sp.note||'Not measured.')+'</div>';
 }
 if(sp.stated&&sp.stated.finding){
  h+=`<div class="note" style="margin-top:6px;color:#8c2f24"><b>Worth asking:</b> ${esc(sp.stated.finding)}</div>`;
 }
 h+='</div>';

 if((AUDIT.discovery||[]).length){
  h+='<div style="margin-top:12px"><b>'+AUDIT.discovery.length
   +' discovery answers already measured</b><div class="note" style="margin-top:4px">'
   +AUDIT.discovery.map(a=>esc(a.key)+' → <b>'+(a.answer==='yes'?'Yes':'No')+'</b>').join(' · ')
   +'</div><div class="note" style="margin-top:4px">'+esc(AUDIT.discovery_note||'')+'</div></div>';
 }
 if((AUDIT.opportunities||[]).length){
  h+='<div style="margin-top:12px"><b>What the audit says we could fix</b><div class="note" style="margin-top:4px">'
   +AUDIT.opportunities.slice(0,6).map(o=>esc(o.finding)).join(' ')+'</div></div>';
 }
 return h;}

async function loadAudit(){
 const dom=auditDomain();
 if(!dom){toast("Add the website first.");return;}
 AUDIT_STATE="loading";AUDIT_ERR="";renderStep();
 try{
  const d=await api('/api/website-audit?domain='+encodeURIComponent(dom)
    +'&client='+encodeURIComponent(S.client||''));
  AUDIT=d;AUDIT_ERR=d.error||"";
 }catch(e){
  /* "We could not look" and "there is nothing" are different answers, and only
     the second one means there is nothing to do about it. */
  AUDIT=null;AUDIT_ERR=e.message||"the audit could not be read";
 }
 AUDIT_STATE="idle";renderStep();}

async function runAudit(){
 const dom=auditDomain();
 if(!dom){toast("Add the website first.");return;}
 if(!window.confirm("Run a fresh audit of "+dom+"?\n\nThis spends one Insites credit "
   +"and takes a few minutes."))return;
 AUDIT_STATE="scanning";AUDIT_ERR="";renderStep();
 try{
  const r=await fetch('/scans/api/scans',{method:'POST',credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({url:dom,force:true,source:'proposal',
                         business_name:S.client||''})});
  const j=await r.json();
  if(j&&j.error)throw new Error(j.error);
 }catch(e){
  AUDIT_STATE="idle";AUDIT_ERR=e.message||"the scanner could not be reached";
  renderStep();return;
 }
 auditPoll(0);}

function auditPoll(n){
 if(n>24){
  AUDIT_STATE="idle";
  AUDIT_ERR="";
  toast("The audit is still running. It is not lost — press Read the audit in a few minutes.");
  renderStep();return;}
 setTimeout(async()=>{
  try{
   const d=await api('/api/website-audit?domain='+encodeURIComponent(auditDomain()));
   if(d&&d.found&&d.age&&d.age.age_days===0){
    AUDIT=d;AUDIT_STATE="idle";renderStep();
    toast("The new audit has landed.");return;}
  }catch(e){/* a poll that fails is a poll, not a failure */}
  auditPoll(n+1);
 },15000);}

function applyAudit(){
 if(!AUDIT||!AUDIT.found)return;
 let taken=0, skipped=0;
 /* Only the blanks. A rep who answered a question is the better source than a
    crawler, and writing over what somebody typed is the panel deciding the
    person was wrong -- the overlay rule hub/client_urls.py works to. */
 (AUDIT.discovery||[]).forEach(a=>{
  const key=a.key, want=a.answer==="yes"?"Yes":"No";
  if(!DISCOVERY_QUESTIONS.some(q=>q.key===key))return;
  if(["Yes","No","Unknown"].includes((S.mkt||{})[key])){skipped++;return;}
  S.mkt[key]=want;taken++;});
 const intake=AUDIT.intake||{};
 if(intake.services&&!String(S.description||"").trim()){
  S.description=intake.services;S.descriptionMode="I have one";taken++;}
 if(intake.website_happy&&!["Yes","No","Unknown"].includes((S.mkt||{}).websiteHappy)){
  S.mkt.websiteHappy=intake.website_happy==="yes"?"Yes":"No";taken++;}
 saveSoon();renderStep();
 toast(taken
  ? taken+" answer"+(taken===1?"":"s")+" taken from the audit"
    +(skipped?", "+skipped+" left alone because they were already answered":"")+"."
  : "Nothing to take — everything the audit measured is already answered here.");}

async function reviewLandingAI(){

function drawLanding(){

 const read=S.landingRead;
 box.innerHTML=(read?`<div style="margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px">

function drawItems(){const host=document.getElementById('prodList');if(!host)return;
 host.innerHTML=S.items.map((i,ix)=>{

/* The rate this line is quoted at. Shown as a number a rep can change rather

   never a mystery -- and a fee line says plainly that there is no rate to

function rateRow(i,ix){
 const sr=sellRateOf(i);
 if(sr===null)
  return `<div class="basisrow"><span class="note" style="margin:0">Priced as a ${esc(String(i.rate||'management or flat').toLowerCase())} fee — this line has no ${'CPM'} to set. ${i.rateValue?money(i.rateValue)+' on the card.':'The card quotes it as listed.'}</span></div>`;
 const start=startingRate(i.rateValue,i.rate);
 return `<div class="basisrow">
  <span class="note" style="margin:0">Quoted ${esc(i.rate)}</span>
  <input type="number" min="0" step="0.25" value="${sr}" class="dmoney" style="width:82px" onchange="setItemRate(${ix},this.value)">
  <span class="note" style="margin:0">card ${money(i.rateValue)} · starts at ${start!==null?money(start):'—'} (2×)${rateIsCustom(i)?' · <b>adjusted</b>':''}</span>

 </div>`;}
/* Monthly or one-time, and for how long -- asked here for the same reason the
   IO conversion asks it. A dollar figure on its own has not said which, and
   the difference is what gets billed: a $3,000 line read as monthly over six
   months is $18,000 the client never agreed to.

   Most lines are monthly for the whole flight, so that is the default and the
   question only takes a click when it is wrong. A one-time cost is spread
   across the flight in the plan totals rather than dropped or charged every
   month -- both of those are wrong in a way that survives review. */
function basisRow(i,ix){
 const months=Math.max(1,+S.months||1);
 const oneTime=i.basis==="one_time";
 const term=Math.max(1,Math.min(months,+i.termMonths||months));
 return `<div class="basisrow">
  <span class="pill${oneTime?'':' on'}" onclick="setBasis(${ix},'monthly')">Monthly</span>
  <span class="pill${oneTime?' on':''}" onclick="setBasis(${ix},'one_time')">One time</span>
  ${oneTime
   ? `<span class="note" style="margin:0">${money(i.dollars||0)} once — ${money(Math.round((i.dollars||0)/months))}/mo across the ${months}-month flight.</span>`
   : `<span class="note" style="margin:0">for <input type="number" min="1" max="${months}" value="${term}" onchange="setTerm(${ix},+this.value)" class="dmoney" style="width:56px"> of ${months} month${months===1?'':'s'} · ${money((i.dollars||0)*term)} total</span>`}
 </div>`;}
function setBasis(ix,basis){
 S.items[ix].basis=basis;
 if(basis==="one_time")S.items[ix].termMonths=1;
 /* Whether a line recurs decides whether it is in the monthly figure at
    all, so this moves the budget exactly as editing its dollars does. */
 syncBudgetToPlan();buildPackages();
 flagDirty();saveSoon();drawItems();drawGuards();}
function setTerm(ix,n){
 const months=Math.max(1,+S.months||1);
 S.items[ix].termMonths=Math.max(1,Math.min(months,n||months));
 flagDirty();saveSoon();drawItems();}
function setItemDollars(ix,v){S.items[ix].dollars=Math.max(0,Math.round(v/50)*50);
 const tot=S.items.reduce((s,i)=>s+(i.dollars||0),0)||1;
 S.items.forEach(i=>{i.pctSeed=Math.round(100*(i.dollars||0)/tot)||1;});
 /* Both editors move the budget, or the number depends on which screen the
    rep happened to edit the plan from. */
 syncBudgetToPlan();buildPackages();
 flagDirty();drawItems();drawGuards();saveSoon();}
function drawRoi(){const h=document.getElementById('roiTags');if(!h)return;h.innerHTML=S.items.map(i=>`<span class="pill on" style="margin:0;cursor:default">${em(i.category)} ${esc(i.category)}: ${esc(CATEGORY_ROI[i.category]||'—')}</span>`).join('');}

/* The quoted rate, per line. A rep who negotiates one number should not have
   to re-plan the campaign around it, and a plan whose rates cannot move is a
   plan that gets rebuilt in a spreadsheet nobody else can read. Clearing the
   box returns the line to the 2x start rather than to zero -- a blank rate
   would silently price the delivery table at nothing. */
function setItemRate(ix,value){
 const i=S.items[ix];if(!i)return;
 const v=+value;
 i.sellRate=(v>0)?Math.round(v*100)/100:startingRate(i.rateValue,i.rate);

function rmItem(i){S.items.splice(i,1);applySeeds();flagDirty();drawItems();drawRoi();drawGuards();saveSoon();}
/* What discovery pointed at, on the screen where products are chosen.

   Twelve questions are asked on step 4 and every answer already produced a
   suggestion -- on step 4, three steps earlier, in a panel a rep reads once
   and then walks away from. So the media mix was built from the goals alone
   and the answers were, in practice, read by the proposal copy and by
   nothing that decides what is on the plan. This is the same list, offered
   where it can be acted on, with the product named and one press to add it.

   Nothing is added automatically. A suggestion is a recommendation the rep
   agreed with when they kept it on step 4, not an instruction -- and a plan
   that grows a line by itself is a plan somebody has to audit before every
   send. */
function discoveryPicks(){
 const onPlan=new Set(S.items.map(i=>String(i.product||"").toLowerCase()));
 const out=[];
 suggestions().forEach(sug=>{
  (sug.products||[]).forEach(name=>{
   const card=rateCard.find(x=>x.product===name)
     ||rateCard.find(x=>String(x.product||"").toLowerCase().startsWith(String(name).toLowerCase()));
   if(!card||onPlan.has(String(card.product).toLowerCase()))return;
   if(out.some(o=>o.card.label===card.label))return;
   out.push({card,why:sug.title,key:sug.key});});});
 return out;}

 const w=document.getElementById('discoWrap');if(!w)return;

 if(!gaps){w.innerHTML='';return;}
 /* A suggestion the rate card sells nothing for is still worth showing --
    the Suite closes several of these and is quoted two steps later, and a
    silently shorter list reads as "discovery found nothing". */
 const unsold=suggestions().filter(sug=>!(sug.products||[]).some(n=>
   rateCard.some(x=>x.product===n||String(x.product||"").toLowerCase().startsWith(String(n).toLowerCase()))
   &&!S.items.some(i=>String(i.product||"").toLowerCase()===String(n).toLowerCase())));
 w.innerHTML=`<div class="bpanel"><div class="ttl">🧭 From what they told us in discovery</div>

  ${picks.length?`<div class="arealist" style="margin-top:10px">${picks.map(pk=>`
   <div class="prod"><div class="pi">${em(pk.card.category)}</div><div class="grow">

    <div class="meta">${esc(pk.why)} · ${esc(pk.card.listedRate||'')}${isAddOn(pk.card.product)?' · <b>add-on</b>':''}</div></div>
    <button class="btn btn-ghost" onclick="addSpecificItem('${esc(pk.card.label)}')">+ Add to the plan</button></div>`).join('')}</div>`
   :`<div class="note" style="margin-top:8px">Everything discovery pointed at that this rate card sells is already on the plan.</div>`}
  ${unsold.length?`<div class="note" style="margin-top:10px">Also raised, and not a media line: ${unsold.map(u=>esc(u.title)).join(' · ')}. The Suite covers several of these — it is quoted two steps on.</div>`:''}
 </div>`;}

function pickTier(name){

              include:prev.include!==false,
              // A negotiated price belongs to the tier it was negotiated on.
              // Carrying it across would quietly re-price Smartest at what
              // somebody agreed for Smart 1.
              note:prev.name===name?(prev.note||""):""};
 saveSoon();renderStep();}

 const t=S.suiteTier||{};

 return{name:listedTier.name,specs:listedTier.specs,listed,monthly,
        include:t.include!==false,note:t.note||"",

/* The Suite panel. It used to be three tiles and a sentence about the Suite
   being the campaign's nervous system -- true, and true of every proposal
   this tool has ever produced, which is why nobody read it. What it says now

function drawSuite(){
 const w=document.getElementById('suiteWrap');if(!w)return;

  : `<div class="note" style="margin-top:10px;color:#8c2f24"><b>Left off the quote.</b> The Investment Summary will show media and production only, and nothing in the proposal will offer the Suite.</div>`;
 const covered=cov.covered.length
  ? `<ul style="margin:8px 0 0 18px;padding:0">${cov.covered.map(r=>`<li style="margin-bottom:4px"><b>${esc(r.feature)}</b> — ${esc(r.detail)}</li>`).join('')}</ul>`
  : `<div class="note" style="margin-top:6px">Nothing — by their own answers they already have every part of the Suite this plan would lean on. Worth saying out loud before it goes on the quote.</div>`;
 const upgrade=cov.upgrade.length
  ? `<div class="note" style="margin-top:10px;color:#8c5a00"><b>A higher tier would also cover:</b> ${cov.upgrade.map(r=>esc(r.feature)+" ("+esc(r.tier)+")").join(' · ')}</div>` : '';
 const unmeasured=cov.unmeasured.length
  ? `<div class="note" style="margin-top:8px">Not measured — nobody answered ${cov.unmeasured.map(r=>esc(r.feature.toLowerCase())).join(', ')} in discovery${gapsN?', along with '+gapsN+' other question'+(gapsN===1?'':'s'):''}. An unanswered question is not a gap the Suite gets credit for closing.</div>` : '';
 w.innerHTML=`<div class="bpanel" style="margin-top:18px"><div class="ttl">🧠 Smart 1 Suite</div>
  <div class="note" style="margin-top:4px">Every lead the media produces lands here. Licensing is quoted separately from media on the proposal, so a client can tell what stops if they pause the campaign — and what does not.</div>
  <div class="cards c3" style="margin-top:10px">${SUITE_TIERS.map(t=>card("🧠",t.name+" · "+money(t.monthly)+"/mo",t.specs,st.name===t.name,`pickTier('${t.name}')`)).join('')}</div>
  <div class="basisrow" style="margin-top:12px">
   <span class="pill${st.include?' on':''}" onclick="setSuiteInclude(true)">On the quote</span>
   <span class="pill${st.include?'':' on'}" onclick="setSuiteInclude(false)">Leave it off</span>
  </div>

 </div>`;}
function drawPkgs(){const w=document.getElementById('pkgWrap');if(!w)return;
 w.innerHTML=S.packages.map((p,i)=>`<div class="pkg${i===S.selPkg?' on':''}" onclick="S.selPkg=${i};S.selectedPackage=S.packages[${i}];saveSoon();drawPkgs()">${p.rec?'<div class="flag">Recommended</div>':''}<div class="pn">${p.name}</div><div class="pp">${money(p.monthly)}<small>/mo</small></div><div class="ptot">${money(p.total)} over ${S.months} mo</div><ul>${p.lines.map(l=>`<li>${esc(l.name)}<b>${money(l.amt)}</b></li>`).join('')}<li>Est. impressions<b>${fmt(p.impr)}</b></li>${p.views?`<li>Est. video views<b>${fmt(p.views)}</b></li>`:''}</ul></div>`).join('');}

/* section editor */
function isRequired(s){return !!s.required||REQUIRED_SECTIONS.includes(s.id);}
function drawSections(){const host=document.getElementById('secList');if(!host)return;
 host.innerHTML=S.sections.map((s,i)=>{

   <div class="sbody">
    <textarea placeholder="${s.kind==='text'||s.kind==='cover'?'Section copy…':'Optional intro copy above the auto table…'}" onchange="S.sections[${i}].body=cleanCopy(this.value);saveSoon();drawSections()">${esc(s.body||'')}</textarea>
    <div class="airow"><input id="aiIns${i}" placeholder="✨ AI rewrite — e.g. shorter, friendlier, more ROI-focused"><button class="btn btn-ghost" style="padding:8px 13px" onclick="aiRewrite(${i})">✨ Rewrite</button></div>
   </div>
  </div>`;}).join('');}
function moveSec(i,d){const j=i+d;if(j<0||j>=S.sections.length)return;const t=S.sections[i];S.sections[i]=S.sections[j];S.sections[j]=t;saveSoon();drawSections();}
function delSec(i){
 // Guarded here as well as in the markup: Expected Results & ROI, the media
 // plan and the investment summary are required by the Smart 1 specification,
 // and the server puts a missing one back on the next save anyway.
 if(isRequired(S.sections[i])){toast("Every Smart 1 proposal includes this section — re-word it instead.");return;}
 if(!confirm("Delete the \""+S.sections[i].title+"\" section from this proposal?"))return;
 S.sections.splice(i,1);saveSoon();drawSections();}
function addSection(){S.sections.push({id:"custom"+Date.now(),title:"New Section",kind:"text",enabled:true,body:""});saveSoon();drawSections();}
/* Writes the proposal a section at a time, so the loader can name what it is
   working on. One request per section: a single spinner for a minute tells a
   rep nothing and looks hung, and one failed section no longer costs the
   other twelve. */
async function draftSections(){
 if(!CFG.ai_enabled){toast("Writing the copy needs OPENAI_API_KEY on the server.");return;}
 let plan;
 try{plan=(await api('/sales/builder/api/ai/section-plan',{method:'POST',body:JSON.stringify({data:S})})).sections||[];}
 catch(e){toast("Couldn't work out what to write: "+e.message);return;}
 if(!plan.length){toast("There are no sections to write.");return;}
 const written=plan.filter(p=>p.has_copy).length;
 if(written&&!confirm("Rewrite all "+plan.length+" sections? "+written+" already have copy, and their current text will be replaced."))return;

 const b=document.getElementById('draftBtn');if(b)b.disabled=true;
 S._drafting={total:plan.length,done:0,now:"",failed:[]};
 drawDraftProgress();
 for(const item of plan){
  S._drafting.now=item.title;drawDraftProgress();
  try{
   const d=await api('/sales/builder/api/ai/draft-sections',{method:'POST',
    body:JSON.stringify({data:S,section:item.id})});
   if(d.sections&&d.sections[item.id]){
    const ix=S.sections.findIndex(x=>x.id===item.id);
    if(ix>=0)S.sections[ix].body=d.sections[item.id];
   }else{
    // A section discarded for breaking a proposal rule is named, not
    // silently skipped -- otherwise it just looks like it wrote nothing.
    S._drafting.failed.push(item.title+((d.breaches&&Object.keys(d.breaches).length)?" (broke a proposal rule)":""));
   }
  }catch(e){S._drafting.failed.push(item.title+" ("+e.message+")");}
  S._drafting.done++;drawDraftProgress();
 }
 const failed=S._drafting.failed.slice();
 S._drafting=null;
 saveNow();renderStep();
 if(b)b.disabled=false;
 toast(failed.length?("Wrote "+(plan.length-failed.length)+" of "+plan.length+" — "+failed.length+" need another go.")
                    :("✨ Wrote all "+plan.length+" sections — read them before they go out."));
}
function drawDraftProgress(){
 const host=document.getElementById('draftProgress');if(!host)return;
 const d=S._drafting;
 if(!d){host.innerHTML='';return;}
 const pct=Math.round(100*d.done/Math.max(1,d.total));
 host.innerHTML=`<div class="bpanel" style="margin-bottom:14px">

/* What a line costs across the flight, honoring the basis the rep answered
   on the media-mix step. Both the review summary and the payload that builds
   the IO used to multiply by months independently, so a one-time production
   fee reached the insertion order as a monthly charge. */
function lineCampaign(i,months){
 const m=Math.max(1,+months||1),d=+i.dollars||0;
 if(i.basis==="one_time")return d;
 const term=Math.max(1,Math.min(m,+i.termMonths||m));
 return d*term;}
function lineForIO(i,months,withRate){
 const row={product:i.product,category:i.category,rate:i.rate,
  budget:i.basis==="one_time"?0:(+i.dollars||0),
  campaignBudget:lineCampaign(i,months),
  basis:i.basis||"monthly",
  termMonths:i.basis==="one_time"?1:Math.max(1,Math.min(Math.max(1,+months||1),+i.termMonths||Math.max(1,+months||1)))};
 /* The QUOTED rate. This sent the card's own rate, so an insertion order
    read "CPM 4.25" for a line the client had been quoted at $8.50 — the
    buy-side number on the document that bills the campaign. sellRateOf() is
    the one reading of it, mirrored by _sell_rate() server-side. */
 if(withRate){const sr=sellRateOf(i);
  row.listedRate=i.rate?(i.rate+" $"+(sr!=null?sr.toFixed(2):(i.rateValue||""))):"Managed/flat";}
 if(i.basis==="one_time")row.note="One-time cost of "+money(+i.dollars||0)+".";
 return row;}

function managementFeeForIO(){
 /* What the plan actually charges in fees, per month. A line with no CPM or
    CPV is a management or flat fee -- the rate card's own definition -- so
    the fee is the sum of those recurring lines. NONE where there are none,
    which is a real answer and the word the IO expects, rather than a blank
    that reads as somebody forgetting to ask. */
 const fees=(S_CONV_ITEMS()||[]).filter(i=>(i.basis||"monthly")!=="one_time"
                                        && sellRateOf(i)==null)
   .reduce((a,b)=>a+(+b.dollars||0),0);
 if(!fees)return "NONE";
 return money(fees)+" per month (on the plan)";}

 return{

  log('<span class="spin"></span>Generating the internal PDF…');
  const ip=await(await fetch(base+"/api/generate-internal-pdf",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})).json();
  if(!ip||!ip.ok)throw new Error("Internal PDF failed: "+((ip&&(ip.error||ip.detail))||"unknown"));
  log("✅ Internal PDF ready");
  let submitted=false;
  if(CONV.submit){
   log('<span class="spin"></span>Submitting to Smart 1 Suite / GoHighLevel…');
   const sub=Object.assign({},payload,{client_pdf_url:cp.url,internal_pdf_url:ip.url});
   const sr=await(await fetch(base+"/api/submit-io",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(sub)})).json();
   if(sr&&sr.ok){submitted=true;log("✅ Sent to Smart 1 Suite");}
   else log("⚠ Smart 1 Suite submit failed: "+esc((sr&&sr.error)||"unknown")+" — you can submit from the IO builder later.");
  }
  // save the answers back into the quote state + mark converted
  const st=Object.assign({},CONV.quote.data||{});
  st.clientContactName=CONV.answers.clientContactName;st.clientContactEmail=CONV.answers.clientContactEmail;st.clientContactPhone=CONV.answers.clientContactPhone;
  st.startDate=CONV.answers.startDate;st.endDate=CONV.answers.endDate;st.creativeSource=CONV.answers.creativeSource;st.creativeFee=CONV.answers.creativeFee;
  st.managementFeeAck=CONV.answers.managementFeeAck;st.landingUrl=CONV.answers.landingUrl||st.landingUrl;
  st.salesContact=CONV.answers.salesContact;st.salesEmail=CONV.answers.salesEmail;
  st.trackingPlan={primaryConversion:CONV.answers.primaryConversion,ga4:CONV.answers.ga4,callTracking:CONV.answers.callTracking,verifier:CONV.answers.verifier};
  log('<span class="spin"></span>Linking the IO back to '+esc(CONV.quote.quote_number)+'…');
  await api('/sales/builder/api/quotes/'+CONV.quote.id+'/converted',{method:'POST',body:JSON.stringify({io_number:orderNumber,client_pdf_url:cp.url||"",internal_pdf_url:ip.url||"",submitted,data:st})});
  log("✅ Quote marked Converted");
  CONV.result={io_number:orderNumber,client_pdf_url:cp.url,internal_pdf_url:ip.url,submitted};
  CONV.step=3;drawConvert();refreshLists();
 }catch(e){
  log("❌ "+esc(e.message));
  log('<br><button class="btn btn-back" onclick="CONV.step=1;drawConvert()">← Back</button> <span class="note">Nothing was saved to the quote. The IO API may be waking up (Render cold start) — try again in ~30 seconds, or finish this one in the IO builder tab.</span>');
 }
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
 drawRep();
 try{const c=await api('/sales/builder/api/config');CFG=Object.assign(CFG,c);}catch(e){}
 const savedIo=lsGet("s1_io_app_url","");if(savedIo)CFG.io_app_url=savedIo;

 // Deep links from Client 360 and from the retired /sales/proposals builder.
 // ?quote=<id> opens an existing quote; ?prefill=1&client=…&url=… starts a new
 // one with the client already filled in.
 const qs=new URLSearchParams(location.search);
 /* A ?quote= link outlives the quote: Client 360 links by id and a draft can
    be deleted. editQuote() toasts the refusal, but nothing after it drew a
    screen, so the rep landed on the empty dashboard shell — a blank page with
    a three-second toast, from a link that looked perfectly good. Fall back to
    the real dashboard so there is always a working screen behind the message. */
 if(qs.get('quote')){
  const opened=await editQuote(qs.get('quote'));
  if(!opened){nav('dashboard');toast("That proposal could not be opened — it may have been deleted. Here is the dashboard instead.");}
  return;}
 /* ?focus=<signal> — arriving from the Hub dashboard's pipeline card. The
    count there is only worth pressing if it lands on the rows it counted, so
    the list filters to exactly those quotes rather than to a status tab that
    is nearly the same thing. The ids come from the same reading the card
    used, so the two cannot disagree about what a signal means. */
 if(qs.get('focus')){await openFocus(qs.get('focus'));return;}
 if(qs.get('prefill')){
  await startNewProposal();
  const map={client:'client',url:'url',industry:'industry',
             contactName:'clientContactName',contactEmail:'clientContactEmail',
             contactPhone:'clientContactPhone',salesContact:'salesContact'};
  let filled=false;
  Object.keys(map).forEach(k=>{const v=(qs.get(k)||'').trim();if(v){S[map[k]]=v;filled=true;}});
  // city/state/zip arrive from Client 360 and describe where the client is, so
  // they seed the first target area rather than being dropped.
  const where=[qs.get('city'),qs.get('state')].filter(Boolean).join(', ')||(qs.get('zip')||'');
  if(where){
   const a=blankArea();a.origin=where;a.name=where;
   S.targetAreas=[a];S._areaIx=0;S._areaView="list";syncLegacyGeo();filled=true;
  }
  if(filled){saveNow();renderStep();toast("Client details filled from Client 360.");}
  return;
 }
 /* ?audit=<domain> — arriving from the Website Audit tool with the scan
    already run. The proposal opens on the customer step with the website
    filled in and the audit read, so the first thing a rep sees is the
    evidence rather than an empty form. Nothing is applied: "Use these
    answers" is still a press. */
 if(qs.get('audit')){
  await startNewProposal();
  S.url=(qs.get('audit')||'').trim();
  /* Two spellings of who this is for, because they mean different things.
     ?client= is a client already on the books (Client 360, the audit tool
     with a client picked) and opens the existing-client search attached to
     that name. ?company= is the prospect record's: a lead is a business
     nobody has on file yet, and naming it as `client` would open a search
     of the client list that finds nothing. */
  const named=(qs.get('client')||'').trim();
  const company=(qs.get('company')||'').trim();
  if(named){S.client=named;S.clientMode="existing";}
  else if(company){S.client=company;S.clientMode="new";}
  else{S.clientMode="new";}
  /* The lead's own contact details. The prospect record already holds who
     to talk to; arriving without them meant retyping what was on the
     screen behind you -- the gap ?prefill=1 closed for Client 360. */
  let carried = named || company ? 1 : 0;
  [['contactName','clientContactName'],['contactEmail','clientContactEmail'],
   ['contactPhone','clientContactPhone']].forEach(([k,f])=>{
   const v=(qs.get(k)||'').trim();
   if(v){S[f]=v;carried++;}
  });
  saveNow();
  step=1;                       // Customer & Industry, where the panel lives
  renderStep();
  await loadAudit();
  const age=(AUDIT&&AUDIT.age)||{};
  const carriedNote = carried ? " Details were carried over from the record." : "";
  toast((age.stale
   ? "This audit is "+age.age_days+" days old — run a new one before quoting from it."
   : "Audit read. Press “Use these answers” to take what it measured.")+carriedNote);
  return;
 }
 nav('dashboard');
})();
</script>
