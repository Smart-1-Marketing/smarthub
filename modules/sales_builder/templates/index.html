<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart 1 Sales Builder — Proposals &amp; Insertion Orders</title>
<style>
  :root{--navy:#1a2e58;--blue:#2563eb;--blue2:#1d4ed8;--sky:#eff6ff;--soft:#eff6ff;--accent:#e5a323;
    --ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--bg:#f4f6fa;--white:#fff;--good:#178653;--bad:#c0392b;
    --shadow:0 10px 30px rgba(20,40,75,.10)}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
  a{color:var(--blue)}
  .topbar{position:sticky;top:0;z-index:60;background:var(--navy);color:#fff}
  .topbar .wrap{max-width:1240px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:16px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;cursor:pointer}
  .brand .dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--blue2),#6da8ee);display:grid;place-items:center;font-size:13px;font-weight:800}
  .brand small{display:block;font-weight:600;font-size:10.5px;color:#9fb6d8;letter-spacing:1.5px;text-transform:uppercase}
  .topnav{display:flex;gap:4px;margin-left:26px}
  .topnav a{color:#c9d8ee;text-decoration:none;font-weight:700;font-size:13.5px;padding:8px 14px;border-radius:9px;cursor:pointer}
  .topnav a.on{background:rgba(255,255,255,.14);color:#fff}
  .topnav a:hover{background:rgba(255,255,255,.09)}
  .userchip{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:13px;color:#c9d8ee;cursor:pointer}
  .userchip .av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#3a2600;font-weight:800;display:grid;place-items:center;font-size:12px}
  .shell{max-width:1240px;margin:0 auto;padding:24px 22px 80px}
  h1{font-size:22px;color:var(--navy);margin:0}
  .pgsub{color:var(--muted);font-size:13.5px;margin-top:3px}
  .headrow{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .headrow .grow{flex:1;min-width:240px}
  .btn{border:0;cursor:pointer;font-weight:700;font-size:13.5px;padding:11px 18px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;font-family:inherit}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-gold{background:var(--accent);color:#3a2600}
  .btn-line{background:#fff;border:1px solid var(--line);color:var(--navy)}
  .btn-ghost{background:var(--sky);color:var(--navy)}
  .btn-good{background:var(--good);color:#fff}
  .btn-back{background:#fff;border:1px solid var(--line);color:var(--muted)}
  .btn:hover{filter:brightness(1.04)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:20px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 16px;box-shadow:var(--shadow)}
  .stat .lab{font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  .stat b{display:block;font-size:24px;color:var(--navy);margin-top:4px}
  .stat .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .stat .sub.up{color:var(--good);font-weight:700}
  .stat.gold{border-top:3px solid var(--accent)}
  .stat.blue{border-top:3px solid var(--blue)}
  .stat.green{border-top:3px solid var(--good)}
  .cols{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .panel .phead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .panel .phead .ttl{font-weight:800;color:var(--navy);font-size:14px}
  .panel .pbody{padding:16px 18px}
  .tabs{display:flex;gap:4px;background:var(--sky);border-radius:10px;padding:3px}

  .b-draft{background:#eef3f8;color:#53657a}
  .b-sent{background:#e8f1fd;color:var(--blue)}
  .b-approved{background:#eaf6ef;color:var(--good)}

  .rowact{display:flex;gap:6px;justify-content:flex-end}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#0d1b2f;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none;z-index:200;max-width:560px;text-align:center}
  /* ===== builder ===== */
  .bshell{max-width:960px;margin:0 auto}
  .bprog{height:5px;background:var(--sky);border-radius:4px;overflow:hidden;margin:6px 0 24px}

  .sub{color:var(--muted);font-size:15px;margin-bottom:6px}

  .choice:hover{border-color:#b9d0f5}.choice.on{border-color:var(--blue);background:#f6faff;box-shadow:0 8px 18px rgba(31,99,174,.14)}
  .choice .em{font-size:24px}.choice h3{margin:0 0 3px;font-size:15px;color:var(--navy)}.choice p{margin:0;font-size:12.5px;color:var(--muted)}
  .choice .tick{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}

  .fld{margin-top:14px;display:flex;flex-direction:column}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
  .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid #b7c7d8;background:#fff;border-radius:18px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;margin:6px 7px 0 0}
  .pill:hover{background:var(--sky)}.pill.on{border-color:var(--blue);background:#edf5ff;color:var(--navy)}.pill.on:before{content:"✓ ";color:var(--blue);font-weight:800}
  .addpill{display:flex;gap:8px;margin-top:11px;max-width:460px}.addpill input{flex:1;border:1px solid #b8c6d5;border-radius:18px;padding:9px 14px;font-size:13px}
  .bpanel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px;box-shadow:var(--shadow)}
  .bpanel .ttl{font-weight:800;color:var(--navy);font-size:13px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  .estgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:12px}
  .est{background:linear-gradient(180deg,#fbfdff,#eef4ff);border:1px solid var(--line);border-radius:11px;padding:15px;text-align:center}
  .est b{display:block;font-size:22px;color:var(--navy);font-weight:800}.est span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .prod{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:11px;background:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .prod .pi{width:38px;height:38px;border-radius:10px;background:var(--sky);color:var(--blue);display:grid;place-items:center;font-size:17px;flex:none}
  .prod .grow{flex:1;min-width:170px}.prod h4{margin:0;font-size:14px;color:var(--navy)}.prod .meta{font-size:12px;color:var(--muted)}
  .prod .alloc{text-align:right;min-width:120px}
  .prod .alloc input{width:92px;border:1px solid #b8c6d5;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:800;color:var(--navy);text-align:right}
  .prod .alloc small{display:block;font-weight:600;color:var(--muted);font-size:11px;margin-top:2px}
  .prod .x{background:#fff;border:1px solid var(--line);color:#c0392b;border-radius:8px;width:28px;height:28px;cursor:pointer;font-weight:800;flex:none}
  .addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.addrow select,.addrow input{border:1px solid #b8c6d5;border-radius:10px;padding:10px 12px;font-size:13px}
  .addrow select{max-width:300px}
  .reconfig{background:#fff8e8;border:1px solid #f0d69a;border-radius:11px;padding:13px 15px;margin-top:13px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .reconfig p{margin:0;font-size:13.5px;color:#7a5a10;flex:1;min-width:220px}

  .pkg:hover{border-color:#b9d0f5}.pkg.on{border-color:var(--blue);box-shadow:0 10px 24px rgba(31,99,174,.16)}
  .pkg .flag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--accent);color:#3a2600;font-size:10.5px;font-weight:800;padding:5px 13px;border-radius:999px;text-transform:uppercase}
  .pkg .pn{font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:1px;font-size:13px}
  .pkg .pp{font-size:26px;font-weight:800;margin:6px 0 0}.pkg .pp small{font-size:13px;color:var(--muted);font-weight:600}
  .pkg .ptot{font-size:12px;color:var(--muted);margin-bottom:9px}

  .pkg li{font-size:12.5px;padding:5px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;color:#33415C}

  .bnav .wrap{max-width:960px;margin:0 auto;padding:13px 22px;display:flex;justify-content:space-between;gap:12px;align-items:center}

  /* ============================================================
   PROPOSAL PREVIEW
   The document as the client will read it. Every section renders the same
   content the PDF will: prose where the section is prose, the real table
   where it is a table. A section can be edited in place, rewritten by the
   AI, or hidden -- and the media plan can be re-costed here rather than
   sending the rep back three steps to change one budget.
   ============================================================ */
function drawPreview(){
 const host=document.getElementById('docPreview');if(!host)return;
 const e=S.estimates||estimates();
 host.innerHTML=`<div class="paperdoc">
  <div class="docband">SMART 1 MARKETING</div>
  <h2 class="doctitle">Marketing Proposal — ${esc(S.client||'Client')}</h2>
  <div class="docsub">${esc(QUOTE_NUMBER||'Draft')} · ${esc(new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}))}${S.salesContact?' · Prepared by '+esc(S.salesContact):''}</div>
  ${S.sections.map((sec,i)=>previewSection(sec,i,e)).join('')}
 </div>`;}
function previewSection(sec,i,e){
 const req=isRequired(sec);
 const editing=S._editSec===sec.id;
 const tools=`<div class="dtools">
   <button class="ic" title="${editing?'Done editing':'Edit this section'}" onclick="toggleEditSec('${sec.id}')">${editing?'✓':'✎'}</button>
   <button class="ic" title="Rewrite with AI" onclick="rewriteSecById('${sec.id}')">✨</button>
   <button class="ic" title="${req?'Required — every Smart 1 proposal includes this':(sec.enabled?'Hide from the proposal':'Show in the proposal')}" ${req?'disabled style="opacity:.3;cursor:not-allowed"':''} onclick="${req?'':`toggleSec('${sec.id}')`}">${sec.enabled?'👁':'🚫'}</button>
  </div>`;
 if(!sec.enabled)
  return `<div class="docsec off"><div class="dhead"><h3>${esc(sec.title)}</h3>${tools}</div>
   <div class="note">Hidden — this section will not appear in the PDF.</div></div>`;
 const body=editing
  ? `<textarea class="dedit" oninput="S.sections[${i}].body=this.value;saveSoon()" placeholder="${sec.kind==='text'?'Section copy…':'Short intro above the table…'}">${esc(sec.body||'')}</textarea>`
  : (sec.body?`<div class="dbody">${esc(sec.body).replace(/\n/g,'<br>')}</div>`
             :`<div class="note dempty">No copy yet — ✨ writes it, or ✎ to type it.</div>`);
 return `<div class="docsec"><div class="dhead"><h3>${esc(sec.title)}</h3>${tools}</div>
  ${body}${previewTable(sec,e)}</div>`;}

/* The generated tables, rendered as the PDF renders them. These are never
   editable text: they are computed from the campaign, and a proposal whose
   prose and tables disagree is the failure the whole spec is built around. */
function previewTable(sec,e){
 const k=sec.kind;
 if(k==="areas"){const rows=(S.targetAreas||[]).filter(areaComplete);if(!rows.length)return '';
  return dtable(["Target area","Coverage","Est. population"],rows.map(a=>{
   const pop=areaPopulation(a),z=areaZips(a);
   return [esc(areaLabel(a)),esc(a.notes||(z.length?z.length+" ZIP Codes":a.type)),pop?fmt(pop):"<b>Not measured</b>"];}));}
 if(k==="reach")return dgrid([["Est. population",e.measured?fmt(e.pop):"—"],["Addressable audience",e.measured?fmt(e.aud):"—"],["Households",e.measured?fmt(e.hh):"—"],["Devices",e.measured?fmt(e.dev):"—"]]);
 if(k==="friction"){const picks=suggestions();if(!picks.length)return '';
  return dtable(["We suggest they should","Why"],picks.map(pk=>[esc(pk.title),esc(pk.detail)]));}
 if(k==="channels"){if(!S.items.length)return '';
  return dtable(["Channel","Role in the funnel","Primary KPI"],S.items.map(it=>{const r=channelRole(it);return [esc(it.product),esc(r[0]),esc(r[1])];}));}
 if(k==="creative"){const rows=creativeRows();if(!rows.length)return '';
  return dtable(["Medium","Campaign spend","Creative"],rows.map(r=>[esc(r.label),money(r.spend),esc(creativePhrase(r))]));}
 if(k==="timeline")return dtable(["Phase","What happens"],TIMELINE_PHASES.map(t=>[esc(t[0])+"<br>"+esc(t[1]),esc(t[2])]));
 if(k==="kpis")return S.kpis.length?`<div class="dnote">KPIs: ${esc(S.kpis.join(', '))}</div>`:'';
 if(k==="mediaplan")return mediaPlanEditor();
 if(k==="packages")return investmentTable();
 if(k==="roi")return roiTable();
 return '';}
function dtable(head,rows){
 return `<table class="dtbl"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`
  +rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')+`</tbody></table>`;}
function dgrid(pairs){
 return `<div class="dgrid">${pairs.map(p=>`<div><b>${p[1]}</b><span>${esc(p[0])}</span></div>`).join('')}</div>`;}
const TIMELINE_PHASES=[
 ["Weeks 1–2","Setup & Onboarding","Admin access collected, tracking pixels placed, conversion actions defined, audience and geography built, Smart 1 Suite provisioned."],
 ["Weeks 3–4","Production & Integration","Creative produced or supplied and approved, landing pages reviewed, workflow automations mapped in the Smart 1 Suite, tracking verified end to end before a cent is spent."],
 ["Month 2+","Execution & Scaling","Campaigns live, weekly pacing and bid optimisation, creative performance checks, budget shifted toward what proves out, first full performance review delivered."]];
function channelRole(it){
 const c=String(it.category||"").toUpperCase(),m=mediumOf(it);
 if(/SEARCH ENGINE MARKETING|PAY PER CLICK/.test(c))return ["Bottom of funnel — captures demand that is already searching","Cost per lead and conversion rate"];
 if(/SEARCH ENGINE OPTIMIZATION/.test(c))return ["Compounding — organic and AI-answer visibility","Ranked terms, map-pack visibility and organic leads"];
 if(/RETARGETING/.test(c))return ["Bottom of funnel — brings back the people who already came","Return visits and cost per conversion"];
 if(m==="video")return ["Top of funnel — builds awareness and trust on the screens the household already watches","Completed views and completion rate"];
 if(m==="audio")return ["Mid funnel — reaches the 79% of digital audio time spent with no screen at all","Reach, frequency and listen-through"];
 if(m==="social")return ["Mid funnel — consideration and re-engagement in feed","Engaged sessions and cost per lead"];
 if(m==="display")return ["Full funnel — precision targeting and retargeting against the people already in market","Click-through rate and cost per action"];
 return ["Supports the campaign","Cost per action"];}
function creativePhrase(r){
 if(r.answer==="has")return "Supplied by the client";

function mediaPlanEditor(){
 const months=Math.max(1,+S.months||1);
 return `<table class="dtbl editable"><thead><tr><th>Product</th><th>Category</th><th>Rate</th><th style="text-align:right">Monthly</th><th style="text-align:right">Total (${months} mo)</th><th></th></tr></thead><tbody>`
  +S.items.map((it,ix)=>`<tr>

    <td>${esc(it.rate?(it.rate+' '+(it.rateValue||'')):'Managed')}</td>
    <td style="text-align:right"><input class="dmoney" type="number" min="0" step="50" value="${it.dollars||0}" onchange="previewSetDollars(${ix},+this.value)"></td>

    <td><button class="x" title="Remove this product" onclick="previewRemoveItem(${ix})">✕</button></td></tr>`).join('')
  +`<tr class="dtot"><td colspan="3">Campaign total</td>
     <td style="text-align:right">${money(S.items.reduce((a,b)=>a+(+b.dollars||0),0))}</td>
     <td style="text-align:right">${money(S.items.reduce((a,b)=>a+(+b.dollars||0),0)*months)}</td><td></td></tr>`

    <span class="note" style="margin:0">Changing the plan here re-costs the packages, the ROI table and the creative gate.</span></div>
   ${previewGuards()}`;}
function previewSetDollars(ix,v){
 S.items[ix].dollars=Math.max(0,Math.round(v/50)*50);
 const tot=S.items.reduce((s,i)=>s+(i.dollars||0),0)||1;
 S.items.forEach(i=>{i.pctSeed=Math.round(100*(i.dollars||0)/tot)||1;});
 buildPackages();S.aiEst=S.aiEst;saveSoon();drawPreview();}
function previewRemoveItem(ix){
 const it=S.items[ix];
 if(!confirm('Remove "'+(it.product||'this product')+'" from the media plan?'))return;
 S.items.splice(ix,1);applySeeds();buildPackages();saveSoon();drawPreview();}
function previewAddItem(){
 const cat=document.getElementById('pvAddCat').value,p=findProduct(cat)||{};
 if(S.items.some(i=>i.category===cat)){toast("That category is already in the mix.");return;}
 S.items.push({label:p.label,category:cat,product:p.product||cat,rate:p.rateType,rateValue:p.rateValue,pctSeed:15,dollars:0});
 applySeeds();buildPackages();saveSoon();drawPreview();
 toast("Added — set its monthly budget.");}
function previewGuards(){
 const g=guardrailsJs(),need=creativeUnresolved();
 let h='';
 if(g.length)h+=`<div class="warnbox" style="margin-top:10px"><b>🛡 Guardrails</b>${g.map(x=>"⚠ "+esc(x)).join("<br>")}</div>`;
 if(need.length)h+=`<div class="gap" style="margin-top:10px"><b>🎬 Creative still to confirm</b><br>`
  +need.map(m=>esc(MEDIUM_LABEL[m].split(" (")[0])+" is in the plan and no spot has been confirmed.").join("<br>")+`</div>`;
 return h;}
function investmentTable(){
 const t=chosenTier(),media=S.items.reduce((a,b)=>a+(+b.dollars||0),0)||+((S.selectedPackage||{}).monthly||S.budget||0);
 const fees=creativeFees(),months=Math.max(1,+S.months||1);
 const recur=t.monthly+media,rows=[
  ["Smart 1 Suite — "+t.name,money(t.monthly),"Monthly"],
  ["Media spend",money(media),"Monthly"]];
 if(fees)rows.push(["Creative production",money(fees),"One-time"]);
 rows.push(["Total first month",money(recur+fees),""]);
 rows.push(["Total campaign ("+months+" mo)",money(recur*months+fees),""]);
 return dtable(["","Amount","Recurs"],rows.map(r=>[esc(r[0]),r[1],esc(r[2])]));}
function roiTable(){
 const months=Math.max(1,+S.months||1);
 let impr=0,views=0;const unpriced=[];
 const rows=S.items.map(it=>{
  const d=+it.dollars||0;let units=null,label="";
  if(it.rate==="CPM"&&it.rateValue>0){units=Math.round(d/it.rateValue*1000);label="impressions/month";impr+=units*months;}
  else if(it.rate==="CPV"&&it.rateValue>0){units=Math.round(d/it.rateValue);label="views/month";views+=units*months;}
  else unpriced.push(it.product);
  return [esc(it.product),money(d),money(d*months),units?fmt(units)+" "+label:"Not impression-based"];});
 if(!rows.length)return '';
 const bits=[];if(impr)bits.push(fmt(impr)+" impressions");if(views)bits.push(fmt(views)+" video views");
 rows.push(["<b>Campaign total</b>","<b>"+money(S.items.reduce((a,b)=>a+(+b.dollars||0),0))+"</b>",
            "<b>"+money(S.items.reduce((a,b)=>a+(+b.dollars||0),0)*months)+"</b>","<b>"+(bits.join(" · ")||"—")+"</b>"]);
 let h=dtable(["Product","Monthly","Campaign ("+months+" mo)","Estimated delivery"],rows);
 if(unpriced.length)h+=`<div class="dnote">Not in the delivery totals (no impression-based rate): ${esc(unpriced.join(', '))}.</div>`;
 const t=(S.traditional||{});
 if(t.running==="Yes"&&t.posture)h+=`<div class="dnote">${t.posture==="shift"
   ?"Every figure above is attributable to the channel that produced it. That is the difference worth weighing against the traditional spend."
   :"These figures cover the digital portion of the plan; they sit alongside the traditional buy rather than replacing it."}</div>`;
 return h;}
function toggleEditSec(id){S._editSec=S._editSec===id?null:id;saveNow();drawPreview();}
function toggleSec(id){
 const sec=S.sections.find(x=>x.id===id);if(!sec||isRequired(sec))return;
 sec.enabled=!sec.enabled;saveSoon();drawPreview();}
async function rewriteSecById(id){
 const i=S.sections.findIndex(x=>x.id===id);if(i<0)return;
 if(!CFG.ai_enabled){toast("AI rewriting needs OPENAI_API_KEY on the server.");return;}
 toast("✨ Rewriting "+S.sections[i].title+"…");
 try{
  const d=await api('/sales/builder/api/ai/draft-sections',{method:'POST',
   body:JSON.stringify({data:S,section:id})});
  if(d.sections&&d.sections[id]){S.sections[i].body=d.sections[id];saveNow();drawPreview();
   toast("✨ "+S.sections[i].title+" rewritten.");return;}
  toast((d.breaches&&Object.keys(d.breaches).length)?"The rewrite broke a proposal rule and was discarded.":"The AI returned nothing for that section.");
 }catch(e){toast("Rewrite failed: "+e.message);}}

/* Start an IO from a proposal we already sent. The proposal is the agreement;
   the IO is what makes it real, and retyping it is where the two drift apart.
   The reader resolves a stored proposal by client + id, so that is what
   travels — handing the IO builder an arbitrary URL to fetch would make it an
   SSRF hole, and the document is already ours. */
function uploadedToIO(pid){
 const x=UPLOADED.find(r=>String(r.id)===String(pid));
 if(!x){toast("That proposal is no longer in the list.");return;}
 if(!x.url){toast("That proposal has no file to read.");return;}
 window.open('/tools/io/?from_proposal='+encodeURIComponent(x.id||x.filename||'')
   +'&client='+encodeURIComponent(x.client||''),'_blank','noopener');
}

async function deleteUploaded(pid){
 const x=UPLOADED.find(r=>String(r.id)===String(pid));
 if(!x){return;}
 if(!confirm(`Remove "${x.filename||x.title}" from ${x.client||"the client"}'s record?

This deletes the uploaded proposal, not any quote built here.`))return;
 try{
  const r=await fetch('/api/client/proposals/update',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({client:x.client,id:x.id,delete:true})});
  const d=await r.json().catch(()=>({}));
  if(d.error){toast(d.error);return;}
  UPLOADED=UPLOADED.filter(r2=>String(r2.id)!==String(pid));
  toast("Proposal removed.");drawRows();
 }catch(e){toast("Could not remove it: "+e.message);}
}

function drawRows(){
 const q=(document.getElementById('q')?.value||"").toLowerCase();
 const rows=LIST.filter(x=>(listTab==="all"||x.status===listTab)&&(!q||[x.quote_number,x.client,x.website,x.products_summary,x.io_number].join(" ").toLowerCase().includes(q)));
 /* Uploaded proposals show under "all" and under their own tab. They have no
    Draft/Approved status, so filtering them by one would hide them entirely
    rather than say why they are missing. */
 const ups=(listTab==="all"||listTab==="Uploaded")
   ? UPLOADED.filter(x=>!q||[x.client,x.filename,x.title,x.note,x.uploaded_by].join(" ").toLowerCase().includes(q))
   : [];
 const merged=rows.map(x=>({x,html:rowHtml(x),t:x.created_at||""}))
   .concat(ups.map(x=>({x,html:uploadedRowHtml(x),t:x.date_sent||x.created_at||""})))
   .sort((a,b)=>String(b.t).localeCompare(String(a.t)));
 const tb=document.getElementById('rows');if(!tb)return;
 tb.innerHTML=merged.map(r=>r.html).join("")||`<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px">No quotes yet — click <b>✨ New Proposal</b> to build the first one.</td></tr>`;

async function aiDraft(){
 const v=(document.getElementById('aiAsk').value||"").trim();
 if(!v){toast("Type what you need — e.g. \"$6k/mo for an HVAC company in Carmel, lead gen\"");return;}
 if(!CFG.ai_enabled){toast("AI drafting is not configured on the server (OPENAI_API_KEY). Opening the guided builder instead.");startNewProposal();return;}
 toast("✨ Drafting the proposal…");
 try{
  const d=await api('/sales/builder/api/ai/draft-proposal',{method:'POST',body:JSON.stringify({prompt:v,categories:productCategories})});
  const dr=d.draft||{};
  await startNewProposal();
  S.client=dr.client||"";S.url=dr.url||"";S.industry=INDUSTRIES.includes(dr.industry)?dr.industry:"";
  S.objectives=(dr.objectives||[]).filter(o=>objectiveKPIs[o]);
  S.geoType=["City/ZIP + Radius","DMA","Statewide","National","Other"].includes(dr.geoType)?dr.geoType:"City/ZIP + Radius";
  S.geo=dr.geo||"";S.radius=+dr.radius||10;S.budget=+dr.budget||8000;S.months=+dr.months||6;
  const cats=(dr.categories||[]).filter(c=>productCategories.includes(c)).slice(0,4);
  if(cats.length){const seeds=[40,30,20,10];S.items=cats.map((c,i)=>{const p=findProduct(c)||{};return{label:p.label,category:c,product:p.product||c,rate:p.rateType,rateValue:p.rateValue,pctSeed:seeds[i]||10,dollars:0};});applySeeds();}
  S.kpis=[...new Set(S.objectives.flatMap(o=>objectiveKPIs[o]||[]))].slice(0,6);
  saveSoon();renderStep();
  toast("✨ Draft ready — review each step and adjust. "+(dr.rationale||""));
 }catch(e){toast("AI draft failed ("+e.message+"). Opening a blank builder.");startNewProposal();}
}

<script>
/* ============================================================
   BUILDER STATE + PERSISTENCE
   ============================================================ */
let S=null,QUOTE_ID=null,QUOTE_NUMBER="",step=0,_saveT=null,_lastStep=-1;
function freshState(){return{
 client:"",url:"",industry:"",descriptionMode:"Build one for me",description:"",
 objectives:[],kpis:[],exclusions:[],
 // One campaign, several places. geoType/geo/radius are kept in step with
 // targetAreas[0] on every save so anything not yet area-aware -- the IO
 // hand-off payload, an old saved quote being re-opened -- still reads a
 // correct campaign. hub/target_areas.py owns the same conversion server-side.
 targetAreas:[],geoType:"City/ZIP + Radius",geo:"",radius:10,population:0,
 ages:["25-34","35-44","45-54"],gender:"Both",income:["No income targeting"],
 audiences:[],budgetMode:"range",budget:8000,months:6,
 items:[],landingMode:"One landing page",landingUrl:"",landing:"",landingReview:"",
 // Per-medium creative answers, keyed "video"/"audio" -- see hub/creative_needs.py.
 // {answer:"has"|"client"|"comp", fee:number, confirmed:bool}
 creativePlan:{},suiteTier:{},
 packages:[],selPkg:1,selectedPackage:null,estimates:null,aiEst:null,
 // Discovery. The last three questions are the ones that change what we
 // recommend; `traditional` is the one with money behind it. Mirrors
 // hub/current_marketing.py.
 mkt:{seo:"",paidSearch:"",socialPosting:"",paidSocial:"",
      retargeting:"",aiOptimized:"",websiteHappy:""},
 traditional:{running:"",detail:"",budget:"",posture:""},
 suggestDismissed:[],
 sections:null,
 salesContact:REP_NAME||"",salesEmail:REP_EMAIL||"",
 clientContactName:"",clientContactEmail:"",clientContactPhone:"",
 startDate:"",endDate:"",creativeSource:"",creativeFee:"",managementFeeAck:"",
 trackingPlan:{primaryConversion:"",ga4:"",callTracking:"",verifier:""},
 dirty:false,keepAsIs:false,configured:false
};}
async function startNewProposal(){
 S=freshState();QUOTE_ID=null;QUOTE_NUMBER="";step=0;_lastStep=-1;S._areaView=null;S._areaIx=0;
 nav('builder');renderStep();
 try{const d=await api('/sales/builder/api/quotes',{method:'POST',body:JSON.stringify({data:S})});
  QUOTE_ID=d.quote.id;QUOTE_NUMBER=d.quote.quote_number;drawQuoteTag("Saved as "+QUOTE_NUMBER);}
 catch(e){drawQuoteTag("⚠ Not saved — server unreachable");}
}
async function editQuote(id){
 try{const d=await api('/sales/builder/api/quotes/'+id);editLoaded(d.quote);}catch(e){toast(e.message);}
}
function editLoaded(q){
 S=Object.assign(freshState(),q.data||{});QUOTE_ID=q.id;QUOTE_NUMBER=q.quote_number;step=0;_lastStep=-1;
 // A quote saved before multi-area targeting has its geography only in
 // geoType/geo/radius. The server already converted it (hub/target_areas
 // from_legacy) and sends the result, so re-opening an old quote shows its
 // target area rather than an empty list nobody entered.
 if(!(S.targetAreas||[]).length&&(q.target_areas||[]).length)S.targetAreas=q.target_areas;
 S._areaView=null;S._areaIx=0;
 nav('builder');renderStep();drawQuoteTag("Editing "+QUOTE_NUMBER+" · rev "+q.revision);
}
function drawQuoteTag(t){const el=document.getElementById('quoteTag');if(el)el.textContent=t;}
function saveSoon(){clearTimeout(_saveT);setSave("…");_saveT=setTimeout(saveNow,900);}
async function saveNow(extra){
 if(!S)return;
 // Stamped on save so the IO payload, the PDF and the dashboard all read the
 // same sentence rather than each re-deriving it.
 try{S.creativeSummary=creativeSummary();}catch(e){}
 setSave("Saving…");
 try{
  if(!QUOTE_ID){const d=await api('/sales/builder/api/quotes',{method:'POST',body:JSON.stringify({data:S})});QUOTE_ID=d.quote.id;QUOTE_NUMBER=d.quote.quote_number;}
  else await api('/sales/builder/api/quotes/'+QUOTE_ID,{method:'PUT',body:JSON.stringify(Object.assign({data:S},extra||{}))});
  setSave("✓ Saved "+(QUOTE_NUMBER||""));drawQuoteTag((QUOTE_NUMBER?QUOTE_NUMBER+" · ":"")+"autosaving");
 }catch(e){setSave("⚠ Not saved: "+e.message);}
}
function setSave(t){const el=document.getElementById('saveState');if(el)el.textContent=t;}

/* ============================================================
   WE SUGGEST THEY SHOULD — mirrors hub/current_marketing.py
   The discovery answers used to be captured and never read. These turn them
   into advice the rep can keep or dismiss, and what is kept reaches the
   proposal's Current Friction Points section.
   ============================================================ */
const DISCOVERY_QUESTIONS=[
 {key:"seo",label:"Doing SEO / local listings?"},
 {key:"paidSearch",label:"Running paid search (Google / Bing)?"},
 {key:"socialPosting",label:"Posting on social media regularly?"},
 {key:"paidSocial",label:"Running paid social media ads?"},
 {key:"retargeting",label:"Retargeting visitors to their website?"},
 {key:"aiOptimized",label:"Optimizing for AI search (AI Overviews, ChatGPT)?"},
 {key:"websiteHappy",label:"Happy with their website?"},
];
const SUGGESTION_RULES=[
 {key:"retargeting",when:["No","Unknown"],title:"Retarget the people who already visited",
  detail:"Someone who has already been to the site is the cheapest conversion available and the easiest audience to reach again. Website retargeting runs at $4.75 CPM on the card and needs only a pixel on the site."},
 {key:"aiOptimized",when:["No","Unknown"],title:"Get the site readable by AI search",
  detail:"Search is turning into an answer engine — AI Overviews, ChatGPT and Siri increasingly answer instead of linking. Being cited needs accurate schema markup, fast pages and clean directory listings across the local platforms."},
 {key:"websiteHappy",when:["No"],title:"Fix the page the media points at",
  detail:"Paid media cannot outrun a landing page that does not convert — it just buys more people to lose. If they are not happy with the site, that is the first thing to fix, before the budget scales."},
 {key:"seo",when:["No","Unknown"],title:"Claim the organic and map results",
  detail:"Paid media stops the day the budget stops. Local listings and organic visibility compound, and they feed the same review and ranking signals AI search reads."},
 {key:"paidSearch",when:["No"],title:"Capture the demand already searching",
  detail:"Everything else in this plan creates demand. Paid search catches the people who already have it and are typing the words right now — usually the lowest cost per lead on the plan."},
 {key:"paidSocial",when:["No"],title:"Re-engage in feed",
  detail:"Paid social is where an audience that has met the brand once gets met again, cheaply, with a different message."},
];
const TRADITIONAL_SUGGESTION={
 supplement:{key:"traditional",title:"Make the traditional buy measurable",
  detail:"They are already spending on traditional media. Digital around it is what makes the whole thing attributable: the same households reached on connected TV and streaming audio, with every response landing in the Smart 1 Suite where it can be counted."},
 shift:{key:"traditional",title:"Move some of the traditional budget where it can be counted",
  detail:"The traditional spend reaches people; what it cannot do is tell them which half worked. Shifting a portion into targeted digital keeps the reach and adds attribution — worth testing with a share of the budget rather than all of it."},
};
function suggestions(){
 const dismissed=S.suggestDismissed||[];
 const out=SUGGESTION_RULES.filter(r=>!dismissed.includes(r.key)&&r.when.includes(S.mkt[r.key]||""))
  .map(r=>({key:r.key,title:r.title,detail:r.detail}));
 const t=S.traditional||{};
 if(t.running==="Yes"&&!dismissed.includes("traditional")&&TRADITIONAL_SUGGESTION[t.posture])
  out.push(Object.assign({},TRADITIONAL_SUGGESTION[t.posture]));
 return out;}
function dismissSuggestion(key){
 S.suggestDismissed=(S.suggestDismissed||[]).concat([key]);saveSoon();renderStep();}
function restoreSuggestions(){S.suggestDismissed=[];saveSoon();renderStep();}
function traditionalReady(){
 const t=S.traditional||{};
 return t.running!=="Yes"||["supplement","shift"].includes(t.posture);}

/* ============================================================
   CREATIVE GATE — mirrors hub/creative_needs.py exactly
   Video and audio are asked about before they are priced. Display is not:
   a set of six banners is a $250 line off the rate card, while a :30 spot
   that does not exist is a launch date nobody can hit.
   ============================================================ */
const COMP_CONFIRM_UNDER=1500;
const TYPICAL_PRODUCTION={video:750,audio:250};
const MEDIUM_LABEL={video:"Video (CTV, streaming, YouTube, pre-roll)",
 audio:"Audio (digital radio, podcasts, streaming audio)",
 display:"Display",social:"Paid social",other:"Other"};
/* Four programmatic VIDEO products sit under the same DISPLAY category as
   banner inventory and their names do not say so -- "Programmatic - Targeted"
   is $17.00 CPM video while "Category" beside it is $4.25 display. Guessing
   from the category would price a video buy and never ask for a spot. */
const EXPLICIT_MEDIUM={"programmatic - ron (run of network)":"video",
 "programmatic - targeted":"video","premium: non-skippable":"video",
 "premium native video":"video"};
const CATEGORY_MEDIUM={"digital radio":"audio","ott":"video","youtube":"video"};
function mediumOf(i){
 const cat=String((i&&i.category)||"").trim().toLowerCase();
 if(CATEGORY_MEDIUM[cat])return CATEGORY_MEDIUM[cat];
 const prod=String((i&&i.product)||"").trim().toLowerCase();
 if(EXPLICIT_MEDIUM[prod])return EXPLICIT_MEDIUM[prod];
 const t=[cat,prod,String((i&&i.label)||"")].join(" ").toLowerCase();
 if(/radio|podcast|audio|spotify|pandora|iheart/.test(t))return "audio";
 if(/video|ott|youtube|trueview|bumper|connected tv|advanced tv|ctv|pre-?roll|non-skippable/.test(t))return "video";
 if(/facebook|instagram|meta|tik ?tok|linkedin|snapchat|pinterest|twitter|social/.test(t))return "social";
 if(/display|banner|retarget|geo-?fence|outreach|native|location lookback|ip target/.test(t))return "display";
 return "other";}
function mediumSpend(m){
 const months=Math.max(1,+S.months||1);
 return Math.round(S.items.filter(i=>mediumOf(i)===m)
  .reduce((sum,i)=>sum+(+i.dollars||0),0)*months);}
function gatedMedia(){
 const present=new Set(S.items.map(mediumOf));
 return ["video","audio"].filter(m=>present.has(m));}
function creativeRows(){
 return gatedMedia().map(m=>{
  const d=(S.creativePlan||{})[m]||{};
  const answer=["has","client","comp"].includes(d.answer)?d.answer:"";
  const spend=mediumSpend(m);
  const needsConfirm=spend<COMP_CONFIRM_UNDER;
  // A comp confirmed on a $1,400 buy is not a comp confirmed on the $300 one
 // it just became. confirmedAt records the number the rep was shown; the
 // confirmation lapses if the budget has fallen since.
 const confirmed=!!d.confirmed&&!(d.confirmedAt&&spend<d.confirmedAt);
  const fee=answer==="client"?(+d.fee||TYPICAL_PRODUCTION[m]||0):0;
  const resolved=!!answer&&!(answer==="comp"&&needsConfirm&&!confirmed);
  return{medium:m,label:MEDIUM_LABEL[m],spend,answer,fee,needsConfirm,confirmed,resolved};});}
function creativeUnresolved(){return creativeRows().filter(r=>!r.resolved).map(r=>r.medium);}
function creativeFees(){return creativeRows().reduce((s,r)=>s+(r.fee||0),0);}
function creativeSummary(){
 const rows=creativeRows();if(!rows.length)return "";
 return rows.map(r=>{const n=r.label.split(" (")[0];
  if(r.answer==="has")return n+": client supplies finished creative";
  if(r.answer==="client")return n+": Smart 1 produces ("+money(r.fee)+")";
  if(r.answer==="comp")return n+": Smart 1 produces at no charge";
  return n+": creative source not yet confirmed";}).join(" · ");}

/* ============================================================
   TARGET AREAS — a campaign runs in as many places as it runs in
   ============================================================ */
const AREA_TYPES=["City/ZIP + Radius","DMA","Statewide","National","Other"];
function uid(){return Math.random().toString(36).slice(2,10);}
function blankArea(){return{id:uid(),name:"",type:"City/ZIP + Radius",origin:"",radius:10,dma:"",state:"",other:"",zips:"",population:0,notes:""};}
function areaGeo(a){
 if(!a)return"";
 if(a.type==="City/ZIP + Radius"){const r=+a.radius||0;
  if(a.origin&&r)return a.origin+" + "+r+"-mile radius";
  return a.origin||(r?r+"-mile radius":"");}
 if(a.type==="DMA")return a.dma?(/dma/i.test(a.dma)?a.dma:a.dma+" DMA"):"";
 if(a.type==="Statewide")return a.state?a.state+" (statewide)":"Statewide";
 if(a.type==="National")return "National";
 return a.other||a.origin||"";}
function areaLabel(a){
 const g=areaGeo(a),n=(a&&a.name||"").trim();
 if(!n||!g)return g||n;
 if(n===g||g.toLowerCase().indexOf(n.toLowerCase())===0)return g;
 return n+" — "+g;}
function areaComplete(a){
 if(!a)return false;
 if(a.type==="Statewide")return !!(a.state||"").trim();
 if(a.type==="National")return true;
 if(a.type==="DMA")return !!(a.dma||"").trim();
 if(a.type==="Other")return !!((a.other||"").trim()||(a.zips||"").trim());
 return !!(a.origin||"").trim();}
function areaZips(a){return String((a&&a.zips)||"").match(/\b\d{5}\b/g)||[];}
function areaPopulation(a){
 if(!a)return null;
 if(+a.population>0)return +a.population;
 if(a.type==="City/ZIP + Radius"){const r=+a.radius||0;return r>0?Math.round(Math.PI*r*r*900):null;}
 if(a.type==="DMA")return a.dma?1200000:null;
 if(a.type==="Statewide")return 6500000;
 if(a.type==="National")return 335000000;
 return null;}
function areasSummary(){const rows=S.targetAreas||[];if(!rows.length)return "";
 const shown=rows.slice(0,2).map(areaLabel),rest=rows.length-shown.length;
 return shown.join(" · ")+(rest>0?" · +"+rest+" more":"");}
/* Keep the single-geo fields in step with the list. Everything downstream
   that predates multi-area targeting -- the IO payload, the review screen --
   reads these, and letting them drift is how a campaign silently loses three
   of its four locations at the hand-off. */
function syncLegacyGeo(){
 const rows=S.targetAreas||[];
 if(!rows.length){S.geo="";return;}
 const first=rows[0];
 S.geoType=first.type;S.radius=+first.radius||10;
 S.geo=rows.map(a=>{const z=areaZips(a);return areaLabel(a)+(z.length?" | ZIP Codes: "+z.join(", "):"");}).join("  ||  ");}

/* estimator (built-in fallback; the AI re-estimate sizes each area for real) */
function ageF(){const map={"18-24":.11,"25-34":.18,"35-44":.17,"45-54":.16,"55-64":.14,"65+":.13};return S.ages.length?S.ages.reduce((s,x)=>s+(map[x]||0),0):.78;}
function incF(){const has=S.income.filter(x=>x!=="No income targeting");if(!has.length)return 1;const m={"Under $50,000":.4,"$50,000–$74,999":.22,"$75,000–$99,999":.16,"$100,000–$149,999":.15,"$150,000–$199,999":.06,"$200,000+":.05};return Math.min(1,has.reduce((s,x)=>s+(m[x]||0),0))||.5;}
function computePopulation(){
 // Every area the campaign runs in, added up. Overlap is NOT deducted -- two
 // 10-mile radii five miles apart share most of their people -- so the number
 // is labelled an estimate wherever it appears.
 const rows=(S.targetAreas||[]).map(areaPopulation).filter(n=>n);
 return rows.length?rows.reduce((s,n)=>s+n,0):0;}
function estimates(){
 // The AI estimate is per area; totals come back from the server.
 if(S.aiEst&&S.aiEst.totals){const t=S.aiEst.totals;
  return{pop:+t.pop||0,aud:+t.aud||0,hh:+t.hh||0,dev:+t.dev||0,ai:true,
         measured:S.aiEst.measured,unmeasured:S.aiEst.unmeasured||[],note:S.aiEst.note||""};}
 const pop=computePopulation();
 // No sizeable area yet is "not measured", not zero. A clean-looking zero is
 // a wrong answer presented confidently.
 if(!pop)return{pop:0,aud:0,hh:0,dev:0,ai:false,measured:0,
                unmeasured:(S.targetAreas||[]).map(areaLabel)};
 const aud=Math.round(pop*.85*ageF()*incF());
 return{pop,aud,hh:Math.round(aud/1.9),dev:Math.round(aud*2.3),ai:false,
        measured:(S.targetAreas||[]).filter(a=>areaPopulation(a)).length,
        unmeasured:(S.targetAreas||[]).filter(a=>!areaPopulation(a)).map(areaLabel)};}
function productDelivery(rateValue,rateType,dollars){
 if(rateType==="CPM"&&rateValue>0)return{unit:"impr",val:Math.round(dollars/rateValue*1000)};
 if(rateType==="CPV"&&rateValue>0)return{unit:"views",val:Math.round(dollars/rateValue)};
 return{unit:"managed",val:0};}
function applySeeds(){const seed=S.items.reduce((s,i)=>s+(i.pctSeed||0),0)||1;
 S.items.forEach(i=>{i.dollars=Math.round(S.budget*(i.pctSeed/seed)/50)*50;});}
function buildPackages(){
 const tiers=[{k:"Essential",mult:.7},{k:"Recommended",mult:1,rec:true},{k:"Accelerated",mult:1.5}];
 const seed=S.items.reduce((s,i)=>s+(i.pctSeed||0),0)||1;
 S.packages=tiers.map(t=>{
  const monthly=Math.round(S.budget*t.mult/250)*250;
  const lines=S.items.map(i=>{const dollars=Math.round(monthly*(i.pctSeed/seed)/50)*50;
   const d=productDelivery(i.rateValue,i.rate,dollars*S.months);
   return{name:i.product,cat:i.category,amt:dollars,unit:d.unit,val:d.val};});
  const impr=lines.filter(l=>l.unit==="impr").reduce((s,l)=>s+l.val,0);
  const views=lines.filter(l=>l.unit==="views").reduce((s,l)=>s+l.val,0);
  const roi=t.mult<1?"2–3×":t.mult>1?"4–6×":"3–5×";
  return{name:t.k,rec:!!t.rec,monthly,total:monthly*S.months,lines,impr,views,roi};});
 S.configured=true;
 if(S.selPkg==null||S.selPkg>2)S.selPkg=1;
 S.selectedPackage=S.packages[S.selPkg];
}
function recommendItems(){
 const cats=[];S.objectives.forEach(o=>(GOAL_CATEGORIES[o]||[]).forEach(c=>{if(!cats.includes(c))cats.push(c);}));
 const chosen=cats.slice(0,4),seeds=[40,30,20,10];
 S.items=chosen.map((c,i)=>{const p=findProduct(c)||{};return{label:p.label,category:c,product:p.product||c,rate:p.rateType,rateValue:p.rateValue,pctSeed:seeds[i]||10,dollars:0};});
 applySeeds();}
function guardrailsJs(){
 const warns=[];
 S.items.forEach(i=>{if((i.category||"").includes("SEARCH ENGINE MARKETING")&&i.dollars>0&&i.dollars<1500)warns.push("Search budget "+money(i.dollars)+"/mo is below the $1,500 monthly minimum.");});
 if(S.months<3)warns.push("Campaign term under 3 months — most Smart 1 programs need 3+ months to optimize.");
 if(S.items.length>4&&S.budget/Math.max(S.items.length,1)<750)warns.push("Budget is split across many products — consider fewer products for impact.");
 if((S.creativeSource||"").startsWith("Smart 1")&&!S.creativeFee)warns.push("Smart 1 is building creative but no creative fee is set.");
 return warns;}

 if(g.includes("Store Visits"))return "A location page with map, hours, click-to-call, and Get Directions. Ensure the Google Business Profile is claimed and consistent.";
 return "A focused landing page aligned to the offer with a single primary CTA and a retargeting pixel installed.";}

function card(em2,t,d,on,click){return `<div class="choice${on?' on':''}" onclick="${click}"><div class="em">${em2}</div><div><h3>${t}</h3><p>${d}</p></div><div class="tick"></div></div>`;}
function pillRow(list,arr,kind){return '<div>'+list.map(v=>`<span class="pill${arr.includes(v)?' on':''}" onclick="pill('${kind}',this.dataset.v)" data-v="${esc(v)}">${esc(v)}</span>`).join('')+'</div>';}
function opt(list,cur){return list.map(x=>`<option ${cur===x?'selected':''}>${esc(x)}</option>`).join('');}
function seg(label,key){
 // "__traditional" is the one question that does not live on S.mkt: its
 // answer opens a whole sub-form, so it is kept with its detail and posture.
 const trad=key==="__traditional";
 const cur=trad?((S.traditional||{}).running||""):S.mkt[key];
 const set=trad?"setTraditional('running',":"setMkt('"+key+"',";
 return `<div class="fld"><label>${label}</label><div>`
  +["Yes","No","Unknown"].map(o=>`<span class="pill${cur===o?' on':''}" onclick="${set}'${o}')">${o}</span>`).join('')
  +`</div></div>`;}
function setMkt(key,value){S.mkt[key]=value;saveSoon();renderStep();}
function setTraditional(key,value){
 S.traditional=Object.assign({},S.traditional,{[key]:value});
 // Answering "No" or "Unknown" clears a posture chosen earlier, so a stale
 // "move their budget" cannot survive the answer that made it meaningless.
 if(key==="running"&&value!=="Yes")S.traditional.posture="";
 saveSoon();
 if(key==="detail"||key==="budget")syncNext();else renderStep();}

function renderStep(){
 if(!S)return;
 const d=STEPS[step]();window._entering=(_lastStep!==step);_lastStep=step;
 window._stepDesc=d;
 const st=document.getElementById('stage');
 st.innerHTML=`<div class="eyebrow">${d.eyebrow}</div><h1 class="q">${d.title}</h1><div class="sub">${d.sub}</div>${d.html}`;
 document.getElementById('stepLabel').textContent='Step '+(step+1)+' of '+STEPS.length;
 document.getElementById('bar').style.width=((step+1)/STEPS.length*100)+'%';
 // Back stays available inside a sub-flow even on step 0 of the wizard,
 // because there it means "back out of this area", not "leave the wizard".
 document.getElementById('backBtn').style.visibility=(step===0&&!d.onBack)?'hidden':'visible';
 document.getElementById('nextBtn').textContent=d.nextLabel||(d.isLast?'Finish & back to dashboard':'Continue →');
 if(d.after)d.after();window._valid=d.valid;syncNext();window.scrollTo(0,0);
}
function syncNext(){const b=document.getElementById('nextBtn');if(b)b.disabled=window._valid?!window._valid():false;}
function nextStep(){
 const d=STEPS[step]();
 if(d.valid&&!d.valid())return;
 // A step can handle Continue itself -- the target-area editor saves the area
 // and returns to the list rather than advancing the wizard.
 if(d.onNext&&d.onNext()===true)return;
 saveNow();
 if(step<STEPS.length-1){step++;renderStep();}
 else{toast("Saved. "+(QUOTE_NUMBER||"")+" is on the dashboard.");nav('dashboard');}}
function prevStep(){
 const d=window._stepDesc||STEPS[step]();
 if(d.onBack&&d.onBack()===true)return;   // the step walked its own sub-flow
 if(step>0){step--;renderStep();}}

/* creative gate widgets */
function creativeCard(r){
 const n=r.label.split(" (")[0];
 const pick=(v,em2,t,d)=>card(em2,t,d,r.answer===v,`setCreative('${r.medium}','${v}')`);
 let html=`<div class="bpanel"><div class="ttl">🎬 ${esc(r.label)} — ${money(r.spend)} over ${S.months} month${S.months===1?'':'s'}</div>
  <div class="cards c3" style="margin-top:10px">
   ${pick("has","✅","They have creative","Finished "+n.toLowerCase()+" spots we can traffic")}
   ${pick("client","💳","They'll pay for it","Smart 1 produces it — the fee goes on this proposal")}
   ${pick("comp","🎁","We comp it","Smart 1 absorbs the production cost")}
  </div>`;
 if(r.answer==="client"){
  html+=`<div class="fld" style="margin-top:12px"><label>Production fee for ${esc(n.toLowerCase())}</label>
   <input type="number" min="0" step="25" value="${r.fee}" oninput="setCreativeFee('${r.medium}',+this.value)" style="max-width:200px">
   <div class="note" style="margin-top:5px">Starting point — ${esc(n)} production is a custom quote, so change it to whatever was agreed.</div></div>`;}
 if(r.answer==="comp"){
  html+=r.needsConfirm
   ? `<div class="warnbox" style="margin-top:12px"><b>⚠ ${money(r.spend)} ${esc(n.toLowerCase())} campaign — are you sure you want to comp this?</b>
      Smart 1 would be producing ${esc(n.toLowerCase())} creative at no charge on a campaign under ${money(COMP_CONFIRM_UNDER)}, which is below where a comp usually pays for itself.
      <div style="margin-top:9px;display:flex;gap:9px;flex-wrap:wrap">
       ${r.confirmed
         ? `<span class="pill on" style="cursor:default">✓ Confirmed — Smart 1 comps this</span><button class="btn btn-line" onclick="setCreative('${r.medium}','client')">Actually, charge for it</button>`
         : `<button class="btn btn-gold" onclick="confirmComp('${r.medium}')">Yes — comp it anyway</button>
            <button class="btn btn-line" onclick="setCreative('${r.medium}','client')">No — the client pays</button>`}
      </div></div>`
   : `<div class="note" style="margin-top:12px">${money(r.spend)} is above the ${money(COMP_CONFIRM_UNDER)} mark, so the comp is recorded without a second question.</div>`;}
 return html+`</div>`;}
function setCreative(medium,answer){
 S.creativePlan=S.creativePlan||{};
 const prev=S.creativePlan[medium]||{};
 // Changing the answer clears the confirmation: a comp confirmed at one
 // budget must not stay confirmed after the plan moves underneath it.
 S.creativePlan[medium]={answer,fee:answer==="client"?(+prev.fee||TYPICAL_PRODUCTION[medium]||0):0,confirmed:false};
 saveSoon();renderStep();}
function setCreativeFee(medium,v){
 S.creativePlan[medium]=Object.assign({},S.creativePlan[medium],{fee:Math.max(0,v||0)});
 saveSoon();syncNext();}
function confirmComp(medium){
 S.creativePlan[medium]=Object.assign({},S.creativePlan[medium],
  {confirmed:true,confirmedAt:mediumSpend(medium),confirmed_at:mediumSpend(medium)});
 saveNow();renderStep();toast("Recorded — the comp is noted on the quote and the IO.");}

function drawEst(){const e=estimates();const g=document.getElementById('estGrid');if(!g)return;
 const L=S._aiLoading?' loading':'';
 // An unmeasured campaign shows a dash, not a zero. "0 households" reads as a
 // finding; it is the absence of one.
 const val=n=>S._aiLoading?'—':(e.measured?fmt(n):'—');
 g.innerHTML=`<div class="est${L}"><b>${val(e.pop)}</b><span>Est. population</span></div><div class="est${L}"><b>${val(e.aud)}</b><span>Addressable audience</span></div><div class="est${L}"><b>${val(e.hh)}</b><span>Households</span></div><div class="est${L}"><b>${val(e.dev)}</b><span>Devices</span></div>`;
 const n=document.getElementById('popNote');
 if(n){
  if(S._aiLoading)n.innerHTML='<span class="spin"></span>Smart 1 is sizing '+((S.targetAreas||[]).length>1?'each target area':'this area')+'…';
  else{
   const bits=[];
   bits.push(e.ai?"✨ Smart 1 AI estimate, per area.":"Built-in estimate — the AI re-estimate sizes each area for real.");
   if(e.note)bits.push(e.note);
   if((e.unmeasured||[]).length)bits.push("Not measured: "+e.unmeasured.join(", ")+".");
   n.textContent=bits.join(" ");}}
 const b=document.getElementById('areaBreakdown');
 if(b){
  const rows=(S.aiEst&&S.aiEst.areas)||null;
  b.innerHTML=(rows&&rows.length>1)
   ? '<div style="margin-top:10px;font-size:12.5px;color:#33415C">'+rows.map(r=>
      '<div style="display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--line)"><span>'+esc(r.label)+'</span><b>'
      +(r.measured?fmt(r.aud)+' addressable':'not measured')+'</b></div>').join('')+'</div>'
   : '';}
 S.estimates=e;}
async function estimateAudienceAI(){
 const ready=(S.targetAreas||[]).filter(areaComplete);
 if(!ready.length){toast("Add a target area first.");return;}
 S._aiLoading=true;drawEst();
 try{const d=await api('/sales/builder/api/estimate-audience',{method:'POST',
   body:JSON.stringify({areas:ready,industry:S.industry,gender:S.gender,ages:S.ages,income:S.income})});
  S.aiEst=d;S._aiLoading=false;drawEst();saveSoon();
  toast(d.ai?("✨ Smart 1 sized "+d.measured+" area"+(d.measured===1?"":"s")+".")
            :("Sized "+d.measured+" area"+(d.measured===1?"":"s")+" from the built-in model."));
 }catch(e){S.aiEst=null;S._aiLoading=false;drawEst();toast("Couldn't reach the AI ("+e.message+"). Showing the built-in estimate.");}}
async function generateDesc(){
 const b=document.getElementById('descBtn');if(b){b.disabled=true;b.innerHTML='<span class="spin"></span>Generating…';}
 try{const d=await api('/sales/builder/api/generate-business-description',{method:'POST',
   body:JSON.stringify({urls:[S.url].filter(Boolean),client:S.client,industry:S.industry,
                        areas:(S.targetAreas||[]).filter(areaComplete),geo:S.geo,brandfetch:{}})});
  if(d&&d.description){S.description=d.description;S.descriptionWarnings=d.warnings||[];saveSoon();renderStep();

/* Writes the proposal a section at a time, so the loader can name what it is
   working on. One request per section: a single spinner for a minute tells a
   rep nothing and looks hung, and one failed section no longer costs the
   other twelve. */
async function draftSections(){
 if(!CFG.ai_enabled){toast("Writing the copy needs OPENAI_API_KEY on the server.");return;}
 let plan;
 try{plan=(await api('/sales/builder/api/ai/section-plan',{method:'POST',body:JSON.stringify({data:S})})).sections||[];}
 catch(e){toast("Couldn't work out what to write: "+e.message);return;}
 if(!plan.length){toast("There are no sections to write.");return;}
 const written=plan.filter(p=>p.has_copy).length;
 if(written&&!confirm("Rewrite all "+plan.length+" sections? "+written+" already have copy, and their current text will be replaced."))return;

 const b=document.getElementById('draftBtn');if(b)b.disabled=true;
 S._drafting={total:plan.length,done:0,now:"",failed:[]};
 drawDraftProgress();
 for(const item of plan){
  S._drafting.now=item.title;drawDraftProgress();
  try{
   const d=await api('/sales/builder/api/ai/draft-sections',{method:'POST',
    body:JSON.stringify({data:S,section:item.id})});
   if(d.sections&&d.sections[item.id]){
    const ix=S.sections.findIndex(x=>x.id===item.id);
    if(ix>=0)S.sections[ix].body=d.sections[item.id];
   }else{
    // A section discarded for breaking a proposal rule is named, not
    // silently skipped -- otherwise it just looks like it wrote nothing.
    S._drafting.failed.push(item.title+((d.breaches&&Object.keys(d.breaches).length)?" (broke a proposal rule)":""));
   }
  }catch(e){S._drafting.failed.push(item.title+" ("+e.message+")");}
  S._drafting.done++;drawDraftProgress();
 }
 const failed=S._drafting.failed.slice();
 S._drafting=null;
 saveNow();renderStep();
 if(b)b.disabled=false;
 toast(failed.length?("Wrote "+(plan.length-failed.length)+" of "+plan.length+" — "+failed.length+" need another go.")
                    :("✨ Wrote all "+plan.length+" sections — read them before they go out."));
}
function drawDraftProgress(){
 const host=document.getElementById('draftProgress');if(!host)return;
 const d=S._drafting;
 if(!d){host.innerHTML='';return;}
 const pct=Math.round(100*d.done/Math.max(1,d.total));
 host.innerHTML=`<div class="bpanel" style="margin-bottom:14px">
  <div class="ttl"><span class="spin"></span> Writing the proposal — ${d.done} of ${d.total} sections</div>
  <div class="progress" style="margin-top:9px"><div class="bar" style="width:${pct}%"></div></div>
  <div class="note" style="margin-top:7px">${d.now?'Now writing: <b>'+esc(d.now)+'</b>':'Starting…'}</div>
  ${d.failed.length?`<div class="note" style="color:#8a6410">Needs another go: ${d.failed.map(esc).join(', ')}</div>`:''}</div>`;}

   <ol style="font-size:13px;color:#33415C;padding-left:20px;line-height:1.7">
    <li>The IO API issues the next order number (10200 series) — same counter the IO builder uses.</li>
    <li>The customer PDF and internal PDF are generated and stored in client gallery, exactly like a hand-built IO.</li>
    <li>${CONV.submit?"The finished IO is sent to Smart 1 Suite / GoHighLevel.":"The IO is prepared but NOT sent to Smart 1 Suite (you can submit from the IO builder later)."}</li>
    <li>${esc(q.quote_number)} is marked <b>Converted</b> and linked to the new IO number.</li>
   </ol>
   <div class="dsec">IO summary</div>
   <ul class="kv2">
    <li><span>Client</span><b>${esc(st.client||"")} · ${esc(a.clientContactName||"—")}</b></li>
    <li><span>Dates</span><b>${esc(a.startDate||"—")} → ${esc(a.endDate||"ongoing")}</b></li>
    <li><span>Products</span><b>${items.map(i=>esc(i.product)+" ("+money(i.budget)+"/mo)").join("<br>")}</b></li>
    <li><span>Monthly / total</span><b>${money(items.reduce((s,i)=>s+i.budget,0))} · ${money(items.reduce((s,i)=>s+i.campaignBudget,0))}</b></li>
    <li><span>Creative</span><b>${esc(a.creativeSource||"—")}</b></li>
    <li><span>Tracking</span><b>${esc(a.primaryConversion||"—")} · GA4: ${esc(a.ga4||"?")}</b></li>
   </ul>
   <label style="display:flex;gap:9px;align-items:center;margin-top:14px;font-size:13.5px;font-weight:700;color:var(--navy)">
    <input type="checkbox" ${CONV.submit?"checked":""} onchange="CONV.submit=this.checked" style="width:17px;height:17px">
    Also submit the finished IO to Smart 1 Suite / GoHighLevel now</label>`;
  foot.innerHTML=`<button class="btn btn-back" onclick="CONV.step=0;drawConvert()">← Back</button>
   <button class="btn btn-gold" onclick="runConvert()">🔁 Create the IO</button>`;
 }else if(CONV.step===2){
  body.innerHTML=`<div class="dsec">Working…</div><div id="convLog" style="font-size:13px;color:#33415C;line-height:2"></div>`;
  foot.innerHTML="";
 }else{
  const r=CONV.result||{};
  body.innerHTML=`<div style="text-align:center;padding:14px 0">
   <div style="font-size:44px">✅</div>
   <h3 style="color:var(--navy);margin:8px 0 4px">IO #${esc(r.io_number||"?")} created from ${esc(q.quote_number)}</h3>
   <p style="color:var(--muted);font-size:13.5px">${r.submitted?"Sent to Smart 1 Suite / GoHighLevel.":"Prepared — not yet submitted to Smart 1 Suite."}</p>
   <div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:12px">
    ${r.client_pdf_url?`<a class="btn btn-line" href="${esc(r.client_pdf_url)}" target="_blank">📄 Customer PDF</a>`:""}
    ${r.internal_pdf_url?`<a class="btn btn-line" href="${esc(r.internal_pdf_url)}" target="_blank">🔒 Internal PDF</a>`:""}
   </div></div>`;
  foot.innerHTML=`<button class="btn btn-primary" onclick="convClose();nav('dashboard')">Done</button>`;
 }
}
function convToReview(){
 const a=CONV.answers,need=[];
 if(!a.clientContactName&&!a.clientContactEmail)need.push("client contact");
 if(!a.startDate)need.push("start date");
 if(!a.creativeSource)need.push("creative source");
 if(need.length){toast("Still needed before the IO: "+need.join(", ")+".");return;}
 CONV.step=1;drawConvert();
}
function ioDataPayload(){
 const st=CONV.quote.data||{},a=CONV.answers,q=CONV.quote;
 const items=(st.items||[]).map(i=>({product:i.product,category:i.category,rate:i.rate,listedRate:i.rate?(i.rate+" "+(i.rateValue||"")):"Managed/flat",budget:i.dollars||0,campaignBudget:(i.dollars||0)*(st.months||1)}));
 const monthly=items.reduce((s,i)=>s+(i.budget||0),0);
 const total=items.reduce((s,i)=>s+(i.campaignBudget||0),0);
 const customerRequirements=[
  "Confirm the campaign start date"+(a.startDate?" ("+a.startDate+")":""),
  (a.creativeSource||"").startsWith("Client")?"Provide finished creative assets in the required sizes":"Approve Smart 1-built creative before launch",
  "Provide access for tracking verification (GA4 / site access)"+(a.ga4==="No"?" — GA4 needs to be installed":""),
  "Confirm the landing page: "+(a.landingUrl||st.landingUrl||"TBD"),
  "Review and sign the insertion order"];
 const internalRequirements=items.map(i=>({title:i.product+" — "+i.category,items:[
  "Monthly budget: "+money(i.budget)+" · campaign total: "+money(i.campaignBudget),
  "Geography: "+((st.targetAreas||[]).length?(st.targetAreas||[]).map(areaLabel).join(" | "):(st.geo||st.geoType||"")),
  "Audience: "+((st.audiences||[]).join(", ")||"per proposal"),
  "Landing page: "+(a.landingUrl||st.landingUrl||"TBD"),
  "KPIs: "+((st.kpis||[]).join(", ")||""),
  "Creative: "+(st.creativeSummary||"display/social only")]}));
 const trackingPlan={primaryConversion:a.primaryConversion,secondaryConversions:[],ga4:a.ga4,gtm:"",callTracking:a.callTracking,thankYouPage:"",offlineImport:"",verifier:a.verifier};
 return{
  ioType:"Converted Proposal",client:st.client,url:st.url,
  clientContactName:a.clientContactName,clientContactEmail:a.clientContactEmail,clientContactPhone:a.clientContactPhone,
  salesContact:a.salesContact,salesEmail:a.salesEmail,
  sameDates:true,start:a.startDate,end:a.endDate||"Ongoing",
  objectives:st.objectives||[],kpis:st.kpis||[],
  // Every target area, not the first one with a radius glued on. targetAreas
  // is what the IO builder reads now; geo stays as the one-string form the
  // IO PDF and the Suite webhook have always taken.
  targetAreas:st.targetAreas||[],geo:st.geo||"",
  audiences:st.audiences||[],incomes:st.income||[],dayparting:"",
  creativeSource:a.creativeSource,creativeFee:a.creativeFee,managementFee:a.managementFeeAck,
  // What the creative gate decided, per medium, so trafficking knows which
  // spots to expect and who agreed to pay for them.
  creativePlan:st.creativePlan||{},creativeSummary:(st.creativeSummary||""),
  suiteTier:st.suiteTier||{},
  exclusions:(st.exclusions||[]).join(", "),
  landingPageMode:st.landingMode,landingPage:a.landingUrl||st.landingUrl,
  landingPageReviews:st.landingReview?[{product:"Campaign landing page",url:a.landingUrl||st.landingUrl,review:st.landingReview}]:[],
  items,creativeUploads:[],brandfetch:{},
  monthlySpendFormatted:money(monthly)+" / month",totalCampaignBudgetFormatted:money(total),
  trackingPlan,guardrailWarnings:(CONV.quote.guardrails||[]).map(g=>({message:g})),
  internalWarnings:["Converted from proposal "+q.quote_number+" in Smart 1 Sales Builder."],
  customerRequirements,internalRequirements,
  mediaMixRecommendation:{},naming:{},campaignOwner:a.salesContact,
  sourceQuote:q.quote_number};
}
async function runConvert(){
 CONV.step=2;drawConvert();
 const log=m=>{const el=document.getElementById('convLog');if(el)el.innerHTML+=m+"<br>";};
 const base=CFG.io_api_base;
 try{
  log('<span class="spin"></span>Requesting the next IO order number…');
  const on=await(await fetch(base+"/api/next-order-number",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})).json();
  if(!on||!on.order_number)throw new Error("The IO API did not return an order number.");
  const orderNumber=on.order_number;
  log("✅ Order number <b>#"+esc(orderNumber)+"</b>"+(on.warning?" <span style='color:#8a6410'>("+esc(on.warning)+")</span>":""));
  const payload=ioDataPayload();payload.orderNumber=orderNumber;
  log('<span class="spin"></span>Generating the customer PDF…');
  const cp=await(await fetch(base+"/api/generate-client-pdf",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})).json();
  if(!cp||!cp.ok)throw new Error("Customer PDF failed: "+((cp&&(cp.error||cp.detail))||"unknown"));
  log("✅ Customer PDF ready");
  log('<span class="spin"></span>Generating the internal PDF…');
  const ip=await(await fetch(base+"/api/generate-internal-pdf",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})).json();
  if(!ip||!ip.ok)throw new Error("Internal PDF failed: "+((ip&&(ip.error||ip.detail))||"unknown"));
  log("✅ Internal PDF ready");
  let submitted=false;
  if(CONV.submit){
   log('<span class="spin"></span>Submitting to Smart 1 Suite / GoHighLevel…');
   const sub=Object.assign({},payload,{client_pdf_url:cp.url,internal_pdf_url:ip.url});
   const sr=await(await fetch(base+"/api/submit-io",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(sub)})).json();
   if(sr&&sr.ok){submitted=true;log("✅ Sent to Smart 1 Suite");}
   else log("⚠ Smart 1 Suite submit failed: "+esc((sr&&sr.error)||"unknown")+" — you can submit from the IO builder later.");
  }
  // save the answers back into the quote state + mark converted
  const st=Object.assign({},CONV.quote.data||{});
  st.clientContactName=CONV.answers.clientContactName;st.clientContactEmail=CONV.answers.clientContactEmail;st.clientContactPhone=CONV.answers.clientContactPhone;
  st.startDate=CONV.answers.startDate;st.endDate=CONV.answers.endDate;st.creativeSource=CONV.answers.creativeSource;st.creativeFee=CONV.answers.creativeFee;
  st.managementFeeAck=CONV.answers.managementFeeAck;st.landingUrl=CONV.answers.landingUrl||st.landingUrl;
  st.salesContact=CONV.answers.salesContact;st.salesEmail=CONV.answers.salesEmail;
  st.trackingPlan={primaryConversion:CONV.answers.primaryConversion,ga4:CONV.answers.ga4,callTracking:CONV.answers.callTracking,verifier:CONV.answers.verifier};
  log('<span class="spin"></span>Linking the IO back to '+esc(CONV.quote.quote_number)+'…');
  await api('/sales/builder/api/quotes/'+CONV.quote.id+'/converted',{method:'POST',body:JSON.stringify({io_number:orderNumber,client_pdf_url:cp.url||"",internal_pdf_url:ip.url||"",submitted,data:st})});
  log("✅ Quote marked Converted");
  CONV.result={io_number:orderNumber,client_pdf_url:cp.url,internal_pdf_url:ip.url,submitted};
  CONV.step=3;drawConvert();refreshLists();
 }catch(e){
  log("❌ "+esc(e.message));
  log('<br><button class="btn btn-back" onclick="CONV.step=1;drawConvert()">← Back</button> <span class="note">Nothing was saved to the quote. The IO API may be waking up (Render cold start) — try again in ~30 seconds, or finish this one in the IO builder tab.</span>');
 }
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
 drawRep();
 try{const c=await api('/sales/builder/api/config');CFG=Object.assign(CFG,c);}catch(e){}
 const savedIo=lsGet("s1_io_app_url","");if(savedIo)CFG.io_app_url=savedIo;

 // Deep links from Client 360 and from the retired /sales/proposals builder.
 // ?quote=<id> opens an existing quote; ?prefill=1&client=…&url=… starts a new
 // one with the client already filled in.
 const qs=new URLSearchParams(location.search);
 if(qs.get('quote')){await editQuote(qs.get('quote'));return;}
 if(qs.get('prefill')){
  await startNewProposal();
  const map={client:'client',url:'url',industry:'industry',
             contactName:'clientContactName',contactEmail:'clientContactEmail',
             contactPhone:'clientContactPhone',salesContact:'salesContact'};
  let filled=false;
  Object.keys(map).forEach(k=>{const v=(qs.get(k)||'').trim();if(v){S[map[k]]=v;filled=true;}});
  // city/state/zip arrive from Client 360 and describe where the client is, so
  // they seed the first target area rather than being dropped.
  const where=[qs.get('city'),qs.get('state')].filter(Boolean).join(', ')||(qs.get('zip')||'');
  if(where){
   const a=blankArea();a.origin=where;a.name=where;
   S.targetAreas=[a];S._areaIx=0;S._areaView="list";syncLegacyGeo();filled=true;
  }
  if(filled){saveNow();renderStep();toast("Client details filled from Client 360.");}
  return;
 }
 nav('dashboard');
})();
</script>
