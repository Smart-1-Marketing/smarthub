<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart 1 Sales Builder — Proposals &amp; Insertion Orders</title>
<style>
  :root{--navy:#1a2e58;--blue:#2563eb;--blue2:#1d4ed8;--sky:#eff6ff;--soft:#eff6ff;--accent:#e5a323;
    --ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--bg:#f4f6fa;--white:#fff;--good:#178653;--bad:#c0392b;
    --shadow:0 10px 30px rgba(20,40,75,.10)}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
  a{color:var(--blue)}
  .shell{max-width:1240px;margin:0 auto;padding:24px 22px 80px}
  h1{font-size:22px;color:var(--navy);margin:0}
  /* The rep's name, in the sub-nav rather than a chip on a branded bar. It is
     the attribution written onto every proposal built here, so "Set your name"
     has to be readable as unset rather than decoration. */
  .repchip{display:inline-flex;align-items:center;gap:8px;font-size:13px}
  .repchip .av{width:24px;height:24px;border-radius:50%;background:var(--accent);
    color:#3a2600;font-weight:800;display:grid;place-items:center;font-size:11px}
  /* The tile is the Hub's; only the category stripe is this page's -- gold for
     money, blue for count, green for won. */
  .s1d-tile{position:relative}
  .s1d-tile.gold{border-top:3px solid var(--accent)}
  .s1d-tile.blue{border-top:3px solid var(--blue)}
  .s1d-tile.green{border-top:3px solid var(--good)}
  .pgsub{color:var(--muted);font-size:13.5px;margin-top:3px}
  .headrow{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .headrow .grow{flex:1;min-width:240px}
  .btn{border:0;cursor:pointer;font-weight:700;font-size:13.5px;padding:11px 18px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;font-family:inherit}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-gold{background:var(--accent);color:#3a2600}
  .btn-line{background:#fff;border:1px solid var(--line);color:var(--navy)}
  .btn-ghost{background:var(--sky);color:var(--navy)}
  .btn-good{background:var(--good);color:#fff}
  .btn-back{background:#fff;border:1px solid var(--line);color:var(--muted)}
  .btn:hover{filter:brightness(1.04)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:20px}
  .s1d-tile .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .s1d-tile .sub.up{color:var(--good);font-weight:700}
  .cols{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .panel .phead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .panel .phead .ttl{font-weight:800;color:var(--navy);font-size:14px}
  .panel .pbody{padding:16px 18px}
  .tabs{display:flex;gap:4px;background:var(--sky);border-radius:10px;padding:3px}
  .tabs span{padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--muted);border-radius:8px;cursor:pointer}
  .tabs span.on{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(20,40,75,.12)}
  .search{margin-left:auto;display:flex;gap:8px}
  .search input{border:1px solid #b8c6d5;border-radius:10px;padding:9px 13px;font-size:13px;width:230px;font-family:inherit}
  .search input:focus{outline:none;border-color:var(--blue)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:#f7fafd;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
  td{padding:12px 14px;border-bottom:1px solid #edf2f7;vertical-align:middle}
  tr.rowlink{cursor:pointer}
  tr.rowlink:hover td{background:#f6faff}
  .qnum{font-weight:800;color:var(--navy)}
  .qnum small{display:block;color:var(--muted);font-weight:600;font-size:11px}
  .badge{display:inline-block;font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
  .b-draft{background:#eef3f8;color:#53657a}
  .b-sent{background:#e8f1fd;color:var(--blue)}
  .b-approved{background:#eaf6ef;color:var(--good)}
  .b-converted{background:#14284b;color:#ffd98a}
  .b-lost{background:#fdeeee;color:var(--bad)}
  .b-expired{background:#fff5df;color:#8a6410}
  .money{font-weight:800;color:var(--navy)}
  .money small{display:block;font-weight:600;color:var(--muted);font-size:11px}
  .rowact{display:flex;gap:6px;justify-content:flex-end}
  .ic{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;display:grid;place-items:center}
  .ic:hover{background:var(--sky)}
  .ic.gold{background:#fff5df;border-color:#f0d69a}
  .miss{font-size:10.5px;color:#8a6410;background:#fff5df;border:1px solid #f0d69a;border-radius:7px;padding:3px 8px;font-weight:700;display:inline-block;margin-top:4px}
  .rail .panel{margin-bottom:16px}
  .quick{display:grid;gap:9px;padding:16px 18px}
  .quick .btn{justify-content:flex-start;width:100%}
  .ai{padding:16px 18px}
  .ai .bubble{background:linear-gradient(180deg,#f6faff,#eef4ff);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:12.5px;color:#33415C;margin-bottom:10px}
  .ai .bubble b{color:var(--navy)}
  .ai .bubble .tag2{display:inline-block;background:var(--navy);color:#ffd98a;font-size:9.5px;font-weight:800;border-radius:6px;padding:2px 7px;margin-bottom:6px;letter-spacing:.6px}
  .aiask{display:flex;gap:8px}
  .aiask input{flex:1;border:1px solid #b8c6d5;border-radius:10px;padding:10px 12px;font-size:12.5px;font-family:inherit}
  .act{padding:6px 18px 14px}
  .act .it{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid #edf2f7;font-size:12.5px;align-items:flex-start}
  .act .it:last-child{border-bottom:0}
  .act .ico{width:28px;height:28px;border-radius:8px;background:var(--sky);display:grid;place-items:center;font-size:13px;flex:none}
  .act .t{color:#33415C}.act .t b{color:var(--navy)}
  .act .when{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap;padding-top:5px}
  /* drawer */
  .overlay{position:fixed;inset:0;background:rgba(13,27,47,.45);z-index:90;display:none}
  .drawer{position:fixed;top:0;right:-560px;width:540px;max-width:96vw;bottom:0;background:#fff;z-index:95;box-shadow:-18px 0 50px rgba(13,27,47,.25);transition:right .25s;display:flex;flex-direction:column}
  .drawer.open{right:0}
  .drawer .dhead{padding:18px 22px;border-bottom:1px solid var(--line);background:#f7fafd}
  .drawer .dhead h2{margin:0;font-size:18px;color:var(--navy)}
  .drawer .dhead .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  .drawer .dbody{flex:1;overflow:auto;padding:18px 22px}
  .kv2{list-style:none;margin:0;padding:0}
  .kv2 li{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #edf2f7;font-size:13px}
  .kv2 li span{color:var(--muted)}.kv2 li b{color:var(--navy);text-align:right}
  .dsec{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:18px 0 6px}
  .gap{background:#fff5df;border:1px solid #f0d69a;border-radius:11px;padding:12px 14px;font-size:12.5px;color:#7a5a10;margin-top:6px}
  .gap b{display:block;color:#5c430b;margin-bottom:4px}
  .gap ul{margin:4px 0 0;padding-left:18px}
  .dfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap;background:#fbfcfe}
  .xclose{margin-left:auto;background:none;border:0;font-size:20px;cursor:pointer;color:var(--muted);float:right}
  .note{font-size:11.5px;color:var(--muted);font-style:italic}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#0d1b2f;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none;z-index:200;max-width:560px;text-align:center}
  /* ===== builder ===== */
  .bshell{max-width:960px;margin:0 auto}
  .bprog{height:5px;background:var(--sky);border-radius:4px;overflow:hidden;margin:6px 0 24px}
  .bprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue2),var(--navy));transition:.3s}
  .eyebrow{color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:2px;font-size:12px}
  h1.q{font-size:26px;color:var(--navy);margin:8px 0 6px;font-weight:800}
  .sub{color:var(--muted);font-size:15px;margin-bottom:6px}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-top:20px}
  .cards.c3{grid-template-columns:repeat(3,1fr)}
  .choice{border:2px solid var(--line);border-radius:13px;padding:16px;cursor:pointer;background:#fff;transition:.15s;display:flex;gap:13px;align-items:flex-start}
  .choice:hover{border-color:#b9d0f5}.choice.on{border-color:var(--blue);background:#f6faff;box-shadow:0 8px 18px rgba(31,99,174,.14)}
  .choice .em{font-size:24px}.choice h3{margin:0 0 3px;font-size:15px;color:var(--navy)}.choice p{margin:0;font-size:12.5px;color:var(--muted)}
  .choice .tick{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
  .choice.on .tick{border-color:var(--blue);background:var(--blue);color:#fff}.choice.on .tick:after{content:"✓";font-size:12px;font-weight:800}
  .fld{margin-top:14px;display:flex;flex-direction:column}
  .fld label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
  .fld input,.fld textarea,.fld select{border:1px solid #b8c6d5;border-radius:10px;padding:11px 13px;font-size:14px;font-family:inherit;background:#fff}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--blue)}
  .fld textarea{resize:vertical;min-height:66px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}
  .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid #b7c7d8;background:#fff;border-radius:18px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;margin:6px 7px 0 0}
  .pill:hover{background:var(--sky)}.pill.on{border-color:var(--blue);background:#edf5ff;color:var(--navy)}.pill.on:before{content:"✓ ";color:var(--blue);font-weight:800}
  .addpill{display:flex;gap:8px;margin-top:11px;max-width:460px}.addpill input{flex:1;border:1px solid #b8c6d5;border-radius:18px;padding:9px 14px;font-size:13px}
  .kpigrp{margin-top:13px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#5a6f85}
  .pill .kpix{font-weight:500;font-size:11px;color:#64788c}
  .bpanel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px;box-shadow:var(--shadow)}
  .bpanel .ttl{font-weight:800;color:var(--navy);font-size:13px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
  .estgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:12px}
  .est{background:linear-gradient(180deg,#fbfdff,#eef4ff);border:1px solid var(--line);border-radius:11px;padding:15px;text-align:center}
  .est b{display:block;font-size:22px;color:var(--navy);font-weight:800}.est span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .prod{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:11px;background:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .prod .pi{width:38px;height:38px;border-radius:10px;background:var(--sky);color:var(--blue);display:grid;place-items:center;font-size:17px;flex:none}
  .prod .grow{flex:1;min-width:170px}.prod h4{margin:0;font-size:14px;color:var(--navy)}.prod .meta{font-size:12px;color:var(--muted)}
  .prod .alloc{text-align:right;min-width:120px}
  .prod .alloc input{width:92px;border:1px solid #b8c6d5;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:800;color:var(--navy);text-align:right}
  .prod .alloc small{display:block;font-weight:600;color:var(--muted);font-size:11px;margin-top:2px}
  .prod .x{background:#fff;border:1px solid var(--line);color:#c0392b;border-radius:8px;width:28px;height:28px;cursor:pointer;font-weight:800;flex:none}
  .addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.addrow select,.addrow input{border:1px solid #b8c6d5;border-radius:10px;padding:10px 12px;font-size:13px}
  .addrow select{max-width:300px}
  .reconfig{background:#fff8e8;border:1px solid #f0d69a;border-radius:11px;padding:13px 15px;margin-top:13px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .reconfig p{margin:0;font-size:13.5px;color:#7a5a10;flex:1;min-width:220px}
  .pkgs{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:18px}
  .pkg{border:2px solid var(--line);border-radius:15px;padding:20px;background:#fff;cursor:pointer;position:relative}
  .pkg:hover{border-color:#b9d0f5}.pkg.on{border-color:var(--blue);box-shadow:0 10px 24px rgba(31,99,174,.16)}
  .pkg .flag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--accent);color:#3a2600;font-size:10.5px;font-weight:800;padding:5px 13px;border-radius:999px;text-transform:uppercase}
  .pkg .pn{font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:1px;font-size:13px}
  .pkg .pp{font-size:26px;font-weight:800;margin:6px 0 0}.pkg .pp small{font-size:13px;color:var(--muted);font-weight:600}
  .pkg .ptot{font-size:12px;color:var(--muted);margin-bottom:9px}
  .pkg ul{list-style:none;padding:0;margin:0}
  .pkg li{font-size:12.5px;padding:5px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;color:#33415C}
  .pkg li b{color:var(--navy)}
  .bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);z-index:60;display:none}
  /* The footer nav is fixed, so its height has to be reserved or the last
     control on a step sits behind Continue -- which reads as a step that
     will not scroll rather than as a bar overlapping it. */
  body.wizard .shell{padding-bottom:96px}
  .bnav .wrap{max-width:960px;margin:0 auto;padding:13px 22px;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .savestate{font-size:11.5px;color:var(--muted)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #c3d4ea;border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .warnbox{background:#fdeeee;border:1px solid #f2c3bd;border-radius:11px;padding:12px 15px;margin-top:13px;font-size:12.5px;color:#8c2f24}
  .warnbox b{display:block;margin-bottom:4px}

/* section editor */
  .sec{border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:12px;overflow:hidden}
  .sec .shead{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#f7fafd;border-bottom:1px solid #edf2f7}
  .sec .shead input[type=text]{flex:1;border:1px solid transparent;background:transparent;font-weight:800;color:var(--navy);font-size:14px;padding:5px 7px;border-radius:7px;font-family:inherit}
  .sec .shead input[type=text]:focus{outline:none;border-color:var(--blue);background:#fff}
  .sec .sbody{padding:12px 14px}
  .sec textarea{width:100%;border:1px solid #b8c6d5;border-radius:9px;padding:10px 12px;font-size:13px;font-family:inherit;min-height:64px;resize:vertical}
  .sec .autotag{font-size:10.5px;font-weight:800;color:var(--blue);background:var(--sky);border-radius:6px;padding:3px 8px;text-transform:uppercase;letter-spacing:.5px}
  .sec .tools{display:flex;gap:5px}
  .sec.off{opacity:.5}
  .airow{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
  .airow input{flex:1;min-width:180px;border:1px solid #b8c6d5;border-radius:9px;padding:8px 11px;font-size:12.5px}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(13,27,47,.5);z-index:110;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.open{display:flex}
  .mbox{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(13,27,47,.4)}
  .mbox .mhead{padding:18px 22px;border-bottom:1px solid var(--line)}
  .mbox .mhead h2{margin:0;font-size:18px;color:var(--navy)}
  .mbox .mhead .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .mbox .mbody{padding:14px 22px 20px;overflow:auto}
  .mbox .mfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:#fbfcfe;border-radius:0 0 16px 16px}
  .convstep{display:none}.convstep.on{display:block}
  iframe.ioframe{width:100%;height:calc(100vh - 130px);border:0;border-radius:14px;background:#fff;box-shadow:var(--shadow)}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .clientcard{border:1px solid var(--line);border-radius:13px;background:#fff;padding:16px 18px;margin-top:12px;box-shadow:var(--shadow)}
  .basisrow{flex-basis:100%;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
  .basisrow .pill{margin:0}
  .clienthit{border:1px solid var(--line);border-radius:10px;background:#fff;
    padding:9px 12px;margin-top:6px;cursor:pointer;transition:border-color .12s,background .12s}
  .clienthit:hover{border-color:var(--blue);background:#f6faff}
  .clienthit b{display:block;color:var(--navy);font-size:13.5px}
  .clienthit span{color:var(--muted);font-size:11.5px}
  .clientcard h3{margin:0 0 3px;font-size:15px;color:var(--navy)}
  .clientcard .meta{font-size:12px;color:var(--muted)}
  /* Discovery, two across. Twelve yes/no/unknown rows in a single column is
     a page of scrolling for what is really one screen of questions. */
  .disc2{display:grid;grid-template-columns:1fr 1fr;gap:2px 22px;margin-top:8px}
  .disc2 .fld{margin-top:8px}
  .disc2 .fld label{display:block;margin-bottom:5px}
  /* Guardrail choices, three across -- same reason. */
  .pillrow.c3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .pillrow.c3 .pill{margin:0;text-align:center}
  /* ---- age and income: a low, a high, and an explicit none ---- */
  .bandbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fbfcfe}
  .bandbox.off{opacity:.72}
  .bandhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .bandhead .pill{margin:0 0 0 auto}
  .bandval{font-weight:800;color:var(--navy);font-size:15px;margin:6px 0 2px}
  /* Two plain range inputs stacked on one track. The lower one keeps pointer
     events so both thumbs stay grabbable; without that the high thumb sits
     over the low one and the low end becomes unreachable at the top of the
     range, which is exactly where somebody drags first. */
  .bandtrack{position:relative;height:30px;margin-top:4px}
  .bandtrack input[type=range]{position:absolute;left:0;right:0;top:6px;width:100%;
    margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
  .bandtrack input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:4px;background:#dde5ee}
  .bandtrack input[type=range]::-moz-range-track{height:5px;border-radius:4px;background:#dde5ee}
  .bandtrack input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    pointer-events:auto;width:19px;height:19px;border-radius:50%;background:var(--blue);
    border:2px solid #fff;box-shadow:0 1px 4px rgba(20,40,75,.35);margin-top:-7px;cursor:pointer}
  .bandtrack input[type=range]::-moz-range-thumb{pointer-events:auto;width:19px;height:19px;
    border-radius:50%;background:var(--blue);border:2px solid #fff;
    box-shadow:0 1px 4px rgba(20,40,75,.35);cursor:pointer}
  .bandtrack input[type=range]:disabled::-webkit-slider-thumb{background:#b6c2d0;cursor:not-allowed}
  .bandtrack input[type=range]:disabled::-moz-range-thumb{background:#b6c2d0;cursor:not-allowed}

  element layer. This module has a complete button vocabulary of its own --
  btn-primary, btn-gold, btn-line, btn-ghost, btn-good, btn-back -- and every
  one of those is a single class, while `.s1d-page button` carries three

function rateIsCustom(i){
 const own=+((i||{}).sellRate);
 if(!(own>0))return false;
 const start=startingRate((i||{}).rateValue,(i||{}).rate);

/* Generated copy carries exactly one tag. hub/proposal_spec.clean_ai_text
   turns every other form of emphasis into plain prose and leaves <b>, which
   reportlab reads natively and python-docx gets as a bold run -- so here the
   string is escaped like any other and then those two are put back, and
   nothing else in the body can reach the page as markup. Copy typed into the
   editor by hand goes through the same path, or the rule holds only until
   somebody pastes. */
function inlineRich(s){
 return esc(s).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>');}
/* Copy as the blocks the document actually draws: paragraphs, and a bulleted
   list as a list. This is the browser half of hub/proposal_spec.blocks() --
   the PDF and the Word export read the Python one, and all three had better
   agree, because the failure being fixed here is a list that arrived as
   "three areas: • Carmel • Fishers • Noblesville" inside one sentence. */
function richText(s){
 const out=[];let list=null;
 String(cleanCopy(s)||"").split("\n").forEach(line=>{
  const t=line.trim();
  if(!t)return;
  if(t.charAt(0)==="\u2022"){
   const item=t.replace(/^\u2022+\s*/,"").trim();
   if(!item)return;
   if(!list){list=[];out.push(list);}
   list.push(item);return;}
  list=null;out.push(t);});
 return out.map(b=>Array.isArray(b)
   ? '<ul class="dlist">'+b.map(i=>'<li>'+inlineRich(i)+'</li>').join('')+'</ul>'
   : '<p>'+inlineRich(b)+'</p>').join('');}
/* The same cleaning, client side, so a rep who pastes Markdown into a
   section sees it normalized at once rather than discovering it in the PDF.
   Deliberately the conservative half of the server's rule: bold and the
   obvious markers. Whatever this misses, the server catches on the way to
   the document. */
function cleanCopy(s){
 return String(s==null?"":s)
  .replace(/\*\*(.+?)\*\*/gs,(m,t)=>"<b>"+t.trim()+"</b>")
  .replace(/__(.+?)__/gs,(m,t)=>"<b>"+t.trim()+"</b>")
  .replace(/<\s*\/?\s*strong\s*>/gi,m=>m.includes("/")?"</b>":"<b>")
  .replace(/^\s{0,3}#{1,6}\s*/gm,"")
  .replace(/^\s{0,3}[-*+]\s+/gm,"• ")
  /* A bullet that shares a line with other bullets is not a list. Mirrors
     hub/proposal_spec._one_bullet_per_line: the models write
     "…three areas: • Carmel • Fishers" often enough that asking politely is
     not a fix, and the server enforces the same shape on the way to the
     document. */
  .replace(/(\S)[ \t]+•[ \t]*/g,"$1\n• ")
  .replace(/`/g,"")
  .replace(/(?<!<)\*+(?!\/?b>)/g,"")
  .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE00}-\u{FE0F}]/gu,"")
  .replace(/\n{3,}/g,"\n\n");}
function esc(s){return String(s==null?"":s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function money(n){return "$"+(+n||0).toLocaleString('en-US');}
function fmt(n){n=+n||0;if(n>=1e6)return(n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M';if(n>=1e3)return Math.round(n/1e3)+'k';return String(Math.round(n));}
function toggle(a,v){const i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);}
let _toastT=null;
function toast(m){const t=document.getElementById('toastEl');t.textContent=m;t.style.display='block';clearTimeout(_toastT);_toastT=setTimeout(()=>t.style.display='none',5200);}
function ago(iso){if(!iso)return"";const d=(Date.now()-new Date(iso).getTime())/864e5;if(d<1)return"Today";if(d<2)return"Yesterday";if(d<7)return Math.floor(d)+"d ago";return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});}

/* Start an IO from a proposal we already sent. The proposal is the agreement;
   the IO is what makes it real, and retyping it is where the two drift apart.
   The reader resolves a stored proposal by client + id, so that is what
   travels — handing the IO builder an arbitrary URL to fetch would make it an
   SSRF hole, and the document is already ours. */
function uploadedToIO(pid){
 const x=UPLOADED.find(r=>String(r.id)===String(pid));
 if(!x){toast("That proposal is no longer in the list.");return;}
 if(!x.url){toast("That proposal has no file to read.");return;}
 window.open('/tools/io/?from_proposal='+encodeURIComponent(x.id||x.filename||'')
   +'&client='+encodeURIComponent(x.client||''),'_blank','noopener');
}

async function deleteUploaded(pid){
 const x=UPLOADED.find(r=>String(r.id)===String(pid));
 if(!x){return;}
 if(!confirm(`Remove "${x.filename||x.title}" from ${x.client||"the client"}'s record?

This deletes the uploaded proposal, not any quote built here.`))return;
 try{
  const r=await fetch('/api/client/proposals/update',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({client:x.client,id:x.id,delete:true})});
  const d=await r.json().catch(()=>({}));
  if(d.error){toast(d.error);return;}
  UPLOADED=UPLOADED.filter(r2=>String(r2.id)!==String(pid));
  toast("Proposal removed.");drawRows();
 }catch(e){toast("Could not remove it: "+e.message);}

   case: no filter, every row. */
let FOCUS=null;
const FOCUS_LABEL={
 expired:"whose pricing has lapsed",
 expiring:"expiring within the week",
 unopened:"sent and never opened",
 waiting:"read by the client with no answer",
 to_convert:"accepted with no insertion order yet"};
async function openFocus(key){
 nav('proposals');
 await drawProposals();
 let d=null;
 try{d=await api('/api/sales/scoreboard');}catch(e){}
 const ids=(d&&d.ids&&d.ids[key])||null;
 if(!ids||!ids.length){
  /* Nothing in that bucket any more, or the reading could not be made. Both
     leave the whole list rather than an empty table that reads as a book with
     nothing in it. */
  FOCUS=null;drawRows();
  toast(d?("Nothing is "+(FOCUS_LABEL[key]||"in that state")+" now."):
          "The pipeline could not be read — showing every proposal.");
  return;}
 FOCUS={key:key,ids:new Set(ids.map(Number))};
 drawRows();
}
function clearFocus(){FOCUS=null;drawRows();}
function focusBanner(){
 if(!FOCUS)return '';
 const n=FOCUS.ids.size;
 return `<div class="note" style="margin:0 0 10px">Showing the ${n} proposal${n===1?'':'s'}
  ${esc(FOCUS_LABEL[FOCUS.key]||'in that state')}, from the dashboard.
  <a onclick="clearFocus()" style="cursor:pointer;color:var(--blue);font-weight:700">Show all</a></div>`;}
function drawRows(){
 const q=(document.getElementById('q')?.value||"").toLowerCase();
 const rows=LIST.filter(x=>(!FOCUS||FOCUS.ids.has(Number(x.id)))
  &&(listTab==="all"||x.status===listTab)&&(!q||[x.quote_number,x.client,x.website,x.products_summary,x.io_number].join(" ").toLowerCase().includes(q)));
 /* Uploaded proposals show under "all" and under their own tab. They have no
    Draft/Approved status, so filtering them by one would hide them entirely
    rather than say why they are missing. */
 /* An uploaded proposal has no quote id in the pipeline reading, so a focused
    list never shows one: the filter is about quotes this Hub is tracking. */
 const ups=(!FOCUS)&&(listTab==="all"||listTab==="Uploaded")
   ? UPLOADED.filter(x=>!q||[x.client,x.filename,x.title,x.note,x.uploaded_by].join(" ").toLowerCase().includes(q))
   : [];
 const merged=rows.map(x=>({x,html:rowHtml(x),t:x.created_at||""}))
   .concat(ups.map(x=>({x,html:uploadedRowHtml(x),t:x.date_sent||x.created_at||""})))
   .sort((a,b)=>String(b.t).localeCompare(String(a.t)));
 /* Both list views draw through drawRows, so both carry the banner and both
    are filled: an id would have put it on whichever screen was written
    first, which is the one nobody arrives on from the dashboard. */
 const note=focusBanner();
 document.querySelectorAll('.focusBanner').forEach(el=>{el.innerHTML=note;});
 const tb=document.getElementById('rows');if(!tb)return;
 tb.innerHTML=merged.map(r=>r.html).join("")||`<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:30px">No quotes yet — click <b>✨ New Proposal</b> to build the first one.</td></tr>`;
}

/* ============================================================
   THE CLIENT'S COPY

   One link per quote, minted once and kept, so a link already in a client's
   inbox goes on working when the quote is revised. What the panel is for is
   the two things a rep cannot otherwise know: whether it was opened, and
   whether the client has seen THIS revision or the one before it.

   "Opens" counts browsers that actually rendered the page, never staff and
   never a link scanner — hub/view_tracking.py carries the rules, and the
   panel says so rather than presenting a bare number.
   ============================================================ */
let SHARE={};
async function drawShare(id){
 const box=document.getElementById('shareBox');if(!box)return;
 let d;
 try{d=await api('/sales/builder/api/quotes/'+id+'/share');}
 catch(e){box.innerHTML='<div class="note">Could not read the client link ('+esc(e.message)+').</div>';return;}
 const s=SHARE[id]=d.share||{};
 if(!s.shared){
  box.innerHTML=`<div class="note">No client link yet. Creating one gives the client a page
   showing this proposal, with one thing on it: accept.</div>
   <div class="addrow" style="margin-top:9px"><button class="btn btn-primary" onclick="makeShare(${id})">🔗 Create the client link</button></div>`;
  return;}
 if(s.revoked){
  box.innerHTML=`<div class="note">The client link is <b>switched off</b> — anyone opening it sees
   the same page as a link that never existed.</div>
   <div class="addrow" style="margin-top:9px"><button class="btn btn-line" onclick="makeShare(${id})">Turn it back on</button></div>`;
  return;}
 const acc=s.accepted,sup=s.superseded;
 const opens=s.views||0;
 box.innerHTML=`
  <div class="fld" style="margin-top:0"><label>Send this to the client</label>
   <input id="shareUrl" readonly value="${esc(s.url)}" onclick="this.select()"></div>
  <div class="addrow" style="margin-top:8px">
   <button class="btn btn-line" onclick="copyShare()">📋 Copy link</button>
   <button class="btn btn-ghost" onclick="window.open('${esc(s.url)}','_blank')">Open it yourself</button>
   <button class="btn btn-ghost" onclick="revokeShare(${id})">Switch it off</button></div>
  <div class="note" style="margin-top:7px">Opening it yourself does not count as the client
   reading it — you are signed in, and the page says so.</div>
  ${s.edited_since_sent?`<div class="warnbox" style="margin-top:9px">You have edited this proposal
    since you sent revision ${s.sent_revision}. The link already shows revision ${s.revision} —
    tell the client there is a new version, or
    <a onclick="makeShare(${id})" style="cursor:pointer;color:var(--blue);font-weight:700">mark it as sent</a>.</div>`:''}
  ${validityPanel(id,s)}
  <div class="dsec" style="margin-top:14px">Opened</div>
  ${opens?`<div class="note"><b>${opens}</b> time${opens===1?'':'s'}${
     s.views_this_revision!==opens?` · <b>${s.views_this_revision}</b> since revision ${s.revision}`:''}
    ${s.last_view?` · last on ${new Date(s.last_view).toLocaleString()}`:''}</div>
   <div class="note" style="margin-top:5px">${s.opens.map(o=>
     new Date(o.at).toLocaleString()+' · rev '+o.revision+' · '+esc(o.device)).join('<br>')}</div>`
   :`<div class="note">Not opened yet. An open is counted when a browser actually shows the page —
     a link scanner in the client's mail system does not count, and neither do you.</div>`}
  <div class="dsec" style="margin-top:14px">Accepted</div>
  ${acc?`<div class="note" style="color:#1c6b32"><b>✓ Accepted by ${esc(acc.name)}</b>
      ${acc.email?' ('+esc(acc.email)+')':''}${acc.at?' on '+new Date(acc.at).toLocaleString():''}
      — revision ${acc.revision}.</div>`
   :(sup?`<div class="note">Revision ${sup.revision} was accepted by <b>${esc(sup.name)}</b>${
        sup.at?' on '+new Date(sup.at).toLocaleString():''}. This proposal is now revision
        ${s.revision}, so that acceptance is <b>superseded</b> — the client has not agreed to the
        current version.</div>`
      :`<div class="note">Not yet.</div>`)}`;}
function validityPanel(id,s){
 /* How long the price stands, on the screen where the link is sent. An
    expired quote that a client can still accept commits us to last spring's
    rates; a rep who cannot see the date cannot extend it either. */
 const v=s.validity||{};
 if(!v.applies)return `<div class="dsec" style="margin-top:14px">How long it stands</div>
  <div class="note">${esc(v.reason||'This quote has no expiry window.')}</div>`;
 const cls=v.expired?'warnbox':'note';
 return `<div class="dsec" style="margin-top:14px">How long it stands</div>
  <div class="${cls}" style="margin-top:${v.expired?'6px':'0'}">${esc(v.note||'')}
   ${v.expired?`<br>Sending it again re-quotes at today's rates and starts a new
     ${v.days}-day window — <a onclick="makeShare(${id})" style="cursor:pointer;color:var(--blue);font-weight:700">re-send the link</a>.`:''}</div>
  <div class="addrow" style="margin-top:7px">
   <label style="font-weight:600;font-size:12px;color:var(--muted);margin:0">Hold the pricing for</label>

          style="width:84px" onkeydown="if(event.key==='Enter')setValidity(${id})">
   <span class="note" style="margin:0">days</span>
   <button class="btn btn-ghost" onclick="setValidity(${id})">Save</button>
   ${v.custom?`<button class="btn btn-ghost" onclick="setValidity(${id},0)">Use the standard window</button>`:''}
  </div>`;}

/* navigator.clipboard is unavailable on http and refusing is allowed, so the

async function saveNow(extra){
 if(!S)return;
 // Stamped on save so the IO payload, the PDF and the dashboard all read the
 // same sentence rather than each re-deriving it.
 try{S.creativeSummary=creativeSummary();}catch(e){}
 /* Where the rep had got to, saved with the work. The quote's answers were
    always kept -- what was lost on every interruption was the place: a rep
    who was on the media plan reopened at step 1 of 14 and pressed Continue
    until they found it again. It rides inside the quote's own data blob
    rather than in a new column, because create_all() adds no column to an
    existing table and one added here would be silently absent on the live
    Postgres with every local test green. */
 try{if(typeof step==="number")S._step=step;}catch(e){}
 setSave("Saving…");
 try{
  /* growth is computed by the server, not stored on the quote's data. Kept
     off S's saved shape deliberately: it is derived from the plan, the
     packages and the discovery answers, and a stale copy of it would be a
     recommended budget that no longer matches the plan it sits under. */
  let saved=null;

     only when it actually changed and only when nothing is being edited:
     drawPreview() rebuilds the whole document, and a rebuild 900ms after a
     keystroke takes the caret out of the section somebody is typing in. */
  /* Both of these are the server's, not S's: computed from the plan, and a
     stale copy is a document contradicting the table above it. Repainted
     only when one actually changed and only when nothing is being edited --
     drawPreview() rebuilds the whole document, and a rebuild 900ms after a
     keystroke takes the caret out of the section somebody is typing in. */
  let repaint=false;
  if(saved&&saved.quote&&saved.quote.media_plan){
   const before=JSON.stringify(S._mediaPlan||null);
   S._mediaPlan=saved.quote.media_plan;
   if(before!==JSON.stringify(S._mediaPlan))repaint=true;

  if(saved&&saved.quote&&saved.quote.investment){
   const before=JSON.stringify(S._invest||null);

  if(saved&&saved.quote&&saved.quote.kpi_framework){

   S._kpiPlan=saved.quote.kpi_framework;

function suiteCoverage(tierName){

 const have=Math.max(0,SUITE_TIER_ORDER.indexOf(tier));
 const covered=[],upgrade=[],unmeasured=[];
 SUITE_FEATURES.forEach(f=>{
  const a=mkt[f.key];
  if(a==="Yes")return;
  const row=Object.assign({answer:a||"",group:f.group||f.key},f);
  if(a!=="No"&&a!=="Unknown"){unmeasured.push(row);return;}
  (Math.max(0,SUITE_TIER_ORDER.indexOf(f.tier))<=have?covered:upgrade).push(row);});
 // One row per capability. Two questions can want the same feature.

  seen.has(r.group)?false:(seen.add(r.group),true));};
 const cov=once(covered),covGroups=new Set(cov.map(r=>r.group));
 return{tier,covered:cov,upgrade:once(upgrade),
        unmeasured:once(unmeasured).filter(r=>!covGroups.has(r.group))};}

   a set of six banners is a $250 line off the rate card, while a :30 spot

/* ============================================================
   THE JOINT MINIMUM RULE
   Mirrors hub/rate_card.py. One table for the proposal and the insertion
   order alike -- these used to be two rules nobody had compared, the
   proposal checking a category table while the IO derived a floor from each
   product's listed rate, so the same line could pass one document and be
   refused by the other after the client had already seen the number.
   test_proposal_spec.py asserts this mirror still matches Python.
   ============================================================ */
const MIN_MONTHLY_DEFAULT=500;
const MIN_BY_CATEGORY={"DIGITAL RADIO": 1000, "IP TARGETS": 1000, "OTT": 1500, "SEARCH ENGINE MARKETING / PAY PER CLICK": 400, "SEARCH ENGINE OPTIMIZATION": 500};
const MIN_BY_PRODUCT={};
/* The line's own category wins: "Programmatic - Targeted" exists under both
   DIGITAL RADIO and DISPLAY and carries a different floor in each. */
function minimumFor(product,category){
 const n=String(product||"").trim().toLowerCase();
 if(MIN_BY_PRODUCT[n]!==undefined)return MIN_BY_PRODUCT[n];
 const c=String(category||"").trim().toUpperCase();
 if(MIN_BY_CATEGORY[c]!==undefined)return MIN_BY_CATEGORY[c];
 return MIN_MONTHLY_DEFAULT;
}

const COMP_CONFIRM_UNDER=1500;
/* Per medium, where the medium's own economics differ. Display creative is
   $250 of design on the card, so comping it stops being sensible far lower
   down than a shoot does -- and a confirmation that fires on every plan is
   one nobody reads. */
const COMP_CONFIRM_BY_MEDIUM={display:500,retargeting:500,email:400,social:100};
function confirmUnder(m){return COMP_CONFIRM_BY_MEDIUM[m]||COMP_CONFIRM_UNDER;}
const TYPICAL_PRODUCTION={video:750,audio:250,display:250,retargeting:250,
 email:150,dooh:250,social:35};
const MEDIUM_LABEL={video:"Video (CTV, streaming, YouTube, pre-roll)",
 audio:"Audio (digital radio, podcasts, streaming audio)",
 display:"Display (banners, native, IP targeted, geo-fenced)",
 retargeting:"Retargeting (the banners that bring them back)",
 email:"Email (the creative that goes in the send)",
 dooh:"Signage (digital out-of-home and indoor screens)",
 social:"Paid social",other:"Other"};
/* Four programmatic VIDEO products sit under the same DISPLAY category as
   banner inventory and their names do not say so -- "Programmatic - Targeted"
   is $17.00 CPM video while "Category" beside it is $4.25 display. Guessing
   from the category would price a video buy and never ask for a spot. */
const EXPLICIT_MEDIUM={"programmatic - ron (run of network)":"video",
 "programmatic - targeted":"video","premium: non-skippable":"video",
 "premium native video":"video",
 /* ...and one the other way: the card files this under a heading called
    SOCIAL ADS - VIDEO, and the heading is what the keyword pass reads, so a
    product whose own name is "Display & Text Ads" was gated as video. */
 "linkedin - display & text ads - budget based - no impression guarantee":"social"};
const CATEGORY_MEDIUM={"digital radio":"audio","ott":"video","youtube":"video",
 "retargeting":"retargeting",
 /* "Select Tactics - Comes with Retargeting" is the programmatic DISPLAY
    buy, whose name lists retargeting as one of the tactics inside it. Read
    off the name alone it becomes a retargeting line and the display half of
    the plan never gets asked for banners at all. */
 "data targeted display":"display","programmatic campaign":"display",
 /* These three answered "other", which is not a medium -- it is the gate
    never being asked. The spec kit has known what they are the whole time,
    so the two halves of one question were disagreeing: one decides whether
    we ask for creative, the other what we ask for. */
 "mobile only":"display","email marketing":"email","smart 1 signage":"dooh",
 /* Two headings that are not media buys. Gating SOCIAL made the word
    "social" decisive below, so the card's own $35 social ad *production*
    line was asked whether the client already had the creative it exists to
    produce, and a $199/month organic posting retainer was asked the same.
    By category, because the other four production lines answer "other" only
    because they happen to contain no medium keyword. */
 "creative / design services":"other","social media management":"other"};
function mediumOf(i){
 const cat=String((i&&i.category)||"").trim().toLowerCase();
 if(CATEGORY_MEDIUM[cat])return CATEGORY_MEDIUM[cat];
 const prod=String((i&&i.product)||"").trim().toLowerCase();
 if(EXPLICIT_MEDIUM[prod])return EXPLICIT_MEDIUM[prod];
 /* The label is deliberately left out. It is "<category heading> —
    <product>", and a heading describes a section of the card rather than a
    product: four IP-targeting products are filed under a heading called
    "Display & Video", so "IP Targeted Display - New Movers" carried the word
    video and the test below runs first. Category and product are both here
    already, so the label added nothing but that. */
 const t=[cat,prod,String((i&&i.description)||"")].join(" ").toLowerCase();
 if(/radio|podcast|audio|spotify|pandora|iheart/.test(t))return "audio";
 if(/video|ott|youtube|trueview|bumper|connected tv|advanced tv|ctv|pre-?roll|non-skippable/.test(t))return "video";
 if(/facebook|instagram|meta|tik ?tok|linkedin|snapchat|pinterest|twitter|social/.test(t))return "social";
 if(/retarget/.test(t))return "retargeting";
 if(/display|banner|geo-?fence|outreach|native|location lookback|ip target|select tactics/.test(t))return "display";

function mediumSpend(m){
 /* Per line, by its own basis and term. Multiplying every line by the flight
    read a $1,500 one-time production as $9,000 — printed on the client's
    creative section, and it switches the comp confirmation off, since that
    question is only asked where the spend is BELOW the threshold. Mirrors
    hub/creative_needs.medium_spend(); test_proposal_spec.py holds them in
    step. */
 const months=Math.max(1,+S.months||1);
 return Math.round(S.items.filter(i=>mediumOf(i)===m).reduce((sum,i)=>{
  const d=+i.dollars||0;
  if((i.basis||"monthly")==="one_time")return sum+d;
  const term=Math.max(1,Math.min(months,+i.termMonths||months));
  return sum+d*term;},0));}
/* Display and retargeting joined video and audio here. A display plan reached
   the insertion order with the creative box empty exactly as often as a CTV
   one did -- it simply cost $250 and a week rather than a shoot, so it was
   found at trafficking instead of at launch and nobody called it a failure.
   Retargeting is asked separately because it is a different set of files:
   the same six sizes carrying the offer that brings somebody back, not the
   one that introduced the brand. */
/* Email and signage joined for the reason display did. Both sell creative
   with published specs and neither was ever asked for, because every product
   under EMAIL MARKETING and SMART 1 SIGNAGE answered "other" and an ungated
   medium is one this step never mentions. */
/* Paid social joined last and was the largest hole: a Meta-only plan
   returned nothing at all from gatedMedia(), so six real buys with published

/* ============================================================
   COMPETITORS AND PLACES TO TARGET

   The audience step offered "Competitor physical locations" and "Competitor
   conquesting" as two chips, and a ticked chip is not a campaign: nothing
   anywhere asked WHICH competitors, or which addresses. So the proposal
   promised to target a client's rivals without naming one, the insertion
   order arrived with the same two words on it, and the first person who had
   to know -- whoever builds the geo-fence -- went back to the rep weeks
   later. Meanwhile the client, who is the only person in the room who
   actually knows who they lose business to, was never asked.

   Named here, carried onto the proposal's audience section, and handed to
   the IO with the addresses attached. Two rules:

     * **A competitor with no address is still worth having.** Conquesting by
       brand name and browsing behavior needs no location at all, and
       refusing the row until somebody looks up a street address is how the
       list stays empty. The row says which of the two it can do.
     * **Nothing is inferred from the name.** No guessed website, no
       geocoding, no "did you mean" -- the rule modules/ads_builder/logo.py
       works to. A wrong address on a geo-fence spends the budget outside
       somebody else's front door.
   ============================================================ */
const TARGET_KINDS=[
 {key:"competitor",label:"Competitor",help:"A business we want to take customers from"},
 {key:"venue",label:"Venue or event",help:"A stadium, expo, dealership row, trade show"},
 {key:"place",label:"Place of interest",help:"A hospital, campus, retail park, employer"},
];
function blankTarget(){return{id:uid(),kind:"competitor",name:"",address:"",note:""};}
function targetRows(){if(!Array.isArray(S.targetsOfInterest))S.targetsOfInterest=[];return S.targetsOfInterest;}
function addTarget(kind){
 targetRows().push(Object.assign(blankTarget(),{kind:kind||"competitor"}));
 saveSoon();drawCompetitors();}
function setTarget(i,field,value){
 const row=targetRows()[i];if(!row)return;
 row[field]=String(value||"").slice(0,200);
 saveSoon();
 // Only the summary is repainted. Redrawing the rows would replace the
 // <input> somebody is typing into and eat the rest of the word -- the trap
 // the Smart 1 Ads target-area rows had, and the Google orphan list after it.
 paintTargetMeta();}
function rmTarget(i){targetRows().splice(i,1);saveSoon();drawCompetitors();}
function targetsReady(){return targetRows().filter(r=>(r.name||"").trim());}
function targetsWithAddress(){return targetsReady().filter(r=>(r.address||"").trim());}
function competitorPanel(){return '<div id="compWrap"></div>';}
function targetSummary(){
 const named=targetsReady(),located=targetsWithAddress();
 if(!named.length)return "Nobody named yet. Conquesting stays a general audience layer until somebody is.";
 const bits=[named.length+" named"];
 if(located.length)bits.push(located.length+" with an address we can fence");
 const noAddr=named.length-located.length;
 if(noAddr)bits.push(noAddr+" by brand and behavior only — no address to fence");
 return bits.join(" · ");}
function paintTargetMeta(){
 const el=document.getElementById('compMeta');
 if(el)el.textContent=targetSummary();}
function drawCompetitors(){
 const w=document.getElementById('compWrap');if(!w)return;
 const rows=targetRows();
 w.innerHTML=`<div class="bpanel"><div class="ttl">🥊 Competitors and places to target</div>
  <div class="note" style="margin-top:2px">Who do they lose business to, and where do their customers already go? Named here, this reaches the proposal's audience section and the insertion order — a geo-fence cannot be built from "competitor conquesting".</div>
  <div class="arealist" style="margin-top:10px">${rows.map((r,i)=>`
   <div class="prod"><div class="pi">${r.kind==="venue"?"🏟":r.kind==="place"?"📍":"🥊"}</div>
    <div class="grow">
     <div class="two">
      <div class="fld" style="margin-top:0"><label>Name</label>
       <input value="${esc(r.name)}" placeholder="${r.kind==="competitor"?"Riverside Dental":"Lucas Oil Stadium"}" oninput="setTarget(${i},'name',this.value)"></div>
      <div class="fld" style="margin-top:0"><label>Address, if we are fencing it <span style="font-weight:400;color:var(--muted)">— optional</span></label>
       <input value="${esc(r.address)}" placeholder="1200 Main St, Carmel, IN 46032" oninput="setTarget(${i},'address',this.value)"></div>
     </div>
     <div class="fld"><label>What we want from it</label>
      <input value="${esc(r.note)}" placeholder="e.g. their implant patients — they run a discount offer every spring" oninput="setTarget(${i},'note',this.value)"></div>
    </div>
    <button class="x" title="Remove" onclick="rmTarget(${i})">✕</button></div>`).join('')}</div>
  <div class="addrow" style="margin-top:12px">${TARGET_KINDS.map(k=>
   `<button class="btn btn-ghost" title="${esc(k.help)}" onclick="addTarget('${k.key}')">+ ${esc(k.label)}</button>`).join('')}</div>
  <div class="addrow" style="margin-top:8px">
   <button class="btn btn-line" onclick="FINDT.open=!FINDT.open;drawCompetitors()">🔎 Find competitors and places</button>
   <button class="btn btn-line" onclick="PLACEPASTE.open=!PLACEPASTE.open;drawCompetitors()">📋 Paste a list</button></div>
  ${findTargetsHtml()}${placePasteHtml()}
  <div class="note" id="compMeta" style="margin-top:8px">${esc(targetSummary())}</div>
 </div>`;}

/* ------------------------------------------------------------
   Researching who to go after

   The client is the person who knows who they lose business to, and they are
   not in the room when the proposal is built. So this asks the model, over
   the web, inside the target areas that are already on the campaign.

   Everything it returns is a **suggestion**. Nothing reaches the campaign or
   the client document until somebody ticks it -- printing a researched list
   on a proposal is us telling a client who their competitors are on a
   model's say-so, and that is the paragraph a client checks hardest. Same
   rule modules/ads_builder applies to its own competitor research.

   An address comes back only where the model gave one and is labeled
   unverified, because a geo-fence built on a wrong address spends the budget
   outside somebody else's front door.
   ------------------------------------------------------------ */
let FINDT={open:false,busy:false,rows:null,note:"",error:""};
function findTargetsHtml(){
 if(!FINDT.open)return '';
 const areas=(S.targetAreas||[]).filter(areaComplete);
 return `<div class="bpanel" style="margin-top:12px;background:#f7fbff"><div class="ttl">🔎 Find competitors and places to target</div>
  <div class="note" style="margin-top:3px">Smart 1 researches the target areas already on this campaign${areas.length?' ('+esc(areas.map(areaLabel).join(' · '))+')':''} and proposes who to go after. Everything it finds is a suggestion until you tick it.</div>
  ${areas.length?'':'<div class="warnbox" style="margin-top:9px">Add a target area first — without somewhere to look, a search like this comes back with national brands.</div>'}
  <div class="fld" style="margin-top:9px"><label>What do they sell, in a few words? <span style="font-weight:400;color:var(--muted)">— optional, but it sharpens the answer</span></label>
   <input id="findSells" value="${esc(FINDT.sells||S.sells||'')}" placeholder="e.g. dental implants and cosmetic dentistry" oninput="FINDT.sells=this.value"></div>
  <div class="addrow" style="margin-top:9px">
   <button class="btn btn-primary" ${(!areas.length||FINDT.busy)?'disabled':''} onclick="runFindTargets()">${FINDT.busy?'<span class="spin" data-s1-think="ai"></span>Researching the market…':'🔎 Research this market'}</button>
   <button class="btn btn-ghost" onclick="FINDT.open=false;drawCompetitors()">Close</button></div>
  ${FINDT.error?'<div class="warnbox" style="margin-top:9px">'+esc(FINDT.error)+'</div>':''}
  ${FINDT.rows?findResultsHtml():''}</div>`;}
function findResultsHtml(){
 if(!FINDT.rows.length)
  return '<div class="note" style="margin-top:10px">'+esc(FINDT.note||'Nothing came back for this campaign.')+'</div>';
 const icon=k=>k==="venue"?"🏟":k==="place"?"📍":"🥊";
 return `<div style="margin-top:11px">
  <div class="note" style="margin-bottom:7px">${esc(FINDT.note||'')}</div>
  ${FINDT.rows.map((r,i)=>`<label class="prod" style="cursor:pointer;background:#fff">
    <input type="checkbox" ${r.accepted?'checked':''} onchange="FINDT.rows[${i}].accepted=this.checked;drawFindCount()" style="margin:4px 8px 0 0">
    <div class="pi">${icon(r.kind)}</div>
    <div class="grow"><h4>${esc(r.name)}</h4>
     <div class="meta">${esc(r.note||'')}</div>
     <div class="meta">${r.address
       ? '📍 '+esc(r.address)+' <span style="color:#8c5a00">— unverified, check it before it is used to build a fence</span>'
       : 'No address — brand and behavior only, which is a real answer and not a gap'}</div>
    </div></label>`).join('')}
  <div class="addrow" style="margin-top:10px">
   <button class="btn btn-primary" onclick="addFoundTargets()">+ Add ticked</button>
   <span class="note" id="findCount" style="align-self:center"></span></div></div>`;}
function drawFindCount(){
 const n=(FINDT.rows||[]).filter(r=>r.accepted).length;
 const el=document.getElementById('findCount');
 if(el)el.textContent=n?n+" ticked":"Nothing ticked yet — tick what belongs on this campaign.";}
async function runFindTargets(){
 FINDT.busy=true;FINDT.error="";drawCompetitors();
 try{
  const d=await api('/sales/builder/api/find-targets',{method:'POST',body:JSON.stringify({
    client:S.client||"",url:S.url||"",industry:S.industry||"",sells:FINDT.sells||"",
    objectives:S.objectives||[],areas:S.targetAreas||[],existing:targetRows()})});
  FINDT.rows=d.targets||[];FINDT.note=d.note||"";
 }catch(e){
  /* "We could not look" and "there is nobody worth naming" are different
     answers and only the second means stop looking. */
  FINDT.error="The research did not run: "+e.message+". Nothing has been changed on the campaign.";
  FINDT.rows=null;
 }finally{FINDT.busy=false;drawCompetitors();drawFindCount();}}
function addFoundTargets(){
 const picked=(FINDT.rows||[]).filter(r=>r.accepted);
 if(!picked.length){toast("Tick the ones that belong on this campaign first.");return;}
 picked.forEach(r=>targetRows().push(Object.assign(blankTarget(),
   {kind:r.kind,name:r.name,address:r.address||"",note:r.note||""})));
 FINDT.rows=(FINDT.rows||[]).filter(r=>!r.accepted);
 saveNow();drawCompetitors();
 toast("Added "+picked.length+" — check any address before the fence is built.");}

/* The same paste box as the target areas, for the rows inside them. A
   separate reader on the server, deliberately: a competitor line is a

let PLACEPASTE={open:false,busy:false,text:"",kind:"competitor",result:null};
function placePasteHtml(){

  <div class="two" style="margin-top:9px"><div class="fld" style="margin-top:0"><label>These are</label>
   <select onchange="PLACEPASTE.kind=this.value">${TARGET_KINDS.map(k=>`<option value="${k.key}" ${PLACEPASTE.kind===k.key?'selected':''}>${esc(k.label)}</option>`).join('')}</select></div><div></div></div>
  <div class="fld"><textarea style="min-height:100px" oninput="PLACEPASTE.text=this.value"
    placeholder="Riverside Dental | 1200 Main St, Carmel, IN 46032 | their implant patients&#10;Lucas Oil Stadium, 500 S Capitol Ave, Indianapolis, IN">${esc(PLACEPASTE.text)}</textarea></div>
  <div class="addrow">

    ${(r.skipped||[]).map(x=>`<div class="note" style="margin:3px 0;color:#8c5a00">✕ <b>${esc(x.line)}</b> — ${esc(x.reason)}</div>`).join('')}
    <div class="addrow" style="margin-top:10px"><button class="btn ${(r.places||[]).length?'btn-primary':'btn-ghost'}" ${(r.places||[]).length?'':'disabled'} onclick="applyPlacePaste()">+ Add ${(r.places||[]).length}</button></div></div>`:''}
 </div>`;}
async function readPlacePaste(){
 if(!String(PLACEPASTE.text||"").trim()){toast("Paste the list first.");return;}
 PLACEPASTE.busy=true;drawCompetitors();
 try{PLACEPASTE.result=await api('/sales/builder/api/paste-places',{method:'POST',
   body:JSON.stringify({text:PLACEPASTE.text,kind:PLACEPASTE.kind,existing:targetRows()})});}
 catch(e){toast("Could not read that list: "+e.message);}
 finally{PLACEPASTE.busy=false;drawCompetitors();}}
function applyPlacePaste(){
 const add=((PLACEPASTE.result||{}).places)||[];
 if(!add.length)return;
 add.forEach(r=>targetRows().push(Object.assign(blankTarget(),r)));
 PLACEPASTE.open=false;PLACEPASTE.result=null;PLACEPASTE.text="";

/* Age and income were chips and are sliders now, so 'age' and 'inc' are gone
   from this map. Left in, they would toggle S.ages under a control that reads
   its range from S.ageRange -- the screen and the reach estimate disagreeing
   with nothing erroring. */
function pill(kind,v){const m={exc:S.exclusions,aud:S.audiences,kpi:S.kpis};
 if(!m[kind])return;toggle(m[kind],v);saveSoon();renderStep();}
function addCustom(kind,id){const el=document.getElementById(id);const v=(el.value||'').trim();if(!v)return;const m={exc:S.exclusions,aud:S.audiences,kpi:S.kpis};if(!m[kind].includes(v))m[kind].push(v);el.value='';saveSoon();renderStep();}
function goal(k){toggle(S.objectives,k);S.items=[];S.kpis=[];saveSoon();renderStep();}
/* The Measurement step's choices. The catalog is the IO builder's own
   benchmark table, handed over by the server (CFG.kpi_choices, from
   hub/kpi_framework.py) rather than restated here -- a second list of what a
   KPI can be is the drift the benchmark mirror test exists to stop. The
   plan-derived group reads S._kpiPlan.rows, the server's own derivation of
   what each product on the plan is measured on, so there is still no client
   copy of benchmarkFor. Grouped because the three lists answer different
   questions, and deduped across them on the lowercased name with the plan's
   answer first: its expected range is the specific one. */
function kpiPill(k,expected){
 return '<span class="pill'+(S.kpis.includes(k)?' on':'')+'" onclick="pill(\'kpi\',this.dataset.v)" data-v="'+esc(k)+'">'+esc(k)+(expected?'<span class="kpix">'+esc(expected)+'</span>':'')+'</span>';}
function kpiChoiceGroups(){
 const seen=new Set();
 const take=rows=>rows.filter(r=>{const key=(r.kpi||'').toLowerCase();if(!key||seen.has(key))return false;seen.add(key);return true;});
 const byKpi={};
 (((kpiPlan()||{}).rows)||[]).filter(r=>r.matched).forEach(r=>{const key=r.kpi.toLowerCase();if(!byKpi[key])byKpi[key]={kpi:r.kpi,expected:r.expected};});
 const plan=take(Object.values(byKpi));
 const goal=take([...new Set(S.objectives.flatMap(o=>objectiveKPIs[o]||[]))].map(k=>({kpi:k,expected:''})));
 const cat=take(((CFG.kpi_choices||{}).catalog)||[]);
 const groups=[];
 if(plan.length)groups.push({title:"What the products on the plan are measured on",rows:plan});
 if(goal.length)groups.push({title:"Suggested by the campaign goals",rows:goal});
 if(cat.length)groups.push({title:(plan.length||goal.length)?"The rest of the benchmark table":"From the benchmark table",rows:cat});
 return groups;}
function budgetDriftNote(){
 /* The plan moves the working budget, so this step has to say when the two
    have parted company -- otherwise a rep who set $8,000, built a $5,750
    plan and came back here reads $5,750 with no explanation and assumes the
    tool lost their answer. What the client asked for is a fact about the
    conversation and is never overwritten. */
 const asked=+S.budgetAsked||0,plan=planRecurring();
 if(!asked||!plan||Math.abs(asked-plan)<1)return '';
 return `<div class="note" style="margin-top:10px">The plan now totals
  <b>${money(plan)}</b> a month, so that is what the proposal, the packages and
  the insertion order are costed at. ${esc(S.client||"The client")} asked for
  <b>${money(asked)}</b> — that is kept on the quote and is not overwritten.
  <a onclick="setBudget(${asked})" style="cursor:pointer;color:var(--blue);font-weight:700">Re-seed the plan at ${money(asked)}</a>.</div>`;}
function setBudget(v){
 /* Both: the number the client asked for, kept as a fact about the
    conversation, and the working budget the plan is seeded from. The plan
    then moves the working figure and never this one. */
 S.budget=+v||0;S.budgetAsked=+v||0;
 S.configured=false;applySeeds();saveSoon();renderStep();}

/* ============================================================
   THE COVERAGE MAP

   One picture, drawn server-side by hub/target_map.py and served as a PNG,
   so the preview, the PDF and the Word export cannot disagree about where
   the campaign runs. Deliberately not drawn in the browser: a JavaScript map
   would be a fourth renderer of the same fact, and this codebase already
   pays for two mirrors (target areas, the creative classifier) that each
   need a test proving the halves still agree.

   The URL carries a signature of the areas, so changing a radius gets a new
   picture rather than the browser serving yesterday's -- a stale map is the
   worst failure available here, because it is plausible, it is on the
   document, and it is about somewhere else.
   ============================================================ */
function areaSig(){
 const rows=(S.targetAreas||[]).map(a=>[a.type,a.origin,a.radius,a.dma,a.state,a.other,a.name].join("|"));
 let h=0;const str=rows.join("~");
 for(let i=0;i<str.length;i++){h=((h<<5)-h+str.charCodeAt(i))|0;}
 return String(h>>>0);}
function mapUrl(){return '/sales/builder/api/quotes/'+QUOTE_ID+'/target-map.png?v='+areaSig();}
/* The map, and the way to take it off the document said out loud.

   Leaving it out was already possible from the 🗺 in the section tools, and
   that is the same mistake the Smart 1 Ads estimate made with its per-section
   pencils: a control drawn at 45% opacity in a row of five icons is a control
   nobody finds, and the one question somebody actually asks of a map is
   "that doesn't look right — how do I get rid of it?". So the answer sits
   under the picture, in words, where the question is asked. The icon stays:
   it is how the map comes back, and it is where every other section-level
   switch lives. */
function mapBlock(sec){
 if(sec.showMap===false)
  return `<div class="dnote">🗺 The coverage map is left out of this proposal — the target areas below still print.
   <a onclick="toggleSecMap('${sec.id}')" style="cursor:pointer;color:var(--blue);font-weight:700">Put the map back</a></div>`;
 if(!QUOTE_ID)
  return '<div class="dnote">The map is drawn once this proposal has saved.</div>';
 if(!(S.targetAreas||[]).some(areaComplete))
  return '<div class="dnote">No target area to map yet.</div>';
 return `<div class="dmap"><img src="${mapUrl()}" alt="Map of the campaign's target areas"
   onerror="mapImgFailed(this)">
  <div class="dnote maprow"><span id="mapNote"></span>
   <a onclick="toggleSecMap('${sec.id}')" style="cursor:pointer;color:var(--blue);font-weight:700;white-space:nowrap"
     title="The map comes off the PDF and the Word export. The target-area table stays.">Doesn't look right? Remove this map</a>
  </div></div>`;}
function toggleSecMap(id){
 const sec=S.sections.find(x=>x.id===id);if(!sec)return;
 sec.showMap=sec.showMap===false;saveSoon();drawPreview();}
/* A map that could not be drawn leaves no gap on the client's document and
   no silence on the rep's screen: the image is removed and the reason is
   printed here, where somebody can act on it. */
function mapImgFailed(img){
 img.style.display='none';
 mapStatus().then(st=>{
  const n=document.getElementById('mapNote');
  if(n)n.textContent=(st&&st.reason)||"The map could not be drawn this time. The target areas are unaffected.";});}
let _mapStatusSig=null,_mapStatusData=null,_mapStatusP=null;
function mapStatus(force){
 const sig=areaSig();
 if(!force&&_mapStatusSig===sig&&_mapStatusData)return Promise.resolve(_mapStatusData);
 if(_mapStatusP&&_mapStatusSig===sig)return _mapStatusP;
 _mapStatusSig=sig;
 _mapStatusP=api('/sales/builder/api/target-map/status',{method:'POST',
   body:JSON.stringify({areas:S.targetAreas||[]})})
  .then(d=>{_mapStatusData=d;return d;})
  .catch(()=>({measured:false,plotted:[],not_plotted:[],unfound:[],
    reason:"We could not check the map."}));
 return _mapStatusP;}
/* What the map shows, said in words, on the screen where the areas are
   edited. Three answers rather than two: drawn, covered but not drawable (a
   DMA has no boundary here and drawing a blob would be a claim nobody can
   check), and not found at all -- which is the only one of the three that is
   somebody's to fix, so it is the only one offered as something to fix. */
function drawMapPanel(){
 const box=document.getElementById('mapPanel');if(!box)return;
 if(!QUOTE_ID){box.innerHTML='<div class="note">The map is drawn once this proposal has saved.</div>';return;}
 if(!(S.targetAreas||[]).some(areaComplete)){
  box.innerHTML='<div class="note">Describe an area and it appears here.</div>';return;}
 /* Capped rather than full-bleed. At the width of this step the picture
    fills a laptop screen on its own and pushes the audience controls under
    the fold -- and the map is reference here, not the deliverable. */
 box.innerHTML=`<img src="${mapUrl()}" alt="Map of the campaign's target areas"
   style="width:100%;max-width:560px;display:block;border:1px solid var(--line);border-radius:10px"
   onerror="this.style.display='none'"><div class="note" id="mapPanelNote" style="margin-top:7px"><span class="spin" data-s1-think="scan"></span>Checking what the map can show…</div>`;
 mapStatus().then(st=>{
  const n=document.getElementById('mapPanelNote');if(!n)return;
  const bits=[];
  if(st.plotted&&st.plotted.length)
   bits.push('<b>'+st.plotted.length+'</b> area'+(st.plotted.length===1?'':'s')+' drawn');
  (st.not_plotted||[]).forEach(r=>bits.push(esc(r.label)+' — '+esc(r.reason)));
  let html=bits.join(' · ')||esc(st.reason||'');
  if(st.unfound&&st.unfound.length)
   html+='<div class="warnbox" style="margin-top:8px">Not on the map: '
    +st.unfound.map(r=>'<b>'+esc(r.label)+'</b> — '+esc(r.reason)).join('<br>')
    +'<div style="margin-top:5px">The campaign still covers these. Correcting the city or adding the state puts them on the picture.</div></div>';
  n.innerHTML=html;});}

/* ============================================================

   already exists in the email the rep is reading. Nothing is added until the
   rows come back and somebody presses Add: the reading is shown first, line
   by line, because a paste that quietly assumed ten miles on eight lines is
   eight decisions nobody made -- and a line that could not be read has to be
   seen rather than counted.

let PASTE={open:false,busy:false,result:null,text:""};
function pasteBox(){
 if(!PASTE.open)
  return `<div style="margin-top:10px"><button class="btn btn-line" onclick="PASTE.open=true;renderStep()">📋 Paste a list of locations</button></div>`;

 return `<div class="bpanel" style="margin-top:12px"><div class="ttl">📋 Paste a list of locations</div>
  <div class="note" style="margin-top:3px">One location per line. A city, a ZIP Code, a DMA or a state — with a radius if you have one. Columns pasted from a spreadsheet work too: <span style="white-space:nowrap">name | city | radius | notes</span>.</div>

    placeholder="Carmel showroom | Carmel, IN | 10&#10;Fishers, IN 15mi&#10;Indianapolis DMA&#10;46032, 46033, 46074"
    oninput="PASTE.text=this.value">${esc(PASTE.text)}</textarea></div>
  <div class="addrow">
   <button class="btn btn-primary" id="pasteBtn" onclick="readPaste()" ${PASTE.busy?'disabled':''}>${PASTE.busy?'<span class="spin"></span>Reading…':'Read this list'}</button>
   <button class="btn btn-ghost" onclick="PASTE.open=false;PASTE.result=null;renderStep()">Cancel</button>
  </div>
  ${r?pasteResultHtml(r):''}</div>`;}
function pasteResultHtml(r){
 const rows=(r.rows||[]).map(x=>`<div class="note" style="margin:3px 0">${x.duplicate?'⏭':'✓'} <b>${esc(x.line)}</b> — ${esc(x.read)}${x.duplicate?' (already on this campaign)':''}</div>`).join('');
 const bad=(r.skipped||[]).map(x=>`<div class="note" style="margin:3px 0;color:#8c5a00">✕ <b>${esc(x.line)}</b> — ${esc(x.reason)}</div>`).join('');
 const n=(r.areas||[]).length;
 return `<div style="margin-top:11px;border-top:1px solid var(--line);padding-top:10px">
  <div class="note"><b>${esc(r.note||'')}</b></div>

  ${bad?'<div class="note" style="margin-top:5px">Lines that were not understood are left out — add those by hand, or reword them and read the list again.</div>':''}

   <button class="btn ${n?'btn-primary':'btn-ghost'}" ${n?'':'disabled'} onclick="applyPaste()">+ Add ${n} target area${n===1?'':'s'}</button>
  </div></div>`;}
async function readPaste(){
 if(!String(PASTE.text||"").trim()){toast("Paste the list first.");return;}
 PASTE.busy=true;renderStep();
 try{PASTE.result=await api('/sales/builder/api/paste-areas',{method:'POST',
   body:JSON.stringify({text:PASTE.text,areas:S.targetAreas||[]})});}
 catch(e){toast("Could not read that list: "+e.message);}
 finally{PASTE.busy=false;renderStep();}}
function applyPaste(){
 const add=(PASTE.result||{}).areas||[];
 if(!add.length)return;
 S.targetAreas=(S.targetAreas||[]).filter(a=>areaComplete(a)||!areaIsBlank(a)).concat(add);
 S.aiEst=null;PASTE.open=false;PASTE.result=null;PASTE.text="";
 syncLegacyGeo();saveNow();renderStep();
 toast("📍 "+add.length+" target area"+(add.length===1?'':'s')+" added.");}
/* A blank starter row the wizard creates for the editor. Pasting a list
   should replace it rather than leaving an empty area at the top of the
   campaign, which is what `areaComplete` alone would do. */
function areaIsBlank(a){
 a=a||{};
 return !String(a.name||"").trim()&&!String(a.origin||"").trim()&&!String(a.dma||"").trim()
   &&!String(a.state||"").trim()&&!String(a.other||"").trim()&&!String(a.zips||"").trim()
   &&a.type!=="Statewide"&&a.type!=="National";}

/* ============================================================
   TARGET AREA SUB-FLOW
   ============================================================ */
function currentArea(){
 if(!S.targetAreas||!S.targetAreas.length)return null;
 const i=Math.min(Math.max(0,S._areaIx|0),S.targetAreas.length-1);
 S._areaIx=i;return S.targetAreas[i];}
/* A control that writes into nothing is a control that does not work, and
   this one said nothing while failing. The editor renders `currentArea() ||
   blankArea()`, so with an empty list every field on the step was bound to a
   throwaway object: picking DMA set a property on it, the redraw read the
   list, and the select snapped back to City/ZIP + Radius with the radius at
   10 and no error anywhere. Pressing Back off a half-typed area is how the
   list came to be empty while `S._areaView` still said "edit" -- which is
   the one state the step's own seeding skipped. Seed here rather than
   return, so no route into that state can leave the step dead. */
function setArea(k,v){
 let a=currentArea();
 if(!a){S.targetAreas=[blankArea()];S._areaIx=0;S._areaView="edit";a=S.targetAreas[0];}
 a[k]=v;S.aiEst=null;syncLegacyGeo();saveSoon();}
function areaEditorStep(){
 const a=currentArea()||blankArea();
 const n=S.targetAreas.length,ix=(S._areaIx|0)+1;
 const first=n<=1;
 return{eyebrow:"Target Area "+ix+(n>1?" of "+n:""),
  title:first?"Where should we run it?":"Where else should we run it?",

   ${a.type==="National"?'<div></div>':''}</div>
  ${a.type==="City/ZIP + Radius"?`<div class="fld"><label>Radius (miles)</label><input type="number" min="1" value="${a.radius||10}" oninput="setArea('radius',Math.max(1,+this.value));drawAreaEst()" style="max-width:160px"></div>`:''}
  ${(a.type==="City/ZIP + Radius"||a.type==="Other")?(()=>{
   /* Finding the ZIPs is an action, and the list itself is reference. It used
      to be an always-open textarea of a hundred five-digit numbers sitting
      between the radius and the notes, which buried the rest of the step.
      The list lives at the foot of the proposal now; here it is a count, a

   const z=areaZips(a);
   return `<div class="bpanel" style="margin-top:12px"><div class="ttl">📍 ZIP Codes for this area</div>
    <div class="note" style="margin-top:4px">${z.length
      ? '<b>'+z.length+' ZIP Code'+(z.length===1?'':'s')+'</b> captured. They print at the back of the proposal and travel to the insertion order.'

     ${a.type==="City/ZIP + Radius"?`<button class="btn ${z.length?'btn-line':'btn-primary'}" id="zipBtn" onclick="lookupZips()">📍 ${z.length?'Find them again':'Find the ZIP Codes this radius touches'}</button>`:''}
     <button class="btn btn-ghost" onclick="S._zipEdit=!S._zipEdit;renderStep()">${S._zipEdit?'✓ Done':'✎ Enter or edit them by hand'}</button></div>

    <div class="fld" style="margin-top:10px"><label>Exceptions — say it the way you would say it</label>

     <div class="note" id="zipRuleNote" style="margin-top:5px">${zipRuleNote(a)}</div></div>
    <div class="note" id="zipNote" style="margin-top:5px"></div></div>`;})():''}
  ${a.type==="Other"?`<div class="fld"><label>Approximate population (optional)</label><input type="number" value="${a.population||''}" oninput="setArea('population',+this.value||0);drawAreaEst()" style="max-width:220px"><div class="note" style="margin-top:5px">Without this, an "Other" area is reported as not measured rather than being guessed at.</div></div>`:''}
  <div class="fld"><label>Notes for this area (optional)</label>

  <div class="bpanel"><div class="ttl">📊 Estimated reach for this area</div><div id="areaEst" class="note"></div></div>

  </div>`,
  valid:()=>areaComplete(currentArea()),
  after:drawAreaEst,
  nextLabel:"✓ Save this target area",
  onNext:saveArea,
  onBack:()=>{
   // Leaving a blank new area behind would leave an unnamed row on the list.
   const a=currentArea();
   if(a&&!areaComplete(a))S.targetAreas.splice(S._areaIx,1);
   if(S.targetAreas.length){S._areaView="list";syncLegacyGeo();saveSoon();renderStep();return true;}
   // Nothing saved yet — fall through to the previous step. The view is
   // cleared with it: left saying "edit" over an empty list it rides in the

 S.targetAreas=S.targetAreas||[];

  /* ============================================================
   PROPOSAL PREVIEW
   The document as the client will read it. Every section renders the same
   content the PDF will: prose where the section is prose, the real table
   where it is a table. A section can be edited in place, rewritten by the
   AI, or hidden -- and the media plan can be re-costed here rather than
   sending the rep back three steps to change one budget.
   ============================================================ */
function drawPreview(){
 const host=document.getElementById('docPreview');if(!host)return;
 const e=S.estimates||estimates();
 host.innerHTML=`<div class="paperdoc">
  <div class="docband">SMART 1 MARKETING</div>
  <h2 class="doctitle">Marketing Proposal — ${esc(S.client||'Client')}</h2>
  <div class="docsub">${esc(QUOTE_NUMBER||'Draft')} · ${esc(new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}))}${S.salesContact?' · Prepared by '+esc(S.salesContact):''}</div>
  ${S.sections.map((sec,i)=>previewSection(sec,i,e)).join('')}
 </div>`;}
function previewSection(sec,i,e){
 const req=isRequired(sec);
 const editing=S._editSec===sec.id;
 const hasTable=sectionHasTable(sec);
 const tableOn=sec.showTable!==false;
 const tools=`<div class="dtools">
   <button class="ic" title="${editing?'Done editing':'Edit this section'}" onclick="toggleEditSec('${sec.id}')">${editing?'✓':'✎'}</button>
   <button class="ic" title="Rewrite with AI" onclick="rewriteSecById('${sec.id}')">✨</button>
   ${hasTable?`<button class="ic" title="${tableOn?'Leave this table out of the proposal — the section copy stays':'Put this table back in the proposal'}" onclick="toggleSecTable('${sec.id}')">${tableOn?'📊':'🚫📊'}</button>`:''}
