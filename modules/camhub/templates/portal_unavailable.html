<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portal temporarily unavailable</title>
<style>
  body{margin:0;background:#f4f6fa;color:#1e293b;font:15px/1.55 'Segoe UI',system-ui,sans-serif}
  .wrap{max-width:520px;margin:60px auto;padding:0 20px;text-align:center}
  h1{color:#1a2e58;font-size:22px;margin:0 0 8px}
  p{color:#475569;margin:0 0 6px}
  .kind{display:inline-block;padding:3px 10px;border-radius:12px;background:#e0e7ff;color:#3730a3;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
</style></head><body>
<div class="wrap">
  <span class="kind">Sponsor Portal</span>
  <h1>The portal is temporarily unavailable</h1>
  <p>{{ reason }}</p>
  <p style="margin-top:16px">Nothing on your side to fix. Reload in a few minutes; the monthly report on file always ships whatever the portal is doing.</p>
</div>
</body></html>
