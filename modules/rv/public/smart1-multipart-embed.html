<!--
Smart RV Demand Package — embed for smart1marketing.com / Smart 1 Suite
======================================================================

This file used to be a SECOND COPY of the RV form, meant to be pasted into a
Suite page and to post back to the Hub. It is not that any more, and the two
reasons are worth keeping:

  * It shipped `const API_BASE = 'https://YOUR-RENDER-APP.onrender.com'`.
    A placeholder reads as configured to every glance and every "is it set?"
    check, which is exactly how CLOUDINARY_URL sat broken in this codebase for
    months.
  * It built its request path by concatenating that base onto the endpoint —
    the one shape tools/linkcheck.py cannot see — and the endpoint it used
    omits the `/land/rv` mount this app actually answers on, so it was a 404
    even with the host filled in correctly. Anyone who pasted it got a form
    that collected answers and delivered none of them, with nothing on either
    side reading as an error.

And a copied form drifts: the day a field is added to the real wizard, the
pasted copy keeps collecting the old set and says nothing.

So the embed frames the real tool instead. Paste ONE line into a Custom HTML
block. Nothing else has to be configured — the mount prefix, the field list
and the lead path all come from the server.

  <script src="https://smart1-hub.onrender.com/land/rv/embed.js"></script>

For a builder that strips <script>, use a plain iframe. Note there is NO
trailing slash on /embed: this wizard's siblings call their APIs with relative
paths that resolve against the DIRECTORY of the current URL, and a slash turns
that into a 404 nobody meets until they press submit.

  <iframe src="https://smart1-hub.onrender.com/land/rv/embed"
          title="RV Dealer Marketing Gameplan"
          style="display:block;width:100%;height:1400px;border:0"
          loading="lazy"></iframe>

Full instructions, and the line for the other eight gameplan pages:
docs/smart1marketing-embeds.md
-->
