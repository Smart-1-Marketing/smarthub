name: check-reconciliation-shared-qb

on:
  pull_request:
    paths:
      - 'modules/check_reconciliation/**'
      - 'test_check_reconciliation.py'
      - 'tests/test_check_reconciliation_shared_qb.py'
      - '.github/workflows/check-reconciliation-shared-qb.yml'

permissions:
  contents: read

jobs:
  shared-qb:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
      SECRET_KEY: ci-not-a-real-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python test_check_reconciliation.py
      - run: pytest -q tests/test_check_reconciliation_shared_qb.py
