# The checks CLAUDE.md tells a contributor to run, run for them on every PR.
#
# The order is deliberate: cheapest and most specific first, so a syntax error
# is reported in seconds rather than after a five-minute boot. Everything here
# is a script already in the repo — CI runs what a person runs, so a green run
# means the same thing in both places, and no check exists only in CI where
# nobody can reproduce it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push supersedes the run in flight for the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres, not SQLite. Sites Admin refuses to start without a real
    # Postgres URL and serves wsgi.py's 503 fallback instead, so on SQLite a
    # whole module silently drops out of every check that boots the app. With
    # the service running, `pagecheck --strict` can treat a 503 as the failure
    # it would be in production. It also exercises create_all() under the
    # advisory lock, which is a documented deploy-time failure mode.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smarthub
          POSTGRES_PASSWORD: smarthub
          POSTGRES_DB: smarthub_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://smarthub:smarthub@localhost:5432/smarthub_ci
      SECRET_KEY: ci-not-a-real-secret
      PANEL_PASSWORD: ci-not-a-real-password
      # HUB_DATA_DIR is deliberately NOT set. It is unset on the Render
      # service too, so leaving it alone keeps CI on the same code path
      # production takes — data_root() falls back the same way in both. The
      # runner is thrown away, so ./data being written to costs nothing.

    steps:
      - uses: actions/checkout@v4

      # 3.12 is what the Dockerfile ships, so CI and production agree on which
      # standard library and which SQLAlchemy behaviour are being tested.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- cheap, specific, first -------------------------------------
      - name: Python syntax (every file)
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.py'):
              if '_attic' in p.parts or 'node_modules' in p.parts:
                  continue
              try:
                  ast.parse(p.read_text(errors='ignore'))
              except SyntaxError as exc:
                  bad.append(f"{p}:{exc.lineno}: {exc.msg}")
          for b in bad:
              print("FAIL  " + b)
          print(f"\n{len(bad)} file(s) with syntax errors")
          sys.exit(1 if bad else 0)
          PY

      # node --check is the real parser; tools/jscheck.py is the stand-in used
      # where node is unavailable. Both run, because they disagree in useful
      # ways: node catches what balance alone cannot, and jscheck is what the
      # template and page checks are built on, so a regression in it would
      # silently weaken those.
      - name: JavaScript syntax (static files)
        run: |
          node --check hub/static/*.js
          for f in modules/*/static/*.js; do [ -e "$f" ] && node --check "$f"; done
          python tools/jscheck.py hub/static/*.js

      - name: JavaScript inside HTML (templates, public pages)
        run: python tools/checktemplates.py

      # ---- boot the composed app --------------------------------------
      - name: Internal links resolve against the mounted app that owns them
        run: python tools/linkcheck.py

      # The check that catches what a template cannot show: the page as the
      # browser receives it, after HubBar and after_request have rewritten it.
      - name: Rendered pages (chrome injected as markup, scripts still parse)
        run: python tools/pagecheck.py --strict

      # The Hub's own defect-pattern check, which previously lived behind a
      # login on a page somebody had to remember to open. Gates on `high`
      # only: two medium findings are outstanding today (ad_builder and msa
      # never write to the activity log), and a check that is red the day it
      # is switched on is one people learn to ignore. They are printed every
      # run so they stay visible; clear them and this can go --strict.
      - name: Known defect patterns (/api/integrity)
        run: python tools/integritycheck.py

      # ---- the repo's own harnesses -----------------------------------
      - name: hub/jsonstore.py — the disk backup actually restores
        run: python test_jsonstore.py

      - name: Ads module — every route, mounted the way wsgi.py mounts it
        run: python test_ads_module.py
