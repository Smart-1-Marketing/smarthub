# The checks CLAUDE.md already prescribes, run automatically.
#
# Every one of these existed as a command a person was expected to remember.
# tools/linkcheck.py in particular was written because a module page calling
# fetch("/api/lead") works standalone and 404s under a mount — that bug took
# down lead capture on seven landing pages for two days. It exits non-zero
# precisely so it can gate a release; until now nothing ran it.
#
# Deliberately no deploy step and no secrets. These checks run on pull requests
# from a clean checkout, so they must pass without Knack, GoHighLevel,
# Cloudinary or OpenAI credentials. Anything that needs a live third party
# belongs in /status and /api/integrity on the deployment, not here — a gate
# that fails because someone else's API is down teaches people to ignore it.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in flight for the same branch.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: syntax, links and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres rather than SQLite, for the steps that boot the app. Sites Admin
    # refuses to start without a real Postgres URL and serves wsgi.py's 503
    # fallback instead, so on SQLite a whole module silently drops out of every
    # check that boots -- 36 of 37 pages checked, and nothing saying so. This
    # is a service container, not a credential: it keeps the "no secrets, runs
    # from a clean checkout" rule above intact, and it also exercises
    # create_all() under its advisory lock, which is a deploy-time failure mode.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smarthub
          POSTGRES_PASSWORD: smarthub
          POSTGRES_DB: smarthub_ci
        ports: ['5432:5432']
        # -U/-d on the probe, or it connects as root, which is not a role
        # in this cluster: nine FATAL lines in the service log every run,
        # none of them meaning anything. (A comment inside the folded
        # scalar below would become part of the docker options string.)
        options: >-
          --health-cmd "pg_isready -U smarthub -d smarthub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://smarthub:smarthub@localhost:5432/smarthub_ci
      SECRET_KEY: ci-not-a-real-secret
      PANEL_PASSWORD: ci-not-a-real-password
      CLIENTS_DATA_DIR: tests/fixtures/clients

    steps:
      - uses: actions/checkout@v7

      # Matches the Dockerfile (python:3.12-slim), so the gate runs what
      # production runs.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: modules/ad_builder/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The PDF Optimizer is a wrapper around these two, and they were in the
      # Dockerfile and nowhere else -- so the compression the tool exists for
      # ran in production and in no check anywhere. Same two packages the
      # Dockerfile installs, not a secret and not a service, so the "runs from
      # a clean checkout" rule above is intact. Without them
      # test_image_pdf_optimizers.py still passes: it says out loud that the
      # path was not covered rather than reporting an unrun path as a clean
      # run, which is the thing it is guarding against.
      - name: Install Ghostscript and qPDF (the PDF optimizer's binaries)
        run: sudo apt-get update -qq
             && sudo apt-get install -y -qq --no-install-recommends ghostscript qpdf

      - name: Python syntax
        run: |
          python -c "import ast, pathlib, sys; \
            files = [p for p in pathlib.Path('.').rglob('*.py') if '_attic' not in p.parts]; \
            [ast.parse(p.read_text(errors='ignore'), str(p)) for p in files]; \
            print(f'parsed {len(files)} Python files')"

      - name: JavaScript syntax
        run: python tools/jscheck.py

      # The other half: jscheck skips blocks carrying Jinja, because Node would
      # reject them for the wrong reason. This balance-checks exactly those, so
      # "not checked (Jinja)" in the step above is not the end of the story.
      - name: JavaScript inside Jinja templates
        run: python tools/checktemplates.py

      # Boots the composed app and checks every internal URL literal against
      # the route table of whichever app owns that path. This is the one that
      # catches the mount trap.
      - name: Link and mount check
        run: python tools/linkcheck.py

      - name: Ad builder module tests
        run: python test_ads_module.py

      - name: Guided Ads optimization tests
        run: |
          if [ -f test_ads_optimization.py ]; then
            python test_ads_optimization.py
          else
            echo "test_ads_optimization.py not on this branch — nothing to run."
          fi

      # The Display Ad Builder is the one module that is not Python: ~14,000
      # lines of TypeScript with its own test suite, and until now this
      # workflow ran none of it. The stated reason was that its tests need an
      # npm install "this workflow deliberately does not do" — which was worth
      # re-measuring rather than inheriting. A clean `npm ci` for this module
      # is a couple of seconds and 63 MB, the suite is about ten, and what it
      # buys is the layout engine, the delivery zip, the QA checks and the
      # platform registry actually being exercised instead of described.
      #
      # So the renderer is compiled and tested here, and the file-content
      # checks below keep the job they are uniquely good at.
      - name: Display ad renderer — install
        working-directory: modules/ad_builder
        run: npm ci

      # Typecheck first, and separately: a type error and a failing assertion
      # are different problems, and a combined step reports whichever came
      # first as though it were the only one.
      - name: Display ad renderer — typecheck
        working-directory: modules/ad_builder
        run: npx tsc --noEmit

      - name: Display ad renderer — tests
        working-directory: modules/ad_builder
        run: npm test

      - name: Display ad layout and build screen tests
        # This is NOT made redundant by the suite above, and the two do not
        # overlap at all. Every node test imports a module from src/; this
        # reads the things nothing imports — the hand-authored template JSON,
        # and build.html, which is a browser file no test can require. So it
        # still asserts that the Proof point field has a box to draw into on
        # every layout with room for one, that those boxes sit inside the safe
        # area and clear of everything else, and that the build screen and the
        # render server agree about the shapes they exchange across a wire
        # nothing typechecks. Guarded like the steps below so this workflow
        # stays mergeable on a branch that predates the file. Reads files
        # only — no database, no network.
        run: |
          if [ -f test_display_ads.py ]; then
            python test_display_ads.py
          else
            echo "test_display_ads.py not on this branch — nothing to run."
          fi

      - name: Ads estimate and client review tests
        # The campaign estimate a CLIENT reads: reachable without a Hub login,
        # carrying no staff chrome, one document shared with the internal
        # preview, every avg CPC labelled an industry estimate, and an edit
        # invalidating the approval it was made against. Guarded like the steps
        # below so this workflow stays mergeable on a branch that predates it.
        run: |
          if [ -f test_ads_estimate.py ]; then
            python test_ads_estimate.py
          else
            echo "test_ads_estimate.py not on this branch — nothing to run."
          fi

      - name: Measured CPC, access tier and deploy preflight tests
        # Google is stubbed throughout, deliberately: what is worth asserting
        # is what the module does when Google says NO, and that is unreachable
        # from a deployment where Google says yes. A top-of-page bid must never
        # be printed as a cost per click, a DEVELOPER_TOKEN_NOT_APPROVED must
        # read as the access tier rather than a bad key, and an area Google
        # could not place must be named rather than widened. Guarded like the
        # steps above so this workflow stays mergeable on a branch that
        # predates the file. No database, no network.
        run: |
          if [ -f test_ads_keyword_plan.py ]; then
            python test_ads_keyword_plan.py
          else
            echo "test_ads_keyword_plan.py not on this branch — nothing to run."
          fi

      - name: Smart 1 Ads explainer tests
        # The bubbles, the per-screen tour and the two walkthroughs. Every
        # failure this covers is silent by design: a bubble whose key is not in
        # the registry is removed rather than left dead on the page, a tour step
        # whose selector matches nothing keeps its narration and hides the ring,
        # and a walkthrough offered on a screen it cannot drive highlights
        # nothing while "Do it for me" returns without doing anything. Guarded
        # like the steps around it so this workflow stays mergeable on a branch
        # that predates the file. Reads files and renders templates -- no
        # database, no network.
        run: |
          if [ -f test_ads_explainer.py ]; then
            python test_ads_explainer.py
          else
            echo "test_ads_explainer.py not on this branch — nothing to run."
          fi

      - name: JSON store tests
        run: python test_jsonstore.py

      - name: Database boot tests
        # A database briefly unreachable during a deploy, and the four ways
        # that used to become permanent: a boot DDL that did not retry, a
        # verdict nothing re-asked (which 503s every Scans route and the
        # client upload link for the life of the worker), a Scans boot failure
        # that was logged nowhere at all, and a sign-in that answered 500 --
        # locking the whole company out and pointing them at their own
        # password. Nothing here reaches a database that is not the throwaway
        # SQLite one. Guarded like the steps around it so this workflow stays
        # mergeable on a branch that predates the file.
        run: |
          if [ -f test_db_boot.py ]; then
            python test_db_boot.py
          else
            echo "test_db_boot.py not on this branch — nothing to run."
          fi

      - name: Report day-cache tests
        # One run per report per day: that the build is called once however
        # many times a report is opened, that a failed or unmeasurable run
        # never becomes the day's answer, that re-running is a POST, and that
        # every write which takes a row off a report drops the cached copy.
        # Every report is a stub, so this reaches no provider. Guarded like
        # the steps around it so this workflow stays mergeable on a branch
        # that predates the file.
        run: |
          if [ -f test_report_cache.py ]; then
            python test_report_cache.py
          else
            echo "test_report_cache.py not on this branch — nothing to run."
          fi

      - name: QA report tests
        # Every report on /qa answers, returns a table the page can draw, and
        # is JSON-encodable -- run with no Knack, no QuickBooks and no
        # GoHighLevel, which is the state that produces a confident empty.
        # Then the half that matters: a report which could not look must never
        # render as "Nothing to report - all clear". That is swept by AST over
        # every module a report is built from, rather than asserted about the
        # four returns that were wrong, and the page's own decision block is
        # lifted out of qa_report.html and run in node. Reaches no provider.
        # Guarded like the steps around it so this workflow stays mergeable on
        # a branch that predates the file.
        run: |
          if [ -f test_qa_reports.py ]; then
            python test_qa_reports.py
          else
            echo "test_qa_reports.py not on this branch — nothing to run."
          fi

      - name: Landing page maker tests
        run: python test_landing_maker.py

      - name: Quote numbering and draft deletion tests
        run: python test_quote_numbers.py

      - name: Commercial Builder HeyGen tests
        run: python test_commercial_heygen.py

      - name: Commercial Builder provider key tests
        run: |
          if [ -f test_commercial_providers.py ]; then
            python test_commercial_providers.py
          else
            echo "test_commercial_providers.py not on this branch — nothing to run."
          fi

      - name: Commercial Builder wizard tests
        # Same skip-rather-than-fail shape as the tests below: a branch cut
        # before this file exists should not fail on its absence.
        run: |
          if [ -f test_commercial_wizard.py ]; then
            python test_commercial_wizard.py
          else
            echo "test_commercial_wizard.py not on this branch — nothing to run."
          fi

      - name: Commercial Builder dashboard layout tests
        # Same skip-rather-than-fail shape as the tests below: a branch cut
        # before this file exists should not fail on its absence.
        run: |
          if [ -f test_commercial_dashboard_layout.py ]; then
            python test_commercial_dashboard_layout.py
          else
            echo "test_commercial_dashboard_layout.py not on this branch — nothing to run."
          fi

      - name: Commercial Builder client review tests
        # Same skip-rather-than-fail shape as the tests below: a branch cut
        # before this file exists should not fail on its absence.
        run: |
          if [ -f test_commercial_review.py ]; then
            python test_commercial_review.py
          else
            echo "test_commercial_review.py not on this branch — nothing to run."
          fi

      - name: Commercial Builder mock-mode tests
        # The mark that says a provider is not live. Every one of these
        # routes already answered `live: false` or `mock: true` and nothing
        # in the browser read it, so a spot built entirely from templates
        # looked exactly like one a model wrote. Skip-rather-than-fail, like
        # its siblings: a branch cut before this file exists should not fail
        # on its absence.
        run: |
          if [ -f test_commercial_mock.py ]; then
            python test_commercial_mock.py
          else
            echo "test_commercial_mock.py not on this branch — nothing to run."
          fi

      - name: Commercial Builder advertising-rule tests
        # Which published rules a spot's copy engages, and the two ways the
        # feature would be worse than absent: a tool that claims a spot is
        # compliant, and a rule that fires on every spot. Also that nothing
        # here blocks a render, that an empty industry reads as not measured
        # rather than unregulated, and that rewriting the offer retires the
        # sign-off. Guarded like the steps around it so this workflow stays
        # mergeable on a branch that predates the file.
        run: |
          if [ -f test_commercial_compliance.py ]; then
            python test_commercial_compliance.py
          else
            echo "test_commercial_compliance.py not on this branch — nothing to run."
          fi

      - name: Commercial Builder archetype and category tests
        # What a spot IS as distinct from how it gets made, the legacy
        # commercial_type reading as the archetype it always was, pack ids
        # matching hub/industries.py so one client cannot get two taxonomies,
        # an unmatched category reading generic rather than wrong, and the
        # check that names any field which changes nothing. Guarded like the
        # steps around it so this workflow stays mergeable on a branch that
        # predates the file.
        run: |
          if [ -f test_commercial_library.py ]; then
            python test_commercial_library.py
          else
            echo "test_commercial_library.py not on this branch — nothing to run."
          fi

      - name: Commercial Builder metering and spot library tests
        # That every billed call site records, that the scanner has a marker
        # for each of them so the gap cannot go quiet again, that no price is
        # invented where none is published, and that the library counts what
        # was approved rather than what merely rendered. Guarded like the
        # steps around it so this workflow stays mergeable on a branch that
        # predates the file.
        run: |
          if [ -f test_commercial_meter.py ]; then
            python test_commercial_meter.py
          else
            echo "test_commercial_meter.py not on this branch — nothing to run."
          fi

      - name: Commercial Builder dashboard rail
        # The dashboard is the one screen in the module that asks the Hub for
        # its icon rail and opts the generic accordion out, and its section
        # rail is read by assistive technology — so both are asserted against
        # the template rather than remembered. It arrived with no step naming
        # it, which is the gap test_ci_gate.py exists to find: a check gated
        # by nobody is a check that stops being run. Guarded like the steps
        # around it so this workflow stays mergeable on a branch that
        # predates the file.
        run: |
          if [ -f test_commercial_dashboard_layout.py ]; then
            python test_commercial_dashboard_layout.py
          else
            echo "test_commercial_dashboard_layout.py not on this branch — nothing to run."
          fi

      - name: Website block tests
        # Same skip-rather-than-fail shape as the tests below: a branch cut
        # before this file exists should not fail on its absence.
        run: |
          if [ -f test_site_blocks.py ]; then
            python test_site_blocks.py
          else
            echo "test_site_blocks.py not on this branch — nothing to run."
          fi

      - name: MSA signing page and embed tests
        # Skipped rather than failed on a branch that predates the file, so
        # this workflow can merge before the branch that adds it.
        run: |
          if [ -f test_msa_embed.py ]; then
            python test_msa_embed.py
          else
            echo "test_msa_embed.py not on this branch — nothing to run."
          fi

      - name: Landing-page embeds for smart1marketing.com
        # The one check that would have caught the marketing site's forms and
        # the Hub's forms being two different things. It also holds the line on
        # sendBeacon('/api/partial-lead'), which tools/linkcheck.py cannot see:
        # under a /land/... mount that leaves the module, 404s on the hub app,
        # and reports nothing, because a beacon fires on pagehide and its
        # return value is read by nobody. Six modules had it.
        run: |
          if [ -f test_landing_embeds.py ]; then
            python test_landing_embeds.py
          else
            echo "test_landing_embeds.py not on this branch — nothing to run."
          fi

      - name: Calculator embed tests
        # The same rules as the step above, on the path they did not cover.
        # The calculators are a blueprint on the hub app and every gameplan
        # tool is dispatcher-mounted, so nothing written for /land/<tool>/embed
        # was in force on /tools/calculators — and both halves failed at once:
        # the hub's embed policy answered the marketing site's iframe with the
        # Smart 1 Suite refusal (403, plain text, in front of a prospect), and
        # the staff sidebar was injected into the calculator pages themselves.
        run: |
          if [ -f test_calculator_embeds.py ]; then
            python test_calculator_embeds.py
          else
            echo "test_calculator_embeds.py not on this branch — nothing to run."
          fi

      - name: IO Builder start-screen tests
        # Same skip-rather-than-fail shape as the steps around it.
        run: |
          if [ -f test_io_start.py ]; then
            python test_io_start.py
          else
            echo "test_io_start.py not on this branch — nothing to run."
          fi

      - name: Landing page goal and offer tests
        # Same skip-rather-than-fail shape as the steps around it.
        run: |
          if [ -f test_landing_spec.py ]; then
            python test_landing_spec.py
          else
            echo "test_landing_spec.py not on this branch — nothing to run."
          fi

      - name: Scan widget tests
        # The widget maker as a tool of its own: the Leads column, and the
        # pause/edit/delete a list of placements is useless without. Guarded
        # like the steps around it so this workflow stays mergeable on a branch
        # that predates the file.
        run: |
          if [ -f test_scan_widgets.py ]; then
            python test_scan_widgets.py
          else
            echo "test_scan_widgets.py not on this branch — nothing to run."
          fi

      - name: Prospect queue tests
        # Who to call, in the order the work has to happen. Guarded like the
        # steps around it so this workflow stays mergeable on a branch that
        # predates the file.
        run: |
          if [ -f test_prospect_queue.py ]; then
            python test_prospect_queue.py
          else
            echo "test_prospect_queue.py not on this branch — nothing to run."
          fi

      - name: Upsell report tests
        # What we could sell each client, out of audits already paid for:
        # coverage named rather than left off, recorded-vs-observed kept
        # apart, and a run that could not look never becoming the day's
        # answer. Guarded like the steps around it so this workflow stays
        # mergeable on a branch that predates the file.
        run: |
          if [ -f test_upsell_report.py ]; then
            python test_upsell_report.py
          else
            echo "test_upsell_report.py not on this branch — nothing to run."
          fi

      - name: Prospect record tests
        # The record a scanned business gets before it is a client: four kinds
        # of empty on the Suite card, a timeline that names what it could not
        # read, and files that report the record and the stored copy apart.
        # Guarded like the steps around it so this workflow stays mergeable on
        # a branch that predates the file.
        run: |
          if [ -f test_prospect_record.py ]; then
            python test_prospect_record.py
          else
            echo "test_prospect_record.py not on this branch — nothing to run."
          fi

      - name: Website audit tests
        # The spend block that leads every rendering of a site audit, the
        # customer-facing audit placement, the lead every audit files, and
        # merging two rows that are one prospect. Guarded like the steps around
        # it so this workflow stays mergeable on a branch that predates the
        # file.
        run: |
          if [ -f test_website_audit.py ]; then
            python test_website_audit.py
          else
            echo "test_website_audit.py not on this branch — nothing to run."
          fi

      - name: Stock photo search tests
        # Four sources in one search — the three free libraries and our own
        # Cloudinary folders. Asserts that a folder nobody has created reads as
        # missing rather than as a search that found nothing, that a provider
        # which refused is named, and that the client-facing picker did not
        # quietly gain our internal folders. Guarded like the steps around it
        # so this workflow stays mergeable on a branch that predates the file.
        run: |
          if [ -f test_stock_search.py ]; then
            python test_stock_search.py
          else
            echo "test_stock_search.py not on this branch — nothing to run."
          fi

      - name: Image picker tests
        # Where a client can upload from, deleting a gallery, and what a
        # General Business client is asked. Guarded like the steps around it so
        # this workflow stays mergeable on a branch that predates the file.
        run: |
          if [ -f test_image_picker.py ]; then
            python test_image_picker.py
          else
            echo "test_image_picker.py not on this branch — nothing to run."
          fi

      - name: Lead delivery tests
        # Skipped rather than failed on a branch that predates the file, so
        # this workflow can merge before the branch that adds it.
        run: |
          if [ -f test_lead_delivery.py ]; then
            python test_lead_delivery.py
          else
            echo "test_lead_delivery.py not on this branch — nothing to run."
          fi

      - name: Target area and delivery tests
        # Guarded like the step above, so this workflow stays mergeable on a
        # branch that predates the file.
        #
        # This file used to be unsafe to run twice, and no longer is. It
        # still setdefaults DATABASE_URL -- so it inherits the Postgres
        # service above, which persists across steps -- but it now empties
        # the client's shelf at the start rather than assuming an empty one,
        # and re-runs clean (82 passed, twice, against one database).
        #
        # The hazard it records is real and worth keeping in mind: jsonstore
        # keys its mirror relative to the data root by design, so a fresh
        # HUB_DATA_DIR in front of an inherited database is refilled with the
        # last run's rows. That is how a duplicated step failed "files one
        # document, not three" with 3 -- two lineages each added a
        # target-areas step and git merged both cleanly.
        #
        # test_dashboard_trends.py and test_google_index.py had the same
        # shape and were fixed the other way, by owning DATABASE_URL as well
        # as HUB_DATA_DIR (the test_blog_publish.py pattern), and so did
        # test_io_records.py and test_sales_status.py -- which reached the
        # identical state by setdefaulting BOTH, so the sweep that pins this
        # could not see them: fresh directory, inherited mirror, whenever
        # only the database is set in the environment. test_jsonstore.py
        # reads either spelling now, and holds every file in the shape
        # against a list of the ones actually re-run to prove they are safe.
        run: |
          if [ -f test_target_areas.py ]; then
            python test_target_areas.py
          else
            echo "test_target_areas.py not on this branch — nothing to run."
          fi

      - name: API usage estimate tests
        # Guarded like the steps around it so this workflow stays mergeable on
        # a branch that predates the file.
        run: |
          if [ -f test_api_usage.py ]; then
            python test_api_usage.py
          else
            echo "test_api_usage.py not on this branch — nothing to run."
          fi

      - name: Google account index tests
        # Guarded like the step above, for the same reason.
        run: |
          if [ -f test_google_index.py ]; then
            python test_google_index.py
          else
            echo "test_google_index.py not on this branch — nothing to run."
          fi

      - name: Proposal specification and creative gate tests
        run: |
          if [ -f test_proposal_spec.py ]; then
            python test_proposal_spec.py
          else
            echo "test_proposal_spec.py not on this branch — nothing to run."
          fi

      - name: Rate card coverage — every product, on a proposal that renders
        # The tests around the card check its rules against the rows somebody
        # thought to write down, which is the set that was already right. This
        # builds eight proposals from the card's own categories, buys every
        # product on one of them, and renders each as a PDF and a Word file —
        # so a product added tomorrow is exercised without anybody editing a
        # list, and a whole new category fails by name rather than being
        # silently skipped. Guarded like the steps around it; it reaches no
        # third party and owns its own database.
        run: |
          if [ -f test_rate_card_coverage.py ]; then
            python test_rate_card_coverage.py
          else
            echo "test_rate_card_coverage.py not on this branch — nothing to run."
          fi

      - name: Knack field map tests — what is mapped, and what is assumed
        # The map is read from the modules that own the ids rather than
        # restated, a confirmation is retired when its field is repinned, and
        # nothing in it can write to Knack. Guarded like the steps around it.
        run: |
          if [ -f test_knack_map.py ]; then
            python test_knack_map.py
          else
            echo "test_knack_map.py not on this branch — nothing to run."
          fi

      - name: IO record tests — the order as a record, not just a PDF
        # One row per order, a resubmission that updates rather than doubling,
        # and bookkeeping that cannot fail the submit it is bookkeeping for.
        # Guarded like the steps around it; nothing in it reaches a third
        # party, and the only write it makes is the Hub's own record.
