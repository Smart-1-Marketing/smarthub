# The checks CLAUDE.md already prescribes, run automatically.
#
# Every one of these existed as a command a person was expected to remember.
# tools/linkcheck.py in particular was written because a module page calling
# fetch("/api/lead") works standalone and 404s under a mount — that bug took
# down lead capture on seven landing pages for two days. It exits non-zero
# precisely so it can gate a release; until now nothing ran it.
#
# Deliberately no deploy step and no secrets. These checks run on pull requests
# from a clean checkout, so they must pass without Knack, GoHighLevel,
# Cloudinary or OpenAI credentials. Anything that needs a live third party
# belongs in /status and /api/integrity on the deployment, not here — a gate
# that fails because someone else's API is down teaches people to ignore it.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in flight for the same branch.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: syntax, links and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres rather than SQLite, for the steps that boot the app. Sites Admin
    # refuses to start without a real Postgres URL and serves wsgi.py's 503
    # fallback instead, so on SQLite a whole module silently drops out of every
    # check that boots -- 36 of 37 pages checked, and nothing saying so. This
    # is a service container, not a credential: it keeps the "no secrets, runs
    # from a clean checkout" rule above intact, and it also exercises
    # create_all() under its advisory lock, which is a deploy-time failure mode.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smarthub
          POSTGRES_PASSWORD: smarthub
          POSTGRES_DB: smarthub_ci
        ports: ['5432:5432']
        # -U/-d on the probe, or it connects as root, which is not a role
        # in this cluster: nine FATAL lines in the service log every run,
        # none of them meaning anything. (A comment inside the folded
        # scalar below would become part of the docker options string.)
        options: >-
          --health-cmd "pg_isready -U smarthub -d smarthub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://smarthub:smarthub@localhost:5432/smarthub_ci
      SECRET_KEY: ci-not-a-real-secret
      PANEL_PASSWORD: ci-not-a-real-password

    steps:
      - uses: actions/checkout@v7

      # Matches the Dockerfile (python:3.12-slim), so the gate runs what
      # production runs.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax
        run: |
          python -c "import ast, pathlib, sys; \
            files = [p for p in pathlib.Path('.').rglob('*.py') if '_attic' not in p.parts]; \
            [ast.parse(p.read_text(errors='ignore'), str(p)) for p in files]; \
            print(f'parsed {len(files)} Python files')"

      - name: JavaScript syntax
        run: python tools/jscheck.py

      # The other half: jscheck skips blocks carrying Jinja, because Node would
      # reject them for the wrong reason. This balance-checks exactly those, so
      # "not checked (Jinja)" in the step above is not the end of the story.
      - name: JavaScript inside Jinja templates
        run: python tools/checktemplates.py

      # Boots the composed app and checks every internal URL literal against
      # the route table of whichever app owns that path. This is the one that
      # catches the mount trap.
      - name: Link and mount check
        run: python tools/linkcheck.py

      - name: Ad builder module tests
        run: python test_ads_module.py

      - name: Ads estimate and client review tests
        # The campaign estimate a CLIENT reads: reachable without a Hub login,
        # carrying no staff chrome, one document shared with the internal
        # preview, every avg CPC labelled an industry estimate, and an edit
        # invalidating the approval it was made against. Guarded like the steps
        # below so this workflow stays mergeable on a branch that predates it.
        run: |
          if [ -f test_ads_estimate.py ]; then
            python test_ads_estimate.py
          else
            echo "test_ads_estimate.py not on this branch — nothing to run."
          fi

      - name: JSON store tests
        run: python test_jsonstore.py

      - name: Landing page maker tests
        run: python test_landing_maker.py

      - name: Quote numbering and draft deletion tests
        run: python test_quote_numbers.py

      - name: Commercial Builder HeyGen tests
        run: python test_commercial_heygen.py

      - name: Commercial Builder provider key tests
        run: |
          if [ -f test_commercial_providers.py ]; then
            python test_commercial_providers.py
          else
            echo "test_commercial_providers.py not on this branch — nothing to run."
          fi

      - name: Website block tests
        # Same skip-rather-than-fail shape as the tests below: a branch cut
        # before this file exists should not fail on its absence.
        run: |
          if [ -f test_site_blocks.py ]; then
            python test_site_blocks.py
          else
            echo "test_site_blocks.py not on this branch — nothing to run."
          fi

      - name: MSA signing page and embed tests
        # Skipped rather than failed on a branch that predates the file, so
        # this workflow can merge before the branch that adds it.
        run: |
          if [ -f test_msa_embed.py ]; then
            python test_msa_embed.py
          else
            echo "test_msa_embed.py not on this branch — nothing to run."
          fi

      - name: Landing-page embeds for smart1marketing.com
        # The one check that would have caught the marketing site's forms and
        # the Hub's forms being two different things. It also holds the line on
        # sendBeacon('/api/partial-lead'), which tools/linkcheck.py cannot see:
        # under a /land/... mount that leaves the module, 404s on the hub app,
        # and reports nothing, because a beacon fires on pagehide and its
        # return value is read by nobody. Six modules had it.
        run: |
          if [ -f test_landing_embeds.py ]; then
            python test_landing_embeds.py
          else
            echo "test_landing_embeds.py not on this branch — nothing to run."
          fi

      - name: IO Builder start-screen tests
        # Same skip-rather-than-fail shape as the steps around it.
        run: |
          if [ -f test_io_start.py ]; then
            python test_io_start.py
          else
            echo "test_io_start.py not on this branch — nothing to run."
          fi

      - name: Landing page goal and offer tests
        # Same skip-rather-than-fail shape as the steps around it.
        run: |
          if [ -f test_landing_spec.py ]; then
            python test_landing_spec.py
          else
            echo "test_landing_spec.py not on this branch — nothing to run."
          fi

      - name: Lead delivery tests
        # Skipped rather than failed on a branch that predates the file, so
        # this workflow can merge before the branch that adds it.
        run: |
          if [ -f test_lead_delivery.py ]; then
            python test_lead_delivery.py
          else
            echo "test_lead_delivery.py not on this branch — nothing to run."
          fi

      - name: Target area and delivery tests
        # Guarded like the step above, so this workflow stays mergeable on a
        # branch that predates the file.
        #
        # RUN THIS FILE EXACTLY ONCE. It calls os.environ.setdefault for
        # DATABASE_URL, so it uses its throwaway SQLite only when nothing else
        # has set one -- and this job sets DATABASE_URL to the Postgres service
        # above, which persists across steps. Each run also gets a fresh
        # HUB_DATA_DIR, and jsonstore restores the previous run's writes into
        # that empty directory, so a second invocation sees the first one's
        # rows and fails "files one document, not three" with 3. Two lineages
        # each added a target-areas step and git merged both cleanly, which is
        # exactly how the duplicate got in.
        run: |
          if [ -f test_target_areas.py ]; then
            python test_target_areas.py
          else
            echo "test_target_areas.py not on this branch — nothing to run."
          fi

      - name: API usage estimate tests
        # Guarded like the steps around it so this workflow stays mergeable on
        # a branch that predates the file.
        run: |
          if [ -f test_api_usage.py ]; then
            python test_api_usage.py
          else
            echo "test_api_usage.py not on this branch — nothing to run."
          fi

      - name: Google account index tests
        # Guarded like the step above, for the same reason.
        run: |
          if [ -f test_google_index.py ]; then
            python test_google_index.py
          else
            echo "test_google_index.py not on this branch — nothing to run."
          fi

      - name: Proposal specification and creative gate tests
        run: |
          if [ -f test_proposal_spec.py ]; then
            python test_proposal_spec.py
          else
            echo "test_proposal_spec.py not on this branch — nothing to run."
          fi

      - name: Social content planner tests
        # Guarded like the steps above so this workflow stays mergeable on a
        # branch that predates the file. Safe to run after the others despite
        # sharing the job's Postgres: every plan id is minted per run, so the
        # rows jsonstore restores from an earlier run's mirror cannot collide
        # with this one's.
        run: |
          if [ -f test_social_plan.py ]; then
            python test_social_plan.py
          else
            echo "test_social_plan.py not on this branch — nothing to run."
          fi

      - name: GPT ad pack tests
        # The 1:1 image gate, the copy checks, the landing-page verdicts and
        # what the ad-ops ZIP actually contains. Guarded like the steps around
        # it so this workflow stays mergeable on a branch that predates the
        # file. Safe to re-run: it *sets* DATABASE_URL and HUB_DATA_DIR rather
        # than setdefault-ing them, and the requests and OpenAI seams are both
        # stubbed, so it needs no credentials and reaches no third party.
        run: |
          if [ -f test_gpt_ads.py ]; then
            python test_gpt_ads.py
          else
            echo "test_gpt_ads.py not on this branch — nothing to run."
          fi

      - name: Sites match and client URL discovery tests
        # Live-only matching, the file-host gate, and the overlay that fills a
        # client's missing website without relabelling them. Guarded like the
        # steps around it so this workflow stays mergeable on a branch that
        # predates the file. Every external reader is stubbed, so it needs no
        # Knack, Simvoly or Cloudinary credentials.
        run: |
          if [ -f test_sites_match.py ]; then
            python test_sites_match.py
          else
            echo "test_sites_match.py not on this branch — nothing to run."
          fi

      - name: Domain attach, orphan URL and domain purchase tests
        # One domain attached to one client in four systems at once, the
        # orphan list that finds a URL nobody owns, and the purchased-domain
        # renewal calendar whose "billed" tick lapses when the renewal date
        # rolls. Guarded like the steps around it so this workflow stays
        # mergeable on a branch that predates the file. Every external reader
        # is stubbed, so it needs no Knack, Simvoly or Insites credentials.
        run: |
          if [ -f test_domain_links.py ]; then
            python test_domain_links.py
          else
            echo "test_domain_links.py not on this branch — nothing to run."
          fi

      - name: Suite embed tests
        # Hub pages framed inside Smart 1 Suite: the SameSite=None companion
        # cookie that reaches a cross-site frame, the safe-method + allowlist
        # limits that stop it being a second front door, the frame-ancestors
        # allowlist, and the sidebar not arriving inside somebody else's
        # navigation. Guarded like the steps around it so this workflow stays
        # mergeable on a branch that predates the file.
        run: |
          if [ -f test_suite_embed.py ]; then
            python test_suite_embed.py
          else
            echo "test_suite_embed.py not on this branch — nothing to run."
          fi

      - name: Marketplace app scope tests
        # The scope set the GHL Marketplace app asks for, and the diff between
        # what was requested and what HighLevel actually granted. Adding a
        # scope costs an agency re-consent, so a write call site with no scope
        # declared is a feature that silently cannot move off the Private
        # Integration Token. Guarded like the steps around it so this workflow
        # stays mergeable on a branch that predates the file. Nothing here
        # reaches HighLevel -- the token record is a fixture.
        run: |
          if [ -f test_ghl_scopes.py ]; then
            python test_ghl_scopes.py
          else
            echo "test_ghl_scopes.py not on this branch — nothing to run."
          fi

      - name: Orphaned Google account tests
        # The GA4 / Tag Manager / Search Console orphan list, the suggestions
        # it makes (a recorded id is evidence; a shared domain is not), and the
        # three systems an attach writes. The index is written as a fixture, so
        # this needs no connected Google account. Guarded like the steps around
        # it so this workflow stays mergeable on a branch that predates it.
        run: |
          if [ -f test_google_links.py ]; then
            python test_google_links.py
          else
            echo "test_google_links.py not on this branch — nothing to run."
          fi

      - name: Blog taxonomy, guardrail and CMS publish tests
        # The blog section's approved-topic list, the never-mention check and
        # what the two CMS panels are handed. Guarded like the steps above so
        # this workflow stays mergeable on a branch that predates the file. It
        # *sets* DATABASE_URL and HUB_DATA_DIR rather than setdefault-ing them,
        # so it always gets its own throwaway mirror and is safe to re-run.
        run: |
          if [ -f test_blog_publish.py ]; then
            python test_blog_publish.py
          else
            echo "test_blog_publish.py not on this branch — nothing to run."
          fi

      - name: Image download and shared zip builder tests
        # The SEO pipeline's downloads, hub/storage.bundle_zip, and the image
        # picker's gallery download now that it runs on the shared builder.
        # Guarded like the steps above so this workflow stays mergeable on a
        # branch that predates the file. Sets DATABASE_URL and HUB_DATA_DIR
        # rather than setdefault-ing them, so it is safe to re-run.
        run: |
          if [ -f test_image_download.py ]; then
            python test_image_download.py
          else
            echo "test_image_download.py not on this branch — nothing to run."
          fi

      - name: Alt text and Claude-in-Chrome publish prompts
        # The alt-text scan, its clamps, and the prompts handed to a browser
        # agent -- including that no stored credential can reach one. Guarded
        # like the steps above so this workflow stays mergeable on a branch
        # that predates the file. Needs no network: hub/seo.py's fetch seam is
        # stubbed, so the scan runs against fixture HTML.
        run: |
          if [ -f test_alt_text.py ]; then
            python test_alt_text.py
          else
            echo "test_alt_text.py not on this branch — nothing to run."
          fi

      - name: Video library tests
        # Safe to re-run, unlike the target-areas step above: this file *sets*
        # DATABASE_URL and HUB_DATA_DIR rather than setdefault-ing them, so it
        # always gets its own throwaway mirror and never restores a previous
        # run's writes into a fresh directory.
        run: |
          if [ -f test_video_library.py ]; then
            python test_video_library.py
          else
            echo "test_video_library.py not on this branch — nothing to run."
          fi

      - name: Web ticket field tests
        # The pinned object_107 ids, the form built from them, and what a
        # write may and may not contain. Guarded like the steps above so this
        # workflow stays mergeable on a branch that predates the file. Needs
        # no Knack credentials — the requests seam is stubbed.
        run: |
          if [ -f test_web_tickets.py ]; then
            python test_web_tickets.py
          else
            echo "test_web_tickets.py not on this branch — nothing to run."
          fi

      - name: Dashboard trend tests
        # The month-over-month comparisons: keyed on the calendar, resolving
        # next month, naming the month each is against. Guarded like the steps
        # above so this workflow stays mergeable on a branch that predates the
        # file. Sets its own HUB_DATA_DIR, so it is safe beside the others.
        run: |
          if [ -f test_dashboard_trends.py ]; then
            python test_dashboard_trends.py
          else
            echo "test_dashboard_trends.py not on this branch — nothing to run."
          fi

      - name: Client group tests
        # The Client 360 Group button: what merges across a grouped record,
        # what must not be counted twice, and that one client can only be in
        # one group. Guarded like the steps above so this workflow stays
        # mergeable on a branch that predates the file. It *sets*
        # DATABASE_URL, HUB_DATA_DIR and AUDIT_LOG_PATH rather than
        # setdefault-ing them, so it always gets its own throwaway mirror and
        # never appends to the checked-in activity log.
        run: |
          if [ -f test_client_groups.py ]; then
            python test_client_groups.py
          else
            echo "test_client_groups.py not on this branch — nothing to run."
          fi

      - name: Boot the composed app
        # Static analysis misses what booting catches; several serious bugs in
        # this repo were only ever found by running it. Requests the pages a
        # change is most likely to break.
        env:
          DATABASE_URL: sqlite:////tmp/ci-boot.db
          PANEL_PASSWORD: ci-test-password
          SECRET_KEY: ci-test-secret
        run: |
          python - <<'PY'
          import sys
          from werkzeug.test import Client
          from wsgi import application

          c = Client(application)
          c.post("/login", data={"password": "ci-test-password", "name": "CI"})

          pages = ["/", "/status", "/diagnostics", "/sales/leads",
                   "/api/integrity", "/api/leads", "/login/health",
                   # The proposal builder and Client 360 render the largest
                   # templates in the repo and are where a bad section kind or
                   # a template typo surfaces as a 500 rather than a test
                   # failure. /sales/proposals is the retired builder's
                   # redirect; a 3xx here is the correct answer.
                   "/sales/builder/", "/sales/proposals/", "/tools/io/",
                   "/client360", "/tools",
                   # The landing maker, and the API its page calls.
                   "/sales/landing", "/api/landing",
                   # The website block builder. Its page draws itself entirely
                   # from api/catalogue, so a page that boots but whose
                   # catalogue 500s is a blank tool -- both are requested.
                   "/tools/site-blocks/", "/tools/site-blocks/api/catalogue",
                   # The social planner, and the page that links to it. Its
                   # index renders the whole post-type spec into the page, so a
                   # bad entry in hub/social_plan.py shows up here as a 500.
                   "/tools/social/",
                   # The GPT ads builder, and the list endpoint its page opens
                   # with -- a page that boots but whose index 500s is a blank
                   # tool, so both are requested.
                   "/tools/gpt-ads/", "/tools/gpt-ads/api/ads",
                   # Sites match is a HUB route under /tools -- the trap
                   # CLAUDE.md names first -- and both of its panels are one
                   # API call each, so a page that boots with a 500 behind it
                   # is a blank tool.
                   "/tools/sites-match", "/api/sites-match", "/api/client-urls",
                   "/creative"]
          bad = []
          for url in pages:
              try:
                  code = c.get(url).status_code
              except Exception as exc:
                  bad.append(f"{url} raised {type(exc).__name__}: {exc}")
                  continue
              print(f"{code}  {url}")
              # 3xx is fine (auth redirects); 4xx/5xx on these is not.
              if code >= 400:
                  bad.append(f"{url} returned {code}")

          if bad:
              print("\nFAILED:")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print("\nthe composed app boots and every checked page responds")
          PY

      # What the BROWSER receives, after HubBar and the hub's after_request
      # have rewritten the response. Every check above reads source; this reads
      # the bytes. HubBar injected the sidebar at the first </body> in the
      # response, and the IO Builder builds two printable documents as
      # JavaScript template literals that each carry their own </body> -- so
      # the chrome landed inside a string, closed the page's script early, and
      # the whole tool rendered blank. Every template was valid. Every link
      # resolved. Nothing above would have caught it.
      - name: Rendered pages (chrome is markup, scripts still parse)
        run: python tools/pagecheck.py --strict

      # The Hub's own defect-pattern check, which otherwise lives behind a
      # login on a page somebody has to remember to open. Gates on `high` only:
      # two medium findings stand today (ad_builder and msa never write to the
      # activity log) and are printed every run, so switching this on did not
      # start it red.
      - name: Known defect patterns (/api/integrity)
        run: python tools/integritycheck.py
