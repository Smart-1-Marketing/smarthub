      # completeness audit offered as an unattached asset, which is exactly
      # what the pending/ folder exists to prevent; and a gallery folder
      # assigned after the save, so it reached the browser and never the disk.
      - name: One image per post, and a badge you can act on
        run: python3 test_blog_images.py
      # hub/analytics_ask.py turns a plain-English question into a GA4 report,
      # and its docstring says what it replaced: a keyword matcher that
      # answered "July versus June" with a 30-day table, "which is worse than
      # refusing -- it answers confidently with the wrong report". It was
      # doing the same thing a layer down. shape() decided which period a row
      # belonged to with tag.endswith("_1") -- but GA4 values that dimension
      # with the range's NAME where one was given, and this module's own
      # prompt REQUIRES names. So both rows landed in one bucket and the
      # second overwrote the first: Dublin at 900 in July against 600 in June
      # rendered as 600, no previous, no change, and a totals row reading "up
      # 100% on 0". Beside it: an unconditional re-sort that threw away the
      # orderBys GA4 had just honoured, turning a time series into a ranking;
      # and a "total" that is the sum of whatever came back, which under a
      # limit is the top N presented as the whole.
      - name: July versus June, and the comparison that answered with June
        run: python3 test_analytics_ask.py
      # hub/webargs.py is 51 lines reached from twenty files, named by no
      # test. Its docstring lists three faults it exists to end -- int()
      # outside a try, an upper bound with no lower one, and the same clamp
      # written out twice -- and the sweep it implies never finished. Smart 1
      # Ads bounded its client search above and not below, over a
      # search_clients() ending [:limit], so ?limit=-5 returned every client
      # except the last five as a clean answer. The Suite panel's audit log
      # had both bounds and no try. And the Commercial Builder's stock search
      # had neither, on a number that goes straight into Pexels and Pixabay
      # once per expanded query. The helper itself had the OverflowError
      # guard its own comment describes on the inner branch only, so a real
      # float infinity -- which json.loads produces from the literal
      # `Infinity`, and three call sites pass a JSON body straight in -- was
      # a 500 out of the helper whose first promise is that it never raises.
      - name: A number a stranger controls
        run: python3 test_webargs.py
      # hub/landing_images.py picks the pictures on a page a prospect reads,
      # and its docstring ends "a page may be short, it may not lie".
      # from_site() regexed every image URL out of a 400 KB scan payload and
      # labelled all of them `their site` -- with no domain check at all.
      # Against a realistic payload six came back and five were somebody
      # else's: the scan vendor's screenshot, a Facebook card, a Google
      # static map, a Google ad creative and another agency's Cloudinary
      # folder, any of which could be the hero of a landing page presented as
      # the client's own premises. Beside it: a picture off their site
      # carries no dimensions, and pick() read a missing `wide` as True, so
