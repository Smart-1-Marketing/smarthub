      - name: Boot the composed app
        # Static analysis misses what booting catches; several serious bugs in
        # this repo were only ever found by running it. Requests the pages a
        # change is most likely to break.
        env:
          DATABASE_URL: sqlite:////tmp/ci-boot.db
          PANEL_PASSWORD: ci-test-password
          SECRET_KEY: ci-test-secret
        run: |
          python - <<'PY'
          import sys
          from werkzeug.test import Client
          from wsgi import application

          c = Client(application)
          c.post("/login", data={"password": "ci-test-password", "name": "CI"})

          pages = ["/", "/status", "/diagnostics", "/sales/leads",
                   "/api/integrity", "/api/leads", "/login/health",
                   # The three pages that must answer without a session: the
                   # crawler files (one behind a login is not read) and the
                   # forgotten-password page, which is the one page somebody
                   # who cannot sign in actually needs.
                   "/robots.txt", "/llms.txt", "/forgot",
                   # The proposal builder and Client 360 render the largest
                   # templates in the repo and are where a bad section kind or
                   # a template typo surfaces as a 500 rather than a test
                   # failure. /sales/proposals is the retired builder's
                   # redirect; a 3xx here is the correct answer.
                   "/sales/builder/", "/sales/proposals/", "/tools/io/",
                   "/client360", "/tools",
                   # The landing maker, and the API its page calls.
                   "/sales/landing", "/api/landing",
                   # The website block builder. Its page draws itself entirely
                   # from api/catalogue, so a page that boots but whose
                   # catalogue 500s is a blank tool -- both are requested.
                   "/tools/site-blocks/", "/tools/site-blocks/api/catalogue",
                   # The social planner, and the page that links to it. Its
                   # index renders the whole post-type spec into the page, so a
                   # bad entry in hub/social_plan.py shows up here as a 500.
                   "/tools/social/",
                   # The GPT ads builder, and the list endpoint its page opens
                   # with -- a page that boots but whose index 500s is a blank
                   # tool, so both are requested.
                   "/tools/gpt-ads/", "/tools/gpt-ads/api/ads",
                   # Sites match is a HUB route under /tools -- the trap
                   # CLAUDE.md names first -- and both of its panels are one
                   # API call each, so a page that boots with a 500 behind it
                   # is a blank tool.
                   "/tools/sites-match", "/api/sites-match", "/api/client-urls",
                   "/creative"]
          bad = []
          for url in pages:
              try:
                  code = c.get(url).status_code
              except Exception as exc:
                  bad.append(f"{url} raised {type(exc).__name__}: {exc}")
                  continue
              print(f"{code}  {url}")
              # 3xx is fine (auth redirects); 4xx/5xx on these is not.
              if code >= 400:
                  bad.append(f"{url} returned {code}")

          if bad:
              print("\nFAILED:")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print("\nthe composed app boots and every checked page responds")
          PY

      # What the BROWSER receives, after HubBar and the hub's after_request
      # have rewritten the response. Every check above reads source; this reads
      # the bytes. HubBar injected the sidebar at the first </body> in the
      # response, and the IO Builder builds two printable documents as
      # JavaScript template literals that each carry their own </body> -- so
      # the chrome landed inside a string, closed the page's script early, and
      # the whole tool rendered blank. Every template was valid. Every link
      # resolved. Nothing above would have caught it.
      - name: Rendered pages (chrome is markup, scripts still parse)
        run: python tools/pagecheck.py --strict

      # The Hub's own defect-pattern check, which otherwise lives behind a
      # login on a page somebody has to remember to open. Gates on `high` only:
      # two medium findings stand today (ad_builder and msa never write to the
      # activity log) and are printed every run, so switching this on did not
      # start it red.
      - name: Known defect patterns (/api/integrity)
        run: python tools/integritycheck.py

      # American English, over the copy this Hub puts on a screen. Smart 1
      # sells in the US and modules/scans/reports.py has normalized the copy
      # it lifts from Insites for a while; everything the Hub wrote itself was
      # drifting the other way, one template at a time, because a British
      # spelling is not a defect any other check here can see -- the page
      # renders, the link resolves, the English is correct. This is green, so
      # a new "colour" is a failing build rather than something a client finds
      # on a proposal.
      - name: American English in the copy
        run: python tools/spellcheck.py

      # ...and that the check above cannot be silenced by an edit somewhere
      # else: it is handed a sentence that plainly drifts and required to say
      # so, and its exemption list is required to still name real files and
      # real words. The failure hub/config.py's ALIASES table describes.
      - name: The spelling check still bites
        run: python3 test_spelling.py

      # One client reader. `context()` asked the site scan for `detected_phone`
      # at the top level of a payload that publishes `meta.detected_phone`, so
      # a client with a complete audit prefilled a form with a name and a URL
      # and left the phone, the address and the industry blank -- on a record
      # that had held all three since the scan ran. This holds the merge, the
      # rule that an offer never overwrites what somebody typed, and the block
      # every AI feature hands a model.
      - name: Client prefill and the block a model is handed
        run: python3 test_client_prefill.py

      # A logo we found is a logo the client's gallery holds. Brandfetch is
      # billed and its answer was stored as JSON; the Insites scan reads the
      # logo off the client's own home page, which is where it comes from for
      # most local businesses. Neither reached the gallery a rep opens to put
      # a mark into an ad. This holds the four ways filing it goes quietly
      # wrong: the same mark filed twice, two different marks collapsed into
      # one, a dead URL drawn as a broken tile, and a billed provider called
      # on a page load.
      - name: Logos reach the client gallery
        run: python3 test_client_logos.py

      # The top search box. A client the query *names* comes first -- but
      # `search_clients()` matches a substring of the domain too, so promoting
      # every row it returns put a bridal shop above Image Creator on the query
      # "image". This holds that split, holds that every screen in the Hub is
      # findable (the seven tools filed under QA Reports were inline in the
      # route that drew them, so nothing else could read them), and holds that
      # a client book which could not be read is named rather than silently
      # answered with only the pages.
      - name: The search box finds clients first, and finds the Hub
        run: python3 test_search.py

      # The layer above the month plan: multi-location intake, the client's
      # four signed pages, the idea weighting and the Suite push. Every one of
      # these fails quietly rather than loudly -- a duplicate flag that crossed
      # a client, a push failure that read as scheduled, a client-facing page
      # behind the staff login, or the copy checks blocking the client's own
      # offer because nobody told them the client had supplied it.
      #
      # Safe to run twice: it *sets* DATABASE_URL, HUB_DATA_DIR and
      # AUDIT_LOG_PATH rather than setdefault-ing them, so it never inherits
      # this job's Postgres. That is the trap named beside test_target_areas.py
      # above -- jsonstore mirrors every write into the database and restores
      # on a miss, so a second run would find the first run's requests and
      # ideas restored into its fresh temporary directory and fail on the
      # counts. Reproduced before it was fixed, and both runs are green now.
      - name: Content requests, ideas and the Suite push
        run: python3 test_social_content.py

      # The client registry ran on a 610-row JSON file committed to the repo
      # while hub/knack_websites.py read the same object live. This holds the
      # switch: live where Knack answers, the export where it will not, a
      # failed pull that never empties a good export, and summary() still
      # measuring the dashboard scorecard against the export -- pointed at the
      # live list it reports 2 active websites instead of 610.
      - name: Websites read live, with the export as the fallback
        run: python3 test_knack_websites_source.py

      # The client half of the Suite embed. The location id inside the
      # encrypted SSO payload is the authorization and the whole security
      # model: every refusal here is a way to show one client another client's
      # record, and every one of them is silent. Carries its own encryptor so
      # the CryptoJS envelope is round-tripped rather than assumed.
      - name: Suite SSO — who is looking, inside a client's own sub-account
        run: python3 test_suite_sso.py

      # Eleven background jobs share one thread. The panel said the loop was
      # alive and drew a green pill for any job whose last run succeeded,
      # however long ago -- and the standby worker, which holds no timings at
      # all, showed every job as never run. This holds the three answers it
      # could not give: overdue, a failure streak, and not-measured-here.
      - name: Background jobs report whether they are working
        run: python3 test_scheduler_health.py
