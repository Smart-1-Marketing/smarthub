# The checks CLAUDE.md already prescribes, run automatically.
#
# Every one of these existed as a command a person was expected to remember.
# tools/linkcheck.py in particular was written because a module page calling
# fetch("/api/lead") works standalone and 404s under a mount — that bug took
# down lead capture on seven landing pages for two days. It exits non-zero
# precisely so it can gate a release; until now nothing ran it.
#
# Deliberately no deploy step and no secrets. These checks run on pull requests
# from a clean checkout, so they must pass without Knack, GoHighLevel,
# Cloudinary or OpenAI credentials. Anything that needs a live third party
# belongs in /status and /api/integrity on the deployment, not here — a gate
# that fails because someone else's API is down teaches people to ignore it.
name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in flight for the same branch.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: syntax, links and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Matches the Dockerfile (python:3.12-slim), so the gate runs what
      # production runs.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax
        run: |
          python -c "import ast, pathlib, sys; \
            files = [p for p in pathlib.Path('.').rglob('*.py') if '_attic' not in p.parts]; \
            [ast.parse(p.read_text(errors='ignore'), str(p)) for p in files]; \
            print(f'parsed {len(files)} Python files')"

      - name: JavaScript syntax
        run: python tools/jscheck.py

      # Boots the composed app and checks every internal URL literal against
      # the route table of whichever app owns that path. This is the one that
      # catches the mount trap.
      - name: Link and mount check
        run: python tools/linkcheck.py

      - name: Ad builder module tests
        run: python test_ads_module.py

      - name: JSON store tests
        run: python test_jsonstore.py

      - name: Landing page maker tests
        run: python test_landing_maker.py

      - name: Lead delivery tests
        # Skipped rather than failed on a branch that predates the file, so
        # this workflow can merge before the branch that adds it.
        run: |
          if [ -f test_lead_delivery.py ]; then
            python test_lead_delivery.py
          else
            echo "test_lead_delivery.py not on this branch — nothing to run."
          fi

      - name: Boot the composed app
        # Static analysis misses what booting catches; several serious bugs in
        # this repo were only ever found by running it. Requests the pages a
        # change is most likely to break.
        env:
          DATABASE_URL: sqlite:////tmp/ci-boot.db
          PANEL_PASSWORD: ci-test-password
          SECRET_KEY: ci-test-secret
        run: |
          python - <<'PY'
          import sys
          from werkzeug.test import Client
          from wsgi import application

          c = Client(application)
          c.post("/login", data={"password": "ci-test-password", "name": "CI"})

          pages = ["/", "/status", "/diagnostics", "/sales/leads",
                   "/sales/landing", "/tools",
                   "/api/integrity", "/api/leads", "/api/landing",
                   "/login/health"]
          bad = []
          for url in pages:
              try:
                  code = c.get(url).status_code
              except Exception as exc:
                  bad.append(f"{url} raised {type(exc).__name__}: {exc}")
                  continue
              print(f"{code}  {url}")
              # 3xx is fine (auth redirects); 4xx/5xx on these is not.
              if code >= 400:
                  bad.append(f"{url} returned {code}")

          if bad:
              print("\nFAILED:")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print("\nthe composed app boots and every checked page responds")
          PY
