        # mergeable on a branch that predates the file. Every external reader
        # is stubbed, so it needs no Knack, Simvoly or Insites credentials.
        run: |
          if [ -f test_domain_links.py ]; then
            python test_domain_links.py
          else
            echo "test_domain_links.py not on this branch — nothing to run."
          fi

      - name: Suite embed tests
        # Hub pages framed inside Smart 1 Suite: the SameSite=None companion
        # cookie that reaches a cross-site frame, the safe-method + allowlist
        # limits that stop it being a second front door, the frame-ancestors
