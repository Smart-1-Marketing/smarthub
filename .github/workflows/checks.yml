      # stopped sweeping, which is worse than not having one.
      - name: The Commercial Builder dashboard stays wired
        run: python3 test_commercial_dashboard_layout.py
      # hub/audit_summary.py grounds every dollar figure in the two paragraphs
      # a prospect reads at the top of their own website audit, which is right
      # — the alternative is a model inventing what somebody spends. It
      # compared the formatted string, so the measured figure re-typed without
      # its comma came back as invented. The whole summary is then discarded,
      # the report renders nothing, the `why` is read by no template, and
      # for_scan() stores the refusal because it "will not change on the next
      # view" — true of a real refusal, false of this one. One dropped comma
      # cost that audit its opening paragraphs permanently.
      - name: A measured figure, re-typed, is not an invented one
        run: python3 test_audit_summary.py
      # hub/blog_images.py names a post's Cloudinary object after its TITLE,
      # with overwrite=True — and hub/seo.py tops a short plan up from six
      # fallback titles and cycles them, so twelve posts a month holds each
      # twice, verbatim. Post 3's featured image became post 9's picture, at
      # one URL, in the store, the gallery and on the client's live site.
      # Beside it: a badge counting archived posts the working list no longer
      # shows, amber for ever with no row to click; a 3 MB hero filed at full
