        # "Riverside HVAC" never collects "Riverside HVAC Supply", that a bulk
        # assignment reports every row's own outcome and writes the file once
        # rather than once per client, that a standing partner rule writes no
        # assignment rows at all and every row it owns says which partner it
        # came from, that a direct assignment beats a rule and taking a client
        # off everybody sticks rather than being re-claimed on the next read,
        # that two rules naming different people leave the client unassigned
        # and name both, that an owner whose account is gone is named rather
        # than read as unassigned, that owners and Ignore/Done marks are
        # applied on read so one gunicorn worker's press is not invisible to
        # the other, that a Done mark on an issue which has since changed
        # reports itself superseded, that a source which could not be read is
        # named instead of counted as nothing, and that every route refuses a
        # stranger. Guarded like the steps above so this
        # workflow stays mergeable on a branch that predates the file. It sets
        # its own DATABASE_URL and HUB_DATA_DIR, so it never touches the real
        # ones.
        run: |
          if [ -f test_client_owners.py ]; then
            python test_client_owners.py
          else
            echo "test_client_owners.py not on this branch — nothing to run."
          fi

      - name: Boot the composed app
        # Static analysis misses what booting catches; several serious bugs in
        # this repo were only ever found by running it. Requests the pages a
        # change is most likely to break.
        env:
          DATABASE_URL: sqlite:////tmp/ci-boot.db
          PANEL_PASSWORD: ci-test-password
          SECRET_KEY: ci-test-secret
        run: |
          python - <<'PY'
          import sys
          from werkzeug.test import Client
          from wsgi import application

          c = Client(application)
          c.post("/login", data={"password": "ci-test-password", "name": "CI"})

          pages = ["/", "/status", "/diagnostics", "/sales/leads",
                   "/api/integrity", "/api/leads", "/login/health",
                   # The three pages that must answer without a session: the
                   # crawler files (one behind a login is not read) and the
                   # forgotten-password page, which is the one page somebody
                   # who cannot sign in actually needs.
                   "/robots.txt", "/llms.txt", "/forgot",
                   # The proposal builder and Client 360 render the largest
                   # templates in the repo and are where a bad section kind or
                   # a template typo surfaces as a 500 rather than a test
                   # failure. /sales/proposals is the retired builder's
                   # redirect; a 3xx here is the correct answer.
                   "/sales/builder/", "/sales/proposals/", "/tools/io/",
                   "/client360", "/tools",
                   # Two blueprint pages and the API each draws itself from.
                   # A page that boots while its API 500s is a blank tool, and
                   # this one's whole content arrives from the fetch.
                   "/my-clients", "/api/my-clients/scoreboard",
                   "/qa/client-owners", "/api/client-owners",
                   # The landing maker, and the API its page calls.
                   "/sales/landing", "/api/landing",
                   # The website block builder. Its page draws itself entirely
                   # from api/catalogue, so a page that boots but whose
                   # catalogue 500s is a blank tool -- both are requested.
                   "/tools/site-blocks/", "/tools/site-blocks/api/catalogue",
                   # The social planner, and the page that links to it. Its
                   # index renders the whole post-type spec into the page, so a
                   # bad entry in hub/social_plan.py shows up here as a 500.
                   "/tools/social/",
                   # The GPT ads builder, and the list endpoint its page opens
                   # with -- a page that boots but whose index 500s is a blank
                   # tool, so both are requested.
                   "/tools/gpt-ads/", "/tools/gpt-ads/api/ads",
                   # Sites match is a HUB route under /tools -- the trap
                   # CLAUDE.md names first -- and both of its panels are one
                   # API call each, so a page that boots with a 500 behind it
                   # is a blank tool.
                   "/tools/sites-match", "/api/sites-match", "/api/client-urls",
                   "/creative"]
          bad = []
          for url in pages:
              try:
                  code = c.get(url).status_code
              except Exception as exc:
                  bad.append(f"{url} raised {type(exc).__name__}: {exc}")
                  continue
              print(f"{code}  {url}")
              # 3xx is fine (auth redirects); 4xx/5xx on these is not.
              if code >= 400:
                  bad.append(f"{url} returned {code}")

          if bad:
              print("\nFAILED:")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print("\nthe composed app boots and every checked page responds")
          PY

      # What the BROWSER receives, after HubBar and the hub's after_request
      # have rewritten the response. Every check above reads source; this reads
      # the bytes. HubBar injected the sidebar at the first </body> in the
      # response, and the IO Builder builds two printable documents as
      # JavaScript template literals that each carry their own </body> -- so
      # the chrome landed inside a string, closed the page's script early, and
      # the whole tool rendered blank. Every template was valid. Every link
      # resolved. Nothing above would have caught it.
      - name: Rendered pages (chrome is markup, scripts still parse)
        run: python tools/pagecheck.py --strict

      # The Hub's own defect-pattern check, which otherwise lives behind a
      # login on a page somebody has to remember to open. Gates on `high` only:
      # two medium findings stand today (ad_builder and msa never write to the
      # activity log) and are printed every run, so switching this on did not
      # start it red.
      - name: Known defect patterns (/api/integrity)
        run: python tools/integritycheck.py

      # American English, over the copy this Hub puts on a screen. Smart 1
      # sells in the US and modules/scans/reports.py has normalized the copy
      # it lifts from Insites for a while; everything the Hub wrote itself was
      # drifting the other way, one template at a time, because a British
      # spelling is not a defect any other check here can see -- the page
      # renders, the link resolves, the English is correct. This is green, so
      # a new "colour" is a failing build rather than something a client finds
      # on a proposal.
      - name: American English in the copy
        run: python tools/spellcheck.py

      # ...and that the check above cannot be silenced by an edit somewhere
      # else: it is handed a sentence that plainly drifts and required to say
      # so, and its exemption list is required to still name real files and
      # real words. The failure hub/config.py's ALIASES table describes.
      - name: The spelling check still bites
        run: python3 test_spelling.py

      # One client reader. `context()` asked the site scan for `detected_phone`
      # at the top level of a payload that publishes `meta.detected_phone`, so
      # a client with a complete audit prefilled a form with a name and a URL
      # and left the phone, the address and the industry blank -- on a record
      # that had held all three since the scan ran. This holds the merge, the
      # rule that an offer never overwrites what somebody typed, and the block
      # every AI feature hands a model.
      - name: Client prefill and the block a model is handed
        run: python3 test_client_prefill.py

      # A logo we found is a logo the client's gallery holds. Brandfetch is
      # billed and its answer was stored as JSON; the Insites scan reads the
      # logo off the client's own home page, which is where it comes from for
      # most local businesses. Neither reached the gallery a rep opens to put
      # a mark into an ad. This holds the four ways filing it goes quietly
      # wrong: the same mark filed twice, two different marks collapsed into
      # one, a dead URL drawn as a broken tile, and a billed provider called
      # on a page load.
      - name: Logos reach the client gallery
        run: python3 test_client_logos.py

      # The top search box. A client the query *names* comes first -- but
      # `search_clients()` matches a substring of the domain too, so promoting
      # every row it returns put a bridal shop above Image Creator on the query
      # "image". This holds that split, holds that every screen in the Hub is
      # findable (the seven tools filed under QA Reports were inline in the
      # route that drew them, so nothing else could read them), and holds that
      # a client book which could not be read is named rather than silently
      # answered with only the pages.
      - name: The search box finds clients first, and finds the Hub
        run: python3 test_search.py

      # A client's llms.txt is hosted here and reached by a redirect on the
      # client's own website, so every part of it can be broken by somebody
      # who never heard of the feature -- and every one of those failures is
      # silent, because the Hub goes on reporting a clean publish while a
      # crawler reads a 404, a login page or a refusal. Two of the three
      # layers that had to be opened were not in the written brief at all:
      # `hub/no_crawl.NoIndex` stamps `noai` onto every response in the
      # composed app, and a saved draft used to overwrite the published copy.
      # This holds the robots groups per user-agent (never by substring), the
      # header the route sets for itself, the 301-versus-302 verdict, and that
      # a robots.txt we could not reach is not read as permission.
      - name: The client llms.txt is readable, redirected and verified
        run: python3 test_llms_hosting.py

      # The help layer, both halves. A bubble whose key the registry does not
      # hold is removed client-side, so the template reads as helped and the
      # screen shows nothing -- no console error, no failed request. And the
      # coverage audit that would have reported the gap was measured against a
      # hand-typed list that had gone stale: it answered "nothing is missing"
      # while two dozen tiled tools carried no explanation at all. It is
      # derived from the index-page tiles now, and a parse that finds no tiles
      # is a refusal to answer rather than a clean bill. This file was in
      # CLAUDE.md's list and in no CI step, so it was a check nobody ran.
      - name: Every bubble has help behind it, and coverage is measured
        run: python3 test_help_layer.py

      # The layer above the month plan: multi-location intake, the client's
      # four signed pages, the idea weighting and the Suite push. Every one of
      # these fails quietly rather than loudly -- a duplicate flag that crossed
      # a client, a push failure that read as scheduled, a client-facing page
      # behind the staff login, or the copy checks blocking the client's own
      # offer because nobody told them the client had supplied it.
      #
      # Safe to run twice: it *sets* DATABASE_URL, HUB_DATA_DIR and
      # AUDIT_LOG_PATH rather than setdefault-ing them, so it never inherits
      # this job's Postgres. That is the trap named beside test_target_areas.py
      # above -- jsonstore mirrors every write into the database and restores
      # on a miss, so a second run would find the first run's requests and
      # ideas restored into its fresh temporary directory and fail on the
      # counts. Reproduced before it was fixed, and both runs are green now.
      - name: Content requests, ideas and the Suite push
        run: python3 test_social_content.py

      # The client registry ran on a 610-row JSON file committed to the repo
      # while hub/knack_websites.py read the same object live. This holds the
      # switch: live where Knack answers, the export where it will not, a
      # failed pull that never empties a good export, and summary() still
      # measuring the dashboard scorecard against the export -- pointed at the
      # live list it reports 2 active websites instead of 610.
      - name: Websites read live, with the export as the fallback
        run: python3 test_knack_websites_source.py

      # The client half of the Suite embed. The location id inside the
      # encrypted SSO payload is the authorization and the whole security
      # model: every refusal here is a way to show one client another client's
      # record, and every one of them is silent. Carries its own encryptor so
      # the CryptoJS envelope is round-tripped rather than assumed.
      - name: Suite SSO — who is looking, inside a client's own sub-account
        run: python3 test_suite_sso.py

      # Eleven background jobs share one thread. The panel said the loop was
      # alive and drew a green pill for any job whose last run succeeded,
      # however long ago -- and the standby worker, which holds no timings at
      # all, showed every job as never run. This holds the three answers it
      # could not give: overdue, a failure streak, and not-measured-here.
      - name: Background jobs report whether they are working
        run: python3 test_scheduler_health.py

      # SmartForecast is a stateful public experience: verify lifecycle rules,
      # immutable history, public embeds, and Render disk recovery together.
      - name: SmartForecast lifecycle, storage and embed tests
        run: python3 test_smartforecast.py

      # The two radio commercial builders. Neither had a test, and the
      # customer-facing half of Fan Radio was behind the staff login: the
      # module has said since it was written that /r/, /api/public/ and
      # /audio/ are the customer's, and the mount passed AuthGuard no public
      # prefixes at all, so mailing a client their approval link mailed them a
      # sign-in form for an account they will never have -- and the audio
      # player on the page was dead with it. Nothing errored; the redirect is
      # a correct answer to a question nobody asked. This holds both halves of
      # "public" (reachable, and no staff chrome on a page a client reads),
      # that a link which is not live answers what an invented one answers,
      # that the trademark guard refuses a render before a provider is called,
      # and that both stores write under the shared data root rather than
      # their own copy of it.
      - name: Radio builders — the client's page, the marks, and the clock
        run: python3 test_radio_builders.py

      # Commercial Builder <-> Radio Promo parity. One reader for "the copy
      # has to actually say it": Radio Promo checked its scripts literally and
      # the Commercial Builder asked whether a field was set on a client
      # record, which is a much easier question -- a spot whose end card had
      # been deleted passed with the phone number sitting in a database
      # column. The three false positives that shared rule closes are held
      # against the findings it must keep making, because a rule loosened
      # until it stops crying wolf and then loosened once more passes on
      # everything. Radio Promo's QC panel runs on the copy rather than after
      # the render, and the line between what may refuse a billed record and
      # what may only report is certainty rather than severity: a timing
      # verdict is words divided by a read pace, so refusing a render on it
      # would refuse a correct read. The :10 and the :60 were unbuildable and
      # the slot keys were hardcoded in six places. And the finished
      # commercial reaches Smart 1 Suite through the Hub's one contact write
      # path, revising the opportunity it already opened rather than adding a
      # second to the same client's pipeline.
      - name: Builder parity — the copy, the panel, the lengths, the Suite
        run: python3 test_builder_parity.py

      # The sample campaigns both radio builders open empty without. Two
      # things about the seeder are worth holding to an assertion. It must not
      # write a script the tool would flag -- four of the first eight were
      # long or short, and one sitting in the library carrying the over-budget
      # warning demonstrates the failure the grader exists to raise. And
      # --remove must never delete somebody's work: both modules exist partly
      # to support promoting a spec piece into a client's ("a spec spot that
      # wins the business becomes that client's first spot"), the sample mark
      # survives that promotion, and matching on the mark alone would delete a
      # real client's spot on the next run. Production holds three Radio Promo
      # projects, two of them client-attached, so it is asserted rather than
      # reasoned about.
      - name: Radio samples — in budget, and never deleting adopted work
        run: python3 test_radio_samples.py

      # Every module's work is attributable, and the two checks that say so
      # both bite. /api/integrity's silent-module check tested whether the
      # STRING "for_module(" appeared in a module's source, which binding the
      # logger satisfies -- so seven modules imported hub.audit, bound it,
      # wrapped it in a no-op fallback, wrote a comment above the import
      # explaining why attribution mattered, and called it nowhere. Deleting a
      # client's live website, connecting a domain, deploying a tag into
      # somebody's Tag Manager container and compressing a client's documents
      # were the least attributable actions in the Hub, behind a check
      # reporting them clean. Its neighbour had the same shape one step on:
      # check_work_kinds() could not see a module's own log() wrapper, so
      # radio_promo logged client work that never reached the client record
      # while fan_radio, doing the same job, did.
      - name: Every module's work is attributable
        run: python3 test_activity_logging.py
      # Declared and never wired is the failure this repo has paid for most
      # often -- an ">>> INTEGRATION POINT <<<" naming three writers that have
      # never existed, `storage.manifest()` feeding an audit nobody built,
      # `check_limits()` written while the page that needed it 500'd. None of
      # them errored: an uncalled function is indistinguishable from a working
      # one until somebody goes looking for the feature it was half of. Every
      # survivor carries the reason it is allowed to, and an entry naming a
      # function that is gone -- or one something now calls -- fails.
      - name: Nothing is declared and left unwired
        run: python3 test_unwired.py

      # `.spin` was defined nine times before hub-thinking.js. The script reaches
      # the Hub three ways (base.html, HubBar, the hub app's own injector) and
      # three client-facing pages inline their own copy, because a Hub script on
      # a stranger's page is a new outbound dependency. This holds the four in
      # step -- same paths, same speed, same reduced-motion rule -- so a prospect
      # and a rep are not looking at two different features.
      - name: One mark for a wait, in all four places it is drawn
        run: python3 test_thinking.py

      # The three index pages, and the crumb map held against the tiles rather
      # than remembered. It has drifted twice: the creative tools moved onto
      # /creative while their URLs stayed under /tools/, and six QA tools moved
      # with their "back" still landing on Client Tools. Nothing reports that --
      # the link resolves and the page renders, it simply lands where the tool
      # is not. Lifts the resolution block out of the page and runs it in node.
      - name: Every tool is tiled once, and the trail names it
        run: python3 test_menu_layout.py

      # The primitives four screens of one product share. It also walks the
      # rendered HTML to assert the page wrapper still contains the page: one
      # stray closing tag ends it early, after which every rule scoped to it
      # silently stops applying -- valid markup, resolving links, passing
      # pagecheck, and invisible in the diff.
      - name: One description of the record-page look
        run: python3 test_detail_ui.py

      # Three places a model reads something the Hub already holds -- a project
      # name, a client's photographs, a ticket's prose. The safety argument is
      # that none of them writes by arriving, and this asserts it from the AST:
      # the source of each carries no path to a write.
      - name: The model proposes, the code decides, a person presses
        run: python3 test_ai_proposals.py

      # Its walkthrough described a wizard that no longer exists -- a Storyboard
      # step the tool had replaced, lengths with no :06 in them, and a QR code
      # called required where the rule is advisory. A rep believes a
      # walkthrough, so this asserts against each of those by name.
      - name: The Commercial Builder explains the tool it is
        run: python3 test_commercial_explainer.py

      # Every help key placed resolves, every tour step rings a card its own
      # screen actually draws, and none of it reaches the two pages a prospect
      # reads -- a staff note there is an internal note in front of a client.
      - name: The prospect record and the audit explain themselves
        run: python3 test_prospect_explainer.py

      # Named in neither this workflow nor CLAUDE.md's list until now, which is
      # the same gap one step further on: a check nobody runs and nobody has
      # written down is one nothing would miss.
      - name: Website block tests (the second file)
        run: python3 test_site_blocks.py

      # CLAUDE.md ends its list of checks by saying all of it runs on every
      # pull request, and it did not: seven of the files that list names were
      # run by nobody but a person who thought to type them -- and the file
      # making the claim is the file listing them. This asserts it in both
      # directions, so the next check added cannot be gated by nobody.
      - name: Client 360 derived health strip
        # hub/record_health.client360(): every pill derived from the stores,
        # a source that refuses drawn as its own state rather than a clean
        # one, a client with nothing on file drawn as unknown, the blogs
        # rule shared with the SEO record, and the renderer driven in node.
        run: python3 test_client360_health.py

      - name: Suite billing reports against a stubbed SaaS API
        # The two GHL billing reports had never been run live and had no test.
        # An unrecognised subscription status is named on the report rather
        # than dropped, a refused plan catalogue is said rather than passed
        # off as $0, and GHL refusing or the company id being unset is never
        # an all-clear. tools/probe_ghl_saas.py is the read-only live half.
        run: python3 test_ghl_billing.py

      - name: The gate runs every check a person runs
        run: python3 test_ci_gate.py

      # The IO Builder had no test of its own, and booting it and pressing its
      # buttons found every AI button in the tool dead: this module carried a
      # second copy of the OpenAI Responses call, and the copy attached the
      # hosted web_search tool to every request — the failure CLAUDE.md
      # records against the Proposal Builder, whose copy was fixed while this
      # one was never touched. There is one reader now and both read it. It
      # also holds the two answers that were reported as successes -- a
      # truncated answer reaching the internal PDF as an empty landing-page
      # review, and a media mix with every field blank -- the landing review
      # that now reads the page rather than asking a model to visit it, and
      # where the line falls between an order and an attempt on submit.
      - name: IO Builder — the model calls, and the landing page it now reads
        run: python3 test_io_builder.py

      # The panel that creates and deletes clients' Smart 1 Suite sub-accounts
      # had no test of its own. Its double-submit guard was a dict in memory
      # against two gunicorn workers, and it was written *after* the account
      # existed — so a resubmit that landed on the other worker, and any
      # genuine double-click, created a second sub-account for one client and
      # answered 201 both times. Its duplicate check could fail and return a
      # clean success, and the activity entry for a deletion carried the name
      # the browser claimed rather than the one GHL held. This holds all three.
      - name: Suite Panel — the guard on creating, the record of deleting
        run: python3 test_suite_panel.py

      # The last two modules named by no test at all. Both take a file a
      # client sent us and hand it back, and both handed the user a raw
      # internal exception instead of a message: Pillow's "cannot identify
      # image file <_io.BytesIO object at 0x7f...>", and -- worse -- the last
      # 2000 characters of Ghostscript's stderr, absolute temp paths and the
      # uploader's filename included, interpolated straight into a 500. The
      # PDF tool's /health also answered "ok" while Ghostscript was missing
      # and every optimize was failing, contradicting the Hub's own /status.
      - name: The image and PDF optimizers
        run: python3 test_image_pdf_optimizers.py

      # The third distinct way a tool's work has gone missing from the client
      # record. The first two have checks: a name WORK_KINDS cannot name, and
      # a module that binds a logger and never calls it. This is the one
      # nothing was asking -- the row is written, the table knows the name,
      # and the client sits under a key work_log() does not read. UTM Builder
      # wrote detail=client AND logged under `utm` while the table said
      # `utm_builder`, so every tracked-link batch was dropped twice over;
      # Background Remover wrote detail=client too, with the gallery half of
      # the same fix already done beside it.
      - name: Work filed against a client reaches that client's record
        run: python3 test_work_attribution.py
      # The last two modules no test named except in passing. Each carried a
      # failure no screen could report: UTM Builder printed the length of its
      # own page as the match count ("300 of 900" for a search matching 450),
      # and the CSV button beside it searched five of the eleven fields the
      # table searched — so a search on a label or a colleague's name handed
      # back a header row and nothing else, contradicting the table above it.
      # Background Remover filed every cut-out into a client's gallery with no
      # dimensions, having measured them two functions earlier; kept its
      # credit cache in a per-process dict on a paid API across two gunicorn
      # workers; and set Flask to refuse at 40 MB a batch its own screen
      # offers at 120, as an HTML 413 the page could only report as "Failed".
      - name: UTM Builder and Background Remover
        run: python3 test_utm_bg_tools.py
      # /api/integrity's silent-module check reads a call rather than an
      # import now, and the seven modules that had bound hub.audit and never
      # used it were fixed. That sweep wired a handful of call sites per
      # module and stopped, and nothing could see the remainder: the check one
      # level up is satisfied by ONE call site. Sites Admin recorded deleting
      # a client's website and not creating one; Google Finder recorded
      # deploying a tag and not deploying a pixel into the same container,
      # which is the very action CLAUDE.md names. One walk, in hub/audit.py,
      # holds both -- and each module declares the writes that deliberately
      # record nothing, so a silent one is a decision rather than an oversight.
      - name: Every write into a client's own account has a name on it
        run: python3 test_write_attribution.py
      # hub/analytics_ids.py compares the GA/GTM ids recorded in Knack against
      # the ones Google can reach, and its own docstring says a false mismatch
      # "is worse than no check at all because it trains people to ignore the
      # warning". It then reported one on every GA row it could see: Knack
      # holds the G- measurement id and a GA4 property summary returns only the
      # numeric property id, so the comparison forced a verdict between two
      # names for one property. On this deployment's own registry that is all
      # 166 recorded GA ids, and `match` was unreachable — a red pill on the
      # client record and a report of "reporting may be pointed at the wrong
      # property" about properties we administer, correctly recorded.
      - name: Two names for one property is not a disagreement
        run: python3 test_analytics_ids.py
      # hub/ghl_oauth.py mints the location-scoped tokens the Suite panel, the
      # social planner and every sub-account join run on, and no test named it
      # except the scope table's. Reading it turned up a divergence one layer
      # out: /diagnostics trims PUBLIC_BASE_URL to its origin before printing
      # which callback URI to register, and the two flows that BUILD one
      # appended to the raw value — so with the path this deployment's linked
      # env group actually carries, the panel named a URI the code never sends.
      # Register what the panel says and consent fails on redirect_uri_mismatch;
      # google_access is the one the panel itself marks client-facing.
      - name: The Suite install, and the callback the panel promises
        run: python3 test_ghl_oauth.py
      # hub/seo_tasks.py raises the web tickets that get schema, FAQs and blog
      # posts onto a client's live site, and its docstring opens by forbidding
      # exactly what it did: "It must never create the same ticket twice ... A
      # queue that fills with duplicates is a queue people stop reading." The
      # dedupe key was the raw URL while the title beside it was _short(), so
      # the module already knew how to reduce a URL to a page and used that
      # only for what somebody reads. Five ordinary spellings of one page --
      # trailing slash, www, http, query string -- raised five tickets, four
      # with an identical title. An http -> https migration would have
      # duplicated the whole book in one pass.
      - name: One page, however its URL was written
        run: python3 test_seo_tasks.py
      # hub/ghl_blog.py publishes a client's llms.txt into Suite as a blog
      # post -- a public URL on somebody's blog -- and read GHL_COMPANY_ID as
      # a location fallback. On this deployment that holds the company id, and
      # a companyId used as a locationId addresses the AGENCY: the client's
      # document went to the agency's own blog, under the agency's domain,
      # created successfully because that location has a real blog with real
      # authors and categories. hub/ghl_contacts.py documents this at length
      # and hub/suite_opportunity.py was fixed for it; this was the third.
      # Beside it: slug_taken() answered False when it could not look, which
      # is what silently disabled the guard against two files describing one
      # client -- and check_access() never tested that scope; a blog id naming
      # nothing fell through to blogs[0]; and the URL was built from the slug
      # we asked for rather than the one Suite assigned.
      - name: companyId is not locationId, for the third time
        run: python3 test_ghl_blog.py
      # The Client 360 forms card asked for forms with no sub-account and fell
      # back to GHL_LEAD_LOCATION_ID -- the sub-account Smart 1's OWN leads are
      # written into -- so every client's card showed the agency's form
      # submissions under that client's name. A count that failed was dropped
      # before the skipped tally, so all-forms-failing rendered as "no form
      # submissions"; and a baseline nobody could read was recorded as 0.
      - name: Whose forms, and what an empty card means
        run: python3 test_ghl_forms.py
      # The client-to-sub-account mapping, in its own store. Every
      # location-scoped feature needs it, and getting a pairing wrong puts
      # one client's work in another client's account -- so a proposal is
      # exact or it is not a proposal, two candidates propose neither, and a
