        # and that case says "not measured" instead. Guarded like the steps
        # around it so this workflow stays mergeable on a branch that predates
        # the file. QuickBooks and Sites Admin are both fixtures, so it needs
        # no connected company and reaches no third party.
        run: |
          if [ -f test_sites_billing.py ]; then
            python test_sites_billing.py
          else
            echo "test_sites_billing.py not on this branch — nothing to run."
          fi

      - name: Domain attach, orphan URL and domain purchase tests
        # One domain attached to one client in four systems at once, the
        # orphan list that finds a URL nobody owns, and the purchased-domain
        # renewal calendar whose "billed" tick lapses when the renewal date
