services:
  - type: web
    name: smart1-hub
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: hub-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      # ---- Hub login ----
      - key: PANEL_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # ---- Suite (GoHighLevel) ----
      - key: GHL_PRIVATE_TOKEN
        sync: false
      - key: GHL_COMPANY_ID
        sync: false
      # Proposal opportunities are filed into GHL_LEAD_LOCATION_ID (below).
      # Optional; the pipeline is discovered from the API when blank.
      - key: GHL_PIPELINE_ID
        sync: false
      - key: GHL_PIPELINE_STAGE_ID
        sync: false
      # The API version header every Suite call sends. Optional; the code
      # defaults to 2021-07-28, which is the v2 Contacts API's own.
      - key: GHL_API_VERSION
        sync: false
      # ---- Lead delivery into Smart 1 Suite ----
      # The Smart 1 Marketing SUB-ACCOUNT id, and the one variable that makes
      # lead delivery work at all: without it every landing page, calculator
      # and scan widget stores its leads and delivers none. It is a location
      # id and NOT GHL_COMPANY_ID -- the Hub refuses the two being equal,
      # because a company id used here files leads against the agency where
      # nobody looks. /api/leads/ghl/preflight?find=1 looks it up by name.
      - key: GHL_LEAD_LOCATION_ID
        sync: false
      # The two CONTACT custom fields the report and PDF links are written
      # into, by id, so a Suite workflow on the lead's tag can email the
      # link. Read the ids off /api/leads/ghl/preflight; never guess them.
      - key: GHL_LEAD_REPORT_URL_FIELD_ID
        sync: false
      - key: GHL_LEAD_PDF_URL_FIELD_ID
        sync: false
      # /api/leads/capture is unauthenticated by design (landing pages post
      # to it); this caps submissions per visitor IP per window so a script
      # cannot bury the real leads. 0 turns the limit off.
      - key: LEADS_RATE_LIMIT
        sync: false
      - key: LEADS_RATE_WINDOW_SECONDS
        sync: false
      - key: BRANDFETCH_API_KEY
        sync: false
      # ---- Sites (Simvoly) ----
      - key: SIMVOLY_API_KEY
        sync: false
      - key: SIMVOLY_API_BASE_URL
        value: https://api.smart1sites.com
      - key: DATABASE_URL
        sync: false
      - key: MOCK_MODE
        value: "false"
      - key: ENABLE_WRITE_ACTIONS
        value: "false"
      # ---- Google Finder ----
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAILS
        value: adops@smart1marketing.com,smartadops@gmail.com,smart1sites@gmail.com
      - key: CACHE_SECONDS
        value: "900"
      - key: TOKEN_DB_PATH
        value: /var/data/google_tokens.db
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      # ---- Google Access (/tools/google-access) ----
      # The client-facing consent flow. GOOGLE_ACCESS_AGENCY_EMAIL is the
      # agency Google account that gets added to each client property, and
      # there is no sensible default for it -- unset, every client link serves
      # "not switched on yet" rather than adding the wrong account.
      - key: GOOGLE_ACCESS_AGENCY_EMAIL
        sync: false
      # Optional. Unset, the module uses the shared GOOGLE_CLIENT_ID /
      # GOOGLE_CLIENT_SECRET above -- the same OAuth client as Google Finder
      # and Hub sign-in -- and says so on its own page, because whichever
      # client is in use is the one whose Authorised redirect URIs must carry
      # <PUBLIC_BASE_URL>/connect/callback.
      - key: GOOGLE_ACCESS_CLIENT_ID
        sync: false
      - key: GOOGLE_ACCESS_CLIENT_SECRET
        sync: false
      # Shown to the client on the consent and receipt pages.
      - key: GOOGLE_ACCESS_SUPPORT_EMAIL
        sync: false
      - key: GOOGLE_ACCESS_SUPPORT_PHONE
        sync: false
      # Business Profile needs a Google allowlist application. Leave off until
      # it is approved: on, every call 403s and the client reads it as their
      # fault; off, they get written instructions instead.
      - key: GOOGLE_ACCESS_GBP_ENABLED
        value: "false"
      # ---- Smart 1 Ads (/tools/ads) ----
      # Unset, the module serves its own settings page naming what is missing.
      - key: GOOGLE_ADS_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      # Exactly one URI, matching the Authorised redirect URI registered in
      # Google Cloud Console character for character. In production it is
      #   https://smart1.agency/tools/ads/oauth/callback
      # Not the onrender.com hostname, and never two URIs joined with a
      # comma -- Google matches one exact string.
      - key: GOOGLE_ADS_REDIRECT_URI
        sync: false
      - key: GOOGLE_ADS_REFRESH_TOKEN
        sync: false
      # ---- Smart 1 Marketing sub-account (GHL) ----
      - key: SUITE_COMPANY_ID
        sync: false
      - key: SMART1SUITE_PRIVATE_TOKEN
        sync: false
      # ---- Suite Marketplace app (sub-account access) ----
      # The agency Private Integration Token above cannot read sub-account
      # resources such as Forms, and HighLevel has no API that creates those
      # tokens. These come from a Marketplace app instead: install it once at
      # the agency and the Hub mints a per-sub-account token on demand, so a
      # new client needs no setup. Redirect URL to register on the app:
      #   <PUBLIC_BASE_URL>/suite/oauth/callback
      - key: GHL_CLIENT_ID
        sync: false
      - key: GHL_CLIENT_SECRET
        sync: false
      # Optional — overrides the default read-only scope set if you need more.
      - key: GHL_OAUTH_SCOPES
        sync: false
      # The Marketplace app's SSO key -- a THIRD credential, separate from the
      # client id and secret, issued on the app's own settings page. It is what
      # decrypts the user payload behind a client-facing frame, so without it
      # hub/suite_sso.py resolves to not_configured and /suite-app refuses
      # rather than trusting a frame it cannot verify. env.example carried it;
      # this file did not, which is how a key gets set everywhere except the
      # service that needs it.
      - key: GHL_SSO_KEY
        sync: false
      # Hosts allowed to frame a Hub page (CSP frame-ancestors). Optional;
      # defaults to HighLevel's own hosts. Set it for a whitelabel domain.
      - key: HUB_EMBED_FRAME_ANCESTORS
        sync: false
      # ---- Scans (Insites Audit API) ----
      - key: INSITES_API_KEY
        sync: false
      # Public URL of this Hub service, so Insites can POST finished audits
      # back to /scans/api/callback. Set to your Render service URL.
      # REQUIRED for Site Scans. Blank means Insites never posts completions
      # back, so every scan hangs on "running" forever. Set to this service URL.
      - key: PUBLIC_BASE_URL
        sync: false
      # Shared secret guarding the Insites completion callback. Generate any
      # long random string; it's appended to the callback URL and verified.
      - key: SCANS_CALLBACK_TOKEN
        generateValue: true
      # ---- Knack API (web tickets) ----
      - key: KNACK_APP_ID
        sync: false
      - key: KNACK_API_KEY
        sync: false
      # ---- QuickBooks ----
      - key: QB_CLIENT_ID
        sync: false
      - key: QB_CLIENT_SECRET
        sync: false
      - key: QB_ENVIRONMENT
        value: production
      # ---- Cloudinary (proposals, SEO images, image projects, cutouts) ----
      # MISSING BEFORE v7. Without this every asset tool silently degraded to
      # local-disk-only storage on a 1 GB disk that is wiped on redeploy.
      - key: CLOUDINARY_URL
        sync: false
      # ---- OpenAI (SEO naming, FAQ, schema, ads, proposals, image gen) ----
      # MISSING BEFORE v7. Without this every AI feature fell back to templates.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_VISION_MODEL
        value: gpt-4o
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: OPENAI_TIMEOUT
        value: "90"
      - key: OPENAI_RETRIES
        value: "2"
      # ---- Stock photo providers (Image Creator universal search) ----
      # Any subset works; search degrades to whichever answer.
      # Both spellings are read; PEXELS_API / PIXABAY_API are the ones set
      # on this service. Either works -- no need to rename in the dashboard.
      - key: PEXELS_API
        sync: false
      - key: PIXABAY_API
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      # ---- Commercial Builder (/tools/commercial-builder) ----
      # Also uses OPENAI_API_KEY, PEXELS_API, PIXABAY_API and CLOUDINARY_URL
      # above. None of these were declared here at all, which is how the tool
      # came to be the one place in the Hub where "the key is set" and "the
      # key is read" could differ without anything saying so.
      #
      # Every one is read through hub/config.py, which accepts <NAME>_API,
      # <NAME>_API_KEY and <NAME>_KEY. The short spelling is what this
      # deployment uses; either works, and there is no need to rename anything
      # in the dashboard. Each provider degrades to mock data rather than
      # erroring, so a name nothing reads costs a silent feature, not a 500 —
      # the dashboard's "Check keys" button is what tells them apart.
      #
      # Spokesperson scenes. Without it a presenter scene has no clip.
      - key: HEYGEN_API
        sync: false
      # Real HeyGen avatar ids for the Smart 1 talent roster, as a JSON object
      # keyed by roster id. Until a person appears here the picker shows them
      # as not yet available rather than offering a tile that fails on click.
      - key: SMART1_TALENT_AVATARS
        sync: false
      # AI video scenes. Runway animates a generated still; clips are 5s or 10s.
      - key: RUNWAY_API
        sync: false
      # Voiceover. Without it a commercial renders with no voice track — and
      # this is the same key Radio Promo and Fan Radio read.
      - key: ELEVENLABS_API
        sync: false
      # Final render, and the last step in the tool. Without it a project goes
      # all the way through brief, script, storyboard and QC and produces no
      # file.
      - key: CREATOMATE_API
        sync: false

      # ---- Background Remover (billed per image) ----
      - key: REMOVE_BG_API_KEY
        sync: false
      # ---- Fonts (optional; a curated list is used without it) ----
      - key: GOOGLE_FONTS_API_KEY
        sync: false
      # ---- Image pipeline ----
      # Longest-edge cap applied BEFORE WebP conversion. WebP alone does not
      # shrink a camera photo — a 6000px JPEG stays 6000px.
      - key: SEO_IMAGES_MAX_EDGE
        value: "2400"
      - key: HUB_PREVIEW_EDGE
        value: "640"
      - key: HUB_AI_USAGE_LOG
        value: "true"
      # ---- Google Workspace login (hub/identity.py) ----
      # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET are already declared above for
      # Google Finder — the Hub login reuses the same OAuth client. Add this
      # Hub's /auth/google/callback to the Authorised redirect URIs in the
      # Google Cloud console, or sign-in returns redirect_uri_mismatch.
      - key: ALLOWED_LOGIN_DOMAINS
        value: smart1marketing.com
      - key: HUB_ADMIN_EMAILS
        sync: false
      # ---- Demo mode (hub/demo.py) ----
      # Any non-empty value turns on demo sign-in. Demo sessions are read-only
      # and every paid call (Insites, remove.bg, OpenAI) is intercepted.
      - key: HUB_DEMO_CODE
        sync: false
      # Set true ONLY on a separate throwaway service used purely for training.
      - key: HUB_DEMO_MODE
        value: "false"
      # ---- provider allowances (/diagnostics warns as you approach them) ----
      - key: BRANDFETCH_WARN_AT
        value: "80"
      - key: BRANDFETCH_MONTHLY_LIMIT
        value: "100"
      - key: INSITES_WARN_AT
        value: "900"
      - key: INSITES_MONTHLY_LIMIT
        value: "1000"
      - key: REMOVEBG_WARN_AT
        value: "40"
      - key: REMOVEBG_MONTHLY_LIMIT
        value: "50"
      # ---- user accounts (self sign-up + admin approval) ----
      # Optional: adds extra super admins beyond the three named in code.
      - key: HUB_SUPER_ADMINS
        sync: false
      # Google sign-in button. Off until the OAuth consent screen is approved.
      - key: HUB_GOOGLE_LOGIN
        value: "false"
      # Inbound Suite webhook. The endpoint FAILS CLOSED without this, so
      # leaving it unset simply means no opportunities flow back in.
      - key: GHL_WEBHOOK_TOKEN
        sync: false
      # Sub-account that owns the blog used for published llms.txt files.
      - key: GHL_BLOG_LOCATION_ID
        sync: false
      # ---- SmartForecast Dynamic Website ----
      # WeatherAPI powers live condition checks. The module still works in
      # simulator/manual mode until this secret is configured.
      - key: WEATHERAPI_KEY
        sync: false
      # Keep the event ledger on Render's persistent disk. docker-start.sh
      # applies this same default for existing services whose dashboard values
      # are not updated by a Blueprint change.
      - key: SMARTFORECAST_DB_PATH
        value: /var/data/smartforecast/smartforecast.sqlite3
      - key: SMARTFORECAST_WEATHER_RETENTION_DAYS
        value: "120"
      - key: SMARTFORECAST_ENGAGEMENT_RETENTION_DAYS
        value: "400"
      # Background jobs — exactly one worker runs them.
      - key: HUB_SCHEDULER
        value: "true"
      - key: SCANS_STUCK_MINUTES
        value: "30"
      # IO Builder submissions post here.
      - key: GHL_WEBHOOK_URL
        sync: false
      # ---- public scan widget ----
      # Reuse an audit this many days old instead of buying another.
      - key: SCANS_WIDGET_REUSE_DAYS
        value: "30"
      - key: SCANS_WIDGET_PRECHECK_LIMIT
        value: "12"
      # ---- shared ----
      - key: AUDIT_LOG_PATH
        value: /var/data/hub-audit.log.jsonl
      - key: FLASK_ENV
        value: production
      # ---- Display Ad Builder ----
      # The renderer runs as a second process in this container and refuses
      # every internal route until this is set to 16+ characters. It is not
      # generated here on purpose: a rotating value would log everyone out of
      # the tool on each deploy. Set it once, in the Render dashboard.
      #
      # This one name is enough. The renderer itself reads ADMIN_TOKEN, and
      # docker-start.sh copies this into that name before starting it -- so do
      # not set a second variable, and do not expect the renderer's own logs to
      # mention the name used here.
      - key: ADBUILDER_ADMIN_TOKEN
        sync: false
      # Loopback port for that process. Nothing outside the container reaches
      # it; only hub/ad_builder_proxy.py talks to it.
      - key: ADBUILDER_PORT
        value: "8791"
      # Renders, project state and the brand cache, on the mounted disk --
      # the renderer's own default is inside the image, which Render replaces
      # on every deploy.
      #
      # Kept here for a service created FROM this blueprint, but do not rely on
      # it: the live smart1-hub takes its environment from the dashboard, so
      # this entry never reached it and the boot log read `output dir:
      # /app/modules/ad_builder/out` for weeks. docker-start.sh now defaults
      # the same path when /var/data is mounted, which is what actually makes
      # it durable. The same caveat applies to every value below.
      - key: OUTPUT_DIR
        value: /var/data/adbuilder-out
      # The public intake form is closed unless one of these is set. Staff
      # inside the Hub do not need either -- the admin token above already
      # satisfies the gate. Set INTAKE_CODE to hand a code to an outside
      # requester, or INTAKE_OPEN=true to publish the form.
      - key: INTAKE_CODE
        sync: false
      - key: MAX_UPLOAD_MB
        value: "100"
